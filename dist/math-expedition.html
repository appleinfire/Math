  const THEMES = [
    { title: 'Animals seen on a hike', items: [['🦊', 'foxes'], ['🦉', 'owls'], ['🐿️', 'squirrels'], ['🦔', 'hedgehogs'], ['🦌', 'deer']] },
    { title: 'Favorite fruit in class', items: [['🍎', 'apples'], ['🍌', 'bananas'], ['🍓', 'berries'], ['🍇', 'grapes'], ['🍊', 'oranges']] },
    { title: 'Weather this month', items: [['☀️', 'sunny'], ['🌧️', 'rainy'], ['☁️', 'cloudy'], ['💨', 'windy']] },
    { title: 'Bugs in the garden', items: [['🐞', 'ladybugs'], ['🐝', 'bees'], ['🦋', 'butterflies'], ['🐛', 'caterpillars'], ['🐜', 'ants']] },
    { title: 'Things found at the beach', items: [['🐚', 'shells'], ['🦀', 'crabs'], ['⭐', 'sea stars'], ['🪨', 'rocks']] },
  ];
  function graphData(k, lo, hi, mult = 1) {
    const th = pick(THEMES);
    const items = U.sample(th.items, k);
    const vals = U.sample(U.range(lo, hi), k).map((v) => v * mult); // distinct values
    return { title: th.title, data: items.map(([emoji, label], i) => ({ emoji, label, value: vals[i] })) };
  }
  function data(d) {
    if (d === 1) {
      const g = graphData(3, 1, 8);
      const x = pick(g.data);
      return N(`How many <b>${x.label}</b>? ${x.emoji}`, x.value, { visual: V.picGraph(g.data, { title: g.title }), hint: `Count the ${x.emoji} in that row.` });
    }
    if (d === 2) {
      const g = graphData(4, 1, 10);
      if (chance(0.5)) {
        const x = pick(g.data);
        return N(`How many <b>${x.label}</b>?`, x.value, { visual: V.barGraph(g.data, { title: g.title }), hint: 'Go to the top of the bar, then look left to the number.' });
      }
      const most = chance(0.5);
      const ans = g.data.reduce((a, b) => ((most ? b.value > a.value : b.value < a.value) ? b : a));
      return C(`Which has the <b>${most ? 'most' : 'fewest'}</b>?`, ans.label, g.data.map((x) => x.label), { visual: V.barGraph(g.data, { title: g.title }), hint: `Find the ${most ? 'tallest' : 'shortest'} bar.` });
    }
    if (d === 3) {
      const g = graphData(4, 1, 12);
      const [a, b] = U.sample(g.data, 2).sort((x, y) => y.value - x.value);
      const vis = chance(0.5) ? V.barGraph(g.data, { title: g.title }) : V.picGraph(g.data, { title: g.title });
      if (chance(0.5)) return N(`How many <b>more</b> ${a.label} than ${b.label}?`, a.value - b.value, { visual: vis, hint: `Find both numbers: ${a.label} and ${b.label}. Then subtract.` });
      return N(`How many <b>fewer</b> ${b.label} than ${a.label}?`, a.value - b.value, { visual: vis, hint: 'Find both numbers, then subtract the smaller from the bigger.' });
    }
    if (d === 4) {
      if (chance(0.5)) {
        const g = graphData(3, 1, 8, 2);
        const x = pick(g.data);
        return N(`Look at the key! How many <b>${x.label}</b>?`, x.value, { visual: V.picGraph(g.data, { per: 2, title: g.title }), hint: 'Each symbol stands for 2. Count by 2s.' });
      }
      const g = graphData(4, 2, 12);
      return N('How many are there <b>in all</b>?', U.sum(g.data.map((x) => x.value)), { visual: V.barGraph(g.data, { title: g.title }), hint: 'Read every bar, then add them all.' });
    }
    if (chance(0.5)) {
      const step = pick([5, 10]);
      const g = graphData(4, 1, 9, step);
      const [a, b, c] = U.sample(g.data, 3);
      if (a.value + b.value <= c.value) return data(5);
      return N(`How many more <b>${a.label} and ${b.label} together</b> than ${c.label}?`, a.value + b.value - c.value, { visual: V.barGraph(g.data, { step, title: g.title }), hint: `Each line on the graph is ${step}. Add the first two, then subtract.` });
    }
    const g = graphData(3, 1, 7, 5);
    const x = pick(g.data);
    return N(`Each symbol means 5. How many <b>${x.label}</b>?`, x.value, { visual: V.picGraph(g.data, { per: 5, title: g.title }), hint: 'Count by 5s!' });
  }

  // ======================================================================
  // 11. Add & subtract within 1000  (2.NBT.7)
  // ======================================================================
  function big(d) {
    const add = chance(0.5);
    if (d === 1) {
      if (chance(0.5)) {
        const a = rnd(1, 8) * 100, b = add ? rnd(1, 9 - a / 100) * 100 : rnd(1, a / 100) * 100;
        return N(E(`${a} ${add ? '+' : '−'} ${b} = ?`), add ? a + b : a - b, { big: true, hint: `Think in hundreds: ${a / 100} ${add ? '+' : '−'} ${b / 100}.` });
      }
      const a = rnd(10, 89) * 10, t = Math.floor(a / 10) % 10;
      if (add) { if (t === 9) return big(1); const b = rnd(1, 9 - t) * 10; return N(E(`${a} + ${b} = ?`), a + b, { big: true, hint: 'Only the tens change.' }); }
      if (t === 0) return big(1);
      const b = rnd(1, t) * 10;
      return N(E(`${a} − ${b} = ?`), a - b, { big: true, hint: 'Only the tens change.' });
    }
    let a, b;
    const ds = (n) => [Math.floor(n / 100), Math.floor(n / 10) % 10, n % 10];
    for (let guard = 0; guard < 500; guard++) {
      a = rnd(101, 899); b = rnd(101, 899);
      if (add && a + b > 999) continue;
      if (!add && b >= a) [a, b] = [b, a];
      if (!add && a === b) continue;
      const [ah, at, ao] = ds(a), [bh, bt, bo] = ds(b);
      const r1c = add ? ao + bo >= 10 : ao < bo;
      const r2c = add ? at + bt + (r1c ? 1 : 0) >= 10 : at - (r1c ? 1 : 0) < bt;
      const regroups = (r1c ? 1 : 0) + (r2c ? 1 : 0);
      if (d === 2 && regroups === 0) break;
      if (d === 3 && regroups === 1) break;
      if (d === 4 && regroups === 2) break;
      if (d === 5) break;
    }
    if (d === 4 && !add && chance(0.4)) { a = rnd(2, 9) * 100 + (chance(0.5) ? rnd(1, 9) : 0); b = rnd(101, a - 1); }
    if (d === 5) {
      if (chance(0.5)) { const c = rnd(5, 10) * 100, x = rnd(101, c - 101); return N(E(`${x} + ? = ${c}`), c - x, { big: true, hint: `Count up from ${x}: to the next ten, the next hundred, then to ${c}.`, explain: `${x} + ${c - x} = ${c}` }); }
      let x, y, z;
      do { x = rnd(101, 499); y = rnd(101, 399); z = rnd(50, 299); } while (x + y + z > 999);
      return N('Add.', x + y + z, { visual: V.column([x, y, z], '+'), hint: 'Add one column at a time, starting with the ones.' });
    }
    const op = add ? '+' : '−', ans = add ? a + b : a - b;
    const vis = chance(0.6) ? V.column([a, b], op) : '';
    return N(vis ? (add ? 'Add.' : 'Subtract.') : E(`${a} ${op} ${b} = ?`), ans, {
      big: !vis, visual: vis,
      hint: add ? 'Add ones, then tens, then hundreds. 10 ones make a ten; 10 tens make a hundred.' : 'Subtract ones, then tens, then hundreds. Regroup when the top digit is smaller.',
      explain: add ? `${a} + ${b} = ${ans}` : `${b} + ${ans} = ${a}`,
    });
  }

        () => { const g = rnd(2, 5); return [`An octopus has 8 arms. How many arms do ${g} octopuses have?`, 8 * g, Array(g).fill(8).join(' + ')]; },
        () => { const a = rnd(300, 600), b = rnd(100, 300), c = rnd(50, 250); return [`A library had ${a} books. It got ${b} new books and lent out ${c}. How many books are on the shelves now?`, a + b - c, `${a} + ${b} − ${c}`]; },
        () => { const a = rnd(3, 6), b = rnd(2, a * 5 - 2); return [`${p} has ${a} bags with 5 marbles in each bag. ${p} gives ${b} marbles to ${q}. How many marbles does ${p} have left?`, a * 5 - b, `${Array(a).fill(5).join(' + ')} − ${b}`]; },
      ],
    };
    const [text, ans, expr] = pick(T[d])();
    return N(text, ans, { hint: d >= 4 ? 'Two steps! What happens first? What happens next?' : 'Act it out or draw a quick picture. Are things joining or leaving?', explain: `${expr} = ${ans}`, wordy: true });
  }

  // ======================================================================
  // 13. Multiply & divide  (challenge: 3.OA.1-7)
  // ======================================================================
  const GROUP_EMOJI = ['🍪', '🐞', '🌸', '🐟', '⭐', '🍓', '🐚'];
  function mult(d) {
    if (d === 1) {
      const g = rnd(2, 5), k = rnd(2, 5);
      if (chance(0.6)) return N(`<b>${g} groups of ${k}</b>. How many in all?`, g * k, { visual: V.groups(g, k, pick(GROUP_EMOJI)), hint: `Skip count by ${k}s, ${g} times.`, explain: `${Array(g).fill(k).join(' + ')} = ${g * k}` });
      const t = pick([2, 5, 10]), n = rnd(1, 5);
      return N(E(`${n} × ${t} = ?`), n * t, { big: true, hint: `Count by ${t}s, ${n} times.` });
    }
    if (d === 2) {
      const t = pick([2, 3, 4, 5, 10]), n = rnd(1, 10);
      const [x, y] = chance(0.5) ? [n, t] : [t, n];
      return N(E(`${x} × ${y} = ?`), x * y, { big: true, hint: `Count by ${t}s.` });
    }
    if (d === 3) {
      const x = rnd(2, 10), y = rnd(2, 10);
      return N(E(`${x} × ${y} = ?`), x * y, { big: true, hint: x === y ? 'A square number!' : `Do you know ${Math.min(x, y)} × ${Math.max(x, y)}? Turn it around if that helps.` });
    }
    if (d === 4) {
      const x = rnd(2, 10), y = rnd(2, 10), c = x * y;
      if (chance(0.5)) return N(E(`${c} ÷ ${x} = ?`), y, { big: true, hint: `Think: ${x} × what = ${c}?`, explain: `${x} × ${y} = ${c}` });
      return N(E(`? × ${y} = ${c}`), x, { big: true, hint: `Count by ${y}s until you reach ${c}.`, explain: `${x} × ${y} = ${c}` });
    }
    switch (rnd(1, 3)) {
      case 1: { const a = rnd(11, 25), b = rnd(2, 5); return N(E(`${a} × ${b} = ?`), a * b, { big: true, hint: `Split it: ${Math.floor(a / 10) * 10} × ${b} and ${a % 10} × ${b}, then add.`, explain: `${Math.floor(a / 10) * 10 * b} + ${(a % 10) * b} = ${a * b}` }); }
      case 2: { const a = rnd(2, 4), b = rnd(2, 5), c = rnd(2, 5); return N(E(`${a} × ${b} × ${c} = ?`), a * b * c, { big: true, hint: 'Multiply two numbers first, then the third.' }); }
      default: {
        const k = rnd(3, 6), each = rnd(3, 9), total = k * each;
        const [p] = two();
        return N(`${p} shares ${total} strawberries equally among ${k} friends. How many does each friend get?`, each, { hint: `Make ${k} equal groups. ${k} × what = ${total}?`, explain: `${total} ÷ ${k} = ${each}` });
      }
    }
  }

  // ======================================================================
  // 14. Patterns & logic  (challenge: algebraic thinking, number sense puzzles)
  // ======================================================================
  function riddle(maxN) {
    for (let attempt = 0; attempt < 60; attempt++) {
      const n = rnd(10, maxN);
      const t = Math.floor(n / 10), o = n % 10;
      const lo = Math.max(10, n - rnd(3, 12)), hi = Math.min(maxN, n + rnd(3, 12));
      if (lo >= n || hi <= n) continue;
      const clues = [
        { s: `I am between ${lo} and ${hi}.`, f: (x) => x > lo && x < hi },
        { s: n % 2 ? 'I am odd.' : 'I am even.', f: (x) => x % 2 === n % 2 },
        { s: `My digits add up to ${t + o}.`, f: (x) => Math.floor(x / 10) + (x % 10) === t + o },
        o > t ? { s: 'My ones digit is bigger than my tens digit.', f: (x) => x % 10 > Math.floor(x / 10) } : o < t ? { s: 'My ones digit is smaller than my tens digit.', f: (x) => x % 10 < Math.floor(x / 10) } : { s: 'My two digits are the same.', f: (x) => x % 10 === Math.floor(x / 10) },
        n % 5 === 0 ? { s: 'You say me when you count by 5s.', f: (x) => x % 5 === 0 } : { s: 'You do NOT say me when you count by 5s.', f: (x) => x % 5 !== 0 },
        n % 3 === 0 ? { s: 'You say me when you count by 3s.', f: (x) => x % 3 === 0 } : null,
      ].filter(Boolean);
      const used = [clues[0]];
      const rest = shuffle(clues.slice(1));
      const cands = () => U.range(10, maxN).filter((x) => used.every((c) => c.f(x)));
      for (const c of rest) {
        if (cands().length === 1) break;
        const before = cands().length;
        used.push(c);
        if (cands().length === before) used.pop();
      }
      if (cands().length === 1 && used.length >= 2) {
        return N(`<b>Secret number riddle</b><ul class="clues">${used.map((c) => `<li>${c.s}</li>`).join('')}</ul>What number am I?`, n, { hint: 'List the numbers that fit the first clue, then cross out the ones that break the other clues.' });
      }
    }
    return logic(1);
  }
  const ANIMOJI = ['🦊', '🐙', '🦉', '🐸', '🦔', '🐢', '🦋', '🐝'];
  function logic(d) {
    const seq = (start, f, k = 5) => { const s = [start]; for (let i = 1; i < k; i++) s.push(f(s[i - 1], i)); return s; };
    const seqQ = (s, gap, hint) => N(`What number comes ${gap === s.length - 1 ? 'next' : 'in the gap'}?<div class="seq">${s.map((v, i) => (i === gap ? BLANK : v)).join(', ')}</div>`, s[gap], { hint });
    if (d === 1) {
      const step = pick([1, 2, 3, 5, 10]);
      const s = seq(rnd(0, 40), (x) => x + step);
      return seqQ(s, 4, 'How much does it grow each time?');
    }
    if (d === 2) {
      if (chance(0.5)) return riddle(50);
      const step = pick([2, 3, 4, 5, 10]);
      if (chance(0.5)) { const s = seq(rnd(step * 5, 80), (x) => x - step); return seqQ(s, 4, 'Is it getting bigger or smaller? By how much?'); }
      const s = seq(rnd(1, 30), (x) => x + step);
      return seqQ(s, rnd(1, 3), 'Find the jump between the numbers you can see.');
    }
    if (d === 3) {
      const [A, Bm] = U.sample(ANIMOJI, 2);
      const a = rnd(2, 9), b = rnd(1, 9);
      switch (rnd(1, 3)) {
        case 1: return N(`<div class="emojieq">${A} + ${A} = ${2 * a}</div>What is ${A} worth?`, a, { hint: 'Two of the same make that number. Half of it!' });
        case 2: return N(`<div class="emojieq">${A} + ${A} + ${A} = ${3 * a}</div>What is ${A} worth?`, a, { hint: 'Three of the same. Try counting by different numbers.' });
        default: return N(`<div class="emojieq">${A} + ${A} = ${2 * a}<br>${A} + ${Bm} = ${a + b}</div>What is ${Bm} worth?`, b, { hint: `First find ${A}. Then use the second line.`, explain: `${A} = ${a}, so ${Bm} = ${a + b} − ${a} = ${b}` });
      }
    }
    if (d === 4) {
      switch (rnd(1, 3)) {
        case 1: {
          const b = [rnd(1, 15), rnd(1, 15), rnd(1, 15)], m = [b[0] + b[1], b[1] + b[2]], top = m[0] + m[1];
          const rows = [[top], m.slice(), b.slice()];
          const which = rnd(1, 3);
          let ans, ask = 'the missing number';
          if (which === 1) { ans = top; rows[0] = [null]; }
          else if (which === 2) { ans = b[0]; rows[2] = [null, b[1], b[2]]; }
          else { ans = b[2]; rows[1] = [m[0], null]; rows[2] = [b[0], b[1], null]; ask = 'the number in the bottom-right block'; }
          return N(`<b>Number pyramid:</b> each block is the sum of the two blocks under it. What is ${ask}?`, ans, { visual: V.pyramid(rows), hint: 'Two blocks side by side add up to the block above them.' });
        }
        case 2: {
          const start = rnd(1, 10);
          const s = seq(start, (x, i) => x + i);
          return seqQ(s, 4, 'Look at the jumps: they grow too!');
        }
        default: {
          if (chance(0.5)) return riddle(99);
          const s = seq(rnd(1, 6), (x) => x * 2);
          return seqQ(s, 4, 'Each number is double the one before.');
        }
      }
    }
    switch (rnd(1, 3)) {
      case 1: {
        const base = [2, 7, 6, 9, 5, 1, 4, 3, 8];
        const tr = pick([(i) => i, (i) => [6, 3, 0, 7, 4, 1, 8, 5, 2][i], (i) => [2, 1, 0, 5, 4, 3, 8, 7, 6][i], (i) => [8, 7, 6, 5, 4, 3, 2, 1, 0][i]]);
        const k = rnd(0, 5);
        const grid = U.range(0, 8).map((i) => base[tr(i)] + k);
        const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
        let ask, other;
        do { [ask, other] = U.sample(U.range(0, 8), 2); } while (!LINES.some((l) => l.includes(ask) && !l.includes(other)));
        // ask = highlighted box (null), other = a second hidden box ('') to make it a real puzzle
        const shown = grid.map((v, i) => (i === ask ? null : i === other ? '' : v));
        return N(`<b>Magic square:</b> every row, column and diagonal adds up to <b>${15 + 3 * k}</b>. What goes in the <b>orange</b> box?`, grid[ask], { visual: V.magic(shown), hint: 'Find a row, column or diagonal where the orange box is the only one missing.', explain: `The missing number is ${grid[ask]}.` });
      }
      case 2: {
        const [A, Bm, Cm] = U.sample(ANIMOJI, 3);
        const a = rnd(2, 6), b = rnd(2, 9), c = rnd(1, b - 1);
        return N(`<div class="emojieq">${A} + ${A} + ${A} = ${3 * a}<br>${A} + ${Bm} = ${a + b}<br>${Bm} − ${Cm} = ${b - c}</div>What is ${Cm} worth?`, c, { hint: 'Solve one line at a time, from the top.', explain: `${A} = ${a}, ${Bm} = ${b}, ${Cm} = ${c}` });
      }
      default: {
        const a = rnd(1, 3), b = rnd(1, 4);
        const s = [a, b];
        for (let i = 2; i < 7; i++) s.push(s[i - 1] + s[i - 2]);
        return seqQ(s, 6, 'Add the two numbers before to get the next one.');
      }
    }
  }

  MQ.TOPICS = {
    add20: { name: 'Facts to 20', icon: '🧮', std: '2.OA.2', gen: add20 },
    place: { name: 'Place Value', icon: '🔢', std: '2.NBT.1–4', gen: place },
    add100: { name: 'Add to 100', icon: '➕', std: '2.NBT.5–6', gen: add100 },
    sub100: { name: 'Subtract to 100', icon: '➖', std: '2.NBT.5', gen: sub100 },
    arrays: { name: 'Odd, Even & Arrays', icon: '🔵', std: '2.OA.3–4', gen: arrays },
    time: { name: 'Telling Time', icon: '🕒', std: '2.MD.7', gen: time },
    money: { name: 'Money', icon: '🪙', std: '2.MD.8', gen: money },
    shapes: { name: 'Shapes & Fractions', icon: '🔷', std: '2.G.1–3', gen: shapes },
    measure: { name: 'Measuring', icon: '📏', std: '2.MD.1–6', gen: measure },
    data: { name: 'Graphs', icon: '📊', std: '2.MD.10', gen: data },
    big: { name: 'Add & Subtract to 1000', icon: '🏔️', std: '2.NBT.7', gen: big },
    words: { name: 'Word Problems', icon: '📖', std: '2.OA.1', gen: words },
    mult: { name: 'Multiply & Divide', icon: '✖️', std: '3.OA (ahead)', gen: mult, ahead: true },
    logic: { name: 'Patterns & Logic', icon: '🧩', std: 'Puzzles (ahead)', gen: logic, ahead: true },
  };

  Object.values(MQ.TOPICS).forEach((t) => (t.track = 'g2'));
  MQ.G = { N, C, M, O, Ln, E, BLANK, NAMES }; // shared with generators-k.js and puzzles

  MQ.makeProblem = (topic, d) => {
    const p = MQ.TOPICS[topic].gen(U.clamp(d, 1, 5));
    p.topic = topic;
    p.d = d;
    return p;
  };
})();
</script>
  <script>
// Kindergarten problem generators (California Common Core, grade K).
//   1-3 = kindergarten standards (K.CC, K.OA, K.NBT, K.MD, K.G)
//   4   = end of kindergarten / start of 1st grade
//   5   = 1st grade material (1.OA, 1.NBT, 1.MD) — room to grow
// Problems lean on pictures, and each has a `say` line so it can be read aloud to kids who don't read yet.
(function () {
  const MQ = (globalThis.MQ = globalThis.MQ || {});
  const U = MQ.U, V = MQ.V;
  const { N, C, M, O, Ln, E, BLANK } = MQ.G;
  const { rnd, pick, chance, shuffle } = U;

  const THINGS = [
    ['🐞', 'ladybug', 'ladybugs'], ['🍎', 'apple', 'apples'], ['🐟', 'fish', 'fish'], ['⭐', 'star', 'stars'],
    ['🐸', 'frog', 'frogs'], ['🌸', 'flower', 'flowers'], ['🐥', 'chick', 'chicks'], ['🍓', 'strawberry', 'strawberries'],
    ['🦋', 'butterfly', 'butterflies'], ['🐚', 'shell', 'shells'], ['🍪', 'cookie', 'cookies'], ['🐝', 'bee', 'bees'],
    ['🎈', 'balloon', 'balloons'], ['🐢', 'turtle', 'turtles'], ['🍄', 'mushroom', 'mushrooms'], ['🥕', 'carrot', 'carrots'],
  ];
  const NAMES = ['Mia', 'Leo', 'Ava', 'Sam', 'Zoe', 'Kai', 'Ivy', 'Max', 'Lily', 'Ben', 'Nora', 'Eli'];
  const who = () => (MQ.playerName && chance(0.25) ? MQ.playerName : pick(NAMES));
  const WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen', 'twenty'];
  const numChoices = (ans, lo, hi, n = 4) => U.numChoices(ans, U.range(Math.max(lo, ans - 3), Math.min(hi, ans + 3)), n).sort((a, b) => a - b);

  // ---------------- Counting (K.CC.4-5; 1.NBT.1 as challenge)
  function k_count(d) {
    const [e, , pl] = pick(THINGS);
    if (d === 1) {
      const n = rnd(1, 5);
      return C(`How many ${e}?`, n, numChoices(n, 1, 6), { visual: V.emojis(e, n), say: `How many ${pl}?`, hint: 'Touch each one and count out loud: one, two, three…' });
    }
    if (d === 2) {
      const n = rnd(4, 10);
      return N(`How many ${e}?`, n, { visual: V.emojis(e, n), say: `How many ${pl}?`, hint: 'Count the top row, then keep counting the next row.' });
    }
    if (d === 3) {
      const n = rnd(10, 20);
      return N(`How many ${e}?`, n, { visual: V.emojis(e, n), say: `How many ${pl}? Count carefully!`, hint: 'Each row has 5. Count by fives, then count on: 5, 10, 15…' });
    }
    if (d === 4) {
      const t = rnd(2, 4), o = rnd(0, 9);
      return N(`Each box has 10 ${e}. How many in all?`, t * 10 + o, { visual: V.tenGroups(e, t, o), say: `Each box has ten ${pl}. How many ${pl} in all?`, hint: 'Count the boxes by tens: 10, 20, 30… then count the extra ones.', explain: `${t} tens and ${o} ones = ${t * 10 + o}` });
    }
    const t = rnd(3, 9), o = rnd(0, 9);
    return N('How many cubes? Each long rod is 10.', t * 10 + o, { visual: V.blocks(0, t, o), say: 'How many cubes? Each long rod is ten.', hint: 'Count the rods by tens, then count on the little cubes.', explain: `${t} tens and ${o} ones = ${t * 10 + o}` });
  }

  // ---------------- Number order (K.CC.1-3; 1.NBT.1, 1.NBT.5 as challenge)
  function k_numbers(d) {
    const seqQ = (seq, gap, say, hint) => N(`What number is missing?<div class="seq">${seq.map((v, i) => (i === gap ? BLANK : v)).join(', ')}</div>`, seq[gap], { say, hint });
    if (d === 1) {
      if (chance(0.5)) { const s = rnd(1, 6); const seq = [s, s + 1, s + 2, s + 3]; return seqQ(seq, 3, `What comes next? ${seq.slice(0, 3).join(', ')}, and then?`, 'Count up by one.'); }
      const n = rnd(1, 9);
      return C(`What number comes <b>after</b> ${n}?`, n + 1, numChoices(n + 1, 1, 10), { say: `What number comes after ${n}?`, hint: `Count: ${n}… what is next?` });
    }
    if (d === 2) {
      if (chance(0.3)) {
        if (chance(0.5)) { const n = rnd(1, 9); return Ln(`Tap where <b>${n}</b> goes on the number line.`, n, { min: 0, max: 10, step: 1, labels: [0, 5, 10] }, { say: `Tap where ${n} goes on the number line.`, hint: 'Find 5 in the middle, then count from there.' }); }
        const ns = U.sample(U.range(1, 10), 4).sort((a, b) => a - b);
        return O('Put the numbers in order. Start with the <b>smallest</b>.', ns, { say: 'Put the numbers in order. Start with the smallest.', hint: 'Which number do you say first when you count?' });
      }
      switch (rnd(1, 3)) {
        case 1: { const n = rnd(2, 19); return N(`What number comes <b>before</b> ${n}?`, n - 1, { say: `What number comes before ${n}?`, hint: 'Count backwards by one.' }); }
        case 2: { const n = rnd(5, 19); return N(`What is <b>one more</b> than ${n}?`, n + 1, { say: `What is one more than ${n}?`, hint: 'One more means the next number when you count.' }); }
        default: { const s = rnd(8, 16), gap = rnd(1, 3); return seqQ([s, s + 1, s + 2, s + 3, s + 4], gap, 'Which number is missing?', 'Count from the first number.'); }
      }
    }
    if (d === 3) {
      if (chance(0.25)) {
        if (chance(0.5)) { const n = rnd(11, 19); return Ln(`Tap where <b>${n}</b> goes on the number line.`, n, { min: 10, max: 20, step: 1, labels: [10, 15, 20] }, { say: `Tap where ${n} goes on the number line.`, hint: '15 is in the middle. Count from 10 or from 15.' }); }
        const ns = U.sample(U.range(1, 20), 4).sort((a, b) => a - b);
        return O('Put the numbers in order. Start with the <b>smallest</b>.', ns, { say: 'Put the numbers in order. Start with the smallest.', hint: 'Numbers 1 to 9 come before the teen numbers.' });
      }
      switch (rnd(1, 3)) {
        case 1: { const k = rnd(1, 6), seq = [k, k + 1, k + 2, k + 3].map((x) => x * 10); return seqQ(seq, 3, `Count by tens: ${seq.slice(0, 3).join(', ')}, and then?`, 'Count by tens: 10, 20, 30, 40…'); }
        case 2: {
          const n = rnd(11, 20), t = Math.floor(n / 10), o = n % 10;
          const opts = U.strChoices(String(n), [String(o * 10 + t), String(n + 10), String(o || n + 1), String(n - 1)].filter((x) => x !== String(n) && x !== '0'), 4);
          return C(`Which number is <b>${WORDS[n]}</b>?`, n, opts, { say: `Which number is ${n}?`, hint: 'Teen numbers start with a 1.' });
        }
        default: { const n = rnd(20, 49); return N(`What number comes <b>after</b> ${n}?`, n + 1, { say: `What number comes after ${n}?`, hint: 'Count on by one.' }); }
      }
    }
    if (d === 4) {
      switch (rnd(1, 3)) {
        case 1: { const n = rnd(30, 99); return N(`What number comes <b>after</b> ${n}?`, n + 1, { say: `What number comes after ${n}?`, hint: n % 10 === 9 ? 'After 9 ones comes a new ten!' : 'Count on by one.' }); }
        case 2: { const n = rnd(21, 100); return N(`What is <b>one less</b> than ${n}?`, n - 1, { say: `What is one less than ${n}?`, hint: 'One less means count back one.' }); }
        default: { const s = rnd(8, 30), seq = [s, s - 1, s - 2, s - 3]; return seqQ(seq, 3, `Count back: ${seq.slice(0, 3).join(', ')}, and then?`, 'Count backwards by one.'); }
      }
    }
    switch (rnd(1, 3)) {
      case 1: { const step = pick([2, 5]), s = rnd(1, 8) * step, seq = [s, s + step, s + 2 * step, s + 3 * step]; return seqQ(seq, 3, `Skip count by ${step}s. What comes next?`, `Count by ${step}s.`); }
      case 2: { const n = rnd(11, 89); return N(`What is <b>10 more</b> than ${n}?`, n + 10, { say: `What is ten more than ${n}?`, hint: 'Ten more: the tens digit goes up by one.' }); }
      default: { const n = rnd(20, 99); return N(`What is <b>10 less</b> than ${n}?`, n - 10, { say: `What is ten less than ${n}?`, hint: 'Ten less: the tens digit goes down by one.' }); }
    }
  }

  // ---------------- Comparing (K.CC.6-7; 1.NBT.3 as challenge)
  function k_compare(d) {
    if (d <= 2) {
      const [[ea, , pa], [eb, , pb]] = U.sample(THINGS, 2);
      const max = d === 1 ? 5 : 10;
      let a = rnd(1, max), b = rnd(1, max);
      if (d === 1) while (a === b) b = rnd(1, max);
      if (d === 2 && chance(0.2)) b = a;
      const askMore = d === 1 || chance(0.5);
      const opts = d === 2 ? [ea, eb, '= same'] : [ea, eb];
      const ans = a === b ? '= same' : (a > b) === askMore ? ea : eb;
      return C(`Are there <b>${askMore ? 'more' : 'fewer'}</b> ${ea} or ${eb}?`, ans, opts, { visual: V.compareRows(a, ea, b, eb), say: `Are there ${askMore ? 'more' : 'fewer'} ${pa} or ${pb}?${d === 2 ? ' Or the same?' : ''}`, hint: 'Match them up one to one. Which row has some left over?' });
    }
    if (d === 3) {
      if (chance(0.3)) {
        const k = rnd(4, 7);
        let ns;
        do ns = U.sample(U.range(1, 10), 5); while (!ns.some((x) => x > k) || !ns.some((x) => x <= k));
        return M(`Tap <b>all</b> the numbers bigger than ${k}.`, ns.filter((x) => x > k), ns, { say: `Tap all the numbers bigger than ${k}.`, hint: `Count to ${k}. The bigger numbers come after it.` });
      }
      const [a, b] = U.sample(U.range(1, 10), 2);
      const big = chance(0.6);
      return C(`Which number is <b>${big ? 'bigger' : 'smaller'}</b>?`, big ? Math.max(a, b) : Math.min(a, b), [a, b], { say: `Which number is ${big ? 'bigger' : 'smaller'}: ${a} or ${b}?`, hint: 'Which one do you say first when you count? That one is smaller.' });
    }
    if (d === 4) {
      const ns = U.sample(U.range(1, 20), 3);
      const big = chance(0.5);
      return C(`Which number is the <b>${big ? 'biggest' : 'smallest'}</b>?`, big ? Math.max(...ns) : Math.min(...ns), ns, { say: `Which number is the ${big ? 'biggest' : 'smallest'}: ${ns.join(', ')}?`, hint: 'Look at the tens first. Teen numbers are bigger than 1 to 9.' });
    }
    let a = rnd(10, 99), b = chance(0.15) ? a : rnd(10, 99);
    const ans = a > b ? '>' : a < b ? '<' : '=';
    return C(`Which sign goes in the box?<div class="eqline">${a} ${BLANK} ${b}</div>`, ans, ['<', '>', '='], { say: `Is ${a} greater than, less than, or equal to ${b}?`, hint: 'The open mouth eats the bigger number! Compare the tens first.', explain: `${a} ${ans} ${b}` });
  }

  // ---------------- Addition (K.OA.1-5; 1.OA.2, 1.OA.6 as challenge)
  function k_add(d) {
    const [e, , pl] = pick(THINGS);
    if (d === 1) {
      const a = rnd(1, 3), b = rnd(1, 5 - a);
      return N(`How many ${e} in all?`, a + b, { visual: V.emojiSum(e, a, b), say: `${a} and ${b} more. How many ${pl} in all?`, hint: 'Count all of them together.' });
    }
    if (d === 2) {
      const a = rnd(1, 6), b = rnd(1, Math.min(4, 10 - a));
      return N(E(`${a} + ${b} = ?`), a + b, { big: true, visual: V.emojiSum(e, a, b), say: `${a} plus ${b} equals what?`, hint: 'Count the first group, then keep counting the second group.' });
    }
    if (d === 3) {
      const a = rnd(1, 9), b = rnd(1, 10 - a);
      return N(E(`${a} + ${b} = ?`), a + b, { big: true, say: `${a} plus ${b} equals what?`, hint: `Start at ${Math.max(a, b)} and count up ${Math.min(a, b)} on your fingers.` });
    }
    if (d === 4) {
      if (chance(0.6)) {
        const a = rnd(1, 9);
        return N(E(`${a} + ? = 10`), 10 - a, { big: true, visual: V.tenFrames(a), say: `${a} plus what makes 10?`, hint: 'Count the empty boxes in the ten frame.', explain: `${a} + ${10 - a} = 10` });
      }
      const n = rnd(4, 9), a = rnd(1, n - 1);
      return N(E(`${n} = ${a} + ?`), n - a, { big: true, say: `${n} equals ${a} plus what?`, hint: `Start at ${a} and count up to ${n}.` });
    }
    if (chance(0.6)) {
      const a = rnd(4, 9), b = rnd(Math.max(2, 11 - a), 9);
      return N(E(`${a} + ${b} = ?`), a + b, { big: true, say: `${a} plus ${b} equals what?`, hint: `Make a ten first: ${Math.max(a, b)} + ${10 - Math.max(a, b)} = 10, then add the rest.` });
    }
    const a = rnd(1, 6), b = rnd(1, 6), c = rnd(1, 6);
    return N(E(`${a} + ${b} + ${c} = ?`), a + b + c, { big: true, say: `${a} plus ${b} plus ${c} equals what?`, hint: 'Add two numbers first, then add the last one.' });
  }

  // ---------------- Subtraction (K.OA.1-2, K.OA.5; 1.OA.6 as challenge)
  function k_sub(d) {
    const [e, , pl] = pick(THINGS);
    if (d === 1) {
      const a = rnd(2, 5), b = rnd(1, a - 1);
      return N(`${a} ${e}. ${b} ${b === 1 ? 'goes' : 'go'} away. How many are left?`, a - b, { visual: V.emojis(e, a, { gone: b }), say: `There are ${a} ${pl}. ${b} ${b === 1 ? 'goes' : 'go'} away. How many are left?`, hint: 'Count only the ones that are not crossed out.' });
    }
    if (d === 2) {
      const a = rnd(3, 10), b = rnd(1, Math.min(5, a - 1));
      return N(E(`${a} − ${b} = ?`), a - b, { big: true, visual: V.emojis(e, a, { gone: b }), say: `${a} minus ${b} equals what?`, hint: 'Cross out, then count what is left.' });
    }
    if (d === 3) {
      const a = rnd(3, 10), b = rnd(1, a);
      return N(E(`${a} − ${b} = ?`), a - b, { big: true, say: `${a} minus ${b} equals what?`, hint: `Hold up ${a} fingers. Put ${b} down.` });
    }
    if (d === 4) {
      const a = rnd(4, 10), r = rnd(1, a - 1);
      if (chance(0.5)) return N(E(`${a} − ? = ${r}`), a - r, { big: true, say: `${a} minus what equals ${r}?`, hint: `Count up from ${r} to ${a}.`, explain: `${a} − ${a - r} = ${r}` });
      return N(E(`10 − ${10 - r} = ?`), r, { big: true, visual: V.tenFrames(10), say: `10 minus ${10 - r} equals what?`, hint: 'Cover some dots in the ten frame. How many are still showing?' });
    }
    const a = rnd(11, 18), b = rnd(a - 9, 9);
    if (chance(0.3)) return N(E(`${a} − ? = ${a - b}`), b, { big: true, say: `${a} minus what equals ${a - b}?`, hint: `Count up from ${a - b} to ${a}.` });
    return N(E(`${a} − ${b} = ?`), a - b, { big: true, say: `${a} minus ${b} equals what?`, hint: `Take away ${a - 10} to get to 10 first, then take away the rest.` });
  }

  // ---------------- Ten-frames & teen numbers (K.NBT.1, K.OA.4; 1.NBT.2 as challenge)
  function k_teen(d) {
    if (d === 1) { const n = rnd(3, 10); return N('How many dots?', n, { visual: V.tenFrames(n), say: 'How many dots are in the ten frame?', hint: 'The top row has 5 boxes. Count on from 5.' }); }
    if (d === 2) { const n = rnd(2, 9); return N('How many more dots to fill the ten-frame?', 10 - n, { visual: V.tenFrames(n), say: 'How many more dots do we need to fill the ten frame?', hint: 'Count the empty boxes.', explain: `${n} + ${10 - n} = 10` }); }
    if (d === 3) {
      const o = rnd(1, 9);
      if (chance(0.5)) return N('How many dots?', 10 + o, { visual: V.tenFrames(10 + o, '#8c9cff'), say: 'How many dots? One ten frame is full.', hint: 'A full ten-frame is 10. Count on from 10.' });
      return N(E(`10 + ${o} = ?`), 10 + o, { big: true, visual: V.tenFrames(10 + o, '#8c9cff'), say: `10 plus ${o} equals what?`, hint: '10 and some more make a teen number.' });
    }
    if (d === 4) {
      const o = rnd(1, 9), n = 10 + o;
      if (chance(0.5)) return N(E(`${n} = 10 + ?`), o, { big: true, say: `${n} equals 10 plus what?`, hint: `${n} is one ten and some ones. Look at the last digit.` });
      return C(`Which number is <b>1 ten and ${o} ones</b>?`, n, U.strChoices(String(n), [String(o * 10 + 1), String(10 + o + 1), String(o), String(n + 10)].filter((x) => x !== String(n)), 4), { visual: V.tenFrames(n, '#8c9cff'), say: `Which number is one ten and ${o} ones?`, hint: 'One ten is 10. Then add the ones.' });
    }
    const t = rnd(2, 9), o = rnd(0, 9);
    switch (rnd(1, 3)) {
      case 1: return N('How many cubes?', t * 10 + o, { visual: V.blocks(0, t, o), say: 'How many cubes? Each rod is ten.', hint: 'Count rods by tens, then count the ones.' });
      case 2: return N(E(`${t} tens and ${o} ones = ?`), t * 10 + o, { say: `${t} tens and ${o} ones equals what?`, hint: `${t} tens is ${t * 10}.` });
      default: return N(`How many <b>tens</b> are in ${t * 10 + o}?`, t, { say: `How many tens are in ${t * 10 + o}?`, hint: 'The first digit tells the tens.' });
    }
  }

  // ---------------- Shapes (K.G.1-6; 1.G as challenge)
  const FLAT = ['circle', 'square', 'triangle', 'rectangle'];
  const SOLIDS = { sphere: ['⚽', '🏀', '🌍', '🍊'], cube: ['🎲', '🧊', '🎁'], cone: ['🍦', '🎉'], cylinder: ['🥫', '🔋', '🥁'] };
  function k_shapes(d) {
    if (d === 1) {
      const s = pick(FLAT);
      return C('What shape is this?', s, FLAT, { visual: V.shape(s, { rotate: chance(0.3) }), say: 'What shape is this?', hint: 'Count the sides. A circle has none!' });
    }
    if (d === 2) {
      if (chance(0.3)) {
        const target = pick(['triangle', 'circle', 'square']);
        const kinds = Array.from({ length: 5 }, () => pick(['triangle', 'square', 'circle', 'rectangle', 'hexagon']));
        if (!kinds.includes(target) || kinds.every((k) => k === target)) return k_shapes(2);
        const keys = kinds.map((k, i) => `${k} ${i + 1}`);
        return M(`Tap <b>all</b> the ${target}s.`, keys.filter((_, i) => kinds[i] === target), keys, {
          choiceHtml: kinds.map((k) => V.shape(k, { rotate: k === 'triangle', fill: pick(V.FILLS) }).replace('width="180"', 'width="64"')),
          say: `Tap all the ${target}s.`, hint: target === 'circle' ? 'A circle is round, with no corners.' : `Count the sides: a ${target} has ${target === 'triangle' ? 3 : 4}.`,
        });
      }
      const pool = [...FLAT, 'hexagon'];
      const s = pick(pool);
      const opts = U.sample(pool.filter((x) => x !== s), 3).concat(s);
      const order = shuffle(opts);
      return C(`Tap the <b>${s}</b>.`, s, order, { choiceHtml: order.map((k) => V.mini(k, 70)), say: `Tap the ${s}.`, hint: s === 'hexagon' ? 'A hexagon has 6 sides, like a honeycomb.' : 'Think about how many sides it has.' });
    }
    if (d === 3) {
      const s = pick(Object.keys(SOLIDS)), obj = pick(SOLIDS[s]);
      return C(`What 3D shape is this? <span class="bigemoji-inline">${obj}</span>`, s, ['sphere', 'cube', 'cone', 'cylinder'], { say: 'What solid shape is this? Sphere, cube, cone, or cylinder?', hint: 'A sphere is a ball. A cube is a box. A cone has a point. A cylinder is like a can.' });
    }
    if (d === 4) {
      const [s, n] = pick([['triangle', 3], ['square', 4], ['rectangle', 4], ['hexagon', 6], ['pentagon', 5]]);
      const what = chance(0.5) ? 'sides' : 'corners';
      return N(`How many <b>${what}</b>?`, n, { visual: V.shape(s, { rotate: true }), say: `How many ${what} does this shape have?`, hint: 'Touch each one as you count.' });
    }
    const kinds = Array.from({ length: rnd(6, 9) }, () => pick(['circle', 'square', 'triangle', 'hexagon']));
    const target = pick(kinds), n = kinds.filter((k) => k === target).length;
    return N(`How many <b>${target}s</b>?`, n, { visual: `<div class="vis shaperow">${kinds.map((k) => V.mini(k, 46)).join('')}</div>`, say: `How many ${target}s can you find?`, hint: `Look for the ${target}s only. Touch each one.` });
  }

  // ---------------- Measure & sort (K.MD.1-3; 1.MD.2 as challenge)
  const COLORS = [['🟥 red', '#ff6b5b'], ['🟦 blue', '#5b8cff'], ['🟩 green', '#5ccf7a'], ['🟨 yellow', '#ffc94d'], ['🟪 purple', '#a678f0']];
  const HEAVY = [['🐘', '🐭'], ['🍉', '🍒'], ['🚗', '🚲'], ['🐋', '🐟'], ['🎃', '🍓'], ['🪨', '🪶'], ['🐻', '🐝']];
  function k_measure(d) {
    if (d === 2 && chance(0.25)) {
      const cols = U.sample(COLORS, 3), lens = U.sample(U.range(3, 12), 3);
      const list = cols.map(([label, color], i) => ({ label, color, len: lens[i] }));
      return O('Put the ribbons in order from <b>shortest</b> to <b>longest</b>.', list.slice().sort((a, b) => a.len - b.len).map((x) => x.label), { visual: V.ribbons(list), say: 'Put the ribbons in order from shortest to longest.', hint: 'Find the shortest ribbon first.' });
    }
    if (d <= 2) {
      const k = d === 1 ? 2 : 3;
      const cols = U.sample(COLORS, k), lens = U.sample(U.range(3, 12), k);
      const list = cols.map(([label, color], i) => ({ label, color, len: lens[i] }));
      const vertical = d === 2 && chance(0.5);
      const word = vertical ? pick(['taller', 'shorter', 'tallest', 'shortest']) : d === 1 ? pick(['longer', 'shorter']) : pick(['longest', 'shortest']);
      const big = /long|tall/.test(word) && !/short/.test(word);
      const ans = list.reduce((a, b) => (big ? (b.len > a.len ? b : a) : b.len < a.len ? b : a));
      return C(`Which ${vertical ? 'tower' : 'ribbon'} is <b>${word}</b>?`, ans.label, list.map((x) => x.label), { visual: V.ribbons(list, vertical), say: `Which ${vertical ? 'tower' : 'ribbon'} is ${word}?`, hint: vertical ? 'They all stand on the same line. Look at the tops.' : 'They all start at the same place. Look at the ends.' });
    }
    if (d === 3) {
      const [h, l] = pick(HEAVY), heavy = chance(0.5);
      return C(`Which is <b>${heavy ? 'heavier' : 'lighter'}</b>?`, heavy ? h : l, shuffle([h, l]), { say: `Which one is ${heavy ? 'heavier' : 'lighter'}?`, hint: 'Imagine holding each one in your hands.' });
    }
    if (d === 4) {
      if (chance(0.5)) {
        const dots = [['🔴', 'red'], ['🔵', 'blue'], ['🟡', 'yellow']];
        const items = Array.from({ length: rnd(7, 11) }, () => pick(dots));
        const [te, tn] = pick(dots), n = items.filter((x) => x[0] === te).length;
        return N(`How many <b>${tn}</b> circles?`, n, { visual: V.strip(items.map((x) => x[0])), say: `How many ${tn} circles are there?`, hint: `Count only the ${tn} ones.` });
      }
      const fruit = ['🍎', '🍌', '🍇', '🍓', '🍐'], animals = ['🐶', '🐱', '🐰', '🐸', '🐤'];
      const items = Array.from({ length: rnd(7, 10) }, () => (chance(0.5) ? pick(fruit) : pick(animals)));
      const askFruit = chance(0.5), n = items.filter((x) => (askFruit ? fruit : animals).includes(x)).length;
      return N(`How many are <b>${askFruit ? 'fruits' : 'animals'}</b>?`, n, { visual: V.strip(items), say: `Sort them! How many are ${askFruit ? 'fruits' : 'animals'}?`, hint: `Count only the ${askFruit ? 'fruits' : 'animals'}.` });
    }
    const len = rnd(3, 10);
    return N('How many cubes long is the ribbon?', len, { visual: V.cubeMeasure(len, pick(COLORS)[1]), say: 'How many cubes long is the ribbon?', hint: 'Count the cubes under the ribbon, from one end to the other.' });
  }

  // ---------------- Story problems (K.OA.2; 1.OA.1-2 as challenge)
  function k_words(d) {
    const [e, one, pl] = pick(THINGS), p = who();
    const story = (text, ans, extra = {}) => N(text, ans, Object.assign({ wordy: true, say: text.replace(/<[^>]+>/g, ''), hint: 'Act it out with your fingers or draw circles.' }, extra));
    if (d === 1) {
      const a = rnd(1, 3), b = rnd(1, 5 - a);
      return story(`${p} has ${a} ${a === 1 ? one : pl}. ${p} gets ${b} more. How many ${pl} now?`, a + b, { visual: V.emojiSum(e, a, b) });
    }
    if (d === 2) {
      if (chance(0.5)) { const a = rnd(2, 6), b = rnd(1, 10 - a); return story(`There are ${a} ${pl} on a leaf. ${b} more ${b === 1 ? "comes" : "come"}. How many ${pl} now?`, a + b, { visual: V.emojiSum(e, a, b) }); }
      const a = rnd(3, 9), b = rnd(1, a - 1);
      return story(`There are ${a} ${pl}. ${b} ${b === 1 ? 'runs' : 'run'} away. How many are left?`, a - b, { visual: V.emojis(e, a, { gone: b }) });
    }
    if (d === 3) {
      if (chance(0.5)) { const a = rnd(2, 7), b = rnd(1, 10 - a); return story(`${p} picks ${a} ${pl} and then ${b} more. How many ${pl} does ${p} have?`, a + b); }
      const a = rnd(4, 10), b = rnd(1, a - 1);
      return story(`${p} has ${a} ${pl} and gives ${b} away. How many ${pl} are left?`, a - b);
    }
    if (d === 4) {
      if (chance(0.5)) { const c = rnd(5, 10), a = rnd(1, c - 1); return story(`${p} needs ${c} ${pl}. ${p} has ${a}. How many more does ${p} need?`, c - a, { hint: `Count up from ${a} to ${c}.` }); }
      const kids = rnd(4, 10), hats = rnd(2, kids - 1);
      return story(`There are ${kids} kids and ${hats} hats. How many kids do not get a hat?`, kids - hats, { hint: 'Give each hat to one kid. How many kids are left?' });
    }
    const a = rnd(3, 9), b = rnd(2, 6), c = rnd(1, a + b - 1);
    if (chance(0.5)) return story(`${a} birds sit on a fence. ${b} more land. Then ${c} fly away. How many birds are on the fence now?`, a + b - c, { hint: 'Two steps: first add, then take away.' });
    const x = rnd(3, 8), y = rnd(3, 8), z = rnd(2, 5);
    return story(`${p} has ${x} red ${pl}, ${y} blue ${pl}, and ${z} yellow ${pl}. How many ${pl} in all?`, x + y + z, { hint: 'Add two colors first, then add the third.' });
  }

  // ---------------- Patterns (enrichment, K.MD.3 / 1.OA.5)
  const PAT = ['🍎', '🍌', '🍇', '⭐', '🌙', '☀️', '🐸', '🐟', '🌸', '🔴', '🔵', '🟡'];
  function k_patterns(d) {
    if (d <= 3) {
      const unit = d === 1 ? 'AB' : d === 2 ? pick(['AAB', 'ABB']) : pick(['ABC', 'AABB']);
      const syms = U.sample(PAT, 4);
      const map = { A: syms[0], B: syms[1], C: syms[2] };
      const full = Array.from({ length: unit.length * 3 }, (_, i) => map[unit[i % unit.length]]);
      const len = Math.min(full.length, unit.length * 2 + rnd(1, unit.length));
      const gap = d === 3 && chance(0.4) ? rnd(1, len - 2) : len - 1;
      const items = full.slice(0, len).map((x, i) => (i === gap ? null : x));
      const ans = full[gap];
      const opts = U.strChoices(ans, [map.A, map.B, map.C, syms[3]].filter(Boolean), 3);
      return C(gap === len - 1 ? 'What comes next?' : 'What is missing?', ans, opts, { visual: V.strip(items), say: gap === len - 1 ? 'Look at the pattern. What comes next?' : 'Look at the pattern. What is missing?', hint: 'Say the pattern out loud. Find the part that repeats.' });
    }
    if (d === 4) {
      const step = pick([1, 2, 10]), s = step === 10 ? 10 * rnd(1, 5) : rnd(0, 10), seq = [s, s + step, s + 2 * step, s + 3 * step];
      return N(`What comes next?<div class="seq">${seq.join(', ')}, ${BLANK}</div>`, s + 4 * step, { say: `What comes next? ${seq.join(', ')}`, hint: 'How much bigger does each number get?' });
    }
    if (chance(0.5)) {
      const [e, , pl] = pick(THINGS), a = rnd(1, 6);
      return N(`<div class="emojieq">${e} + ${e} = ${2 * a}</div>How much is one ${e}?`, a, { say: `Two of the same ${pl} make ${2 * a}. How much is one?`, hint: 'Split the number into two equal parts.' });
    }
    const s = rnd(1, 3), seq = [s, s + 1, s + 3, s + 6];
    return N(`What comes next?<div class="seq">${seq.join(', ')}, ${BLANK}</div>`, s + 10, { say: `What comes next? ${seq.join(', ')}`, hint: 'Look at the jumps: +1, +2, +3… what is the next jump?' });
  }

  Object.assign(MQ.TOPICS, {
    k_count: { name: 'Counting', icon: '🔢', std: 'K.CC.4–5', gen: k_count, track: 'k' },
    k_numbers: { name: 'Number Order', icon: '➡️', std: 'K.CC.1–3', gen: k_numbers, track: 'k' },
    k_compare: { name: 'More or Fewer', icon: '⚖️', std: 'K.CC.6–7', gen: k_compare, track: 'k' },
    k_add: { name: 'Adding', icon: '➕', std: 'K.OA.1–5', gen: k_add, track: 'k' },
    k_sub: { name: 'Taking Away', icon: '➖', std: 'K.OA.1–5', gen: k_sub, track: 'k' },
    k_teen: { name: 'Ten Frames & Teens', icon: '🔟', std: 'K.NBT.1', gen: k_teen, track: 'k' },
    k_shapes: { name: 'Shapes', icon: '🔺', std: 'K.G.1–6', gen: k_shapes, track: 'k' },
    k_measure: { name: 'Size & Sorting', icon: '📏', std: 'K.MD.1–3', gen: k_measure, track: 'k' },
    k_words: { name: 'Story Problems', icon: '📖', std: 'K.OA.2', gen: k_words, track: 'k' },
    k_patterns: { name: 'Patterns', icon: '🧩', std: 'Patterns (ahead)', gen: k_patterns, track: 'k', ahead: true },
  });
})();

  <script>
// Puzzles in the style of Math Kangaroo (levels 1–2) and simpler "Joey" puzzles for kindergarten.
// Every problem has 5 answer choices (A–E in a contest). Difficulty d maps to contest points:
//   d1–2 → 3-point questions, d3 → 4-point, d4–5 → 5-point.
// All problems are original; they follow the contest's style, not its actual questions.
(function () {
  const MQ = (globalThis.MQ = globalThis.MQ || {});
  const U = MQ.U, V = MQ.V;
  const { C, E } = MQ.G;
  const { rnd, pick, chance, shuffle } = U;

  const KIDS = ['Ann', 'Ben', 'Cara', 'Dan', 'Eva', 'Finn', 'Gia', 'Hugo', 'Iris', 'Jack', 'Kira', 'Liam'];
  const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  // Five numeric choices around the answer, smallest first (like the contest sheets).
  const N5 = (text, ans, near, o = {}) => C(text, ans, U.numChoices(ans, near, 5).sort((a, b) => a - b), o);
  const dayChoices = (ans) => U.strChoices(ans, DAYS.filter((d) => d !== ans), 5);
  const plural = (n, one, many) => (n === 1 ? one : many);

  // ---------- 1. Count the shapes ----------
  function polyomino(n, size = 4) {
    const cells = [[rnd(0, size - 1), rnd(0, size - 1)]];
    const has = (r, c) => cells.some(([a, b]) => a === r && b === c);
    while (cells.length < n) {
      const [r, c] = pick(cells), [dr, dc] = pick([[0, 1], [1, 0], [0, -1], [-1, 0]]);
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nc >= 0 && nr < size && nc < size && !has(nr, nc)) cells.push([nr, nc]);
    }
    const mr = Math.min(...cells.map((x) => x[0])), mc = Math.min(...cells.map((x) => x[1]));
    return cells.map(([r, c]) => [r - mr, c - mc]);
  }
  // Squares of every size that fit inside a shape made of little squares.
  function squaresInShape(cells) {
    const has = (r, c) => cells.some(([a, b]) => a === r && b === c);
    const out = {};
    for (let k = 1; k <= 4; k++) for (const [r0, c0] of cells) {
      let all = true;
      for (let r = r0; r < r0 + k && all; r++) for (let c = c0; c < c0 + k && all; c++) all = has(r, c);
      if (all) out[k] = (out[k] || 0) + 1;
    }
    return out;
  }
  function kg_count(d) {
    if (d === 1) {
      const n = rnd(5, 9);
      return N5('How many little squares make this shape?', n, [n - 1, n + 1, n - 2, n + 2], { visual: V.cellShape(polyomino(n)), say: 'How many little squares make this shape?', hint: 'Count row by row and touch each square.' });
    }
    // Half of the time: a random shape made of little squares.
    if (chance(0.5)) {
      if (d === 2) {
        const n = rnd(9, 13);
        return N5('How many little squares make this shape?', n, [n - 1, n + 1, n - 2, n + 2], { visual: V.cellShape(polyomino(n, 4), { size: 30 }), say: 'How many little squares make this shape?', hint: 'Count row by row and touch each square.' });
      }
      for (let t = 0; t < 50; t++) {
        const n = d === 3 ? rnd(7, 10) : d === 4 ? rnd(9, 12) : rnd(12, 15), cells = polyomino(n, d === 5 ? 5 : 4);
        const sq = squaresInShape(cells);
        if (d === 3) {
          const ans = sq[2] || 0;
          if (ans < 1) continue;
          return N5('How many 2×2 squares (made of 4 little squares) can you find in this shape? They may overlap.', ans, [ans - 1, ans + 1, ans + 2, n].filter((x) => x !== ans), { visual: V.cellShape(cells, { size: 30 }), hint: 'Look at every little square: can it be the top-left corner of a 2×2 square?', explain: `There are ${ans} of them.` });
        }
        const ans = U.sum(Object.values(sq));
        if (!sq[2] || (d === 5 && !sq[3] && sq[2] < 3)) continue;
        return N5('How many squares of any size can you find in this shape?', ans, [n, ans - 1, ans + 1, ans + 2, n + 1].filter((x) => x !== ans), { visual: V.cellShape(cells, { size: d === 5 ? 26 : 30 }), hint: 'Count the little squares, then the 2×2 squares, then any bigger ones.', explain: Object.entries(sq).map(([k, v]) => `${v} of size ${k}×${k}`).join(' + ') + ` = ${ans}` });
      }
    }
    // Grid puzzles: squares, rectangles, dominoes or 2×2 squares in an r×c grid, or triangles in a fan of m parts.
    const squaresIn = (r, c) => U.sum(U.range(1, Math.min(r, c)).map((k) => (r - k + 1) * (c - k + 1)));
    const rectsIn = (r, c) => ((r * (r + 1)) / 2) * ((c * (c + 1)) / 2);
    const tasks = {
      2: [['rect', 1, 3], ['rect', 1, 4], ['rect', 3, 1], ['rect', 4, 1], ['sq', 2, 2], ['fan', 2], ['fan', 3], ['dom', 1, 4], ['dom', 4, 1], ['dom', 1, 5], ['dom', 2, 2], ['sq2', 2, 3], ['sq2', 3, 2]],
      3: [['fan', 3], ['fan', 4], ['rect', 1, 5], ['rect', 5, 1], ['sq', 2, 3], ['sq', 3, 2], ['rect', 2, 2], ['dom', 2, 3], ['dom', 3, 2], ['sq2', 3, 3], ['sq2', 2, 4], ['sq2', 4, 2]],
      4: [['sq', 3, 3], ['sq', 2, 4], ['sq', 4, 2], ['fan', 5], ['rect', 1, 6], ['rect', 2, 3], ['rect', 3, 2], ['dom', 3, 3], ['dom', 2, 4], ['sq2', 3, 4], ['sq2', 4, 3]],
      5: [['sq', 3, 4], ['sq', 4, 3], ['sq', 4, 4], ['rect', 2, 4], ['rect', 3, 3], ['fan', 6], ['rect', 4, 2], ['dom', 3, 4], ['dom', 4, 4], ['sq2', 4, 4], ['sq2', 3, 5]],
    }[d];
    const [kind, r, c] = pick(tasks);
    if (kind === 'fan') {
      const ans = (r * (r + 1)) / 2;
      return N5('How many triangles are in this picture?', ans, [r, r + 1, 2 * r, ans - 1, ans + r], { visual: V.fan(r), hint: 'Count triangles made of 1 piece, then 2 pieces next to each other, and so on.', explain: `${U.range(1, r).reverse().join(' + ')} = ${ans}` });
    }
    if (kind === 'dom') {
      const ans = r * (c - 1) + c * (r - 1);
      return N5('How many rectangles made of exactly 2 little squares are in this picture?', ans, [r * c, ans - 1, ans + 1, ans + 2, Math.floor(r * c / 2)].filter((x) => x !== ans), { visual: V.grid(r, c, '#ffd28a'), hint: 'Count the ones lying down, then the ones standing up.', explain: `${r * (c - 1)} lying down + ${c * (r - 1)} standing up = ${ans}` });
    }
    if (kind === 'sq2') {
      const ans = (r - 1) * (c - 1);
      return N5('How many 2×2 squares (made of 4 little squares) are in this picture? They may overlap.', ans, [r * c, ans - 1, ans + 1, ans + 2, Math.floor(r * c / 4)].filter((x) => x !== ans), { visual: V.grid(r, c, '#c3b5ff'), hint: 'Slide a 2×2 window across each row, then down.', explain: `${c - 1} in each row × ${r - 1} rows = ${ans}` });
    }
    if (kind === 'sq') {
      const ans = squaresIn(r, c), parts = U.range(1, Math.min(r, c)).map((k) => (r - k + 1) * (c - k + 1));
      return N5('How many squares of any size are in this picture?', ans, [r * c, r * c + 1, ans - 1, ans + 1, ans + 2], { visual: V.grid(r, c, '#a6e3d8'), hint: 'Count 1×1 squares, then 2×2 squares, then bigger ones. Don’t forget the big ones!', explain: parts.map((n, i) => `${n} of size ${i + 1}×${i + 1}`).join(' + ') + ` = ${ans}` });
    }
    const ans = rectsIn(r, c);
    return N5('How many rectangles of any size are in this picture? (A square counts as a rectangle too.)', ans, [r * c, r * c + r + c, ans - 1, ans + 1, ans - 2], { visual: V.grid(r, c, '#a6e3d8'), hint: r === 1 || c === 1 ? 'Count the 1-piece ones, then 2-piece, then 3-piece…' : 'Count the rectangles in one row first, then the ones that use more rows.', explain: `${(r * (r + 1)) / 2} ways to choose the rows × ${(c * (c + 1)) / 2} ways to choose the columns = ${ans}` });
  }

  // ---------- 2. Balance scales ----------
  // Neutral toy shapes (fruit would look silly: "2 melons weigh as much as 1 banana").
  const FRUIT = [['🔴', 'red ball', 'red balls'], ['🟦', 'blue block', 'blue blocks'], ['🔺', 'pyramid', 'pyramids'], ['⭐', 'star', 'stars'], ['🟡', 'yellow ball', 'yellow balls'], ['🟩', 'green block', 'green blocks']];
  function kg_balance(d) {
    const [A, B, Cc] = U.sample(FRUIT, 3);
    if (d === 1) {
      const k = rnd(2, 3), m = 2;
      return N5(`The scale is balanced. How many ${A[0]} weigh the same as ${m} ${B[0]}?`, k * m, [k, k + 1, k * m + 1, k * m - 1], { visual: V.scale(Array(k).fill(A[0]), [B[0]]), say: `${k} ${A[2]} weigh the same as one ${B[1]}. How many ${A[2]} weigh the same as ${m} ${B[2]}?`, hint: `One ${B[1]} is worth ${k} ${A[2]}. Two of them?` });
    }
    if (d === 2) {
      const k = rnd(2, 3), m = 2;
      return N5(`One ${B[0]} weighs the same as ${k} ${A[0]}. One ${Cc[0]} weighs the same as ${m} ${B[0]}. How many ${A[0]} weigh the same as one ${Cc[0]}?`, k * m, [k, m, k + m, k * m + 2], { visual: V.scale(Array(m).fill(B[0]), [Cc[0]]), say: `One ${B[1]} weighs as much as ${k} ${A[2]}. One ${Cc[1]} weighs as much as ${m} ${B[2]}. How many ${A[2]} weigh as much as one ${Cc[1]}?`, hint: `Swap each ${B[1]} for ${k} ${A[2]}.`, explain: `${m} × ${k} = ${k * m}` });
    }
    if (d === 3) {
      const a = rnd(2, 5), b = rnd(a + 1, 9);
      return N5(`<div class="emojieq">${B[0]} = ${b} kg<br>${A[0]} + ${A[0]} + ${B[0]} = ${2 * a + b} kg</div>How heavy is one ${A[0]}?`, a, [a - 1, a + 1, b, 2 * a], { say: `A ${B[1]} weighs ${b} kilograms. Two ${A[2]} and a ${B[1]} weigh ${2 * a + b} kilograms. How heavy is one ${A[1]}?`, hint: `Take away the ${B[1]} first.`, explain: `${2 * a + b} − ${b} = ${2 * a}, and half of ${2 * a} is ${a}.` });
    }
    if (d === 4) {
      const a = rnd(2, 6), b = rnd(2, 8);
      return N5(`<div class="emojieq">${A[0]} + ${B[0]} = ${a + b}<br>${A[0]} + ${A[0]} + ${B[0]} = ${2 * a + b}</div>How much is ${B[0]}?`, b, [a, a + b, b + 1, b - 1], { hint: 'Compare the two lines: what is different?', explain: `The second line has one more ${A[0]}: ${A[0]} = ${2 * a + b} − ${a + b} = ${a}, so ${B[0]} = ${a + b} − ${a} = ${b}.` });
    }

    const ask = pick([0, 1, 2]), ans = [x, y, z][ask];
    return N5(`<div class="emojieq">${A[0]} + ${B[0]} = ${x + y}<br>${B[0]} + ${Cc[0]} = ${y + z}<br>${A[0]} + ${Cc[0]} = ${x + z}</div>How much is ${[A, B, Cc][ask][0]}?`, ans, [x + y + z, ans + 1, ans - 1, ans + 2], { hint: 'Add all three lines: you get every shape twice.', explain: `All three lines together: ${2 * (x + y + z)}, so one of each = ${x + y + z}. Then subtract the line without it.` });
  }

  // ---------- 3. Who is taller? ----------
  function kg_order(d) {
    if (d === 5) {
      const [p, q, r] = U.sample(KIDS, 3), c = rnd(6, 10), b = c - rnd(1, 3), a = b + rnd(2, 4);
      return N5(`${r} is ${c} years old. ${q} is ${c - b} ${plural(c - b, 'year', 'years')} younger than ${r}. ${p} is ${a - b} years older than ${q}. How old is ${p}?`, a, [b, c, a + 1, a - 1], { hint: `First find ${q}’s age.`, explain: `${q} is ${b}, so ${p} is ${b} + ${a - b} = ${a}.` });
    }
    const n = d <= 1 ? 3 : d <= 3 ? 4 : 5;
    const kids = U.sample(KIDS, n); // kids[0] is the tallest
    const facts = shuffle(kids.slice(0, -1).map((k, i) => (chance(0.5) ? `${k} is taller than ${kids[i + 1]}.` : `${kids[i + 1]} is shorter than ${k}.`)));
    const asks = [['the tallest', 0], ['the shortest', n - 1]];
    if (d >= 3) asks.push(['the second tallest', 1]);
    if (n === 5) asks.push(['in the middle', 2]);
    const [q, idx] = pick(asks);
    const extra = n === 3 ? ['They are all the same height', 'You can’t tell'] : n === 4 ? ['You can’t tell'] : [];
    return C(`${facts.join(' ')}<br><b>Who is ${q}?</b>`, kids[idx], shuffle(kids).concat(extra), { wordy: true, hint: 'Line them up from tallest to shortest, one fact at a time.', explain: `From tallest to shortest: ${kids.join(', ')}.` });
  }

  // ---------- 4. Calendar puzzles ----------
  function kg_calendar(d) {
    const t = rnd(0, 6);
    if (d === 1) { const k = rnd(1, 3), back = chance(0.4), ans = DAYS[(t + (back ? 7 - k : k)) % 7]; return C(`What day comes ${k} ${plural(k, 'day', 'days')} ${back ? 'before' : 'after'} ${DAYS[t]}?`, ans, dayChoices(ans), { hint: back ? 'Say the days of the week backwards.' : 'Say the days of the week in order.' }); }
    if (d === 2) { const k = pick([7, 8, 9, 14]); return C(`Today is ${DAYS[t]}. What day will it be in ${k} days?`, DAYS[(t + k) % 7], dayChoices(DAYS[(t + k) % 7]), { hint: 'In 7 days it is the same day again.', explain: `${k} days = ${Math.floor(k / 7)} week${k >= 14 ? 's' : ''} and ${k % 7} more day${k % 7 === 1 ? '' : 's'}.` }); }
    if (d === 3) { const k = pick([3, 4, 6, 8, 10, 12]); const ans = DAYS[(((t - k) % 7) + 7) % 7]; return C(`Today is ${DAYS[t]}. What day was it ${k} days ago?`, ans, dayChoices(ans), { hint: 'Count backwards. 7 days ago was the same day.' }); }
    if (d === 4) { const date = pick([8, 10, 15, 20, 22, 29]); const ans = DAYS[(t + date - 1) % 7]; return C(`The 1st of the month is a ${DAYS[t]}. What day of the week is the ${date}${date === 22 ? 'nd' : 'th'}?`, ans, dayChoices(ans), { hint: 'The 8th, 15th, 22nd and 29th are the same day as the 1st.' }); }
    const first = rnd(0, 6), target = rnd(0, 6), nth = pick([2, 3]);
    let date = 1 + ((target - first + 7) % 7) + 7 * (nth - 1);
    return N5(`The 1st of the month is a ${DAYS[first]}. What date is the ${nth === 2 ? 'second' : 'third'} ${DAYS[target]} of the month?`, date, [date - 7, date + 7, date - 1, date + 1].filter((x) => x > 0), { hint: `Find the first ${DAYS[target]}, then add 7.`, explain: `The first ${DAYS[target]} is the ${date - 7 * (nth - 1)}, so the ${nth === 2 ? 'second' : 'third'} is the ${date}.` });
  }

  // ---------- 5. Coin puzzles ----------
  const fewest = (amt, coins) => { const best = Array(amt + 1).fill(Infinity); best[0] = 0; for (let a = 1; a <= amt; a++) for (const c of coins) if (c <= a) best[a] = Math.min(best[a], best[a - c] + 1); return best[amt]; };
  const ways = (amt, coins) => { const w = Array(amt + 1).fill(0); w[0] = 1; for (const c of coins) for (let a = c; a <= amt; a++) w[a] += w[a - c]; return w[amt]; };
  function kg_coins(d) {
    if (d <= 2) {
      const coins = d === 1 ? pick([[1, 2, 5], [1, 3, 5], [1, 2, 4], [1, 5, 10], [2, 3, 5]]) : pick([[1, 2, 5, 10], [1, 3, 5, 10], [2, 5, 10], [1, 5, 10, 25], [1, 4, 6, 10]]);
      const amt = d === 1 ? rnd(6, 15) : rnd(13, 29), ans = fewest(amt, coins);
      if (ans === Infinity) return kg_coins(d);
      return N5(`Kanga has lots of ${coins.map((c) => c + '¢').join(', ')} coins. What is the <b>fewest</b> coins she needs to pay exactly ${amt}¢?`, ans, [ans + 1, ans + 2, ans - 1], { hint: 'Use the biggest coins you can first.' });
    }
    if (d === 3) {
      const set = U.sample([1, 2, 3, 4, 5, 10, 20, 25], 3).sort((a, b) => a - b);
      const sums = new Set();
      for (let m = 1; m < 8; m++) sums.add(set.reduce((s, c, i) => s + (m & (1 << i) ? c : 0), 0));
      return N5(`Joey has three coins: ${set.map((c) => c + '¢').join(', ')}. How many different amounts can he pay exactly using one or more of them?`, sums.size, [3, 6, 8, 9], { hint: 'List them: each coin alone, two coins, all three.', explain: `${[...sums].sort((a, b) => a - b).join('¢, ')}¢ — that is ${sums.size} amounts.` });
    }
    const coins = d === 4 ? pick([[2, 5], [2, 3], [3, 5], [1, 5], [1, 10], [2, 10]]) : pick([[1, 2, 5], [1, 5, 10], [1, 2, 10], [2, 5, 10], [1, 3, 5]]);
    let amt, ans;
    do { amt = d === 4 ? rnd(10, 24) : rnd(5, 16); ans = ways(amt, coins); } while (ans < 2 || ans > 15);
    return N5(`In how many different ways can you pay ${amt}¢ using only ${coins.map((c) => c + '¢').join(' and ')} coins? (The order of the coins does not matter.)`, ans, [ans - 1, ans + 1, ans + 2], { hint: `Try using 0 of the biggest coin, then 1, then 2…`, explain: `There are ${ans} ways.` });
  }

  // ---------- 6. Paths on a grid ----------
  const choose = (n, k) => (k === 0 ? 1 : (choose(n - 1, k - 1) * n) / k);
  // Corner (i, j) = i steps right and j steps up from A.
  const waysTo = (i, j) => choose(i + j, i);
  function kg_paths(d) {
    if (d === 1) {
      const r = rnd(1, 4), c = rnd(1, 5);
      if (r + c < 3) return kg_paths(1);
      if (chance(0.4)) return N5('A bug walks all the way around the outside of this grid, along the lines. How many sides of little squares long is its walk?', 2 * (r + c), [r + c, r * c, 2 * (r + c) - 1, 2 * (r + c) + 2], { visual: V.pathGrid(r, c), hint: 'Count the bottom, the right side, the top and the left side.', explain: `${c} + ${r} + ${c} + ${r} = ${2 * (r + c)}` });
      return N5('A bug walks along the lines from A to B. How many sides of little squares long is the shortest way?', r + c, [r * c, r + c + 1, r + c - 1, r + c + 2], { visual: V.pathGrid(r, c), hint: 'It must go up and to the right. Count each.' });
    }
    const sizes = { 2: [[1, 2], [2, 1], [1, 3], [3, 1], [1, 4], [4, 1], [2, 2]], 3: [[2, 2], [1, 5], [5, 1], [1, 6], [6, 1], [2, 3], [3, 2]], 4: [[2, 3], [3, 2], [2, 4], [4, 2], [3, 3]], 5: [[3, 3], [4, 2], [2, 4], [2, 5], [3, 4], [4, 3]] }[d];
    const special = { 2: [[2, 2], [2, 3], [3, 2]], 3: [[2, 3], [3, 2], [2, 2]], 4: [[2, 3], [3, 2], [2, 4], [4, 2]], 5: [[3, 3], [3, 4], [4, 3], [2, 5]] }[d];
    const ask = 'The bug walks from A to B along the lines and only goes <b>up</b> or <b>right</b>.';
    const hint = 'At every corner, write how many ways lead there: add the ways from the left and from below.';
    // Half of the time the bug must pass a ⭐ corner (easier levels) or avoid a closed ✖ corner (harder levels).
    if (chance(0.5)) {
      for (let t = 0; t < 30; t++) {
        const [r, c] = pick(special), i = rnd(0, c), j = rnd(0, r);
        if ((i === 0 && j === 0) || (i === c && j === r)) continue;
        const through = waysTo(i, j) * waysTo(c - i, r - j), total = waysTo(c, r);
        if (d <= 3) {
          if (through === total || through < 2) continue;
          return N5(`${ask} It must pass the corner with the ⭐. How many different ways can it go?`, through, [total, through - 1, through + 1, through + 2].filter((x) => x !== through), { visual: V.pathGrid(r, c, { via: [i, j] }), hint: 'Count the ways from A to the star, and from the star to B. Then multiply.', explain: `${waysTo(i, j)} ${plural(waysTo(i, j), 'way', 'ways')} to the star × ${waysTo(c - i, r - j)} ${plural(waysTo(c - i, r - j), 'way', 'ways')} from the star to B = ${through}` });
        }
        const ans = total - through;
        if (ans < 2 || through === 0) continue;
        return N5(`${ask} The corner with the ✖ is closed. How many different ways can it go?`, ans, [total, ans - 1, ans + 1, through].filter((x) => x !== ans), { visual: V.pathGrid(r, c, { block: [i, j] }), hint: 'Count all the ways, then take away the ways that go through the closed corner.', explain: `${total} ways in all − ${through} through the ✖ = ${ans}` });
      }
    }
    const [r, c] = pick(sizes);
    const ans = choose(r + c, r);
    return N5(`${ask} How many different ways can it go?`, ans, [ans - 1, ans + 1, ans + 2, r * c, r + c].filter((x) => x !== ans), { visual: V.pathGrid(r, c), hint, explain: `Writing the number of ways at each corner gives ${ans} at B.` });
  }

  // ---------- 7. Flip and turn ----------
  const normCells = (cs) => { const mr = Math.min(...cs.map((x) => x[0])), mc = Math.min(...cs.map((x) => x[1])); return cs.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]); };
  const keyOf = (cs) => normCells(cs).map((x) => x.join('-')).join(',');
  const flip = (cs) => { const m = Math.max(...cs.map((x) => x[1])); return cs.map(([r, c]) => [r, m - c]); };
  const turn = (cs) => { const m = Math.max(...cs.map((x) => x[0])); return cs.map(([r, c]) => [c, m - r]); }; // quarter turn clockwise
  function kg_mirror(d) {
    let cells, all;
    do {
      cells = polyomino(d <= 2 ? 4 : 5, 3);
      all = [];
      let t = cells;
      for (let i = 0; i < 4; i++) { all.push(t); all.push(flip(t)); t = turn(t); }
    } while (new Set(all.map(keyOf)).size < 8); // only shapes without any symmetry
    const tasks = [
      ['It is flipped over the dotted line, like in a mirror. What does it look like?', flip(cells), 'right'],
      ['It is turned a quarter turn clockwise (↻). What does it look like?', turn(cells), null],
      ['It is turned upside down (a half turn). What does it look like?', turn(turn(cells)), null],
      ['It is flipped over the dotted line and then turned a half turn. What does it look like?', turn(turn(flip(cells))), 'right'],
    ];
    const [q, target, line] = tasks[d <= 2 ? 0 : d === 3 ? 1 : d === 4 ? pick([1, 2]) : pick([2, 3])];
    const others = all.filter((x) => keyOf(x) !== keyOf(target));
    const opts = shuffle([target, ...U.sample(others.filter((x, i, a) => a.findIndex((y) => keyOf(y) === keyOf(x)) === i), 4)]);
    const values = opts.map((_, i) => 'picture ' + (i + 1));
    return C(`Here is a shape. ${q}`, values[opts.indexOf(target)], values, { visual: V.cellShape(cells, { line, fill: '#ffb547' }), choiceHtml: opts.map((o) => V.cellShape(normCells(o), { size: 18, fill: '#ffb547' })), say: `Here is a shape. ${q.replace('(↻)', '')}`, hint: line ? 'In a mirror, left and right swap places.' : 'Imagine turning the page.' });
  }

  // ---------- 8. Cube towers ----------
  function kg_cubes(d) {
    if (d <= 2) {
      const back = Array.from({ length: d === 1 ? rnd(3, 4) : 4 }, () => rnd(1, d === 1 ? 3 : 4)), ans = U.sum(back);
      return N5('How many cubes are in these towers?', ans, [ans - 1, ans + 1, ans + 2, ans - 2], { visual: V.towers(back), say: 'How many cubes are in these towers?', hint: 'Count each tower, then add.' });
    }
    const cols = d === 3 ? 2 : 3;
    const back = Array.from({ length: cols }, () => rnd(2, 4));
    const front = back.map((h) => rnd(1, h - 1));
    const ans = U.sum(back) + U.sum(front);
    if (d === 5) { // how many more cubes to fill every tower up to the tallest one
      const top = Math.max(...back), need = top * cols * 2 - ans;
      return N5(`These cubes stand in 2 rows. Every cube is on the table or on another cube. How many more cubes are needed so that <b>every</b> tower is ${top} cubes tall?`, need, [need - 1, need + 1, need + 2, ans], { visual: V.towers(back, front), hint: `First count the cubes. A full block would have ${top} × ${cols * 2} cubes.`, explain: `There are ${ans} cubes. ${cols * 2} towers of ${top} = ${top * cols * 2}. ${top * cols * 2} − ${ans} = ${need}.` });
    }
    return N5('These cubes stand in 2 rows. Every cube is on the table or on another cube. How many cubes are there?', ans, [ans - 1, ans + 1, ans + 2, ans - 2], { visual: V.towers(back, front), hint: 'Count the back row and the front row separately. Some back cubes are hidden!', explain: `Back row: ${back.join(' + ')} = ${U.sum(back)}. Front row: ${front.join(' + ')} = ${U.sum(front)}. Total: ${ans}.` });
  }

  // ---------- 9. What comes next? ----------
  function kg_pattern(d) {
    let seq, hint;
    if (d === 1) { const k = pick([2, 3, 5, 10]), s = rnd(1, 10); seq = U.range(0, 4).map((i) => s + i * k); hint = 'How much does it grow each time?'; }
    else if (d === 2) {
      if (chance(0.5)) { const a = rnd(1, 4), b = rnd(a + 1, 6), s = rnd(1, 10); seq = [s]; for (let i = 1; i < 6; i++) seq.push(seq[i - 1] + (i % 2 ? a : b)); hint = `The jumps take turns: +${a}, +${b}, +${a}…`; }
      else { const st = rnd(0, 2); seq = [1, 3, 6, 10, 15, 21, 28].slice(st, st + 5); hint = 'Look at the jumps: they grow by one each time.'; }
    }
    else if (d === 3) { const s = rnd(1, 9), j = rnd(1, 3); seq = [s]; for (let i = 0; i < 4; i++) seq.push(seq[i] + j + i); hint = `The jumps are +${j}, +${j + 1}, +${j + 2}…`; }
    else if (d === 4) {
      const k = rnd(1, 3), s0 = rnd(1, 9), a = rnd(2, 5), b = rnd(1, a - 1), top = rnd(30, 50);
      seq = pick([
        [1, 4, 9, 16, 25, 36, 49].slice(k - 1, k + 4), [1, 2, 4, 8, 16, 32, 64].slice(k - 1, k + 4), [1, 3, 7, 15, 31], [3, 4, 6, 9, 13, 18],
        U.range(0, 5).map((i) => s0 + Math.ceil(i / 2) * a - Math.floor(i / 2) * b), // +a, −b, +a, −b…
        [top, top - 1, top - 3, top - 6, top - 10], // the jumps back grow
        [s0, s0 * 2, s0 * 4, s0 * 8], [k, k * 3, k * 9, k * 27],
      ]);
      hint = 'Compare each number with the one before it.';
    }
    else if (chance(0.6)) { const a = rnd(1, 5), b = rnd(a, 7); seq = [a, b]; while (seq.length < 6) seq.push(seq[seq.length - 1] + seq[seq.length - 2]); hint = 'Each number comes from the two numbers before it.'; }
    else { const s0 = rnd(1, 9); seq = [s0, s0 + 1, s0 + 3, s0 + 7, s0 + 15]; hint = 'Look at the jumps: each jump is twice the one before.'; }
    const ans = seq[seq.length - 1], shown = seq.slice(0, -1);
    return N5(`What number comes next?<div class="seq">${shown.join(', ')}, <span class="blank">?</span></div>`, ans, [ans - 1, ans + 1, ans + 2, ans - 2, shown[shown.length - 1] + (shown[shown.length - 1] - shown[shown.length - 2])].filter((x) => x !== ans && x > 0), { hint, say: `What number comes next? ${shown.join(', ')}` });
  }

  // ---------- 10. Hidden digits ----------
  function kg_digits(d) {
    for (let tries = 0; tries < 200; tries++) {
      if (d === 1) {
        if (chance(0.4)) { const x = rnd(2, 10); return N5(E(`? + ? = ${2 * x}`) + '<p>Both boxes hide the <b>same</b> number. What is it?</p>', x, [x - 1, x + 1, 2 * x, x + 2], { hint: 'Which number plus itself makes it?' }); }
        if (chance(0.3)) { const x = rnd(1, 6); return N5(E(`? + ? + ? = ${3 * x}`) + '<p>All three boxes hide the <b>same</b> number. What is it?</p>', x, [x - 1, x + 1, 3 * x, x + 2].filter((v) => v > 0), { hint: 'Try 1, 2, 3… three times.' }); }
        const x = rnd(1, 9), a = rnd(2, 9);
        return N5(E(`? + ${a} = ${x + a}`) + '<p>What number is hiding in the box?</p>', x, [x - 1, x + 1, x + a, a].filter((v) => v >= 0 && v !== x), { hint: 'Count on from the number you know.' });
      }
      if (d === 2 || d === 3) {
        const add = d === 2;
        const a = rnd(2, 8), b = rnd(0, 9), x = rnd(0, 9), y = rnd(1, 9);
        const X = 10 * a + x, Y = 10 * y + b, S = add ? X + Y : X - Y;
        if (S < 10 || S > 99) continue;
        let sols = 0;
        for (let p = 0; p < 10; p++) for (let q = 1; q < 10; q++) if ((add ? 10 * a + p + 10 * q + b : 10 * a + p - 10 * q - b) === S) sols++;
        if (sols !== 1) continue;
        return N5(`<div class="eqline">${a}<span class="blank">?</span> ${add ? '+' : '−'} <span class="blank">?</span>${b} = ${S}</div>Each box hides one digit. What do the two hidden digits add up to?`, x + y, [x + y - 1, x + y + 1, x + y + 2, x, y].filter((v) => v !== x + y), { hint: add ? 'Start with the ones place.' : 'Check the ones place first: do you need to borrow?', explain: `${X} ${add ? '+' : '−'} ${Y} = ${S}, so the digits are ${x} and ${y}: ${x} + ${y} = ${x + y}.` });
      }
      const A = rnd(101, 499), B = rnd(101, 499), S = A + B;
      const ia = rnd(0, 2), ib = rnd(0, 2), is = rnd(0, 2);
      const hide = (n, i) => String(n).split('').map((c, k) => (k === i ? '<span class="blank">?</span>' : c)).join('');
      const dig = (n, i) => +String(n)[i];
      let sols = 0;
      for (let p = 0; p < 10; p++) for (let q = 0; q < 10; q++) for (let r = 0; r < 10; r++) {
        const set = (n, i, v) => +String(n).split('').map((c, k) => (k === i ? v : c)).join('');
        if ((ia === 0 && p === 0) || (ib === 0 && q === 0) || (is === 0 && r === 0)) continue;
        if (set(A, ia, p) + set(B, ib, q) === set(S, is, r)) sols++;
      }
      if (sols !== 1) continue;
      const ans = dig(A, ia) + dig(B, ib) + dig(S, is);
      return N5(`<div class="column-inline">${hide(A, ia)} + ${hide(B, ib)} = ${hide(S, is)}</div>Each box hides one digit. What do the three hidden digits add up to?`, ans, [ans - 1, ans + 1, ans + 2, ans - 2], { hint: 'Work one place at a time, starting with the ones.', explain: `${A} + ${B} = ${S}. Hidden digits: ${dig(A, ia)}, ${dig(B, ib)}, ${dig(S, is)} → ${ans}.` });
    }
    return kg_digits(1);
  }

  // ---------- 11. Age puzzles ----------
  function kg_age(d) {
    const [p, q] = U.sample(KIDS, 2);
    if (d === 1) { const a = rnd(4, 9), k = rnd(2, 5); return N5(`${p} is ${a} years old. How old will ${p} be in ${k} years?`, a + k, [a, k, a + k + 1, a + k - 1], { hint: 'Count on from today’s age.' }); }
    if (d === 2) { const a = rnd(6, 10), b = rnd(2, a - 2); return N5(`${p} is ${a} and ${q} is ${b}. How old will ${p} be when ${q} is ${a}?`, 2 * a - b, [a, a + b, 2 * a - b + 1, 2 * a - b - 1], { hint: `${p} is always ${a - b} years older.`, explain: `${a} − ${b} = ${a - b} years apart, so ${a} + ${a - b} = ${2 * a - b}.` }); }
    if (d === 3) { const b = rnd(3, 9), diff = rnd(1, 4), a = b + diff; return N5(`Together ${p} and ${q} are ${a + b} years old. ${p} is ${diff} ${plural(diff, 'year', 'years')} older than ${q}. How old is ${q}?`, b, [a, b + 1, b - 1, a + b - diff].filter((x) => x !== b), { hint: `Take away the ${diff} extra years first, then share equally.`, explain: `${a + b} − ${diff} = ${2 * b}, half is ${b}.` }); }
    if (d === 4 && chance(0.5)) {
      const b = rnd(2, 6), x = rnd(1, 6), a = 2 * b + x; // in x years: a + x = 2 × (b + x)
      return N5(`${p} is ${a} and ${q} is ${b}. In how many years will ${p} be exactly twice as old as ${q}?`, x, [x - 1, x + 1, x + 2, a - b].filter((v) => v > 0 && v !== x), { hint: 'Try 1 year, 2 years, 3 years… and check.', explain: `In ${x} ${plural(x, 'year', 'years')}: ${p} ${a + x}, ${q} ${b + x}, and ${a + x} = 2 × ${b + x}.` });
    }
    if (d === 4) {
      let s, x, dad;
      do { s = rnd(4, 9); x = rnd(1, 6); dad = 3 * (s + x) - x; } while (dad < 25 || dad > 45);
      return N5(`Dad is ${dad} and his daughter is ${s}. In how many years will Dad be exactly 3 times as old as his daughter?`, x, [x - 1, x + 1, x + 2, x + 3].filter((v) => v > 0), { hint: 'Try 1 year, 2 years, 3 years… and check.', explain: `In ${x} years: Dad ${dad + x}, daughter ${s + x}, and ${dad + x} = 3 × ${s + x}.` });
    }
    const n = rnd(3, 4), sum = rnd(12, 24), k = rnd(2, 5);
    return N5(`The ages of ${n} brothers and sisters add up to ${sum} today. What will their ages add up to in ${k} years?`, sum + n * k, [sum + k, sum + n * k - k, sum + n * k + k, sum + n].filter((v) => v !== sum + n * k), { hint: `Every one of them gets ${k} years older.`, explain: `${sum} + ${n} × ${k} = ${sum + n * k}` });
  }

  <script>

// Every puzzle is a choice question with an explanation. Clue puzzles are built from a hidden answer and

(function () {
  const MQ = (globalThis.MQ = globalThis.MQ || {});

  const speech = (...parts) => parts.join(' ');
  // All orderings of an array (n ≤ 5).
  function perms(a) {
    if (a.length <= 1) return [a.slice()];
    const out = [];
    a.forEach((x, i) => { for (const p of perms([...a.slice(0, i), ...a.slice(i + 1)])) out.push([x, ...p]); });

  // Keep adding true clues until exactly one world fits, then drop clues that are not needed.
  function enough(worlds, clues, holds, minClues = 1) {
    const fit = (cs) => worlds.filter((w) => cs.every((c) => holds(c, w)));
    const used = [];
    for (const c of clues) {
      if (fit(used).length === 1) break;
      if (fit([...used, c]).length < fit(used).length) used.push(c);
    }
    if (fit(used).length !== 1) return null;
    for (let i = used.length - 1; i >= 0; i--) {
      if (used.length <= minClues) break;
      const less = used.filter((_, k) => k !== i);

  }
  const ORD = ['first', 'second', 'third', 'fourth', 'fifth'];

  // ---------------- 1. Order from clues ----------------
  const SCALES = [
    { more: 'taller', less: 'shorter', most: 'tallest', least: 'shortest', kind: 'tall' },
    { more: 'older', less: 'younger', most: 'oldest', least: 'youngest', kind: 'old' },
    { more: 'faster', less: 'slower', most: 'fastest', least: 'slowest', kind: 'fast' },

  function lg_order(d) {
    if (d <= 3) { // compare: rank 0 is the most
      const n = d === 3 ? 4 : 3, sc = d === 1 ? SCALES[0] : pick(SCALES), names = kids(n);

      const pairs = [];
