    }
    if (d === 2) { // some, and turning a sentence around
      forms.push(() => yn(`Some of the ${pl} in the ${box} are ${p}. ${N} takes a ${sg} from the ${box}. Is it ${p}?`, "Can't tell", `Only some are ${p}: ${N} may have picked a ${p} one or a different one.`));
      forms.push(() => yn(`All the ${pl} in the ${box} are ${p}. ${N} has a ${p} ${sg}. Did it come from the ${box}?`, "Can't tell", `${p[0].toUpperCase() + p.slice(1)} ${pl} can be in other places too.`));
      forms.push(() => yn(`The ${box} has only ${p} ${pl} and ${p2} ${pl}. ${N} takes one that is not ${p}. Is it ${p2}?`, 'Yes', `There are only two colors. Not ${p} means ${p2}.`));
    }
    if (d === 3) { // if… then
      const r = pick(RULES), rule = f(r.rule);
      forms.push(() => yn(`${rule} ${f(r.isIf)} ${f(r.qThen)}`, 'Yes', `The rule says exactly this: ${rule}`, 'Read the "if" part and the "then" part separately.'));
      forms.push(() => yn(`${rule} ${f(r.notThen)} ${f(r.qIf)}`, 'No', `If the "if" part were true, the "then" part would have happened. It did not, so the "if" part is not true.`, 'Read the "if" part and the "then" part separately.'));
      forms.push(() => yn(`${rule} ${f(r.isThen)} ${f(r.qIf)}`, "Can't tell", `The rule does not say this is the only reason. It could have happened for another reason.`, 'Read the "if" part and the "then" part separately.'));
      forms.push(() => yn(`${rule} ${f(r.notIf)} ${f(r.qThen)}`, "Can't tell", `The rule only tells what happens when the "if" part is true. Here it is not, so we don't know.`, 'Read the "if" part and the "then" part separately.'));
    }
    if (d === 4) { // made-up words, so only the sentences count
      const [A, B, Cw] = U.sample(WORDS, 3), Z = pick(CREATURES);
      const art = (w) => ('aeiou'.includes(w[0]) ? 'an ' : 'a ') + one(w);
      const H = 'These are made-up words. Use only the sentences: draw circles inside circles if it helps.';
      forms.push(() => yn(`All ${A} are ${B}. All ${B} are ${Cw}. Is every ${one(A)} ${art(Cw)}?`, 'Yes', `${A} are inside ${B}, and ${B} are inside ${Cw}.`, H));
      forms.push(() => yn(`All ${A} are ${B}. All ${B} are ${Cw}. Is every ${one(Cw)} ${art(A)}?`, "Can't tell", `There may be ${Cw} that are not ${A}.`, H));
      forms.push(() => yn(`All ${A} are ${B}. No ${B} are ${Cw}. Can ${art(A)} be ${art(Cw)}?`, 'No', `Every ${one(A)} is ${art(B)}, and no ${one(B)} is ${art(Cw)}.`, H));
      forms.push(() => yn(`All ${A} are ${B}. ${Z} is ${art(A)}. Is ${Z} ${art(B)}?`, 'Yes', `${Z} is ${art(A)}, and all ${A} are ${B}.`, H));
      forms.push(() => yn(`All ${A} are ${B}. ${Z} is ${art(B)}. Is ${Z} ${art(A)}?`, "Can't tell", `Some ${B} may not be ${A}.`, H));
      forms.push(() => yn(`No ${A} are ${B}. ${Z} is ${art(B)}. Is ${Z} ${art(A)}?`, 'No', `${Z} is ${art(B)}, and no ${one(B)} can be ${art(A)}.`, H));
      forms.push(() => yn(`Some ${A} are ${B}. All ${B} are ${Cw}. Is every ${one(A)} ${art(Cw)}?`, "Can't tell", `Only the ${A} that are ${B} must be ${Cw}. We know nothing about the other ${A}.`, H));
    }
    if (d === 5) { // only, except, either… or, longer chains
      const [A, B, Cw, D] = U.sample(WORDS, 4), Z = pick(CREATURES), M = pick(KIDS.filter((k) => k !== N));
      const art = (w) => ('aeiou'.includes(w[0]) ? 'an ' : 'a ') + one(w);
      forms.push(() => yn(`Only kids with a ticket can ride the train. ${N} is riding the train. Does ${N} have a ticket?`, 'Yes', 'Nobody without a ticket can ride, so a rider must have one.'));
      forms.push(() => yn(`Only kids with a ticket can ride the train. ${N} has a ticket. Is ${N} riding the train?`, "Can't tell", `A ticket lets ${N} ride, but ${N} may not be riding.`));
      forms.push(() => yn(`Every kid in the club has a cat or a dog, or both. ${N} is in the club and has no cat. Does ${N} have a dog?`, 'Yes', `${N} must have one of them, and it is not a cat.`));
      forms.push(() => yn(`Not all ${A} are ${B}. ${Z} is ${art(A)}. Is ${Z} ${art(B)}?`, "Can't tell", `Some ${A} are ${B} and some are not. ${Z} could be either.`));
      forms.push(() => yn(`All ${A} are ${B}, except ${Z}. ${Z} is ${art(A)}. Is ${Z} ${art(B)}?`, 'No', `${Z} is the one ${one(A)} that is not ${art(B)}.`));
      forms.push(() => yn(`All ${A} are ${B}. All ${B} are ${Cw}. All ${Cw} are ${D}. ${Z} is ${art(A)}. Is ${Z} ${art(D)}?`, 'Yes', `${A} → ${B} → ${Cw} → ${D}: each one is inside the next.`));
      forms.push(() => yn(`No ${A} are ${B}. All ${Cw} are ${A}. Can ${art(Cw)} be ${art(B)}?`, 'No', `Every ${one(Cw)} is ${art(A)}, and no ${one(A)} is ${art(B)}.`));
      forms.push(() => yn(`${N} always wins at checkers against ${M}. ${M} always wins against Pat. Did ${N} play Pat today?`, "Can't tell", `The sentences say nothing about a game today between ${N} and Pat.`));
      forms.push(() => yn(`Everyone who finished the puzzle got a star. ${M} did not get a star. Did ${M} finish the puzzle?`, 'No', `If ${M} had finished, ${M} would have a star.`));
    }
    return pick(forms)();
  }

  function lg_situation(d) {
    const [N, M] = kids(2);
    const f = (s) => s.replace(/\{N\}/g, N).replace(/\{M\}/g, M);
    const [q, ans, wrong, ex] = pick(SIT[d]);
    const text = f(q), choices = shuffle([ans, ...wrong].map(f));

  // ---------------- 5. Counting the ways, and "to be sure" ----------------
  const PAIRS = [
    ['shirts', 'pairs of shorts', 'outfit of one shirt and one pair of shorts'],
    ['hats', 'scarves', 'set of one hat and one scarf'],
    ['kinds of bread', 'kinds of cheese', 'sandwich with one bread and one cheese'],
    ['ice cream flavors', 'kinds of cones', 'ice cream with one flavor in one cone'],
    ['cups', 'straws', 'drink with one cup and one straw'],
  ];
  const nc = (text, ans, near, o) => C(text, ans, U.numChoices(ans, near, 4).sort((a, b) => a - b), Object.assign({ wordy: true, say: text }, o));
  const games = (n) => (n * (n - 1)) / 2;
  function lg_count(d) {
    const N = pick(KIDS);
    const outfits = (lo, hi) => {
      const [a1, b1, what] = pick(PAIRS), a = rnd(lo, hi), b = rnd(lo, hi);
      return nc(`${N} has ${a} ${a1} and ${b} ${b1}. How many different kinds of ${what} can ${N} make?`, a * b, [a + b, a * b + 1, a * b - 1, a + b + 1], { hint: `For each one of the ${a1}, count how many ${b1} go with it.`, explain: `${a} × ${b} = ${a * b}: each of the ${a} ${a1} goes with ${b} ${b1}.` });
    };
    const shake = (n) => nc(`${n} friends meet, and every two of them shake hands once. How many handshakes are there?`, games(n), [n, n * (n - 1), games(n) + 1, n + 1], { hint: 'Let the first friend shake everyone’s hand, then the second friend shakes hands with the rest…', explain: `${U.range(1, n - 1).reverse().join(' + ')} = ${games(n)}.` });
    const lineup = (n) => { const names = kids(n), ans = [1, 1, 2, 6, 24][n]; return nc(`${names.join(', ')} line up for a photo. In how many different orders can they stand?`, ans, [n * n, n + 1, ans - 1, ans + 2, ans * 2], { hint: 'How many kids can be first? Then how many can be second?', explain: `${U.range(1, n).reverse().join(' × ')} = ${ans}.` }); };
    const digits = (k, rep) => {
      const ds = U.sample([1, 2, 3, 4, 5, 6, 7, 8, 9], k).sort((a, b) => a - b), ans = rep ? k * k : k * (k - 1);
      return nc(`Use the digits ${ds.join(', ')} to make two-digit numbers${rep ? ' (a digit may be used twice, like ' + ds[0] + ds[0] + ')' : ' (each digit at most once in a number)'}. How many different numbers can you make?`, ans, [k * k, k * (k - 1), k * 2, ans + 1], { hint: 'Pick the tens digit first, then count the ones digits that can go with it.', explain: `${k} choices for the tens × ${rep ? k : k - 1} for the ones = ${ans}.` });
    };
    const league = (n) => nc(`${n} teams play a tournament. Every team plays every other team once. How many games are played?`, games(n), [n, n * (n - 1), games(n) + 1, games(n) - 1], { hint: 'Count the games of the first team, then the new games of the second team…', explain: `${U.range(1, n - 1).reverse().join(' + ')} = ${games(n)}.` });
    if (d === 1) return outfits(2, 3);
    if (d === 2) return pick([() => outfits(2, 4), () => shake(3), () => nc(`${N} has a red, a blue and a green balloon and gives one balloon to each of 2 friends. How many balloons are left?`, 1, [0, 2, 3], { explain: '3 − 2 = 1.' })])();
    if (d === 3) return pick([() => lineup(3), () => shake(4), () => digits(3, false), () => digits(3, true), () => {
      const n = 2;
      return nc(`${N} has ${n} hats, ${n} shirts and ${n} pairs of pants. How many different outfits of a hat, a shirt and pants can ${N} make?`, 8, [6, 4, 9, 7], { explain: '2 × 2 × 2 = 8.', hint: 'First count hat-and-shirt sets, then add the pants.' });
    }])();
    const socks = () => {
      const r = rnd(3, 9), b = rnd(3, 9), [c1, c2] = U.sample(['red', 'blue', 'green', 'black', 'white'], 2), kind = rnd(1, 3);
      const intro = `A drawer has ${r} ${c1} socks and ${b} ${c2} socks. ${N} takes socks without looking.`;
      if (kind === 1) return nc(`${intro} How many must ${N} take to be sure to have 2 socks of the same color?`, 3, [2, 4, r + 1, b + 1], { hint: 'Think of the unluckiest way it could go.', explain: 'The first 2 could be different colors. The 3rd always matches one of them.' });
      if (kind === 2) return nc(`${intro} How many must ${N} take to be sure to get a ${c1} sock?`, b + 1, [b, r, r + 1, b + 2], { hint: 'Think of the unluckiest way it could go.', explain: `Unluckiest: all ${b} ${c2} socks come first. The next one must be ${c1}: ${b} + 1 = ${b + 1}.` });
      return nc(`${intro} How many must ${N} take to be sure to get 2 ${c1} socks?`, b + 2, [b + 1, 2, r + 2, b + 3], { hint: 'Think of the unluckiest way it could go.', explain: `Unluckiest: all ${b} ${c2} socks come first, then 2 ${c1}: ${b} + 2 = ${b + 2}.` });
    };
    if (d === 4) return pick([socks, () => shake(5), () => league(rnd(4, 6)), () => digits(4, false)])();
    const colors3 = () => {
      const k = rnd(1, 2), cs = U.sample(['red', 'blue', 'green', 'yellow'], 3), ns = [rnd(4, 8), rnd(4, 8), rnd(4, 8)];
      const intro = `A bag has ${ns[0]} ${cs[0]}, ${ns[1]} ${cs[1]} and ${ns[2]} ${cs[2]} marbles. ${N} takes marbles without looking.`;
      if (k === 1) return nc(`${intro} How many must ${N} take to be sure to have 3 marbles of the same color?`, 7, [3, 4, 6, 9], { hint: 'Unluckiest: as many as possible without 3 of one color.', explain: '2 of each color is 6 marbles with no 3 the same. The 7th makes 3 of one color.' });
      const sorted = ns.slice().sort((a, b) => b - a), ans = sorted[0] + sorted[1] + 1;
      return nc(`${intro} How many must ${N} take to be sure to have at least one marble of every color?`, ans, [3, ans - 1, ans + 1, sorted[0] + 1], { hint: 'Unluckiest: the two biggest colors come out first.', explain: `${sorted[0]} + ${sorted[1]} marbles could miss one color. One more: ${ans}.` });
    };
    return pick([colors3, () => lineup(4), () => {
      const a = rnd(2, 3), b = rnd(2, 3), c = rnd(2, 4);

  // ---------------- 6. Truth-tellers and fibbers ----------------
  const FACTS = [['I have a dog.', 'Does {N} have a dog?'], ['I ate an apple today.', 'Did {N} eat an apple today?'], ['My bike is red.', 'Is {N}’s bike red?'], ['I can whistle.', 'Can {N} whistle?'], ['I have a sister.', 'Does {N} have a sister?'], ['I saw a rainbow.', 'Did {N} see a rainbow?'], ['My hat is new.', 'Is {N}’s hat new?']];
  const PLACES = ['under the bed', 'in the box', 'in the closet', 'behind the couch'];

  // Statements a person can make about the group; truth(w) tells whether it is true in world w (true = truth-teller).
  function statements(names, s) {
    const out = [], o = names.map((_, i) => i).filter((i) => i !== s);
    for (const x of o) {
      out.push({ t: `“${names[x]} tells the truth.”`, f: (w) => w[x] });
      out.push({ t: `“${names[x]} is a fibber.”`, f: (w) => !w[x] });
      out.push({ t: `“${names[x]} and I are the same kind.”`, f: (w) => w[x] === w[s] });
      out.push({ t: `“${names[x]} and I are different kinds.”`, f: (w) => w[x] !== w[s] });
    }
    if (names.length === 2) {
      out.push({ t: '“We are both fibbers.”', f: (w) => !w[0] && !w[1] });
      out.push({ t: '“At least one of us is a fibber.”', f: (w) => !w[0] || !w[1] });
    } else {
      for (let k = 0; k <= 3; k++) out.push({ t: `“Exactly ${k} of us ${k === 1 ? 'tells' : 'tell'} the truth.”`, f: (w) => w.filter(Boolean).length === k });
      out.push({ t: '“At least one of us is a fibber.”', f: (w) => w.some((x) => !x) });
    }
    return out;
  }
  const RULE_TF = 'A truth-teller always tells the truth. A fibber always fibs.';
  function lg_liars(d) {
    const [N, M] = kids(2);
    if (d === 1) {
      const [fact, q] = pick(FACTS), honest = chance(0.5), qq = q.replace('{N}', N);
      const text = `${N} ${honest ? 'always tells the truth' : 'always fibs (never tells the truth)'}. ${N} says: “${fact}” ${qq}`;
      return C(text, honest ? 'Yes' : 'No', YN, { wordy: true, say: text, hint: honest ? 'If someone always tells the truth, what they say is true.' : 'If someone always fibs, the opposite of what they say is true.', explain: honest ? `${N} tells the truth, so it is true.` : `${N} always fibs, so it is not true.` });
    }
    if (d === 2) {
      if (chance(0.5)) {
        const [p1, p2] = U.sample(PLACES, 2), honest = chance(0.5);
        const text = `The ball is either ${p1} or ${p2}. ${N} ${honest ? 'always tells the truth' : 'always fibs'}. ${N} says: “The ball is ${p1}.” Where is the ball?`;
        const ans = honest ? p1 : p2;
        return C(text, ans.replace(/^./, (c) => c.toUpperCase()), PLACES.map((x) => x.replace(/^./, (c) => c.toUpperCase())), { wordy: true, say: text, hint: 'There are only two places. Is what was said true or false?', explain: honest ? `${N} tells the truth: ${p1}.` : `${N} fibs, so it is not ${p1}. It must be ${p2}.` });
      }
      // One of them ate the cookie; work out who from one sentence.
      const speakerHonest = chance(0.5), speaker = speakerHonest ? N : M, other = speakerHonest ? M : N;
      const claims = [[`I ate it.`, (e) => e === speaker], [`I did not eat it.`, (e) => e !== speaker], [`${other} ate it.`, (e) => e === other], [`${other} did not eat it.`, (e) => e !== other]];
      const [claim, holds] = pick(claims);
      const eater = [N, M].find((e) => holds(e) === speakerHonest);
      const text = `${N} always tells the truth and ${M} always fibs. One of them ate the cookie. ${speaker} says: “${claim}” Who ate the cookie?`;
      return C(text, eater, [N, M, 'Both', 'Nobody'], { wordy: true, say: text, hint: `Does ${speaker} tell the truth or fib? Then what really happened?`, explain: speakerHonest ? `${N} tells the truth, so “${claim}” is true: ${eater} ate it.` : `${M} fibs, so “${claim}” is false: ${eater} ate it.` });
    }
    // d3–5: find the only possible truth-tellers
    const n = d === 5 ? 3 : 2, names = kids(n);
    for (let tries = 0; tries < 200; tries++) {
      const truth = names.map(() => chance(0.5));
      const worlds = [];
      for (let m = 0; m < 1 << n; m++) worlds.push(names.map((_, i) => !!(m & (1 << i))));
      const said = names.map((_, s) => {
        return pick(statements(names, s).filter((st) => st.f(truth) === truth[s]));
      });
      if (d === 3 || (d === 5 && chance(0.4))) said[rnd(0, n - 1)] = null; // someone says nothing
      const fits = worlds.filter((w) => said.every((st, s) => !st || st.f(w) === w[s]));
      if (fits.length !== 1) continue;
      const lines = names.map((p, s) => (said[s] ? `${p} says: ${said[s].t}` : `${p} says nothing.`));
      const check = names.map((p, s) => (said[s] ? `${p} ${truth[s] ? 'tells the truth, and' : 'fibs, and'} ${said[s].t} is ${truth[s] ? 'true' : 'false'}.` : `${p} ${truth[s] ? 'tells the truth' : 'fibs'}.`)).join(' ');
      const intro = `${RULE_TF} ${names.join(n === 2 ? ' and ' : ', ')} are each a truth-teller or a fibber.`;
      if (n === 2) {
        const label = (w) => (w[0] && w[1] ? 'Both' : !w[0] && !w[1] ? 'Neither' : w[0] ? `Only ${names[0]}` : `Only ${names[1]}`);
        const q = 'Who tells the truth?';
        return C(`${intro}${list(lines)}${q}`, label(truth), [`Only ${names[0]}`, `Only ${names[1]}`, 'Both', 'Neither'], { wordy: true, say: speech(intro, ...lines, q), hint: 'Try it: suppose the first one tells the truth. Does everything fit? Then try the other way.', explain: check });
      }
      const k = truth.filter(Boolean).length, q = 'How many of them tell the truth?';
      return C(`${intro}${list(lines)}${q}`, k, [0, 1, 2, 3], { wordy: true, say: speech(intro, ...lines, q), hint: 'Try each possibility and look for the one where nobody breaks their rule.', explain: check });
    }
    return lg_liars(4);
  }

  });

})();

  // ---------------------------------------------------------------- Dragon Egg: one dragon drawing in ten (eleven) colors

  // fly: the just-hatched baby flying around (small wings, no eggshell)

      rainbow: ['#ff6b6b', '#ffe66d', '#5ec8ff'].map((col, i) => P(`M${52 + i * 6} 25L${55 + i * 6} ${13 + (i % 2) * -3}L${58 + i * 6} 25Z`, col, ol(d, 1.6))).join(''),

    const crest = stage === 0 || crown ? '' : crests[el];

      crystal: spk(16, 24, 6, '#ffc4ec') + spk(104, 22, 5, '#9ff0ff') + spk(12, 62, 3.5, '#d3b8ff'),
      moon: star(16, 22, 4, '#fff3a6') + star(104, 18, 3.5, '#fff3a6') + C(12, 60, 1.6, '#ffffff') + C(108, 54, 1.4, '#ffffff'),

      rainbow: spk(14, 20, 6, '#ffe66d') + spk(106, 18, 5, '#ff8fc7') + spk(12, 64, 4, '#5ec8ff'),

    return [defs, glow + aura + halo + wings + tail + tip + body + arms + feet + shell + head + face + crown + (stage === 3 ? spk(30, 24, 4, '#ffffff') + spk(92, 24, 4, '#ffffff') : '')];

  Object.keys(MQ.DRAGON_LOOK).forEach((id) => { A[id] = (k, o) => dragon(k, id, o.stage == null ? 2 : o.stage, o.fly); });

  MQ.art = (id, o = {}) => {

  // ---------------------------------------------------------------- eggs
  const EGG = 'M60 8C84 8 100 48 100 72C100 96 82 112 60 112C38 112 20 96 20 72C20 48 36 8 60 8Z';

      spk(102, 26, 8, '#fff1a6') + spk(18, 30, 6, '#fff1a6') + spk(104, 96, 5, '#fff1a6'), '#a8650a', '#ffe066'],
    dragon: (k, o) => [`<pattern id="${k}p" width="14" height="12" patternUnits="userSpaceOnUse"><path d="M0 12C0 4 14 4 14 12M-7 6C-7 -2 7 -2 7 6M7 6C7 -2 21 -2 21 6" fill="none" stroke="#9b59b6" stroke-width="2"/></pattern><clipPath id="${k}c"><path d="${EGG}"/></clipPath>` + glowG(k + 'g', o.glow || '#ff9f1c'),

  <script>
// Test prep: an i-Ready-style adaptive "Placement Check".
//
// One grade ladder (Early K … 3rd grade+) serves both grades. Each step takes its questions from the
// existing generators (kindergarten track for K–1st, 2nd-grade track for 2nd–3rd). The check covers the
// four i-Ready domains and picks every next question near the child's current estimated level.
//
// The level is estimated from all answers so far with a small item-response model:
//   P(right) = guess + (1 − guess) · logistic(1.7 · (ability − step))
// where "guess" depends on the format (a 2-button choice is easy to guess, a typed number is not).
(function () {
  const MQ = (globalThis.MQ = globalThis.MQ || {});
  const U = MQ.U;
  const P = {};

  P.DOMAINS = [
    { id: 'nbt', name: 'Number & Operations', short: 'Numbers', icon: '🔢' },
    { id: 'alg', name: 'Algebra & Algebraic Thinking', short: 'Algebra', icon: '🧩' },
    { id: 'md', name: 'Measurement & Data', short: 'Measurement', icon: '📏' },
    { id: 'geo', name: 'Geometry', short: 'Geometry', icon: '🔷' },
  ];
  const DOMAIN_OF = {
    add20: 'alg', place: 'nbt', add100: 'nbt', sub100: 'nbt', arrays: 'alg', time: 'md', money: 'md', shapes: 'geo', measure: 'md',
    data: 'md', big: 'nbt', words: 'alg', mult: 'alg', logic: 'alg',
    k_count: 'nbt', k_numbers: 'nbt', k_compare: 'nbt', k_teen: 'nbt', k_add: 'alg', k_sub: 'alg', k_words: 'alg', k_patterns: 'alg',
    k_measure: 'md', k_shapes: 'geo',
  };
  Object.entries(DOMAIN_OF).forEach(([t, d]) => { if (MQ.TOPICS[t]) MQ.TOPICS[t].domain = d; });

  // Which topics feed each domain on each track (school-math topics only, no enrichment puzzles).
  const POOL = {
    k: { nbt: ['k_count', 'k_numbers', 'k_compare', 'k_teen'], alg: ['k_add', 'k_sub', 'k_words'], md: ['k_measure'], geo: ['k_shapes'] },
    g2: { nbt: ['place', 'add100', 'sub100', 'big'], alg: ['add20', 'arrays', 'words'], md: ['time', 'money', 'measure', 'data'], geo: ['shapes'] },
  };
  P.POOL = POOL;
  P.STEPS = [
    { label: 'Early K', track: 'k', d: 1 },
    { label: 'Mid K', track: 'k', d: 2 },
    { label: 'Late K', track: 'k', d: 3 },
    { label: 'Early 1st', track: 'k', d: 4 },
    { label: 'Late 1st', track: 'k', d: 5 },
    { label: 'Early 2nd', track: 'g2', d: 1 },
    { label: 'Mid 2nd', track: 'g2', d: 2 },
    { label: 'Late 2nd', track: 'g2', d: 3 },
    { label: 'Early 3rd', track: 'g2', d: 4 },
    { label: '3rd grade+', track: 'g2', d: 5 },
  ];
  const TOP = P.STEPS.length - 1;
  const clampStep = (x) => U.clamp(Math.round(x), 0, TOP);
  P.label = (theta) => P.STEPS[clampStep(theta)].label;

  // Where a child "should" be today: fall = early, winter = mid, spring = late in their grade.
  P.expected = (grade, date = new Date()) => {
    const m = date.getMonth(); // 0 = Jan
    const part = m >= 7 && m <= 9 ? 0 : m >= 10 || m <= 1 ? 1 : 2;
    return (grade === 'k' ? 0 : 5) + part;
  };
  P.status = (theta, expected) => {
    const diff = theta - expected;
    if (diff >= 1.5) return { id: 'above', text: 'Above grade level', icon: '🌟' };
    if (diff >= -1) return { id: 'on', text: 'On grade level', icon: '✅' };
    return { id: 'below', text: 'Needs practice', icon: '🌱' };
  };

  // ---------- the statistics ----------
  const guessOf = (p) =>
    p.kind === 'choice' ? 1 / p.choices.length : p.kind === 'line' ? 1 / (Math.round((p.line.max - p.line.min) / p.line.step) + 1) : p.kind === 'order' ? 0.05 : p.kind === 'multi' ? 0.05 : 0.02;
  const pRight = (theta, step, g) => g + (1 - g) / (1 + Math.exp(-1.7 * (theta - step)));
  // Most likely ability given the answers, with a gentle prior around `mean`.
  function estimate(items, mean, sd = 2.5) {
    let best = mean, bestLL = -Infinity;
    for (let th = -1; th <= TOP + 1.001; th += 0.05) {
      let ll = -((th - mean) ** 2) / (2 * sd * sd);
      for (const it of items) {
        const pr = pRight(th, it.s, it.g);
        ll += Math.log(it.ok ? pr : 1 - pr);
      }
      if (ll > bestLL) { bestLL = ll; best = th; }
    }
    return U.clamp(best, 0, TOP);
  }
  P.estimate = estimate;

  // ---------- running a check ----------
  P.newCheck = (grade, history = []) => {
    const last = history.filter((h) => h.grade === grade).slice(-1)[0];
    // Like i-Ready: the first check starts one grade below; later checks start a little below the last result.
    const start = last ? U.clamp(Math.round(last.overall) - 1, 0, TOP) : grade === 'k' ? 0 : 3;
    const counts = grade === 'k' ? { nbt: 6, alg: 5, md: 4, geo: 5 } : { nbt: 8, alg: 8, md: 8, geo: 6 };
    const plan = [];
    const left = Object.assign({}, counts);
    while (Object.values(left).some((n) => n > 0)) for (const d of ['nbt', 'alg', 'md', 'geo']) if (left[d]-- > 0) plan.push(d);
    return { grade, start, plan, items: [], seen: new Set(), date: U.dateKey() };
  };
  P.total = (eng) => eng.plan.length;
  P.done = (eng) => eng.items.length >= eng.plan.length;
  const overallNow = (eng) => estimate(eng.items, eng.start + 0.5, 3);
  const domainNow = (eng, dom) => estimate(eng.items.filter((it) => it.dom === dom), eng.items.length ? overallNow(eng) : eng.start + 0.5, 2);

  P.next = (eng) => {
    const dom = eng.plan[eng.items.length];
    const step = clampStep(domainNow(eng, dom));
    const st = P.STEPS[step];
    let p;
    for (let i = 0; i < 30; i++) {
      p = MQ.makeProblem(U.pick(POOL[st.track][dom]), st.d);
      const key = p.text + (p.visual || '');
      if (!eng.seen.has(key)) { eng.seen.add(key); break; }
    }
    p.step = step;
    p.dom = dom;
    return p;
  };
  P.answer = (eng, p, ok, given) => {
    eng.items.push({
      dom: p.dom, s: p.step, ok: !!ok, g: guessOf(p), t: p.topic, d: p.d,
      q: String(p.text).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 150),
      given: given === undefined ? '' : String(given), a: Array.isArray(p.answer) ? p.answer.join(', ') : String(p.answer), e: p.explain || '',
    });
  };
  // A question as it was shown, with the child's answer (null when left blank), for the full review (kept on the device).
  P.snapshot = (p, given) => ({
    text: p.text, visual: p.visual || '', kind: p.kind, big: !!p.big, wordy: !!p.wordy, unit: p.unit || '',
    choices: p.choices || null, choiceHtml: p.choiceHtml || null, answer: p.answer, explain: p.explain || '',
    given: given === undefined || given === '' ? null : given,
  });
  P.result = (eng) => {
    const overall = overallNow(eng);
    const domains = {};
    for (const d of P.DOMAINS) domains[d.id] = Math.round(domainNow(eng, d.id) * 10) / 10;
    return {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      date: eng.date, grade: eng.grade,
      overall: Math.round(overall * 10) / 10, domains,
      expected: P.expected(eng.grade),
      n: eng.items.length, correct: eng.items.filter((i) => i.ok).length,
      items: eng.items,
    };
  };

  // What to practice next: the two weakest domains, at the difficulty that matches the result.
  P.practicePlan = (res, grade) => {
    const track = grade === 'k' ? 'k' : 'g2';
    const toD = (theta) => (track === 'k' ? U.clamp(Math.round(theta) + 1, 1, 5) : U.clamp(Math.round(theta) - 4, 1, 5));
    const weakest = P.DOMAINS.slice().sort((a, b) => res.domains[a.id] - res.domains[b.id]).slice(0, 2);
    const topics = [...new Set(weakest.flatMap((d) => POOL[track][d.id]))];
    const diff = toD(Math.min(...weakest.map((d) => res.domains[d.id])));
    return { domains: weakest, topics, diff };
  };

  // ---------- Math Kangaroo style mock contest ----------
  // Kangaroo: 24 questions, 8 worth 3 points, 8 worth 4, 8 worth 5 (96 in all), 75 minutes, no penalty for wrong answers.
  // Joey (kindergarten): 12 picture puzzles, 1 point each, no clock.
  P.KANGAROO_MINUTES = 75;
  // A question this child has not seen yet: never one already in this attempt (`avoid`), preferably one
  // not shown in earlier attempts (profile `seen`); when every candidate was seen, the one seen longest ago.
  P.fresh = (topic, d, avoid = new Set()) => {
    const seen = (MQ.state && MQ.state.seen && MQ.state.seen[topic]) || [];
    let best = null, bestRank = Infinity;
    for (let i = 0; i < 40; i++) {
      const p = MQ.makeProblem(topic, d), k = U.qkey(p);
      const rank = avoid.has(k) ? 1e9 : seen.indexOf(k);
      if (rank === -1) { best = p; break; }
      if (rank < bestRank || !best) { best = p; bestRank = rank; }
    }
    avoid.add(U.qkey(best));
    return best;
  };
  // review: skills the child got wrong before ({ topic, d }, most urgent first). Kangaroo and Logic tests swap a few
  // questions for fresh ones of those skills, in the same section, so the test keeps its size and point values.
  // (CogAT, Brain Games and Joey tests already ask every question type at every level they use.)
  P.REVIEW_IN_CONTEST = 3;
  const bandOf = (d) => (d <= 2 ? 3 : d === 3 ? 4 : 5);
  P.newContest = (kind, review = []) => {
    const avoid = new Set();
    const make = (topic, d) => P.fresh(topic, d, avoid);
    const items = [];
    if (kind === 'logic' || kind === 'logick') {
      // Logic Lab challenge: every kind of logic puzzle, the easier round first.
      const [topics, levels] = kind === 'logic' ? [MQ.LOGIC_TOPICS, [4, 5]] : [MQ.LOGIC_K, [1, 2]];
      levels.forEach((d, r) => { for (const t of U.shuffle(topics)) items.push({ p: make(t, d), pts: 1, sec: r ? 'Round 2' : 'Round 1' }); });
    } else if (kind === 'joey') {
      for (let i = 0; i < 12; i++) items.push({ p: make('kg_joey', 1), pts: 1 });
    } else if (kind === 'nnat') {
      // NNAT-3 style: 48 questions, the four kinds mixed, getting harder from the first to the last (levels 1–6)
      for (const x of MQ.nnatPlan()) items.push({ p: make(x.topic, x.d), pts: 1, sec: MQ.TOPICS[x.topic].name });
    } else if (kind === 'cogat' || kind === 'cogatk') {
      // CogAT style: battery by battery, each question type in a row, getting harder within the type.
      const levels = kind === 'cogat' ? [1, 2, 3, 4, 5] : [1, 1];
      for (const b of MQ.COGAT_BATTERIES) for (const t of b.topics) for (const d of levels) items.push({ p: make(t, d), pts: 1, sec: b.id });
    } else {
      for (const pts of [3, 4, 5]) {
        const topics = U.shuffle(MQ.KANGAROO_TOPICS);
        for (let i = 0; i < 8; i++) items.push({ p: make(topics[i % topics.length], pts === 3 ? U.rnd(1, 2) : pts === 4 ? 3 : U.rnd(4, 5)), pts });
      }
    }
    const family = kind === 'kangaroo' ? MQ.KANGAROO_TOPICS : kind === 'logic' ? MQ.LOGIC_TOPICS : kind === 'logick' ? MQ.LOGIC_K : [];
    const maxD = kind === 'logick' ? 2 : 5;
    for (const r of review.filter((x) => family.includes(x.topic) && x.d <= maxD).slice(0, P.REVIEW_IN_CONTEST)) {
      // the same type if it is in the test, otherwise any question of the same section
      const fits = (it) => !it.rv && (kind === 'kangaroo' ? it.pts === bandOf(r.d) : true);
      let at = items.findIndex((it) => fits(it) && it.p.topic === r.topic);
      if (at < 0) at = items.findIndex(fits);
      if (at < 0) continue;
      const p = make(r.topic, r.d);
      p.review = true;
      items[at] = Object.assign({}, items[at], { p, rv: true });
    }
    return { kind, items, answers: items.map(() => null), flags: items.map(() => false), i: 0, seconds: kind === 'kangaroo' ? P.KANGAROO_MINUTES * 60 : kind === 'nnat' ? MQ.NNAT_TEST.minutes * 60 : 0, started: Date.now() };
  };
  P.scoreContest = (ct) => {
    const graded = ct.items.map((it, i) => ({ it, given: ct.answers[i], ok: ct.answers[i] !== null && ct.answers[i] === it.p.answer }));
    // Sections: point values for Kangaroo, batteries for CogAT. Types: accuracy per kind of question.
    const sections = {}, types = {}, levels = {};
    for (const g of graded) {
      const l = (levels[g.it.p.d] = levels[g.it.p.d] || { right: 0, n: 0 });
      l.n++;
      if (g.ok) l.right++;
      const s = (sections[g.it.sec || g.it.pts] = sections[g.it.sec || g.it.pts] || { right: 0, n: 0 });
      const t = (types[g.it.p.topic] = types[g.it.p.topic] || { right: 0, n: 0 });
      s.n++; t.n++;
      if (g.ok) { s.right++; t.right++; }
    }
    return {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      date: U.dateKey(), kind: ct.kind,
      score: U.sum(graded.filter((g) => g.ok).map((g) => g.it.pts)), max: U.sum(ct.items.map((it) => it.pts)),
      right: graded.filter((g) => g.ok).length, blank: graded.filter((g) => g.given === null).length, n: graded.length,
      sections, types, levels, minutes: Math.max(1, Math.round((Date.now() - ct.started) / 60000)), timed: !!ct.timed,
      used: ct.timed && ct.seconds ? ct.seconds - Math.max(0, ct.left || 0) : null, // seconds on the clock
      items: graded.map((g) => ({
        t: g.it.p.topic, d: g.it.p.d, pts: g.it.pts, sec: g.it.sec || '', ok: g.ok, rv: !!g.it.rv,
        q: String(g.it.p.text).replace(/<svg[\s\S]*?<\/svg>/g, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 160), // pictures dropped
        g: g.given === null ? '' : g.given, a: g.it.p.answer, e: g.it.p.explain || '',
        letterG: g.given === null ? '' : 'ABCDE'[g.it.p.choices.indexOf(g.given)], letterA: 'ABCDE'[g.it.p.choices.indexOf(g.it.p.answer)],
      })),
    };
  };

  // ---------- what each test is, for the ⓘ buttons ----------
  P.INFO = {
    check: {
      title: 'Placement Check', icon: '🎯',
      what: 'A practice version of the i-Ready Diagnostic in math: an adaptive test where the next question gets harder after a right answer and easier after a wrong one.',
      where: 'Many California schools give the i-Ready Diagnostic three times a year (fall, winter, spring). Teachers use it to see each child’s level and to choose lessons.',
      checks: 'Four areas of school math: Numbers & Operations, Algebra & Algebraic Thinking, Measurement & Data, and Geometry. The result is a level such as “Mid 2nd”, compared with where most kids are at that time of year.',
      how: 'Take a check about a week before the school test, or every couple of months to see growth. No hints during the check. Afterwards, “Practice these” trains the two weakest areas, and the mistakes come back in Fix-it Lab.',
    },
    kangaroo: {
      title: 'Math Kangaroo', icon: '🦘',
      what: 'An international math contest with thinking puzzles, not drills. Levels 1–2 take the same paper: 24 puzzles in 75 minutes, answers A–E.',
      where: 'Held once a year in March at test centers across the US (Math Kangaroo USA). Kids sign up through a local center, often a school or a library.',
      checks: 'Logic, counting, shapes and patterns, careful reading. Puzzles are worth 3, 4 or 5 points, and a wrong answer costs nothing.',
      how: 'Try a mock contest with the clock once in a while, and use “Practice by type” for the kinds of puzzles that went wrong. Missed puzzle types come back in the next mock contest.',
    },
    joey: {
      title: 'Joey Puzzles', icon: '🐣',
      what: 'Picture brain teasers in the style of Math Kangaroo, made easier for kindergarten.',
      where: 'Math Kangaroo starts in 1st grade; these puzzles get a kindergartner used to the style early.',
      checks: 'Counting, comparing, simple patterns and shapes, and listening carefully to the question.',
      how: 'Play the 12 puzzles with a grown-up nearby. Every question can be read aloud with 🔊. There is no clock.',
    },
    nnat: {
      title: 'NNAT-3 practice', icon: '🔷',
      what: 'Practice for the Naglieri Nonverbal Ability Test, 3rd edition (NNAT-3): picture puzzles with shapes and colors, no words and no numbers. It measures reasoning, not what was taught in class.',
      where: 'Eureka Union School District uses the NNAT-3 as the only test for GATE eligibility: an NAI of 132 or more (98th percentile) qualifies. Testing starts in 2nd grade, every child may test twice (a second try the next year), and the district tests in February. Invitations go out in early December; register by mid-January.',
      checks: 'Four kinds of puzzles: Pattern Completion (the piece that fits a design), Reasoning by Analogy (how shapes change across and down), Serial Reasoning (each row and column uses every shape and color once), and Spatial Visualization (putting pictures together in your mind). The 2nd-grade test (Level C) has about 48 puzzles in 30 minutes.',
      how: 'The district does not recommend a study guide but says getting to know the format builds confidence. Use “Practice by type” in short sessions (it gets harder as answers are right, up to a Genius level harder than the test), and take the 48-question practice test with the 30-minute clock now and then to practice the pace: about 35 seconds a puzzle. Real NAI scores and percentiles cannot be estimated from practice.',
    },
    cogat: {
      title: 'CogAT practice', icon: '🧠',
      what: 'Practice for the Cognitive Abilities Test (CogAT), which measures reasoning, not what was taught in class.',
      where: 'Many school districts use the CogAT for gifted (GATE) programs. Eureka Union uses the NNAT-3 for GATE instead (see NNAT-3 practice); the CogAT is one of the tests for the extra testing chance through CSU Sacramento, and its reasoning puzzles are good practice for any thinking test.',
      checks: 'Three parts: Verbal (picture analogies, sentence completion, picture classification), Quantitative (number analogies, number puzzles, number series) and Nonverbal (figure matrices, figure classification, paper folding).',
      how: 'Short sessions of “Practice by type” work best; a full 45-question test now and then shows progress in each part. Real CogAT percentiles cannot be estimated from practice.',
    },
    cogatk: {
      title: 'Brain Games', icon: '🧠',
      what: 'Picture thinking puzzles in the style of the CogAT, made for kindergarten.',
      where: 'GATE testing starts in 2nd grade (Eureka Union uses the NNAT-3, a picture-puzzle test); these games build the same kinds of thinking early.',
      checks: 'Seeing patterns, things that go together, and how shapes change.',
      how: 'Play a few puzzles at a time. Every question is read aloud.',
    },
    logic: {
      title: 'Logic Lab', icon: '🧩',
      what: 'Logic puzzles in words: put people in order from clues, find who has what, decide what must be true, count all the ways, and catch the fibber.',
      where: 'Not a school test, but the same thinking is in Math Kangaroo, CogAT, NNAT and the word problems on i-Ready, and it helps in reading too.',
      checks: 'Careful reading, using only what is said, trying possibilities and checking them. Levels 4–5 are advanced puzzles for kids who want more.',
      how: 'Use “Practice by type” (it gets harder as answers are right, and every answer is explained). The 12-puzzle challenge mixes all types at the advanced levels.',
    },
    logick: {
      title: 'Logic Lab', icon: '🧩',
      what: 'First logic puzzles: who is tallest, who has which pet, yes or no, and what happens next.',
      where: 'Not a school test. It builds the careful thinking used in all later math.',
      checks: 'Listening to clues and putting them together.',
      how: 'Play with a grown-up: every puzzle is read aloud, and drawing the clues on paper helps.',
    },
  };

  MQ.prep = P;
})();
</script>

    for (const a of Object.values(F.ANIMALS)) if (a.lv === L) out.push({ e: a.e, name: a.name });
    F.BEDS.forEach((b, i) => { if (i >= 2 && b[0] === L) out.push({ e: '🟫', name: 'Garden bed ' + (i + 1) }); });
    F.PENS.forEach((p, i) => { if (i >= 1 && p[0] === L) out.push({ e: '🏡', name: 'Animal pen ' + (i + 1) }); });
    for (const s of F.STANDS) if (s.lv === L && L > 1) out.push({ e: s.e, name: s.name });
    for (const d of Object.values(F.DECOR)) if (d.lv === L) out.push({ e: d.e, name: d.name });
    F.tiers(grade).forEach((t) => { if (t.lv === L && L > 1) out.push({ e: t.ahead ? '⭐' : '🧮', name: 'New money problems: ' + t.name + (t.ahead ? ' (challenge)' : '') }); });
    for (const w of Object.values(F.WORKS)) {
      if (w.lv === L) out.push({ e: w.e, name: w.name + ' (workshop)' });
      for (const r of w.recipes) if (r.lv === L && r.lv > w.lv) out.push({ e: F.ITEMS[r.out].e, name: `New recipe: ${F.ITEMS[r.out].many}` });
    }
    if (L === F.BANK_LV) out.push({ e: '🏦', name: 'The bank: save money and earn interest' });
    F.ACCOUNTS.forEach((a, i) => { if (i && a.lv === L) out.push({ e: a.e, name: `Bank: ${a.name} (more savings earn the big interest)` }); });
    for (const u of F.BED_UP) if (u.lv === L) out.push({ e: u.icon, name: 'Garden bed upgrade: ' + u.name });
    for (const u of F.PEN_UP) if (u.lv === L) out.push({ e: '🏡', name: 'Pen upgrade: ' + u.name });
    for (const [n, lv] of F.FEED_PACKS) if (lv === L && L > 1) out.push({ e: F.FEED.e, name: `Feed: ${n} bags in one pack` });
    if (L === F.HELPER.lv) out.push({ e: '🧑‍🌾', name: `Farmhand ${F.HELPER.name}: feeds and collects for a wage` });
    if (L === F.HELPER.picksLv) out.push({ e: '🧑‍🌾', name: `${F.HELPER.name} picks ripe crops too` });
    const t = F.TITLES.find((x) => x[0] === L);
    if (t && L > 1) out.push({ e: '🎖️', name: 'New title: ' + t[1] });
    return out;
  };
  // A farmer's title grows with the farm level.
  F.TITLES = [[1, 'Little farmer'], [5, 'Farm helper'], [10, 'Farmer'], [15, 'Busy farmer'], [20, 'Rancher'], [30, 'Farm boss'], [40, 'Market master'], [50, 'Farm tycoon'], [60, 'Farm legend'], [75, 'Farm hero'], [100, 'Farm superstar']];
  F.title = (L) => F.TITLES.filter((x) => x[0] <= L).pop()[1];

  // ---------------------------------------------------------------- new farm
  F.fresh = () => ({
    money: 0, // set for the grade on first open (F.ensure)
    started: false,
    xp: 0,
    day: 1,
    feed: 3,
    beds: [{ c: 'carrot', g: 1 }, { c: null, g: 0 }],
    pens: [{ a: 'chicken', g: 0, fed: false, ready: 0 }],
    basket: {},
    owned: {},
    stand: 0,
    goal: '',
    tier: 1,
    streak: 0,
    miss: 0,
    customers: 0,
    t: 0, // when the farm last changed (for merging copies from two devices)
    stats: { sold: 0, earned: 0, spent: 0, tasks: 0, right: 0, vip: 0, jobs: 0, made: 0, interest: 0, bankDays: 0, saved: 0, tookOut: 0, built: 0, dreamIn: 0 }, // saved / tookOut: all money ever put in / taken out of the bank; built: paid to builders from the bank; dreamIn: what the buildings earned
    works: {}, // workshop id: { r: recipe index or null, g: nights, ready: items, out: item }
    bank: { bal: 0, acct: 0, log: [], pend: [] }, // see the bank below: bank day is every 7th farm day
    dream: { p: 0, s: 0, b: false, seen: false }, // Big Dreams: project p, stages built s, builders at work tonight b
    treasure: {}, // the traveling merchant's treasures bought: id: true
    merchant: null, // his visit: { week, n, item, charms, a, cost, got } (see the traveling merchant below)
    charms: {}, // the merchant's week charms working now: id: { cost, until, gain, a, extra } (Golden Piggy: { cost }, until bank day)
    dep: { ok: false, amt: 0, until: 0 }, // the bank's locked deposit (2nd grade): opened once savings pass the limit (ok); amt locked until farm day `until`
  });
  F.START_MONEY = [5, 30];
  F.ensure = (st) => {
    if (!st.farm) st.farm = F.fresh();
    const fm = st.farm;
    if (!fm.started) { fm.started = true; fm.money = F.START_MONEY[gi(st.grade)]; }
    // farms from the first version: add what came later
    if (!fm.works) fm.works = {};
    if (!fm.bank) fm.bank = { bal: 0, log: [], pend: [] };
    if (!fm.bank.pend) { fm.bank.pend = []; delete fm.bank.since; } // bank weeks used to be calendar weeks
    if (!fm.bank.acct) fm.bank.acct = 0; // bank accounts came later
    if (!fm.helper) fm.helper = { hired: false, on: true };
    if (!fm.stats.wages) fm.stats.wages = 0;
    for (const k of ['made', 'interest', 'bankDays']) if (!fm.stats[k]) fm.stats[k] = 0;
    // totals saved and taken out came later: what is in the bank and is not interest was saved
    if (fm.stats.saved == null) { fm.stats.saved = Math.max(0, fm.bank.bal - fm.stats.interest); fm.stats.tookOut = 0; }
    if (!fm.dream) fm.dream = { p: 0, s: 0, b: false, seen: false }; // Big Dreams came later
    if (!fm.treasure) fm.treasure = {}; // so did the traveling merchant
    if (fm.merchant === undefined) fm.merchant = null;
    if (!fm.charms) fm.charms = {}; // and his week charms
    for (const k of ['charms', 'charmCost', 'charmGain', 'charmWins']) if (!fm.stats[k]) fm.stats[k] = 0;
    if (!fm.dep) fm.dep = { ok: false, amt: 0, until: 0 }; // and the locked deposit
    if (!fm.stats.depBonus) fm.stats.depBonus = 0;
    for (const k of ['built', 'dreamIn']) if (!fm.stats[k]) fm.stats[k] = 0;
    return fm;
  };

  // ---------------------------------------------------------------- farm actions
  F.price = (id, grade) => F.ITEMS[id].price[gi(grade)];
  F.seedPrice = (crop, grade) => F.CROPS[crop].seed[gi(grade)];
  F.basketCount = (fm) => U.sum(Object.values(fm.basket));
  F.basketValue = (fm, grade) => U.sum(Object.entries(fm.basket).map(([id, n]) => n * F.price(id, grade)));
  F.cropStage = (bed) => {
    if (!bed.c) return 'empty';
    return bed.g >= F.cropDays(bed) ? 'ready' : bed.g === 0 ? 'seed' : 'sprout';
  };
  F.animalStage = (pen) => {
    const a = F.ANIMALS[pen.a];
    return pen.g >= a.grow[1] ? 2 : pen.g >= a.grow[0] ? 1 : 0; // 0 baby, 1 young, 2 grown-up
  };
  // A bed keeps its upgrades (u) when it is planted and picked.
  F.plant = (fm, i, crop) => { Object.assign(fm.beds[i], { c: crop, g: 0, again: false }); };
  F.harvest = (fm, i) => {
    const bed = fm.beds[i];
    if (F.cropStage(bed) !== 'ready') return 0;
    const n = F.cropYield(bed, fm);
    fm.basket[bed.c] = (fm.basket[bed.c] || 0) + n;
    if (F.charmOn(fm, 'sun')) { const x = fm.charms.sun; x.extra = x.extra || {}; x.extra[bed.c] = (x.extra[bed.c] || 0) + n / 2; } // what the Sunshine Potion added
    if (F.bedGlass(bed) && !bed.again) Object.assign(bed, { g: 0, again: true }); // the greenhouse grows a second harvest
    else Object.assign(bed, { c: null, g: 0, again: false });
    return n;
  };
  F.emptyBeds = (fm) => fm.beds.map((b, i) => (b.c ? -1 : i)).filter((i) => i >= 0);
  // Plant the same crop in n empty beds for one payment of n × the seed price.
  F.plantAll = (fm, grade, crop, n) => {
    const beds = F.emptyBeds(fm).slice(0, n), price = beds.length * F.seedPrice(crop, grade);
    if (beds.length < n || fm.money < price || F.CROPS[crop].lv > F.level(fm.xp).level) return false;
    fm.money -= price;
    fm.stats.spent += price;
    beds.forEach((i) => F.plant(fm, i, crop));
    return true;
  };
  // What a pen has to collect, thing by thing: [[item, count], …] (the mythic things first).
  F.penLoot = (p) => [[F.MYTHS[p.a] && F.MYTHS[p.a].item, p.rare || 0], [F.ANIMALS[p.a].item, p.ready || 0]].filter(([id, n]) => id && n > 0);
  F.collect = (fm, i) => {
    const pen = fm.pens[i], loot = pen.a ? F.penLoot(pen) : [];
    if (!loot.length) return 0;
    for (const [item, n] of loot) fm.basket[item] = (fm.basket[item] || 0) + n;
    pen.ready = 0;
    pen.rare = 0;
    return U.sum(loot.map((x) => x[1]));
  };
  F.feed = (fm, i) => {
    const pen = fm.pens[i], eat = F.penEat(pen);
    if (pen.fed) return 'fed';
    if (fm.feed < eat) return 'nofeed';
    fm.feed -= eat;
    pen.fed = true;
    return 'ok';
  };
  // Selling a pen's animals to the neighbour, to make room for another kind. Farmer Rosa pays half of what they cost
  // in the shop: every animal in the pen (the 2nd and 3rd came with "Room for"), and half of the cozy barn. The pen's
  // upgrades go with the animals (they cost what one more animal of that kind costs), so the pen is new again.
  F.NEIGHBOR = ['👩‍🌾', 'Farmer Rosa'];
  F.resale = (p, grade) => {
    const g = gi(grade), cost = F.ANIMALS[p.a].cost[g], each = Math.ceil(cost / 2), n = F.penCount(p);
    const barn = (p.u || 0) >= 3 ? Math.ceil(F.upCost('pen', 2, grade, p.a) / 2) : 0;
    return { cost, each, n, barn, total: n * each + barn };
  };
  // Things the animals already made go to the basket first. Returns what Rosa paid (0 for an empty pen).
  F.sellPen = (fm, grade, i) => {
    const p = fm.pens[i];
    if (!p || !p.a) return 0;
    F.collect(fm, i);
    const { total } = F.resale(p, grade);
    fm.money += total;
    fm.stats.animalsSold = (fm.stats.animalsSold || 0) + F.penCount(p);
    fm.pens[i] = { a: null, g: 0, fed: false, ready: 0 };
    return total;
  };
  // Night: crops grow a day, fed animals grow and grown-ups make something. Returns what happened for the morning card.
  F.nextDay = (fm, grade = 'g2') => {
    const news = { ripe: [], made: [], grew: [], hungry: [], cooked: [], helper: null };
    const hp = fm.helper;
    if (hp && hp.hired && hp.on) { // the farmhand works tonight if there is money for the wage
      const wage = F.HELPER.wage[gi(grade)];
      if (fm.money < wage) news.helper = { unpaid: true, wage };
      else {
        fm.money -= wage;
        fm.stats.wages = (fm.stats.wages || 0) + wage;
        news.helper = { wage, fed: 0, short: 0, collected: 0, picked: 0 };
        fm.pens.forEach((p, i) => { if (p.a && !p.fed) F.feed(fm, i) === 'ok' ? news.helper.fed++ : news.helper.short++; });
      }
    }
    for (const [id, w] of Object.entries(fm.works || {})) {
      if (w.r === null || w.r === undefined) continue;
      const r = F.WORKS[id].recipes[w.r];
      w.g++;
      if (w.g >= r.days) { w.ready = (w.ready || 0) + 1; w.out = r.out; w.r = null; w.g = 0; news.cooked.push(r.out); }
    }
    const tr = fm.treasure || {};
    if (tr.fairy) { // the Feed Fairy feeds hungry pens, for free
      const fed = fm.pens.filter((x) => x.a && !x.fed).slice(0, F.TREASURES.fairy.feeds);
      fed.forEach((p) => (p.fed = true));
      if (fed.length) news.fairy = fed.map((p) => p.a);
    }
    fm.beds.forEach((b) => {
      if (!b.c || F.cropStage(b) === 'ready') return;
      b.g++;
      if (F.cropStage(b) === 'ready') news.ripe.push(b.c);
    });
    fm.pens.forEach((p) => {
      if (!p.a) return;
      if (!p.fed) { news.hungry.push(p.a); return; }
      const before = F.animalStage(p);
      if (before === 2) {
        const a = F.ANIMALS[p.a], k = F.penMakes(p);
        if (F.mythOn(fm, p.a)) { // a Mythic Feed week: the rare thing instead of the usual one
          const it = F.MYTHS[p.a].item;
          p.rare = Math.min(30, (p.rare || 0) + k);
          news.made.push([it, k]);
          fm.charms.myth.gain += k * (F.price(it, grade) - F.price(a.item, grade));
        } else { p.ready = Math.min(30, (p.ready || 0) + k); news.made.push([a.item, k]); }
      }
      p.g++;
      if (F.animalStage(p) > before) news.grew.push([p.a, F.animalStage(p)]);
      p.fed = false;
    });
    if (news.helper && !news.helper.unpaid) { // in the morning: products into the basket, ripe crops too from level 48
      fm.pens.forEach((p, i) => { news.helper.collected += F.collect(fm, i); });
      if (F.level(fm.xp).level >= F.HELPER.picksLv) fm.beds.forEach((b, i) => { news.helper.picked += F.harvest(fm, i); });
    }
    news.built = F.buildOvernight(fm);
    fm.day++;
    news.charmEnd = F.charmsMorning(fm, grade);
    if (tr.goose) { const x = F.TREASURES.goose.gold[gi(grade)]; fm.money += x; fm.stats.earned += x; news.gold = x; }
    if (tr.sheep) { fm.basket.rainbow = (fm.basket.rainbow || 0) + 1; news.rainbow = 1; }
    news.merchant = F.merchantMorning(fm, grade);
    if (fm.dep && fm.dep.amt && fm.day === fm.dep.until) news.depReady = F.depositBack(fm.dep.amt);
    news.depNew = F.depositCheck(fm, grade);
    news.bankDay = fm.bank ? F.bankMorning(fm, grade) : false; // the morning of bank day: what is saved earns interest
    return news;
  };

  // ---------------------------------------------------------------- the shop
  // Every thing a farmer can buy, with its state for this farm: lock (level needed), owned, price.
  F.shop = (fm, grade) => {
    const L = F.level(fm.xp).level, g = gi(grade), out = [];
    const freePen = fm.pens.some((p) => !p.a);
    for (const [n, lv] of F.FEED_PACKS) out.push({ id: 'feed:' + n, tab: 'animals', e: F.FEED.e, name: `${n} bags of feed`, price: n * F.FEED.price[g], lv, note: `You have ${fm.feed} 🌾` });
    for (const [id, a] of Object.entries(F.ANIMALS)) out.push({ id: 'animal:' + id, tab: 'animals', e: a.e, name: a.name, price: a.cost[g], lv: a.lv, note: `${F.ITEMS[a.item].e} ${F.fmt(F.price(a.item, grade), grade)} each · eats ${a.eat} 🌾 a day`, blocked: !freePen && 'Sell animals to free a pen' });
    const nb = fm.beds.length, np = fm.pens.length;
    if (nb < F.BEDS.length) out.push({ id: 'bed', tab: 'farm', e: '🟫', name: 'Garden bed ' + (nb + 1), price: F.BEDS[nb][1 + g], lv: F.BEDS[nb][0], note: 'Grow more crops' });
    if (np < F.PENS.length) out.push({ id: 'pen', tab: 'farm', e: '🏡', name: 'Animal pen ' + (np + 1), price: F.PENS[np][1 + g], lv: F.PENS[np][0], note: 'Room for one more animal' });
    fm.beds.forEach((b, i) => {
      const up = F.BED_UP[b.u || 0];
      if (up) out.push({ id: 'bedup:' + i, tab: 'up', e: up.icon, name: `Garden bed ${i + 1}: ${up.name}`, price: up.cost[g], lv: up.lv, note: up.note });
      else out.push({ id: 'bedup:' + i, tab: 'up', e: '🏅', name: `Garden bed ${i + 1}: every upgrade`, price: 0, lv: 1, owned: true });
    });
    fm.pens.forEach((p, i) => {
      if (!p.a) return;
      const up = F.PEN_UP[p.u || 0], a = F.ANIMALS[p.a];
      if (up) out.push({ id: 'penup:' + i, tab: 'up', e: a.e, name: `${a.name} pen: ${up.name}`, price: F.upCost('pen', p.u || 0, grade, p.a), lv: up.lv, note: up.note });
      else out.push({ id: 'penup:' + i, tab: 'up', e: a.e, name: `${a.name} pen: every upgrade`, price: 0, lv: 1, owned: true });
    });
    const H = F.HELPER;
    out.push({ id: 'helper', tab: 'farm', e: '🧑‍🌾', name: `Farmhand ${H.name}`, price: H.hire[g], lv: H.lv, owned: !!(fm.helper && fm.helper.hired), note: `Feeds the animals every night and collects in the morning. Wage: ${F.fmt(H.wage[g], grade)} a day.` });
    const na = F.ACCOUNTS[(fm.bank.acct || 0) + 1];
    if (na) out.push({ id: 'acct', tab: 'farm', e: na.e, name: 'Bank: ' + na.name, price: na.cost[g], lv: Math.max(na.lv, F.BANK_LV), note: `The bank adds the big interest on savings up to ${F.fmt(na.top[g], grade)}` });
    const ns = F.STANDS[fm.stand + 1];
    if (ns) out.push({ id: 'stand', tab: 'farm', e: ns.e, name: ns.name, price: ns.cost[g], lv: ns.lv, note: `Customers tip ${Math.round(ns.tip * 100)}% for right answers` });
    for (const [id, w] of Object.entries(F.WORKS)) out.push({ id: 'work:' + id, tab: 'farm', e: w.e, name: w.name, price: w.cost[g], lv: w.lv, owned: !!(fm.works || {})[id], note: 'Makes ' + w.recipes.map((r) => F.ITEMS[r.out].e).join(' ') + ' from what you grow' });
    for (const [id, d] of Object.entries(F.DECOR)) out.push({ id: 'decor:' + id, tab: 'decor', e: d.e, name: d.name, price: d.cost[g], lv: d.lv, owned: !!fm.owned[id] });
    for (const x of out) x.locked = x.lv > L;
    return out;
  };
  F.shopItem = (fm, grade, id) => F.shop(fm, grade).find((x) => x.id === id) || null;
  // Apply a paid purchase. Returns a short line for the toast.
  F.buy = (fm, grade, id) => {
    const x = F.shopItem(fm, grade, id);
    if (!x || x.locked || x.owned || x.blocked || fm.money < x.price) return null;
    fm.money -= x.price;
    fm.stats.spent += x.price;
    const [kind, arg] = id.split(':');
    if (kind === 'animal') { const i = fm.pens.findIndex((p) => !p.a); fm.pens[i] = { a: arg, g: 0, fed: false, ready: 0 }; }
    else if (kind === 'feed') fm.feed += +arg;
    else if (kind === 'bed') fm.beds.push({ c: null, g: 0 });
    else if (kind === 'pen') fm.pens.push({ a: null, g: 0, fed: false, ready: 0 });
    else if (kind === 'stand') fm.stand++;
    else if (kind === 'decor') fm.owned[arg] = true;
    else if (kind === 'work') fm.works[arg] = { r: null, g: 0, ready: 0, out: '' };
    else if (kind === 'bedup') fm.beds[+arg].u = (fm.beds[+arg].u || 0) + 1;
    else if (kind === 'penup') fm.pens[+arg].u = (fm.pens[+arg].u || 0) + 1;
    else if (kind === 'helper') fm.helper = { hired: true, on: true };
    else if (kind === 'acct') fm.bank.acct = (fm.bank.acct || 0) + 1;
    if (fm.goal === id) fm.goal = '';
    return x;
  };
  // Seed packets are bought from an empty bed.
  F.buySeed = (fm, grade, i, crop) => {
    const price = F.seedPrice(crop, grade);
    if (fm.money < price || fm.beds[i].c || F.CROPS[crop].lv > F.level(fm.xp).level) return false;
    fm.money -= price;
    fm.stats.spent += price;
    F.plant(fm, i, crop);
    return true;
  };
  // ---------------------------------------------------------------- workshops
  // What a recipe is worth: the inputs sold one by one, the thing made from them, and how much more that brings.
  F.worth = (r, grade) => {
    const inVal = U.sum(Object.entries(r.in).map(([id, n]) => n * F.price(id, grade)));
    const outVal = F.price(r.out, grade);
    return { inVal, outVal, gain: outVal - inVal };
  };
  F.canMake = (fm, work, i) => {
    const r = F.WORKS[work].recipes[i], w = fm.works[work];
    if (!w || w.r !== null || r.lv > F.level(fm.xp).level) return false;
    return Object.entries(r.in).every(([id, n]) => (fm.basket[id] || 0) >= n);
  };
  F.startMake = (fm, work, i) => {
    if (!F.canMake(fm, work, i)) return false;
    const r = F.WORKS[work].recipes[i];
    for (const [id, n] of Object.entries(r.in)) { fm.basket[id] -= n; if (!fm.basket[id]) delete fm.basket[id]; }
    Object.assign(fm.works[work], { r: i, g: 0 });
    return true;
  };
  F.takeMade = (fm, work) => {
    const w = fm.works[work];
    if (!w || !w.ready) return 0;
    const n = w.ready;
    fm.basket[w.out] = (fm.basket[w.out] || 0) + n;
    fm.stats.made += n;
    w.ready = 0;
    return n;
  };

  // ---------------------------------------------------------------- the bank
  // Money in the bank grows every bank week of 7 farm days: every 7th farm day (day 7, 14, 21 …) is bank day. In the
  // morning of bank day the bank looks at what is saved, and the interest on it waits until the child collects it at
  // the bank (working it out first). Interest comes in two steps, like a real savings account with tiers:
  //  - the big rate on savings up to the account's limit: 10¢ for every whole dollar in 2nd grade, 1¢ for every 10¢
  //    in kindergarten (10% a week, easy to work out);
  //  - the small rate on the rest: 1¢ for every whole dollar (1% a week), so big savings still grow, but slowly.
  // A better account (bought like any farm upgrade) raises the limit. At most 4 bank days wait to be collected.
  // bank = { bal, acct, log: [{ day, kind, amt }], pend: [{ day, bal }] } — acct: which account (F.ACCOUNTS),
  // pend: bank days waiting, with the morning balance.
  F.BANK_LV = 10;
  F.BANK_WEEK = 7;
  F.BANK_RULE = [[10, 1], [100, 10]]; // the big rate: [for every …, add …] for k, g2
  F.BANK_LOW = [100, 1]; // the small rate above the limit: 1¢ for every whole dollar (both grades)
  F.ACCOUNTS = [ // top: the big rate is paid on savings up to this (k, g2)
    { e: '🐷', name: 'Piggy account', lv: 10, cost: [0, 0], top: [500, 5000] },
    { e: '🥈', name: 'Silver account', lv: 18, cost: [40, 3000], top: [1000, 10000] },
    { e: '🥇', name: 'Gold account', lv: 27, cost: [60, 8000], top: [2000, 20000] },
    { e: '💎', name: 'Diamond account', lv: 41, cost: [80, 20000], top: [5000, 50000] },
    { e: '👑', name: 'Royal vault', lv: 56, cost: [99, 40000], top: [10000, 100000] },
  ];
  F.BANK_MISSED = 4;
  F.bankRule = (grade) => F.BANK_RULE[gi(grade)];
  F.account = (fm) => F.ACCOUNTS[(fm.bank && fm.bank.acct) || 0];
  F.bankTop = (acct, grade) => F.ACCOUNTS[acct || 0].top[gi(grade)];
  F.ruleText = (grade, acct = 0) => {
    const top = F.fmt(F.bankTop(acct, grade), grade);
    return grade === 'k'
      ? `The bank adds 1¢ for every 10¢ you save, up to ${top}. Above ${top} it adds 1¢ for every 100¢. Every bank week.`
      : `The bank adds 10¢ for every whole dollar you save, up to ${top}. Above ${top} it adds 1¢ for every whole dollar. Every bank week.`;
  };
  // This week's interest, in its two parts: big = how many dollars (k: tens of cents) earn the big rate,
  // small = how many whole dollars above the limit earn the small rate.
  F.interestParts = (bal, grade, acct = 0) => {
    const [per, add] = F.bankRule(grade), top = F.bankTop(acct, grade);
    const big = Math.floor(Math.min(bal, top) / per), small = Math.floor(Math.max(0, bal - top) / F.BANK_LOW[0]);
    return { top, per, add, big, small, x: big * add + small * F.BANK_LOW[1] };
  };
  F.interest = (bal, grade, acct = 0) => F.interestParts(bal, grade, acct).x;
  const addDays = (key, n) => { const d = new Date(key + 'T12:00:00'); d.setDate(d.getDate() + n); return U.dateKey(d); };
  F.addDays = addDays;
  const bankLog = (fm, kind, amt, day = fm.day) => { fm.bank.log.unshift({ day, kind, amt }); fm.bank.log.length = Math.min(fm.bank.log.length, 12); };
  F.isBankDay = (day) => day % F.BANK_WEEK === 0;
  // The farm days of this bank week (the last one is bank day).
  F.bankWeek = (day) => { const first = Math.floor((day - 1) / F.BANK_WEEK) * F.BANK_WEEK + 1; return U.range(first, first + F.BANK_WEEK - 1); };
  // Nights until the next bank day (on bank day itself: until the next one).
  F.nightsToBankDay = (day) => (Math.floor(day / F.BANK_WEEK) + 1) * F.BANK_WEEK - day;
  F.deposit = (fm, amt) => {
    if (!(amt > 0) || amt > fm.money) return false;
    fm.money -= amt;
    fm.bank.bal += amt;
    fm.stats.saved += amt;
    bankLog(fm, 'in', amt);
    return true;
  };
  F.withdraw = (fm, amt) => {
    if (!(amt > 0) || amt > fm.bank.bal) return false;
    fm.bank.bal -= amt;
    fm.money += amt;
    fm.stats.tookOut += amt;
    bankLog(fm, 'out', amt);
    return true;
  };
  // Called each morning (from F.nextDay): on bank day, note what is in the bank, counting interest still waiting.
  // The Big Dreams' buildings earn money that day too (inc: [[icon, name, amount], …]); it goes into the bank after
  // the interest.
  F.bankMorning = (fm, grade) => {
    if (!F.isBankDay(fm.day) || fm.bank.pend.length >= F.BANK_MISSED) return false; // at most 4 bank days wait
    // what will be in the bank once the bank days still waiting are paid (each earns on the one before)
    let bal = fm.bank.bal;
    for (const x of fm.bank.pend) { if (!x.paid) bal += F.interest(bal, grade, fm.bank.acct) * (x.piggy ? 2 : 1); bal += F.incomeOf(x); }
    const inc = F.dreamIncome(fm, grade);
    if (!bal && !inc.length) return false;
    const p = inc.length ? { day: fm.day, bal, inc } : { day: fm.day, bal };
    if (fm.charms && fm.charms.piggy) { p.piggy = { cost: fm.charms.piggy.cost }; delete fm.charms.piggy; } // the Golden Piggy doubles this one
    fm.bank.pend.push(p);
    return true;
  };
  F.bankDue = (fm) => fm.bank.pend.length;
  F.incomeOf = (p) => U.sum((p.inc || []).map((x) => x[2]));
  // Pay the interest of the oldest bank day waiting. Returns { day, bal, x, bonus, cost }: with the merchant's Golden
  // Piggy the bank pays it twice (bonus: the second time; cost: what the piggy cost). A bank day with buildings' income
  // waits for F.payIncome after its interest (paid: true).
  F.payInterest = (fm, grade) => {
    const p = fm.bank.pend[0];
    if (!p || p.paid) return null;
    const x = F.interest(p.bal, grade, fm.bank.acct), bonus = p.piggy ? x : 0;
    fm.bank.bal += x + bonus;
    fm.stats.interest += x + bonus;
    fm.stats.bankDays++;
    bankLog(fm, 'interest', x, p.day);
    if (p.piggy) { bankLog(fm, 'piggy', bonus, p.day); F.charmDone(fm, { cost: p.piggy.cost, gain: bonus }, grade); }
    if (p.inc && p.inc.length) p.paid = true;
    else fm.bank.pend.shift();
    return p.piggy ? { day: p.day, bal: p.bal, x, bonus, cost: p.piggy.cost } : { day: p.day, bal: p.bal, x };
  };
  // What the buildings earned on that bank day goes into the bank. Returns { day, x, inc }.
  F.payIncome = (fm) => {
    const p = fm.bank.pend[0];
    if (!p || !p.paid) return null;
    fm.bank.pend.shift();
    const x = F.incomeOf(p);
    fm.bank.bal += x;
    fm.stats.dreamIn += x;
    bankLog(fm, 'dream', x, p.day);
    return { day: p.day, x, inc: p.inc };
  };
  // All-time bank summary: what is in the bank now, split into the child's own money and interest
  // (interest counts as spent last, so taking money out uses up the child's own money first).
  F.bankSummary = (fm) => {
    const s = fm.stats, interest = Math.min(fm.bank.bal, s.interest);
    return { saved: s.saved, tookOut: s.tookOut, interest: s.interest, days: s.bankDays, bal: fm.bank.bal, own: fm.bank.bal - interest, fromInterest: interest, built: s.built || 0, dreamIn: s.dreamIn || 0, depBonus: s.depBonus || 0, locked: (fm.dep && fm.dep.amt) || 0 };
  };
  // ---------------------------------------------------------------- the locked deposit (2nd grade)
  // Savings above the account's limit earn only the small interest (1¢ a dollar). So once the savings first pass
  // the limit, the bank offers a locked deposit: move savings in $5 steps into it for 4 bank weeks, and for every $5
  // the bank gives back $6 (that is 5¢ a dollar a week: less than the big interest, much more than the small one).
  // It can't be taken out early, and there is one at a time. When it unlocks, the money goes back to the savings.
  F.DEPOSIT = { weeks: 4, step: 500, back: 600 };
  F.depositOn = (fm, grade) => grade !== 'k' && !!fm.dep && fm.dep.ok;
  // the offer opens the first time the savings are above the account's limit (returns true when it just opened)
  F.depositCheck = (fm, grade) => {
    if (grade === 'k' || !fm.dep || fm.dep.ok || !fm.bank || fm.bank.bal <= F.bankTop(fm.bank.acct, grade)) return false;
    fm.dep.ok = true;
    return true;
  };
  F.depositBack = (amt) => (amt / F.DEPOSIT.step) * F.DEPOSIT.back;
  // it unlocks on the 4th bank day after the day it is locked
  F.depositUntil = (day) => (Math.floor(day / F.BANK_WEEK) + F.DEPOSIT.weeks) * F.BANK_WEEK;
  F.depositReady = (fm) => !!fm.dep && fm.dep.amt > 0 && fm.day >= fm.dep.until;
  F.lockDeposit = (fm, grade, amt) => {
    if (!F.depositOn(fm, grade) || fm.dep.amt || !(amt > 0) || amt % F.DEPOSIT.step || amt > fm.bank.bal) return false;
    fm.bank.bal -= amt;
    Object.assign(fm.dep, { amt, until: F.depositUntil(fm.day) });
    bankLog(fm, 'lock', amt);
    return true;
  };
  // Returns { amt, back } and puts the money back into the savings, or null when it is still locked.
  F.collectDeposit = (fm) => {
    if (!F.depositReady(fm)) return null;
    const amt = fm.dep.amt, back = F.depositBack(amt);
    fm.bank.bal += back;
    fm.stats.depBonus += back - amt;
    Object.assign(fm.dep, { amt: 0, until: 0 });
    bankLog(fm, 'unlock', back);
    return { amt, back };
  };
  // How the savings would grow, bank week by bank week, without adding or taking out money.
  F.project = (bal, grade, weeks = 6, acct = 0) => { const out = [bal]; for (let i = 0; i < weeks; i++) out.push(out[i] + F.interest(out[i], grade, acct)); return out; };

  // ---------------------------------------------------------------- Big Dreams
  // Huge buildings to save up for, one after another: a fruit orchard, a guest cottage, a railway, a castle. Each is
  // built in stages. A stage is paid from the bank (a bank transfer to the builders, never from the wallet), the
  // builders work that night, and from then on the stage earns money every bank day (pay), straight into the bank.
  // An earning stage pays for itself in about 8 bank weeks (it earns a bit more than the bank's big interest, with no
  // limit, but the money is spent); after that it is all profit. The castle earns nothing:
  // it is the dream. Prices [k, g2] fit what a farm makes at the level it is usually reached (see the farm tests).
  F.DREAM_LV = F.BANK_LV;
  F.DREAMS = [
    { id: 'orchard', e: '🍎', name: 'Fruit Orchard', blurb: 'Plant fruit trees once, and sell fruit every bank week.', earns: 'fruit sales', stages: [
      { e: '🍎', name: 'Apple trees', cost: [100, 2500], pay: [12, 300] },
      { e: '🍐', name: 'Pear trees', cost: [150, 4000], pay: [18, 500] },
      { e: '🍑', name: 'Peach trees', cost: [200, 6000], pay: [24, 700] },
    ] },
    { id: 'cottage', e: '🏡', name: 'Guest Cottage', blurb: 'Build a cozy cottage. Visitors stay there and pay rent every bank week.', earns: 'rent', stages: [
      { e: '🧱', name: 'Stone floor', cost: [300, 8000], pay: [36, 1000] },
      { e: '🪟', name: 'Walls and windows', cost: [400, 12000], pay: [48, 1400] },
      { e: '🏠', name: 'Red roof', cost: [500, 16000], pay: [60, 1900] },
      { e: '🌷', name: 'Flower garden', cost: [600, 24000], pay: [72, 2900] },
    ] },
    { id: 'railway', e: '🚂', name: 'Farm Railway', blurb: 'A little train around the farm. Visitors buy tickets every bank week.', earns: 'train tickets', stages: [
      { e: '🛤️', name: 'Train tracks', cost: [800, 25000], pay: [96, 3000] },
      { e: '🚉', name: 'Station', cost: [1000, 40000], pay: [120, 4800] },
      { e: '🚂', name: 'Steam train', cost: [1200, 55000], pay: [144, 6600] },
      { e: '🌉', name: 'Bridge over the river', cost: [1400, 80000], pay: [168, 9600] },
    ] },
    { id: 'castle', e: '🏰', name: 'Castle on the Hill', blurb: 'The biggest dream of all: your very own castle. It earns nothing. It is just amazing.', earns: '', castle: true, stages: [
      { e: '🧱', name: 'Castle walls', cost: [1500, 80000], pay: [0, 0] },
      { e: '🗼', name: 'Two towers', cost: [1800, 100000], pay: [0, 0] },
      { e: '🚪', name: 'Gate and drawbridge', cost: [2100, 120000], pay: [0, 0] },
      { e: '🚩', name: 'Royal flags', cost: [2400, 140000], pay: [0, 0] },
      { e: '👑', name: 'Golden throne hall', cost: [2700, 160000], pay: [0, 0] },
    ] },
  ];
  F.dreamOpen = (fm) => F.level(fm.xp).level >= F.DREAM_LV;
  F.dreamDone = (fm) => fm.dream.p >= F.DREAMS.length; // every dream built
  F.dreamNow = (fm) => (F.dreamDone(fm) ? null : F.DREAMS[fm.dream.p]); // the dream being built
  // the next stage to pay for: { d, i, st, cost, pay } (null when every dream is built)
  F.dreamNext = (fm, grade) => {
    const d = F.dreamNow(fm);
    if (!d) return null;
    const st = d.stages[fm.dream.s];
    return { d, i: fm.dream.s, st, cost: st.cost[gi(grade)], pay: st.pay[gi(grade)] };
  };
  // how many stages of dream number k are built
  F.dreamBuilt = (fm, k) => (k < fm.dream.p ? F.DREAMS[k].stages.length : k === fm.dream.p ? fm.dream.s : 0);
  // What the buildings earn on a bank day, one line per dream: [[icon, name, amount], …]
  F.dreamIncome = (fm, grade) => {
    if (!fm.dream) return [];
    const out = [];
    F.DREAMS.forEach((d, k) => {
      const n = F.dreamBuilt(fm, k), x = U.sum(d.stages.slice(0, n).map((st) => st.pay[gi(grade)]));
      if (x) out.push([d.e, d.name, x]);
    });
    return out;
  };
  F.canBuild = (fm, grade) => { const n = F.dreamNext(fm, grade); return !!n && !fm.dream.b && F.dreamOpen(fm) && fm.bank.bal >= n.cost; };
  // Pay the builders from the bank. They build the stage tonight. Returns the stage paid for (or null).
  F.payBuilders = (fm, grade) => {
    if (!F.canBuild(fm, grade)) return null;
    const n = F.dreamNext(fm, grade);
    fm.bank.bal -= n.cost;
    fm.stats.built += n.cost;
    fm.dream.b = true;
    bankLog(fm, 'build', n.cost);
    return n;
  };
  // Night: the builders finish the stage. Returns { d, i, st, done } (done: the whole dream is finished) or null.
  F.buildOvernight = (fm) => {
    const dr = fm.dream;
    if (!dr || !dr.b) return null;
    const d = F.DREAMS[dr.p], i = dr.s;
    dr.b = false;
    dr.s++;
    const done = dr.s >= d.stages.length;
    if (done) { dr.p++; dr.s = 0; }
    return { d, i, st: d.stages[i], done };
  };
  // How many bank days until a stage has earned back its price.
  F.payback = (cost, pay) => (pay ? Math.ceil(cost / pay) : 0);

  // ---------------------------------------------------------------- the traveling merchant
  // Uncle Marco comes every 3rd bank week and stays its 7 farm days (so a bank day falls in his visit, and the child
  // can take savings out of the bank in time). He starts coming once the first Big Dream stage is built (so the new
  // things come one at a time), and then keeps coming. Every visit he brings two week charms: magic that works for 7
  // farm days, each visit a different pair, priced at about a third of what it brings a good farm (so it pays for
  // itself about three times over when it is used well). Every 2nd visit he also brings a rare treasure that stays on
  // the farm for good: expensive (3 to 5 bank weeks of what a good farm makes at its level), so it takes real saving.
  // If it isn't bought, he brings the same treasure again on his next treasure visit.
  F.MERCHANT = { e: '🧔', name: 'Uncle Marco', every: 3, rare: 2 };
  F.TREASURES = {
    goose: { e: '🪿', name: 'Golden Goose', lv: 10, cost: [95, 20000], gold: [3, 250], note: (fmt) => `Lays a golden egg every morning: +${fmt(F.TREASURES.goose.gold[1])} into your wallet. No feed needed.`, noteK: (fmt) => `Lays a golden egg every morning: +${fmt(F.TREASURES.goose.gold[0])} into your wallet. No feed needed.` },
    can: { e: '🪣', name: 'Magic Watering Can', lv: 12, cost: [95, 25000], note: () => 'Every garden bed gives 1 more crop at every harvest.' },
    musician: { e: '🎻', name: 'Street Musician', lv: 12, cost: [90, 20000], tip: 0.1, note: () => 'Plays music at your stand: customers tip 10% more for right answers, on any stand.' },
    fairy: { e: '🧚', name: 'Feed Fairy', lv: 14, cost: [90, 25000], feeds: 2, note: () => 'Every night she feeds two hungry pens for free.' },
    sheep: { e: '🐑', name: 'Rainbow Sheep', lv: 16, cost: [99, 35000], note: () => 'Gives a ball of rainbow wool every morning, to sell at your stand. No feed needed.' },
  };
  F.treasureNote = (id, grade, fmt) => { const t = F.TREASURES[id]; return (grade === 'k' && t.noteK ? t.noteK : t.note)(fmt); };
  // Week charms. myth: the animals of one kind become mythic (F.MYTHS); clover: bigger tips; sun: double harvests;
  // piggy: the next bank day pays double interest.
  F.CHARM_NIGHTS = 7;
  F.CHARMS = {
    myth: { e: '🌟', name: 'Mythic Feed' },
    clover: { e: '🍀', name: 'Lucky Clover', tip: 0.2 },
    sun: { e: '☀️', name: 'Sunshine Potion' },
    piggy: { e: '🐷', name: 'Golden Piggy' },
  };
  F.CHARM_PAIRS = [['myth', 'clover'], ['sun', 'piggy'], ['myth', 'sun'], ['clover', 'piggy'], ['myth', 'piggy'], ['sun', 'clover']];
  F.charmName = (id, a) => (id === 'myth' && a ? `Mythic Feed for ${F.MYTHS[a].of}` : F.CHARMS[id].name);
  F.charmNote = (id, grade, fmt, a) => {
    const N = F.CHARM_NIGHTS;
    if (id === 'myth') {
      const M = F.MYTHS[a], it = F.ITEMS[M.item], was = F.ITEMS[F.ANIMALS[a].item];
      return `For ${N} nights your ${M.of} become ${M.many}! They make ${it.many} instead of ${was.many}: ${fmt(F.price(M.item, grade))} each, not ${fmt(F.price(F.ANIMALS[a].item, grade))}. Feed them every day!`;
    }
    if (id === 'clover') return `For ${N} days customers tip ${Math.round(F.CHARMS.clover.tip * 100)}% more for first-try right answers, on any stand.`;
    if (id === 'sun') return `For ${N} days every harvest gives twice as many crops.`;
    return 'On the next bank day the bank pays your interest twice!';
  };
  // What a good farm at level L makes in a farm day, in cents: crops (the best crop in every open bed, with half the
  // bed upgrades), animals (the best animals in the open pens, with room for more), total.
  F.goodDay = (L, grade) => {
    const g = gi(grade), beds = F.BEDS.filter((b) => b[0] <= L).length, pens = F.PENS.filter((p) => p[0] <= L).length;
    const bed = { u: Math.floor(F.BED_UP.filter((u) => u.lv <= L).length / 2) };
    let best = 0;
    for (const [id, c] of Object.entries(F.CROPS)) if (c.lv <= L) { bed.c = id; best = Math.max(best, (F.cropYield(bed) * F.price(id, grade) - c.seed[g]) / F.cropDays(bed)); }
    const room = 1 + F.PEN_UP.filter((x, i) => i < 2 && x.lv <= L).length;
    const animals = U.sum(Object.values(F.ANIMALS).filter((a) => a.lv <= L).map((a) => (a.per * F.price(a.item, grade) - a.eat * F.FEED.price[g]) * room).sort((a, b) => b - a).slice(0, pens));
    return { crops: beds * best, animals, total: beds * best + animals };
  };
  // What a charm brings in its week (cents): Mythic Feed from this farm's pens of kind a; Lucky Clover and the
  // Sunshine Potion on a good farm at this level; the Golden Piggy at most (the big interest on a full account).
  F.charmGain = (id, fm, grade, a) => {
    const N = F.CHARM_NIGHTS, d = F.goodDay(F.level(fm.xp).level, grade);
    if (id === 'myth') return N * (F.price(F.MYTHS[a].item, grade) - F.price(F.ANIMALS[a].item, grade)) * U.sum(fm.pens.filter((p) => p.a === a).map(F.penMakes));
    if (id === 'clover') return Math.round(N * d.total * F.CHARMS.clover.tip);
    if (id === 'sun') return Math.round(N * d.crops);
    const top = F.bankTop(fm.bank.acct, grade);
    return F.interest(top, grade, fm.bank.acct);
  };
  // about a third of what it brings: whole dollars (kindergarten: 5¢ steps, paid with coins, at most 95¢)
  F.charmCost = (id, fm, grade, a) => {
    const x = F.charmGain(id, fm, grade, a) / 3;
    return grade === 'k' ? Math.max(5, Math.min(95, Math.round(x / 5) * 5)) : Math.max(100, Math.round(x / 100) * 100);
  };
  F.charmOn = (fm, id) => { const c = fm.charms && fm.charms[id]; return !!c && (id === 'piggy' || fm.day < c.until); };
  F.mythOn = (fm, a) => F.charmOn(fm, 'myth') && fm.charms.myth.a === a;
  // what a charm has brought so far (the Sunshine Potion counts the extra crops at their price)
  F.charmGot = (c, grade) => (c.gain || 0) + U.sum(Object.entries(c.extra || {}).map(([id, n]) => n * F.price(id, grade)));
  F.charmDone = (fm, c, grade) => {
    const got = F.charmGot(c, grade);

    if (got > c.cost) fm.stats.charmWins++;
