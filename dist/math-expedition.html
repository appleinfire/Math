      const used = enough(worlds, cands, (c, w) => w.indexOf(c.a) < w.indexOf(c.b), n - 1);
      if (!used) return lg_order(d);
      let q, ans;
      const r = d === 1 ? pick([0, n - 1]) : d === 2 ? rnd(0, 2) : rnd(0, 3);
      if (r === 0) { q = `Who is the ${sc.most}?`; ans = truth[0]; }
      else if (r === n - 1) { q = `Who is the ${sc.least}?`; ans = truth[n - 1]; }
      else { q = n === 3 ? `Who is in the middle (not the ${sc.most} and not the ${sc.least})?` : `Who is the ${ORD[r]} ${sc.most}?`; ans = truth[r]; }
      const order = truth.join(', ');
      return C(`${list(used.map((c) => c.t))}${q}`, ans, shuffle(names), {
        wordy: true, say: speech(...used.map((c) => c.t), q),
        hint: `Put the names in a row from ${sc.most} to ${sc.least}, one clue at a time.`,
        explain: `From ${sc.most} to ${sc.least}: ${order}.`,
      });
    }
    // standing in a line, front to back
    const n = d === 4 ? 4 : 5, names = kids(n), truth = shuffle(names), worlds = perms(names);
    const pos = (w, x) => w.indexOf(x);
    const cands = [];
    for (const a of names) for (const b of names) {
      if (a === b) continue;
      if (pos(truth, a) === pos(truth, b) + 1) cands.push({ t: `${a} is right behind ${b}.`, f: (w) => pos(w, a) === pos(w, b) + 1 });
      if (pos(truth, a) < pos(truth, b)) cands.push({ t: `${a} is somewhere in front of ${b}.`, f: (w) => pos(w, a) < pos(w, b) });
    }
    for (const a of names) {
      if (pos(truth, a) !== 0) cands.push({ t: `${a} is not first.`, f: (w) => pos(w, a) !== 0 });
      if (pos(truth, a) !== n - 1) cands.push({ t: `${a} is not last.`, f: (w) => pos(w, a) !== n - 1 });
    }
    if (chance(0.6)) { const a = truth[0]; cands.push({ t: `${a} is first in line.`, f: (w) => w[0] === a, first: a }); }
    if (d === 5) for (let i = 1; i < n - 1; i++) {
      const [x, m, y] = [truth[i - 1], truth[i], truth[i + 1]];
      cands.push({ t: `${m} stands between ${x} and ${y}.`, f: (w) => Math.abs(pos(w, x) - pos(w, y)) === 2 && pos(w, m) === (pos(w, x) + pos(w, y)) / 2 });
    }
    const used = enough(worlds, shuffle(cands), (c, w) => c.f(w), 3);
    if (!used || used.length > (d === 4 ? 5 : 6)) return lg_order(d);
    const named = used.filter((c) => c.first).map((c) => c.first);
    const r = pick(U.range(1, n - 1).filter((i) => !named.includes(truth[i])));
    const q = `Who is ${ORD[r]} in line?`;
    return C(`${n} kids stand in a line, one behind the other.${list(used.map((c) => c.t))}${q}`, truth[r], shuffle(names), {
      wordy: true, say: speech(`${n} kids stand in a line.`, ...used.map((c) => c.t), q),
      hint: 'Draw the line with empty spots. Start with the clue that tells you the most.',
      explain: `From front to back: ${truth.join(', ')}.`,
    });
  }

  // ---------------- 2. Who has what ----------------
  const SETS = [
    { items: [['cat', '🐱'], ['dog', '🐶'], ['fish', '🐟'], ['bird', '🐦']], intro: 'Each kid has a different pet.', pos: (p, i) => `${p} has the ${i}.`, neg: (p, i) => `${p} does not have the ${i}.`, who: (i) => `Who has the ${i}?`, what: (p) => `Which pet does ${p} have?` },
    { items: [['apple', '🍎'], ['banana', '🍌'], ['pear', '🍐'], ['orange', '🍊']], intro: 'Each kid eats a different fruit.', pos: (p, i) => `${p} eats the ${i}.`, neg: (p, i) => `${p} does not eat the ${i}.`, who: (i) => `Who eats the ${i}?`, what: (p) => `Which fruit does ${p} eat?` },
    { items: [['red shirt', '🔴'], ['blue shirt', '🔵'], ['green shirt', '🟢'], ['yellow shirt', '🟡']], intro: 'Each kid wears a different shirt.', pos: (p, i) => `${p} wears the ${i}.`, neg: (p, i) => `${p} does not wear the ${i}.`, who: (i) => `Who wears the ${i}?`, what: (p) => `Which shirt does ${p} wear?` },
    { items: [['soccer', '⚽'], ['tennis', '🎾'], ['basketball', '🏀'], ['baseball', '⚾']], intro: 'Each kid plays a different sport.', pos: (p, i) => `${p} plays ${i}.`, neg: (p, i) => `${p} does not play ${i}.`, who: (i) => `Who plays ${i}?`, what: (p) => `Which sport does ${p} play?` },
  ];
  function lg_whois(d) {
    const n = d <= 3 ? 3 : 4, set = pick(SETS), names = kids(n), items = U.sample(set.items, n);
    const truth = shuffle(items.map((_, i) => i)); // truth[k] = item index of kid k
    const worlds = perms(items.map((_, i) => i));
    const cands = [];
    names.forEach((p, k) => items.forEach(([it, em], i) => {
      if (truth[k] === i) cands.push({ t: `${em} ${set.pos(p, it)}`, pos: true, k, i });
      else cands.push({ t: `${em} ${set.neg(p, it)}`, pos: false, k, i });
    }));
    const pool = shuffle(cands), posOk = d <= 3 ? 1 : 0; // harder levels give only "does not" clues
    const ordered = [...pool.filter((c) => c.pos).slice(0, posOk), ...pool.filter((c) => !c.pos)];
    const used = enough(worlds, ordered, (c, w) => (w[c.k] === c.i) === c.pos, 2);
    if (!used || used.length > (n === 3 ? 4 : 7)) return lg_whois(d);
    const told = new Set(used.filter((c) => c.pos).map((c) => c.k));
    const k = pick(names.map((_, i) => i).filter((i) => !told.has(i)));
    const [it, em] = items[truth[k]];
    const solved = names.map((p, i) => `${p}: ${items[truth[i]][1]} ${items[truth[i]][0]}`).join(', ');
    const clueText = shuffle(used).map((c) => c.t);
    const base = { wordy: true, hint: 'Make a little table: kids down the side, things across the top. Cross out every "does not".', explain: solved + '.' };
    if (chance(0.5)) {
      const q = set.who(it);
      return C(`${set.intro}${list(clueText)}${em} ${q}`, names[k], shuffle(names), Object.assign(base, { say: speech(set.intro, ...clueText, q) }));
    }
    const q = set.what(names[k]);
    const labels = items.map(([x, e]) => `${e} ${x}`);
    return C(`${set.intro}${list(clueText)}${q}`, `${em} ${it}`, shuffle(labels), Object.assign(base, { say: speech(set.intro, ...clueText, q) }));
  }

  // ---------------- 3. Yes / No / Can't tell ----------------
  const YNC = ['Yes', 'No', "Can't tell"];
  const yn = (text, ans, explain, hint) => C(text, ans, YNC, { wordy: true, explain, hint: hint || 'Use only what the sentences say, not what usually happens.' });
  const THINGS = [['balls', 'ball'], ['marbles', 'marble'], ['socks', 'sock'], ['cookies', 'cookie'], ['crayons', 'crayon'], ['blocks', 'block'], ['buttons', 'button'], ['shells', 'shell']];
  const BOXES = ['box', 'bag', 'basket', 'jar', 'drawer'];
  const COLORS = ['red', 'blue', 'green', 'yellow', 'orange', 'purple', 'pink', 'white'];
  const RULES = [
    { rule: 'If it rains, {N} takes an umbrella.', isIf: 'It is raining.', notIf: 'It is not raining.', isThen: '{N} took an umbrella.', notThen: '{N} did not take an umbrella.', qIf: 'Is it raining?', qThen: 'Does {N} take an umbrella?' },
    { rule: 'If the bell rings, the robot dances.', isIf: 'The bell is ringing.', notIf: 'The bell is not ringing.', isThen: 'The robot is dancing.', notThen: 'The robot is not dancing.', qIf: 'Is the bell ringing?', qThen: 'Does the robot dance?' },
    { rule: 'If {N} wears the blue cap, {N} plays soccer.', isIf: '{N} is wearing the blue cap.', notIf: '{N} is not wearing the blue cap.', isThen: '{N} is playing soccer.', notThen: '{N} is not playing soccer.', qIf: 'Is {N} wearing the blue cap?', qThen: 'Does {N} play soccer?' },
    { rule: 'If it is Tuesday, {N} goes swimming.', isIf: 'Today is Tuesday.', notIf: 'Today is not Tuesday.', isThen: '{N} went swimming today.', notThen: '{N} did not go swimming today.', qIf: 'Is today Tuesday?', qThen: 'Does {N} go swimming today?' },
    { rule: 'If the parrot sees a banana, it sings.', isIf: 'The parrot sees a banana.', notIf: 'The parrot does not see a banana.', isThen: 'The parrot is singing.', notThen: 'The parrot is not singing.', qIf: 'Does the parrot see a banana?', qThen: 'Does the parrot sing?' },
    { rule: 'If {N} plays the drum, the baby wakes up.', isIf: '{N} is playing the drum.', notIf: '{N} is not playing the drum.', isThen: 'The baby woke up.', notThen: 'The baby did not wake up.', qIf: 'Is {N} playing the drum?', qThen: 'Does the baby wake up?' },
    { rule: 'If it snows, the school is closed.', isIf: 'It is snowing.', notIf: 'It is not snowing.', isThen: 'The school is closed.', notThen: 'The school is open.', qIf: 'Is it snowing?', qThen: 'Is the school closed?' },
    { rule: 'If the green light is on, the toy train moves.', isIf: 'The green light is on.', notIf: 'The green light is off.', isThen: 'The toy train is moving.', notThen: 'The toy train is not moving.', qIf: 'Is the green light on?', qThen: 'Does the toy train move?' },
    { rule: 'If {N} finds a shell, {N} puts it in a bucket.', isIf: '{N} found a shell.', notIf: '{N} did not find a shell.', isThen: 'There is a shell in the bucket.', notThen: 'The bucket is empty.', qIf: 'Did {N} find a shell?', qThen: 'Is there a shell in the bucket?' },
  ];
  const WORDS = ['bloops', 'zibs', 'razzles', 'fips', 'gloms', 'wugs', 'snorks', 'tazzles', 'mibs', 'quorps', 'dax', 'blicks'];
  const CREATURES = ['Zog', 'Mip', 'Tib', 'Quark', 'Bix', 'Lulu', 'Pim', 'Rook'];
  const one = (w) => (w.endsWith('x') ? w : w.slice(0, -1)); // bloops → bloop, dax → dax
  function lg_truth(d) {
    const N = pick(KIDS), [pl, sg] = pick(THINGS), box = pick(BOXES), [p, p2] = U.sample(COLORS, 2);
    const f = (s) => s.replace(/\{N\}/g, N);
    const forms = [];
    if (d <= 2) { // all / none
    forms.push(() => yn(`All the ${pl} in the ${box} are ${p}. ${N} takes a ${sg} from the ${box}. Is it ${p}?`, 'Yes', `Every ${sg} in the ${box} is ${p}, so this one is too.`));
    forms.push(() => yn(`None of the ${pl} in the ${box} are ${p}. ${N} takes a ${sg} from the ${box}. Is it ${p}?`, 'No', `No ${sg} in the ${box} is ${p}.`));
    forms.push(() => yn(`All the ${pl} in the ${box} are ${p}. Is there a ${p2} ${sg} in the ${box}?`, 'No', `They are all ${p}, so none can be ${p2}.`));
    }
    if (d === 2) { // some, and turning a sentence around
      forms.push(() => yn(`Some of the ${pl} in the ${box} are ${p}. ${N} takes a ${sg} from the ${box}. Is it ${p}?`, "Can't tell", `Only some are ${p}: ${N} may have picked a ${p} one or a different one.`));
      forms.push(() => yn(`All the ${pl} in the ${box} are ${p}. ${N} has a ${p} ${sg}. Did it come from the ${box}?`, "Can't tell", `${p[0].toUpperCase() + p.slice(1)} ${pl} can be in other places too.`));
      forms.push(() => yn(`The ${box} has only ${p} ${pl} and ${p2} ${pl}. ${N} takes one that is not ${p}. Is it ${p2}?`, 'Yes', `There are only two colors. Not ${p} means ${p2}.`));
    }
    if (d === 3) { // if… then
      const r = pick(RULES), rule = f(r.rule);
      forms.push(() => yn(`${rule} ${f(r.isIf)} ${f(r.qThen)}`, 'Yes', `The rule says exactly this: ${rule}`, 'Read the "if" part and the "then" part separately.'));
      forms.push(() => yn(`${rule} ${f(r.notThen)} ${f(r.qIf)}`, 'No', `If the "if" part were true, the "then" part would have happened. It did not, so the "if" part is not true.`, 'Read the "if" part and the "then" part separately.'));
      forms.push(() => yn(`${rule} ${f(r.isThen)} ${f(r.qIf)}`, "Can't tell", `The rule does not say this is the only reason. It could have happened for another reason.`, 'Read the "if" part and the "then" part separately.'));
      forms.push(() => yn(`${rule} ${f(r.notIf)} ${f(r.qThen)}`, "Can't tell", `The rule only tells what happens when the "if" part is true. Here it is not, so we don't know.`, 'Read the "if" part and the "then" part separately.'));
    }
    if (d === 4) { // made-up words, so only the sentences count
      const [A, B, Cw] = U.sample(WORDS, 3), Z = pick(CREATURES);
      const art = (w) => ('aeiou'.includes(w[0]) ? 'an ' : 'a ') + one(w);
      const H = 'These are made-up words. Use only the sentences: draw circles inside circles if it helps.';
      forms.push(() => yn(`All ${A} are ${B}. All ${B} are ${Cw}. Is every ${one(A)} ${art(Cw)}?`, 'Yes', `${A} are inside ${B}, and ${B} are inside ${Cw}.`, H));
      forms.push(() => yn(`All ${A} are ${B}. All ${B} are ${Cw}. Is every ${one(Cw)} ${art(A)}?`, "Can't tell", `There may be ${Cw} that are not ${A}.`, H));
      forms.push(() => yn(`All ${A} are ${B}. No ${B} are ${Cw}. Can ${art(A)} be ${art(Cw)}?`, 'No', `Every ${one(A)} is ${art(B)}, and no ${one(B)} is ${art(Cw)}.`, H));
      forms.push(() => yn(`All ${A} are ${B}. ${Z} is ${art(A)}. Is ${Z} ${art(B)}?`, 'Yes', `${Z} is ${art(A)}, and all ${A} are ${B}.`, H));
      forms.push(() => yn(`All ${A} are ${B}. ${Z} is ${art(B)}. Is ${Z} ${art(A)}?`, "Can't tell", `Some ${B} may not be ${A}.`, H));
      forms.push(() => yn(`No ${A} are ${B}. ${Z} is ${art(B)}. Is ${Z} ${art(A)}?`, 'No', `${Z} is ${art(B)}, and no ${one(B)} can be ${art(A)}.`, H));
      forms.push(() => yn(`Some ${A} are ${B}. All ${B} are ${Cw}. Is every ${one(A)} ${art(Cw)}?`, "Can't tell", `Only the ${A} that are ${B} must be ${Cw}. We know nothing about the other ${A}.`, H));
    }
    if (d === 5) { // only, except, either… or, longer chains
      const [A, B, Cw, D] = U.sample(WORDS, 4), Z = pick(CREATURES), M = pick(KIDS.filter((k) => k !== N));
      const art = (w) => ('aeiou'.includes(w[0]) ? 'an ' : 'a ') + one(w);
      forms.push(() => yn(`Only kids with a ticket can ride the train. ${N} is riding the train. Does ${N} have a ticket?`, 'Yes', 'Nobody without a ticket can ride, so a rider must have one.'));
      forms.push(() => yn(`Only kids with a ticket can ride the train. ${N} has a ticket. Is ${N} riding the train?`, "Can't tell", `A ticket lets ${N} ride, but ${N} may not be riding.`));
      forms.push(() => yn(`Every kid in the club has a cat or a dog, or both. ${N} is in the club and has no cat. Does ${N} have a dog?`, 'Yes', `${N} must have one of them, and it is not a cat.`));
      forms.push(() => yn(`Not all ${A} are ${B}. ${Z} is ${art(A)}. Is ${Z} ${art(B)}?`, "Can't tell", `Some ${A} are ${B} and some are not. ${Z} could be either.`));
      forms.push(() => yn(`All ${A} are ${B}, except ${Z}. ${Z} is ${art(A)}. Is ${Z} ${art(B)}?`, 'No', `${Z} is the one ${one(A)} that is not ${art(B)}.`));
      forms.push(() => yn(`All ${A} are ${B}. All ${B} are ${Cw}. All ${Cw} are ${D}. ${Z} is ${art(A)}. Is ${Z} ${art(D)}?`, 'Yes', `${A} → ${B} → ${Cw} → ${D}: each one is inside the next.`));
      forms.push(() => yn(`No ${A} are ${B}. All ${Cw} are ${A}. Can ${art(Cw)} be ${art(B)}?`, 'No', `Every ${one(Cw)} is ${art(A)}, and no ${one(A)} is ${art(B)}.`));
      forms.push(() => yn(`${N} always wins at checkers against ${M}. ${M} always wins against Pat. Did ${N} play Pat today?`, "Can't tell", `The sentences say nothing about a game today between ${N} and Pat.`));
      forms.push(() => yn(`Everyone who finished the puzzle got a star. ${M} did not get a star. Did ${M} finish the puzzle?`, 'No', `If ${M} had finished, ${M} would have a star.`));
    }
    return pick(forms)();
  }

  <script>
// Test prep: an i-Ready-style adaptive "Placement Check".
//
// One grade ladder (Early K … 3rd grade+) serves both grades. Each step takes its questions from the
// existing generators (kindergarten track for K–1st, 2nd-grade track for 2nd–3rd). The check covers the
// four i-Ready domains and picks every next question near the child's current estimated level.
//
// The level is estimated from all answers so far with a small item-response model:
//   P(right) = guess + (1 − guess) · logistic(1.7 · (ability − step))
// where "guess" depends on the format (a 2-button choice is easy to guess, a typed number is not).
(function () {
  const MQ = (globalThis.MQ = globalThis.MQ || {});
  const U = MQ.U;
  const P = {};

  P.DOMAINS = [
    { id: 'nbt', name: 'Number & Operations', short: 'Numbers', icon: '🔢' },
    { id: 'alg', name: 'Algebra & Algebraic Thinking', short: 'Algebra', icon: '🧩' },
    { id: 'md', name: 'Measurement & Data', short: 'Measurement', icon: '📏' },
    { id: 'geo', name: 'Geometry', short: 'Geometry', icon: '🔷' },
  ];
  const DOMAIN_OF = {
    add20: 'alg', place: 'nbt', add100: 'nbt', sub100: 'nbt', arrays: 'alg', time: 'md', money: 'md', shapes: 'geo', measure: 'md',
    data: 'md', big: 'nbt', words: 'alg', mult: 'alg', logic: 'alg',
    k_count: 'nbt', k_numbers: 'nbt', k_compare: 'nbt', k_teen: 'nbt', k_add: 'alg', k_sub: 'alg', k_words: 'alg', k_patterns: 'alg',
    k_measure: 'md', k_shapes: 'geo',
  };
  Object.entries(DOMAIN_OF).forEach(([t, d]) => { if (MQ.TOPICS[t]) MQ.TOPICS[t].domain = d; });

  // Which topics feed each domain on each track (school-math topics only, no enrichment puzzles).
  const POOL = {
    k: { nbt: ['k_count', 'k_numbers', 'k_compare', 'k_teen'], alg: ['k_add', 'k_sub', 'k_words'], md: ['k_measure'], geo: ['k_shapes'] },
    g2: { nbt: ['place', 'add100', 'sub100', 'big'], alg: ['add20', 'arrays', 'words'], md: ['time', 'money', 'measure', 'data'], geo: ['shapes'] },
  };
  P.POOL = POOL;
  P.STEPS = [
    { label: 'Early K', track: 'k', d: 1 },
    { label: 'Mid K', track: 'k', d: 2 },
    { label: 'Late K', track: 'k', d: 3 },
    { label: 'Early 1st', track: 'k', d: 4 },
    { label: 'Late 1st', track: 'k', d: 5 },
    { label: 'Early 2nd', track: 'g2', d: 1 },
    { label: 'Mid 2nd', track: 'g2', d: 2 },
    { label: 'Late 2nd', track: 'g2', d: 3 },
    { label: 'Early 3rd', track: 'g2', d: 4 },
    { label: '3rd grade+', track: 'g2', d: 5 },
  ];
  const TOP = P.STEPS.length - 1;
  const clampStep = (x) => U.clamp(Math.round(x), 0, TOP);
  P.label = (theta) => P.STEPS[clampStep(theta)].label;

  // Where a child "should" be today: fall = early, winter = mid, spring = late in their grade.
  P.expected = (grade, date = new Date()) => {
    const m = date.getMonth(); // 0 = Jan
    const part = m >= 7 && m <= 9 ? 0 : m >= 10 || m <= 1 ? 1 : 2;
    return (grade === 'k' ? 0 : 5) + part;
  };
  P.status = (theta, expected) => {
    const diff = theta - expected;
    if (diff >= 1.5) return { id: 'above', text: 'Above grade level', icon: '🌟' };
    if (diff >= -1) return { id: 'on', text: 'On grade level', icon: '✅' };
    return { id: 'below', text: 'Needs practice', icon: '🌱' };
  };

  // ---------- the statistics ----------
  const guessOf = (p) =>
    p.kind === 'choice' ? 1 / p.choices.length : p.kind === 'line' ? 1 / (Math.round((p.line.max - p.line.min) / p.line.step) + 1) : p.kind === 'order' ? 0.05 : p.kind === 'multi' ? 0.05 : 0.02;
  const pRight = (theta, step, g) => g + (1 - g) / (1 + Math.exp(-1.7 * (theta - step)));
  // Most likely ability given the answers, with a gentle prior around `mean`.
  function estimate(items, mean, sd = 2.5) {
    let best = mean, bestLL = -Infinity;
    for (let th = -1; th <= TOP + 1.001; th += 0.05) {
      let ll = -((th - mean) ** 2) / (2 * sd * sd);
      for (const it of items) {
        const pr = pRight(th, it.s, it.g);
        ll += Math.log(it.ok ? pr : 1 - pr);
      }
      if (ll > bestLL) { bestLL = ll; best = th; }
    }
    return U.clamp(best, 0, TOP);
  }
  P.estimate = estimate;

  // ---------- running a check ----------
  P.newCheck = (grade, history = []) => {
    const last = history.filter((h) => h.grade === grade).slice(-1)[0];
    // Like i-Ready: the first check starts one grade below; later checks start a little below the last result.
    const start = last ? U.clamp(Math.round(last.overall) - 1, 0, TOP) : grade === 'k' ? 0 : 3;
    const counts = grade === 'k' ? { nbt: 6, alg: 5, md: 4, geo: 5 } : { nbt: 8, alg: 8, md: 8, geo: 6 };
    const plan = [];
    const left = Object.assign({}, counts);
    while (Object.values(left).some((n) => n > 0)) for (const d of ['nbt', 'alg', 'md', 'geo']) if (left[d]-- > 0) plan.push(d);
    return { grade, start, plan, items: [], seen: new Set(), date: U.dateKey() };
  };
  P.total = (eng) => eng.plan.length;
  P.done = (eng) => eng.items.length >= eng.plan.length;
  const overallNow = (eng) => estimate(eng.items, eng.start + 0.5, 3);
  const domainNow = (eng, dom) => estimate(eng.items.filter((it) => it.dom === dom), eng.items.length ? overallNow(eng) : eng.start + 0.5, 2);

  P.next = (eng) => {
    const dom = eng.plan[eng.items.length];
    const step = clampStep(domainNow(eng, dom));
    const st = P.STEPS[step];
    let p;
    for (let i = 0; i < 30; i++) {
      p = MQ.makeProblem(U.pick(POOL[st.track][dom]), st.d);
      const key = p.text + (p.visual || '');
      if (!eng.seen.has(key)) { eng.seen.add(key); break; }
    }
    p.step = step;
    p.dom = dom;
    return p;
  };
  P.answer = (eng, p, ok, given) => {
    eng.items.push({
      dom: p.dom, s: p.step, ok: !!ok, g: guessOf(p), t: p.topic, d: p.d,
      q: String(p.text).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 150),
      given: given === undefined ? '' : String(given), a: Array.isArray(p.answer) ? p.answer.join(', ') : String(p.answer), e: p.explain || '',
    });
  };
  P.result = (eng) => {
    const overall = overallNow(eng);
    const domains = {};
    for (const d of P.DOMAINS) domains[d.id] = Math.round(domainNow(eng, d.id) * 10) / 10;
    return {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      date: eng.date, grade: eng.grade,
      overall: Math.round(overall * 10) / 10, domains,
      expected: P.expected(eng.grade),
      n: eng.items.length, correct: eng.items.filter((i) => i.ok).length,
      items: eng.items,
    };
  };

  // What to practice next: the two weakest domains, at the difficulty that matches the result.
  P.practicePlan = (res, grade) => {
    const track = grade === 'k' ? 'k' : 'g2';
    const toD = (theta) => (track === 'k' ? U.clamp(Math.round(theta) + 1, 1, 5) : U.clamp(Math.round(theta) - 4, 1, 5));
    const weakest = P.DOMAINS.slice().sort((a, b) => res.domains[a.id] - res.domains[b.id]).slice(0, 2);
    const topics = [...new Set(weakest.flatMap((d) => POOL[track][d.id]))];
    const diff = toD(Math.min(...weakest.map((d) => res.domains[d.id])));
    return { domains: weakest, topics, diff };
  };

  // ---------- Math Kangaroo style mock contest ----------
  // Kangaroo: 24 questions, 8 worth 3 points, 8 worth 4, 8 worth 5 (96 in all), 75 minutes, no penalty for wrong answers.
  // Joey (kindergarten): 12 picture puzzles, 1 point each, no clock.
  P.KANGAROO_MINUTES = 75;
  // A question this child has not seen yet: never one already in this attempt (`avoid`), preferably one
  // not shown in earlier attempts (profile `seen`); when every candidate was seen, the one seen longest ago.
  P.fresh = (topic, d, avoid = new Set()) => {
    const seen = (MQ.state && MQ.state.seen && MQ.state.seen[topic]) || [];
    let best = null, bestRank = Infinity;
    for (let i = 0; i < 40; i++) {
      const p = MQ.makeProblem(topic, d), k = U.qkey(p);
      const rank = avoid.has(k) ? 1e9 : seen.indexOf(k);
      if (rank === -1) { best = p; break; }
      if (rank < bestRank || !best) { best = p; bestRank = rank; }
    }
    avoid.add(U.qkey(best));
    return best;
  };
  // review: skills the child got wrong before ({ topic, d }, most urgent first). Kangaroo and Logic tests swap a few
  // questions for fresh ones of those skills, in the same section, so the test keeps its size and point values.
  // (CogAT, Brain Games and Joey tests already ask every question type at every level they use.)
  P.REVIEW_IN_CONTEST = 3;
  const bandOf = (d) => (d <= 2 ? 3 : d === 3 ? 4 : 5);
  P.newContest = (kind, review = []) => {
    const avoid = new Set();
    const make = (topic, d) => P.fresh(topic, d, avoid);
    const items = [];
    if (kind === 'logic' || kind === 'logick') {
      // Logic Lab challenge: every kind of logic puzzle, the easier round first.
      const [topics, levels] = kind === 'logic' ? [MQ.LOGIC_TOPICS, [4, 5]] : [MQ.LOGIC_K, [1, 2]];
      levels.forEach((d, r) => { for (const t of U.shuffle(topics)) items.push({ p: make(t, d), pts: 1, sec: r ? 'Round 2' : 'Round 1' }); });
    } else if (kind === 'joey') {
      for (let i = 0; i < 12; i++) items.push({ p: make('kg_joey', 1), pts: 1 });
    } else if (kind === 'cogat' || kind === 'cogatk') {
      // CogAT style: battery by battery, each question type in a row, getting harder within the type.
      const levels = kind === 'cogat' ? [1, 2, 3, 4, 5] : [1, 1];
      for (const b of MQ.COGAT_BATTERIES) for (const t of b.topics) for (const d of levels) items.push({ p: make(t, d), pts: 1, sec: b.id });
    } else {
      for (const pts of [3, 4, 5]) {
        const topics = U.shuffle(MQ.KANGAROO_TOPICS);
        for (let i = 0; i < 8; i++) items.push({ p: make(topics[i % topics.length], pts === 3 ? U.rnd(1, 2) : pts === 4 ? 3 : U.rnd(4, 5)), pts });
      }
    }
    const family = kind === 'kangaroo' ? MQ.KANGAROO_TOPICS : kind === 'logic' ? MQ.LOGIC_TOPICS : kind === 'logick' ? MQ.LOGIC_K : [];
    const maxD = kind === 'logick' ? 2 : 5;
    for (const r of review.filter((x) => family.includes(x.topic) && x.d <= maxD).slice(0, P.REVIEW_IN_CONTEST)) {
      // the same type if it is in the test, otherwise any question of the same section
      const fits = (it) => !it.rv && (kind === 'kangaroo' ? it.pts === bandOf(r.d) : true);
      let at = items.findIndex((it) => fits(it) && it.p.topic === r.topic);
      if (at < 0) at = items.findIndex(fits);
      if (at < 0) continue;
      const p = make(r.topic, r.d);
      p.review = true;
      items[at] = Object.assign({}, items[at], { p, rv: true });
    }
    return { kind, items, answers: items.map(() => null), flags: items.map(() => false), i: 0, seconds: kind === 'kangaroo' ? P.KANGAROO_MINUTES * 60 : 0, started: Date.now() };
  };
  P.scoreContest = (ct) => {
    const graded = ct.items.map((it, i) => ({ it, given: ct.answers[i], ok: ct.answers[i] !== null && ct.answers[i] === it.p.answer }));
    // Sections: point values for Kangaroo, batteries for CogAT. Types: accuracy per kind of question.
    const sections = {}, types = {};
    for (const g of graded) {

      const t = (types[g.it.p.topic] = types[g.it.p.topic] || { right: 0, n: 0 });
      s.n++; t.n++;
      if (g.ok) { s.right++; t.right++; }
    }
    return {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      date: U.dateKey(), kind: ct.kind,
      score: U.sum(graded.filter((g) => g.ok).map((g) => g.it.pts)), max: U.sum(ct.items.map((it) => it.pts)),
      right: graded.filter((g) => g.ok).length, blank: graded.filter((g) => g.given === null).length, n: graded.length,

      items: graded.map((g) => ({

  <script>
// Saved progress, one profile per child, in localStorage on this device.
//   math-expedition-profiles   → { active, order: [ids] }
//   math-expedition-p-<id>     → that child's whole state (grade, progress, crystals, stats…)
// Profiles never share data: switching profile swaps the whole state object.
// When the family is connected to the cloud (js/cloud.js), every change is reported through S.onChange
// and changes from other devices come back through S.applyRemote / S.removeRemote.
(function () {
  const MQ = (globalThis.MQ = globalThis.MQ || {});
  const INDEX = 'math-expedition-profiles';
  const PKEY = (id) => 'math-expedition-p-' + id;
  const OLD = 'math-expedition-v1'; // single-player save from the first version

  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const fresh = (grade = 'g2') => ({
    v: 1,
    id: newId(),
    grade,
    name: '',
    companion: '🦊',
    buddyName: 'Pip',
    created: MQ.U.dateKey(),
    lastPlayed: '',
    crystals: 0,
    xp: 0,
    levels: {}, // '<world>-<i>': { stars }
    creatures: {}, // id: { got, from }
    badges: {}, // id: date
    eggsHatched: 0,
    stats: { attempts: 0, correct: 0, bestStreak: 0, topics: {}, d5: 0, lightning60: 0, lightning120: 0, endlessBest: 0, fixed: 0 },
    daily: { last: '', streak: 0, best: 0 },
    days: {}, // 'YYYY-MM-DD': { a, c } — answers and first-try right answers, kept for two years
    months: {}, // 'YYYY-MM': { topic: [answers, right] } — long-term accuracy per topic
    mistakes: [],
    review: {}, // 'topic|d': { topic, d, box, due, miss, last } — mistakes to practice again (see S.miss / S.hit)
    goal: { perDay: 0, days: 5 }, // daily goal set by a grown-up: problems per day (0 = off), days per week
    tips: {}, // topic: date a strategy tip was last shown
    tests: { checks: [], contests: [] }, // Placement Check and mock contest results (newest last)
    seen: {}, // test-prep topic: recently shown question keys (oldest first), so retakes bring new questions
    trainer: { topics: MQ.track(grade).core.slice(0, 3), diff: 'auto', mode: 'endless' },
    settings: { sound: true, unlockAll: false, readAloud: grade === 'k', voice: true },
  });

  function merge(base, saved) {
    for (const k of Object.keys(saved)) {
      if (saved[k] && typeof saved[k] === 'object' && !Array.isArray(saved[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) merge(base[k], saved[k]);
      else base[k] = saved[k];
    }
    return base;
  }
  const get = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked: play without saving */ } };
  const del = (k) => { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } };
  const readProfile = (id) => { const raw = get(PKEY(id)); return raw ? merge(fresh(raw.grade), raw) : null; };

  const S = {};
  let index = { active: null, order: [] };
  let memory = {}; // fallback when storage is blocked
  const listeners = [];
  S.onChange = (fn) => listeners.push(fn);
  const changed = (type, id, st) => listeners.forEach((fn) => { try { fn(type, id, st); } catch (e) { /* a sync problem must never break the game */ } });
  const stamp = (st) => { st.rev = Math.max(Date.now(), (st.rev || 0) + 1); };

  S.init = () => {
    index = get(INDEX) || { active: null, order: [] };
    const old = get(OLD);
    if (old && !index.order.length) { // migrate the first version's single save into a 2nd-grade profile
      const st = merge(fresh('g2'), old);
      st.id = newId();
      st.grade = 'g2';
      put(PKEY(st.id), st);
      index = { active: st.id, order: [st.id] };
      put(INDEX, index);
      del(OLD);
    }
    index.order = index.order.filter((id) => get(PKEY(id)) || memory[id]);
    MQ.state = null;
    return index;
  };
  S.profiles = () => index.order.map((id) => readProfile(id) || memory[id]).filter(Boolean);
  S.lastActive = () => index.active;
  S.open = (id) => {
    const st = readProfile(id) || memory[id];
    if (!st) return null;
    MQ.state = st;
    MQ.playerName = st.name;
    index.active = id;
    put(INDEX, index);
    return st;
  };
  S.create = ({ name, grade, companion, buddyName }) => {
    const st = fresh(grade);
    Object.assign(st, { name, companion, buddyName });
    index.order.push(st.id);
    memory[st.id] = st;
    MQ.state = st;
    S.save();
    return S.open(st.id);
  };
  // Grown-up preview: the app plays on a copy of the child's profile with every world open, and nothing is saved
  // (no storage, no cloud upload, no unfinished tests). Ending the preview reloads the real profile.
  S.preview = false;
  S.startPreview = () => {
    if (!MQ.state || S.preview) return MQ.state;
    const copy = JSON.parse(JSON.stringify(MQ.state));
    copy.settings.unlockAll = true;
    S.preview = true;
    MQ.state = copy;
    return copy;
  };
  S.endPreview = () => {
    if (!S.preview) return MQ.state;
    S.preview = false;
    const id = MQ.state && MQ.state.id;
    MQ.state = null;
    return id ? S.open(id) : null;
  };

  // Unfinished tests (Placement Check, mock contests), one per kind, kept on this device for each child.
  const PAUSE = (id) => 'math-expedition-pause-' + id;
  S.paused = (kind) => (!S.preview && MQ.state && (get(PAUSE(MQ.state.id)) || {})[kind]) || null;
  S.setPaused = (kind, data) => {
    if (!MQ.state || S.preview) return;
    const all = get(PAUSE(MQ.state.id)) || {};
    all[kind] = data;
    put(PAUSE(MQ.state.id), all);
  };
  S.clearPaused = (kind) => {
    if (!MQ.state || S.preview) return;
    const all = get(PAUSE(MQ.state.id)) || {};
    if (!(kind in all)) return;
    delete all[kind];
    Object.keys(all).length ? put(PAUSE(MQ.state.id), all) : del(PAUSE(MQ.state.id));
  };
  S.remove = (id) => {
    del(PKEY(id));
    del(PAUSE(id));
    delete memory[id];
    index.order = index.order.filter((x) => x !== id);
    if (index.active === id) index.active = null;
    put(INDEX, index);
    if (MQ.state && MQ.state.id === id) MQ.state = null;
    changed('remove', id);
  };
  S.update = (id, fields) => { // change another profile's name / grade from the grown-ups page
    if (S.preview) return;
    const st = MQ.state && MQ.state.id === id ? MQ.state : readProfile(id);
    if (!st) return;
    Object.assign(st, fields);
    stamp(st);
    put(PKEY(id), st);
    memory[id] = st;
    changed('save', id, st);
  };
  S.save = () => {
    const st = MQ.state;
    if (!st || S.preview) return;
    stamp(st);
    memory[st.id] = st;
    put(PKEY(st.id), st);
    changed('save', st.id, st);
  };
  S.reset = () => { // erase one child's progress, keep who they are
    const { id, name, grade, companion, buddyName } = MQ.state;
    MQ.state = Object.assign(fresh(grade), { id, name, grade, companion, buddyName, resetAt: Date.now() });
    del(PAUSE(id));
    S.save();
  };
  S.exportCode = () => btoa(unescape(encodeURIComponent(JSON.stringify(MQ.state))));
  S.importCode = (code) => {
    const obj = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if (!obj || obj.v !== 1) throw new Error('This is not a Math Expedition save code.');
    const st = merge(fresh(obj.grade || 'g2'), obj);
    if (!st.id || !index.order.includes(st.id)) { st.id = st.id || newId(); index.order.push(st.id); }
    stamp(st);
    memory[st.id] = st;
    put(PKEY(st.id), st);
    changed('save', st.id, st);
    return S.open(st.id);
  };

  // ---------- cloud sync support ----------
  // Combine two copies of the same child's progress (e.g. played offline on two devices).
  // Nothing earned is lost: creatures, badges and stars are united; counters keep the higher value;
  // spendable things (crystals) and settings come from the most recent copy.
  S.SEEN_MAX = 80;
  // Remember that a test-prep question was shown (most recent last).
  S.markSeen = (topic, key) => {
    const st = MQ.state;
    if (!st) return;
    const list = (st.seen = st.seen || {})[topic] || [];
    const at = list.indexOf(key);
    if (at === list.length - 1 && at >= 0) return;
    if (at >= 0) list.splice(at, 1);
    list.push(key);
    st.seen[topic] = list.slice(-S.SEEN_MAX);
  };
  S.mergeProfiles = (a, b) => {
    if (!a) return b;
    if (!b) return a;
    const [nw, old] = (a.rev || 0) >= (b.rev || 0) ? [a, b] : [b, a];
    if ((nw.resetAt || 0) > (old.rev || 0)) return JSON.parse(JSON.stringify(nw)); // progress was erased on purpose
    const out = JSON.parse(JSON.stringify(nw));
    out.creatures = Object.assign({}, old.creatures, nw.creatures);
    out.badges = Object.assign({}, old.badges, nw.badges);
    out.levels = Object.assign({}, old.levels);
    for (const [k, v] of Object.entries(nw.levels || {})) out.levels[k] = { stars: Math.max(v.stars || 0, (old.levels[k] || {}).stars || 0) };
    const max = (x, y) => Math.max(x || 0, y || 0);
    out.xp = max(nw.xp, old.xp);
    out.eggsHatched = max(nw.eggsHatched, old.eggsHatched);
    for (const k of ['attempts', 'correct', 'bestStreak', 'd5', 'lightning60', 'lightning120', 'endlessBest', 'fixed']) out.stats[k] = max(nw.stats[k], old.stats[k]);
    for (const [t, v] of Object.entries(old.stats.topics || {})) if (!out.stats.topics[t] || out.stats.topics[t].a < v.a) out.stats.topics[t] = v;
    out.days = Object.assign({}, old.days);
    for (const [d, v] of Object.entries(nw.days || {})) out.days[d] = { a: max(v.a, (old.days[d] || {}).a), c: max(v.c, (old.days[d] || {}).c) };
    if ((old.daily.last || '') > (nw.daily.last || '')) out.daily = Object.assign({}, old.daily);
    out.daily.best = max(nw.daily.best, old.daily.best);
    if ((old.lastPlayed || '') > (out.lastPlayed || '')) out.lastPlayed = old.lastPlayed;
    // test results from both devices are kept (each result has its own id, which starts with a timestamp)
    out.tests = Object.assign({}, nw.tests);
    for (const key of new Set([...Object.keys(old.tests || {}), ...Object.keys(nw.tests || {})])) {
      const both = [...((old.tests || {})[key] || []), ...((nw.tests || {})[key] || [])];
      if (!both.every((x) => x && x.id)) continue;
      const byId = {};
      for (const r of both) byId[r.id] = r;
      out.tests[key] = Object.values(byId).sort((x, y) => (x.id < y.id ? -1 : 1));
    }
    // questions seen on either device; the newer copy's order wins
    out.seen = {};
    for (const t of new Set([...Object.keys(old.seen || {}), ...Object.keys(nw.seen || {})])) {
      const keys = [...((old.seen || {})[t] || []), ...((nw.seen || {})[t] || [])];
      out.seen[t] = keys.filter((k, i) => keys.lastIndexOf(k) === i).slice(-S.SEEN_MAX);
    }
    // monthly accuracy: each cell keeps the copy with more answers
    out.months = JSON.parse(JSON.stringify(old.months || {}));
    for (const [m, ts] of Object.entries(nw.months || {})) {
      const o = (out.months[m] = out.months[m] || {});
      for (const [t, v] of Object.entries(ts)) if (!o[t] || o[t][0] < v[0]) o[t] = v.slice();
    }
    // mistakes to practice: the copy that was practiced more recently wins for each skill
    out.review = Object.assign({}, old.review || {});
    for (const [k, v] of Object.entries(nw.review || {})) if (!out.review[k] || (v.last || '') >= (out.review[k].last || '')) out.review[k] = v;
    out.tips = Object.assign({}, old.tips || {}, nw.tips || {});
    out.rev = max(nw.rev, old.rev);
    return out;
  };
  // A copy of a profile arrived from another device. Returns true if anything changed here.
  S.applyRemote = (remote) => {
    if (!remote || !remote.id) return false;
    const id = remote.id;
    const live = MQ.state && MQ.state.id === id && !S.preview; // in a preview the copy on screen is left alone
    const local = (live ? MQ.state : null) || readProfile(id) || memory[id];
    const merged = merge(fresh(remote.grade || 'g2'), S.mergeProfiles(local, remote));
    if (local && JSON.stringify(local) === JSON.stringify(merged)) return false;
    if (live) { // update in place so the screen keeps the same object
      for (const k of Object.keys(MQ.state)) delete MQ.state[k];
      Object.assign(MQ.state, merged);
    }
    memory[id] = merged;
    put(PKEY(id), live ? MQ.state : merged);
    if (!index.order.includes(id)) index.order.push(id);
    put(INDEX, index);
    return true;
  };
  S.removeRemote = (id) => {
    if (!index.order.includes(id)) return false;
    del(PKEY(id));
    delete memory[id];
    index.order = index.order.filter((x) => x !== id);
    if (index.active === id) index.active = null;
    put(INDEX, index);
    if (MQ.state && MQ.state.id === id) MQ.state = null;
    return true;
  };
  S.raw = (id) => (MQ.state && MQ.state.id === id && !S.preview ? MQ.state : readProfile(id) || memory[id]);

  // ---------- mistakes to practice again ----------
  // A first-try mistake puts the skill (topic + difficulty) in box 0, due today. A first-try right answer on a
  // due skill moves it up a box: next try 1 day later, then 3 days later; the third right answer fixes it.
  // So a mistake counts as fixed after three right answers on three different days. A new mistake starts over.
  S.REVIEW_GAP = [0, 1, 3];
  S.REVIEW_MAX = 80;
  const addDays = (key, n) => { const d = new Date(key + 'T12:00:00'); d.setDate(d.getDate() + n); return MQ.U.dateKey(d); };
  S.addDays = addDays;
  S.rkey = (topic, d) => topic + '|' + d;
  S.miss = (topic, d) => {
    const st = MQ.state, today = MQ.U.dateKey(), k = S.rkey(topic, d);
    const r = (st.review[k] = st.review[k] || { topic, d, box: 0, due: today, miss: 0, last: today });
    Object.assign(r, { box: 0, due: today, last: today, miss: r.miss + 1 });
    const keys = Object.keys(st.review);
    if (keys.length > S.REVIEW_MAX) { // forget the skills missed longest ago
      keys.sort((a, b) => (st.review[a].last < st.review[b].last ? -1 : 1));
      for (const x of keys.slice(0, keys.length - S.REVIEW_MAX)) delete st.review[x];
    }
  };
  S.hit = (topic, d) => {
    const st = MQ.state, today = MQ.U.dateKey(), k = S.rkey(topic, d), r = st.review[k];
    if (!r || r.due > today) return null;
    r.box++;
    r.last = today;
    if (r.box >= S.REVIEW_GAP.length) { delete st.review[k]; st.stats.fixed = (st.stats.fixed || 0) + 1; return 'fixed'; }
    r.due = addDays(today, S.REVIEW_GAP[r.box]);
    return 'up';
  };
  // Skills to practice today (optionally only those that fit), the oldest and most-missed first.
  S.dueReview = (fit = () => true) => {
    const st = MQ.state, today = MQ.U.dateKey();
    return Object.values((st && st.review) || {})
      .filter((r) => r.due <= today && MQ.TOPICS[r.topic] && fit(r))
      .sort((a, b) => (a.due !== b.due ? (a.due < b.due ? -1 : 1) : b.miss - a.miss));
  };

  // Record one answered problem (first-try result) for statistics and the mistakes to practice again.
  // Returns 'fixed' when this answer fixed an old mistake, 'up' when it moved one closer to fixed.
  S.record = (p, firstTry, given) => {
    const st = MQ.state;
    const t = (st.stats.topics[p.topic] = st.stats.topics[p.topic] || { a: 0, c: 0, byD: {} });
    const bd = (t.byD[p.d] = t.byD[p.d] || { a: 0, c: 0 });
    t.a++; bd.a++; st.stats.attempts++;
    if (firstTry) { t.c++; bd.c++; }
    const day = MQ.U.dateKey();
    st.lastPlayed = day;
    const dd = (st.days[day] = st.days[day] || { a: 0, c: 0 });
    dd.a++;
    if (firstTry) dd.c++;
    const mk = day.slice(0, 7), mt = ((st.months[mk] = st.months[mk] || {})[p.topic] = st.months[mk][p.topic] || [0, 0]);
    mt[0]++;
    if (firstTry) mt[1]++;
    if (!firstTry && given !== undefined) {
      st.mistakes.unshift({ topic: p.topic, d: p.d, text: p.text.replace(/<li>/g, ' • ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140), given: String(given), answer: String(p.answer), date: day });
      st.mistakes.length = Math.min(st.mistakes.length, 40);
    }
    const keys = Object.keys(st.days).sort();
    while (keys.length > 730) delete st.days[keys.shift()];
    const months = Object.keys(st.months).sort();
    while (months.length > 36) delete st.months[months.shift()];
    if (!p.d) return null;
    if (firstTry) return S.hit(p.topic, p.d);
    S.miss(p.topic, p.d);
    return null;
  };

  MQ.store = S;
})();
</script>

// Sound effects (synthesized with Web Audio, no files) and confetti.
(function () {
  const MQ = (globalThis.MQ = globalThis.MQ || {});
  let ctx = null;
  const ac = () => {
    if (!ctx) {
      const A = window.AudioContext || window.webkitAudioContext;
      if (!A) return null;
      ctx = new A();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function tone(freq, at, dur, type = 'sine', vol = 0.18) {
    const c = ac();
    if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.value = freq;
    const t = c.currentTime + at;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  }
  const SONGS = {
    tap: () => tone(520, 0, 0.06, 'triangle', 0.08),
    correct: () => { tone(660, 0, 0.14, 'triangle'); tone(990, 0.09, 0.22, 'triangle'); },

  // ---------------------------------------------------------------- home
  function nextUp() {

        <button class="tile t-fixit ${toFix ? 'hot' : ''}" data-act="go" data-arg="fixit"><span class="ti">🛠️</span><b>Fix-it Lab</b><small>${toFix ? `${toFix} to fix today` : inRepair ? 'All done today ✓' : 'No mistakes to fix'}</small></button>
        <button class="tile t-journal" data-act="go" data-arg="journal"><span class="ti">📔</span><b>Field Journal</b><small>${have} / ${total} creatures</small></button>

        <button class="tile t-prep wide" data-act="go" data-arg="prep"><span class="ti">🎯</span><span><b>Test Prep</b><small>${PAUSE_KINDS.some((k) => S.paused(k)) ? '⏸️ You have an unfinished test: tap to continue' : 'Placement Check in the style of i-Ready' + (myChecks().length ? ' · last: ' + P().label(myChecks().slice(-1)[0].overall) : '')}</small></span></button>
      </div>

  // The daily goal a grown-up set: a ring for today and a dot for each day of this week.
  function goalStrip() {
    const g = st.goal || {};
    if (!g.perDay) return '';
    const today = U.dateKey(), n = (st.days[today] || {}).a || 0, mon = MQ.weekStart(today);
    const days = U.range(0, 6).map((i) => S.addDays(mon, i));
    const met = days.filter((k) => ((st.days[k] || {}).a || 0) >= g.perDay).length;
    const dots = days.map((k, i) => `<i class="${((st.days[k] || {}).a || 0) >= g.perDay ? 'on' : ''} ${k === today ? 'now' : ''}" title="${'MTWTFSS'[i]}">${'MTWTFSS'[i]}</i>`).join('');
    return `<div class="goal" role="group" aria-label="Daily goal">
      <span class="ring" style="--p:${Math.min(100, pct(n, g.perDay))}"><b>${Math.min(n, 999)}</b><small>/ ${g.perDay}</small></span>
      <span class="goal-t"><b>${n >= g.perDay ? 'Today’s goal reached! 🎉' : `Today’s goal: ${g.perDay - n} more ${g.perDay - n === 1 ? 'problem' : 'problems'}`}</b>
        <small>This week: ${met} of ${g.days} goal days</small><span class="wdots">${dots}</span></span></div>`;
  }

  // ---------------------------------------------------------------- map & world
  function map() {

        ${open ? `<span class="wprog">★ ${stars}/18 · ${w.levels.map((l) => `<i class="${st.creatures[l.creature] ? '' : 'sil'}">${MQ.CREATURES[l.creature].emoji}</i>`).join('')}</span>` : `<span class="wprog">Befriend the guardian of ${WORLDS()[i - 1].name} to open</span>`}
        </span>${open && found === 6 ? '<span class="wdone">✓</span>' : ''}</button>`;
