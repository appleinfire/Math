  };
  // The morning a charm's week is over it stops. Returns what it brought, for the morning card: [{ id, a, cost, got }].
  F.charmsMorning = (fm, grade) => {
    const out = [];
    for (const id of Object.keys(fm.charms || {})) {
      const c = fm.charms[id];
      if (id === 'piggy' || fm.day < c.until) continue;
      delete fm.charms[id];
      out.push({ id, a: c.a, cost: c.cost, got: F.charmDone(fm, c, grade) });
    }
    return out;
  };
  F.bankWeekNo = (day) => Math.ceil(day / F.BANK_WEEK);
  F.merchantOn = (fm) => !!fm.dream && (fm.dream.p > 0 || fm.dream.s > 0) && F.dreamOpen(fm);
  // his visit, while he is here (null when he isn't)
  F.merchantHere = (fm) => { const m = fm.merchant; return m && m.week === F.bankWeekNo(fm.day) ? m : null; };
  // what he still has for sale on a visit: { item: the rare treasure or null, charms: [ids] }
  const wares = (fm, m) => ({ item: m.item && !(fm.treasure || {})[m.item] ? m.item : null, charms: (m.charms || []).filter((c) => !(m.got || {})[c]) });
  F.merchantWares = (fm) => { const m = F.merchantHere(fm); return m ? wares(fm, m) : { item: null, charms: [] }; };
  // the rare treasure he has for sale today (null when he isn't here, it isn't a treasure visit, or it was bought)
  F.merchantNow = (fm) => F.merchantWares(fm).item;
  F.merchantHas = (fm) => { const w = F.merchantWares(fm); return !!w.item || w.charms.length > 0; };
  F.merchantNights = (day) => F.bankWeekNo(day) * F.BANK_WEEK - day; // nights left (0: he leaves tonight)
  // The rare treasure he brings: the one the child is saving for, or else the first one not bought yet that fits the
  // farm level (null: none left).
  F.nextTreasure = (fm) => {
    const L = F.level(fm.xp).level, ok = (t) => !!F.TREASURES[t] && !(fm.treasure || {})[t] && F.TREASURES[t].lv <= L;
    const goal = (fm.goal || '').startsWith('treasure:') ? fm.goal.slice(9) : '';
    return ok(goal) ? goal : Object.keys(F.TREASURES).find(ok) || null;
  };
  // A new visit (number n, in bank week w): the treasure on every 2nd visit, two charms, their prices for this farm.
  // Mythic Feed is for a kind of animal on the farm (grown-ups first), a different kind each time.
  F.merchantVisit = (fm, grade, w, n) => {
    const item = n % F.MERCHANT.rare === 1 ? F.nextTreasure(fm) : null;
    const has = Object.keys(F.MYTHS).filter((a) => fm.pens.some((p) => p.a === a));
    const grown = has.filter((a) => fm.pens.some((p) => p.a === a && F.animalStage(p) === 2));
    const kinds = (grown.length ? grown : has).sort((x, y) => F.charmGain('myth', fm, grade, y) - F.charmGain('myth', fm, grade, x));
    const a = kinds.length ? kinds[Math.floor(n / 2) % kinds.length] : null;
    let charms = F.CHARM_PAIRS[(n - 1) % F.CHARM_PAIRS.length];
    if (!a) charms = charms.map((c) => (c === 'myth' ? ['sun', 'clover', 'piggy'].find((x) => !charms.includes(x)) : c));
    const cost = {};
    for (const c of charms) cost[c] = F.charmCost(c, fm, grade, a);
    return { week: w, n, item, charms, a: charms.includes('myth') ? a : null, cost, got: {} };
  };
  // Each morning: he arrives on the first morning of his bank week, says goodbye on his last day (if something is
  // still for sale), and the morning after he left. Returns ['came' | 'last' | 'left', visit] for the morning card, or null.
  F.merchantMorning = (fm, grade) => {
    const w = F.bankWeekNo(fm.day), m = fm.merchant;
    if (w % F.MERCHANT.every === 0 && F.merchantOn(fm) && (!m || m.week !== w)) {
      fm.merchant = F.merchantVisit(fm, grade, w, (m ? m.n || 1 : 0) + 1);
      return ['came', fm.merchant];
    }
    if (!m) return null;
    const left = wares(fm, m);
    if (!left.item && !left.charms.length) return null;
    if (m.week === w && F.merchantNights(fm.day) === 0) return ['last', m];
    if (m.week === w - 1 && F.isBankDay(fm.day - 1)) return ['left', m];
    return null;
  };
  // The farm day he comes next (with a treasure: on his next treasure visit), counting from today.
  F.merchantNext = (fm, rare = false) => {
    const E = F.MERCHANT.every, m = fm.merchant;
    let w = (Math.floor(F.bankWeekNo(fm.day) / E) + 1) * E, n = (m ? m.n || 1 : 0) + 1;
    if (rare) while (n % F.MERCHANT.rare !== 1) { w += E; n++; }
    return (w - 1) * F.BANK_WEEK + 1;
  };
  F.buyTreasure = (fm, grade) => {
    const id = F.merchantNow(fm), t = id && F.TREASURES[id], cost = t && t.cost[gi(grade)];
    if (!t || fm.money < cost) return null;
    fm.money -= cost;
    fm.stats.spent += cost;
    fm.treasure[id] = true;
    if (fm.goal === 'treasure:' + id) fm.goal = '';
    return Object.assign({ id, cost }, t);
  };
  // Buy a week charm: it starts working now, for 7 farm days (the Golden Piggy: on the next bank day, or on today's
  // if today is bank day and its interest isn't collected yet). Returns { id, cost, … } or null.
  F.buyCharm = (fm, grade, id) => {
    const m = F.merchantHere(fm), cost = m && m.cost && m.cost[id];
    if (!m || !F.merchantWares(fm).charms.includes(id) || !(cost > 0) || fm.money < cost) return null;
    fm.money -= cost;
    fm.stats.spent += cost;
    fm.stats.charms++;
    fm.stats.charmCost += cost;
    m.got = Object.assign({}, m.got, { [id]: true });
    if (id === 'piggy') {
      const today = fm.bank.pend.find((p) => p.day === fm.day && !p.paid);
      if (today && !today.piggy) today.piggy = { cost };
      else fm.charms.piggy = { cost };
    } else fm.charms[id] = Object.assign({ cost, until: fm.day + F.CHARM_NIGHTS, gain: 0 }, id === 'myth' ? { a: m.a } : {});
    return Object.assign({ id, cost, a: id === 'myth' ? m.a : null }, F.CHARMS[id]);
  };
  // Is the Golden Piggy waiting for a bank day (bought, interest not paid yet)?
  F.piggyWaiting = (fm) => !!(fm.charms && fm.charms.piggy) || fm.bank.pend.some((p) => p.piggy);
  // How much to put aside each day to buy it before he leaves: today and every day left, in whole dollars (k: cents).
  F.perDayToSave = (need, nights, grade) => { const days = nights + 1, x = Math.ceil(need / days); return grade === 'k' ? x : Math.ceil(x / 100) * 100; };

  // ---------------------------------------------------------------- grown-up preview
  // The farm of a level-60 farmer, to look around in the grown-up preview (a copy of the profile; nothing is saved):
  // everything open and owned, plenty of money, crops and animals at every stage, a full basket, a bank day waiting.
  F.showcase = (st) => {
    const fm = F.ensure(st), g = st.grade, k = g === 'k';
    let xp = 0;
    for (let L = 1; L < 60; L++) xp += F.need(L);
    Object.assign(fm, {
      xp, money: k ? 5000 : 100000, feed: 200, stand: F.STANDS.length - 1, tier: F.tiers(g).length, goal: '',
      beds: ['carrot', 'tomato', 'corn', 'pumpkin', 'strawberry', 'pineapple'].map((c, i) => ({ c, u: [0, 1, 2, 3, 5, 6][i], g: i % 2 ? 0 : 9 })),
      pens: ['chicken', 'cow', 'bees', 'fishpond', 'sheep', 'unicorn'].map((a, i) => ({ a, g: i === 5 ? 0 : 9, fed: i % 3 === 0, ready: i % 2 ? 3 : 0, u: i % 4 })),
      basket: {}, owned: {}, works: {},
      helper: { hired: true, on: false },
      day: 14,
      bank: { bal: k ? 1234 : 12345, acct: 1, log: [], pend: [{ day: 14, bal: k ? 1234 : 12345 }] }, // above the Silver limit: both rates
      dream: { p: 2, s: 2, b: false, seen: true }, // the orchard and the cottage built, the railway half done
      treasure: { goose: true, can: true, musician: true }, // three of the merchant's treasures
      dep: k ? { ok: false, amt: 0, until: 0 } : { ok: true, amt: 2000, until: 28 }, // and a locked deposit (2nd grade)
    });
    Object.assign(fm.stats, k ? { saved: 1100, tookOut: 100, interest: 234, bankDays: 9 } : { saved: 11000, tookOut: 1000, interest: 2345, bankDays: 9 }); // adds up to the bank above
    // the merchant is visiting (farm day 14 is the last day of bank week 2) with a treasure and two charms; two charms work
    fm.merchant = F.merchantVisit(fm, g, 2, 3);
    fm.charms = { clover: { cost: k ? 30 : 900, until: 18, gain: k ? 12 : 640 }, myth: { a: 'cow', cost: k ? 60 : 2400, until: 17, gain: k ? 33 : 1750 } };
    fm.pens[1].rare = 2;
    for (const id of Object.keys(F.ITEMS)) fm.basket[id] = 3;
    for (const id of Object.keys(F.DECOR)) fm.owned[id] = true;
    Object.keys(F.WORKS).forEach((id, i) => { fm.works[id] = i % 2 ? { r: null, g: 0, ready: 1, out: F.WORKS[id].recipes[0].out } : { r: null, g: 0, ready: 0, out: '' }; });
    return fm;
  };

  // The saving goal: something in the shop, or a rare treasure from the merchant ('treasure:goose').
  F.goalItem = (fm, grade) => {
    if (!fm.goal) return null;
    if (!fm.goal.startsWith('treasure:')) return F.shopItem(fm, grade, fm.goal);
    const id = fm.goal.slice(9), t = F.TREASURES[id];
    return t && !(fm.treasure || {})[id] ? { id: fm.goal, e: t.e, name: t.name, price: t.cost[gi(grade)], lv: t.lv, treasure: id } : null;
  };

  // ---------------------------------------------------------------- XP
  // Returns the levels reached (empty when none), after paying each level's gift.
  F.addXp = (fm, n, grade) => {
    const before = F.level(fm.xp).level;
    fm.xp += n;
    const after = F.level(fm.xp).level, ups = [];
    for (let L = before + 1; L <= after; L++) { fm.money += F.gift(L, grade); ups.push(L); }
    return ups;
  };
  // Adaptive tier: 4 first-try right in a row → one tier up (if open), 2 misses → down.
  F.adapt = (fm, grade, firstTry) => {
    if (firstTry) { fm.streak++; fm.miss = 0; } else { fm.miss++; fm.streak = 0; }
    const open = F.tierOpen(fm, grade);
    if (fm.streak >= 4 && fm.tier < open) { fm.tier++; fm.streak = 0; return 'up'; }
    if (fm.miss >= 2 && fm.tier > 1) { fm.tier--; fm.miss = 0; return 'down'; }
    if (fm.tier > open) fm.tier = open;
    return null;
  };
  // Every money problem counts in the child's daily totals (daily goal, My Progress).
  F.record = (st, firstTry) => {
    const day = U.dateKey(), dd = (st.days[day] = st.days[day] || { a: 0, c: 0 });
    dd.a++;
    st.stats.attempts++;
    if (firstTry) { dd.c++; st.stats.correct++; }
    st.lastPlayed = day;
  };

  // ---------------------------------------------------------------- customers & problems
  F.PEOPLE = [['🐻', 'Bruno'], ['🐰', 'Hazel'], ['🦊', 'Felix'], ['🐼', 'Mei'], ['🦉', 'Olive'], ['🐸', 'Ribbit'], ['🐨', 'Kip'], ['🐯', 'Tess'], ['🐹', 'Peanut'], ['🦔', 'Spike'], ['🐧', 'Pablo'], ['🦝', 'Rocky'], ['🐿️', 'Nutmeg'], ['🦌', 'Fern'], ['🐭', 'Pip'], ['🦫', 'Bucky']];
  F.VIPS = [['🦁', 'Mayor Leo'], ['🦄', 'Princess Luna'], ['🐘', 'Chef Ellie'], ['🦒', 'Professor Gigi'], ['🐳', 'Captain Blue']];
  const plural = (id, n) => (n === 1 ? F.ITEMS[id].name : F.ITEMS[id].many);
  const things = (id, n) => `${n} ${F.ie(id)} ${plural(id, n)}`;
  // Choices for an amount of money: the answer and near misses (a coin off, a dime off, a dollar off).
  // traps: wrong answers a child is likely to give (tried first), then amounts near the answer
  F.moneyChoices = (ans, grade, traps = []) => {
    const near = [ans + 10, ans - 10, ans + 5, ans - 5, ans + 25, ans - 25, ans + 100, ans - 100, ans + 1, ans - 1].filter((x) => x > 0 && x !== ans);
    const picks = new Set([ans]);
    for (const x of traps) if (x > 0 && picks.size < 4) picks.add(x);
    for (const x of U.shuffle(near)) { if (picks.size >= 4) break; picks.add(x); }
    return U.shuffle([...picks]).map((x) => F.fmt(x, grade));
  };
  // Number pad for amounts in cents under a dollar; buttons for dollar amounts (typing $3.45 is hard on a pad).
  function ask(p, ans, grade) {
    if (grade === 'k' || ans < 100) return Object.assign(p, { kind: 'num', answer: ans, unit: '¢' });
    const choices = F.moneyChoices(ans, grade);
    return Object.assign(p, { kind: 'choice', answer: F.fmt(ans, grade), choices });
  }
  const tag = (id, grade) => `<span class="ftag">${F.ie(id)} ${F.fmt(F.price(id, grade), grade)}</span>`;
  const row = (id, n) => `<div class="frow" aria-hidden="true">${Array(Math.min(n, 12)).fill(F.ie(id)).join('')}</div>`;

  // One problem. ctx: { grade, tier (object), stock: { item: count } }. Returns null when the stock can't make it.
  // Every problem has: kind (num | choice | coins), text, answer, hint, explain, sale { item: count } and total (cents
  // the customer pays for the sale).
  F.problem = (type, ctx) => {
    const { grade, tier, stock } = ctx;
    const fmt = (c) => F.fmt(c, grade);
    const items = Object.keys(stock).filter((id) => stock[id] > 0);
    const P = (id) => F.price(id, grade);
    // an item and how many, with the total at most `max`
    const pickSale = (minQ, maxQ, max) => {
      const ok = U.shuffle(items).map((id) => {
        const top = Math.min(maxQ, stock[id], Math.floor(max / P(id)));
        return top >= minQ ? [id, U.rnd(minQ, top)] : null;
      }).filter(Boolean);
      return ok[0] || null;
    };
    const kinds = tier.coins;
    if (type === 'total') {
      const s = pickSale(2, grade === 'k' ? 3 : 4, tier.max);
      if (!s) return null;
      const [id, q] = s, T = q * P(id);
      return ask({ type, text: `wants <b>${things(id, q)}</b>. One costs <b>${fmt(P(id))}</b>. How much is that in all?`, visual: row(id, q) + tag(id, grade), hint: `Add ${fmt(P(id))} ${q} times: ${Array(q).fill(P(id)).join(' + ')}.`, explain: `${Array(q).fill(fmt(P(id))).join(' + ')} = ${fmt(T)}`, sale: { [id]: q }, total: T }, T, grade);
    }
    if (type === 'count') {
      const s = pickSale(1, 3, tier.max);
      if (!s) return null;
      const [id, q] = s, T = q * P(id), coins = F.coinsFor(T, kinds);
      if (!coins) return null;
      const names = grade !== 'k' && tier !== F.tiers(grade)[0];
      return ask({ type, text: `buys <b>${things(id, q)}</b> and pays with these. How much money is it?`, visual: MQ.V.coins(coins, !names), hint: 'Start with the money worth the most, then count on.', explain: `${coins.map((k) => fmt(F.COINV[k])).join(' + ')} = ${fmt(T)}`, sale: { [id]: q }, total: T }, T, grade);
    }
    if (type === 'collect') {
      const s = pickSale(1, 3, tier.max);
      if (!s) return null;
      const [id, q] = s, T = q * P(id);
      if (!F.fewest(T, kinds)) return null;
      return { type, kind: 'coins', target: T, coinKinds: kinds, text: `buys <b>${things(id, q)}</b> for <b>${fmt(T)}</b>. Help them pay: tap coins to make <b>${fmt(T)}</b>.`, hint: 'Start with the biggest coin that fits, then add smaller ones.', explain: `One way: ${F.fewest(T, kinds).map((k) => fmt(F.COINV[k])).join(' + ')} = ${fmt(T)}`, sale: { [id]: q }, total: T };
    }
    if (type === 'change' || type === 'giveChange') {
      const s = pickSale(1, 3, Math.max(...tier.pay) - 1);
      if (!s) return null;
      const [id, q] = s, T = q * P(id);
      const over = tier.pay.filter((x) => x > T);
      if (!over.length) return null;
      const X = over[0] - T < 5 && over[1] ? U.pick(over.slice(0, 2)) : over[0];
      const C = X - T;
      const steps = `Count up from ${fmt(T)} to ${fmt(X)}.`;
      const base = { type, text: `buys <b>${things(id, q)}</b> for <b>${fmt(T)}</b> and pays with <b>${F.payName(X)}</b>. `, visual: MQ.V.coins(F.payCoins(X), true), hint: steps, explain: `${fmt(X)} − ${fmt(T)} = ${fmt(C)}`, sale: { [id]: q }, total: T };
      if (type === 'change') return ask(Object.assign(base, { text: base.text + 'How much change do you give back?' }), C, grade);
      const ck = kinds.filter((k) => F.COINV[k] < X);
      if (!F.fewest(C, ck)) return null;
      return Object.assign(base, { kind: 'coins', target: C, coinKinds: ck, text: base.text + 'Tap coins to give the right change.', explain: `${fmt(X)} − ${fmt(T)} = ${fmt(C)}. One way: ${F.fewest(C, ck).map((k) => fmt(F.COINV[k])).join(' + ')}` });
    }
    if (type === 'enough') {
      const s = pickSale(1, 2, tier.max);
      if (!s) return null;
      const [id, q] = s, T = q * P(id);
      const off = U.pick([-3, -2, -1, 0, 1, 2, 5]) * (T >= 20 ? 5 : 1);
      const H = Math.max(1, T + off);
      const coins = F.coinsFor(H, kinds);
      if (!coins) return null;
      const yes = H >= T;
      return { type, kind: 'choice', choices: ['Yes, enough', 'No, not enough'], answer: yes ? 'Yes, enough' : 'No, not enough', text: `wants <b>${things(id, q)}</b> for <b>${fmt(T)}</b>. These coins are in their pocket. Do they have enough?`, visual: MQ.V.coins(coins, true), hint: `Count the coins, then compare with ${fmt(T)}.`, explain: `The coins make ${fmt(H)}. ${fmt(H)} is ${H > T ? 'more than' : H === T ? 'the same as' : 'less than'} ${fmt(T)}, so ${yes ? 'yes, it is enough' : 'it is not enough'}.`, sale: { [id]: q }, total: T, noPay: !yes };
    }
    if (type === 'two' || type === 'budget') {
      let two = U.shuffle(items).filter((id) => P(id) < tier.max).slice(0, type === 'budget' && tier.pay.length > 1 && items.length > 2 ? 3 : 2);
      if (type === 'two' && two.length === 2 && P(two[0]) + P(two[1]) > tier.max) { // a second thing that fits the money with the first
        const fit = U.shuffle(items).find((id) => id !== two[0] && P(two[0]) + P(id) <= tier.max);
        if (fit) two = [two[0], fit];
      }
      if (two.length < 2) return null;
      const T = U.sum(two.map(P));
      const list = two.map((id) => `${F.ITEMS[id].e} ${F.ITEMS[id].name} (${fmt(P(id))})`).join(' and ');
      const sale = {};
      two.forEach((id) => (sale[id] = 1));
      if (type === 'two') {
        if (T > tier.max) return null;
        return ask({ type, text: `wants <b>${list}</b>. How much is that in all?`, visual: `<div class="ftags">${two.map((id) => tag(id, grade)).join('<b>+</b>')}</div>`, hint: grade === 'k' ? 'Count on from the bigger price.' : 'Add the dollars, then the cents. 100¢ make a dollar.', explain: `${two.map((id) => fmt(P(id))).join(' + ')} = ${fmt(T)}`, sale, total: T }, T, grade);
      }
      const over = (tier.pay || []).filter((x) => x > T);
      if (!over.length) return null;
      const H = over[0];
      return ask({ type, text: `has <b>${fmt(H)}</b> and buys <b>${list}</b>. How much money will they have left?`, visual: `<div class="ftags">${two.map((id) => tag(id, grade)).join('<b>+</b>')}</div>`, hint: `First add the prices. Then count up from the total to ${fmt(H)}.`, explain: `${two.map((id) => fmt(P(id))).join(' + ')} = ${fmt(T)}; ${fmt(H)} − ${fmt(T)} = ${fmt(H - T)}`, sale, total: T }, H - T, grade);
    }
    if (type === 'multiply') {
      const s = pickSale(3, 9, tier.max);
      if (!s) return null;
      const [id, q] = s, T = q * P(id);
      return ask({ type, text: `orders <b>${things(id, q)}</b> at <b>${fmt(P(id))}</b> each. How much is the order?`, visual: row(id, q) + tag(id, grade), hint: `${q} × ${fmt(P(id))}: find 2 × first, then keep adding, or split ${fmt(P(id))} into dollars and cents.`, explain: `${q} × ${fmt(P(id))} = ${fmt(T)}`, sale: { [id]: q }, total: T }, T, grade);
    }
    if (type === 'deal') {
      const s = pickSale(2, 6, tier.max * 2);
      if (!s) return null;
      const id = s[0], one = P(id), dealP = 2 * one - (one >= 50 ? 10 * U.rnd(1, 3) : U.rnd(1, 3) * 5);
      if (dealP <= one) return null;
      const qs = [4, 6].filter((n) => n <= stock[id]);
      const q = qs.length ? U.pick(qs) : 2;
      if (q > stock[id]) return null;
      const T = (q / 2) * dealP;
      return ask({ type, text: `likes today’s deal: <b>2 ${F.ITEMS[id].many} for ${fmt(dealP)}</b> (one is ${fmt(one)}) and takes <b>${things(id, q)}</b>. How much do they pay?`, visual: row(id, q) + tag(id, grade), hint: `${q} ${F.ITEMS[id].many} is ${q / 2} pairs. Each pair costs ${fmt(dealP)}.`, explain: `${q / 2} × ${fmt(dealP)} = ${fmt(T)} (without the deal it would be ${fmt(q * one)})`, sale: { [id]: q }, total: T }, T, grade);
    }
    if (type === 'profit') {
      const crops = Object.keys(F.CROPS).filter((c) => items.includes(c) || F.CROPS[c].lv <= 8);
      const c = U.pick(crops), seed = F.seedPrice(c, grade), y = F.CROPS[c].yield, T = y * P(c);
      const s = pickSale(1, 2, tier.max);
      if (!s) return null;
      return ask({ type, text: `asks a farmer question: a packet of ${F.ITEMS[c].e} seeds costs <b>${fmt(seed)}</b> and gives <b>${y} ${F.ITEMS[c].many}</b> that sell for <b>${fmt(P(c))}</b> each. How much <b>profit</b> is that? Then they buy ${things(s[0], s[1])}.`, hint: `Profit = money you get − money you spent. First ${y} × ${fmt(P(c))}.`, explain: `${y} × ${fmt(P(c))} = ${fmt(T)}; ${fmt(T)} − ${fmt(seed)} = ${fmt(T - seed)} profit`, sale: { [s[0]]: s[1] }, total: s[1] * P(s[0]) }, T - seed, grade);
    }
    if (type === 'interest') {
      const [per, add] = F.bankRule(grade);
      const bal = grade === 'k' ? U.rnd(12, Math.min(tier.max, 199)) : U.rnd(120, 2400);
      const n = Math.floor(bal / per), I = n * add;
      const s = pickSale(1, 2, tier.max);
      if (!s) return null;
      const unit = per === 100 ? 'whole dollar' : fmt(per);
      return ask({ type, text: `asks a bank question: the bank adds <b>${fmt(add)} for every ${unit}</b> you save. They have <b>${fmt(bal)}</b> in the bank. How much interest do they get this week? Then they buy ${things(s[0], s[1])}.`, hint: per === 100 ? `How many whole dollars are in ${fmt(bal)}? Each dollar brings 10¢.` : `How many tens are in ${bal}? Each ten brings 1¢.`, explain: `${fmt(bal)} has ${n} ${per === 100 ? (n === 1 ? 'whole dollar' : 'whole dollars') : n === 1 ? 'ten' : 'tens'}: ${n} × ${fmt(add)} = ${fmt(I)}`, sale: { [s[0]]: s[1] }, total: s[1] * P(s[0]) }, I, grade);
    }
    if (type === 'worth') {
      const r = U.pick(F.recipes());
      const w = F.worth(r, grade);
      const s = pickSale(1, 2, tier.max);
      if (!s) return null;
      const ins = Object.entries(r.in).map(([id, n]) => `${n} ${F.ITEMS[id].e}`).join(' + ');
      return ask({ type, text: `asks a farmer question: <b>${ins}</b> sell for <b>${fmt(w.inVal)}</b> in all. Made into ${F.ITEMS[r.out].e} ${F.ITEMS[r.out].name}, they sell for <b>${fmt(w.outVal)}</b>. How much <b>more</b> money is that? Then they buy ${things(s[0], s[1])}.`, hint: `Count up from ${fmt(w.inVal)} to ${fmt(w.outVal)}.`, explain: `${fmt(w.outVal)} − ${fmt(w.inVal)} = ${fmt(w.gain)}`, sale: { [s[0]]: s[1] }, total: s[1] * P(s[0]) }, w.gain, grade);
    }
    return null;
  };
  // The question before making something in a workshop: is it worth it?
  F.makeQuestion = (r, grade) => {
    const fmt = (c) => F.fmt(c, grade), w = F.worth(r, grade);
    const ins = Object.entries(r.in).map(([id, n]) => `${n} ${F.ITEMS[id].e} ${n === 1 ? F.ITEMS[id].name : F.ITEMS[id].many}`).join(' and ');
    const tags = Object.entries(r.in).map(([id, n]) => `<span class="ftag">${n} × ${F.ITEMS[id].e} ${fmt(F.price(id, grade))}</span>`).join('<b>+</b>');
    return ask({ type: 'make', text: `Make ${F.ITEMS[r.out].e} <b>${F.ITEMS[r.out].name}</b> from <b>${ins}</b>? Sold one by one they bring <b>${fmt(w.inVal)}</b>. The ${F.ITEMS[r.out].name} sells for <b>${fmt(w.outVal)}</b>. How much <b>more</b> money do you get by making it?`, visual: `<div class="ftags">${tags}<b>→</b><span class="ftag">${F.ITEMS[r.out].e} ${fmt(w.outVal)}</span></div>`, hint: `Count up from ${fmt(w.inVal)} to ${fmt(w.outVal)}.`, explain: `${fmt(w.outVal)} − ${fmt(w.inVal)} = ${fmt(w.gain)} more`, sale: {}, total: 0 }, w.gain, grade);
  };
  // How much Rosa pays for a pen. Kindergarten counts the coins she pays with; 2nd grade works out half of the shop
  // price (one animal) or adds it up (more animals, the barn).
  F.sellQuestion = (p, grade) => {
    const fmt = (c) => F.fmt(c, grade), a = F.ANIMALS[p.a], { cost, each, n, barn, total } = F.resale(p, grade);
    const what = `${n > 1 ? n + ' × ' : ''}${a.e} ${a.name}${barn ? ' and the cozy barn' : ''}`;
    const base = { type: 'sell', who: F.NEIGHBOR, sale: {}, total: 0 };
    if (grade === 'k') {
      const coins = F.fewest(total, total >= 25 ? ['q', 'd', 'n', 'p'] : ['d', 'n', 'p']);
      return ask(Object.assign(base, { text: `buys your <b>${what}</b> for half of the shop price. She pays with these coins. How much money is it?`, visual: MQ.V.coins(coins, false), hint: 'Start with the money worth the most, then count on.', explain: `${coins.map((k) => fmt(F.COINV[k])).join(' + ')} = ${fmt(total)}` }), total, grade);
    }
    let q;
    if (n === 1 && !barn) q = { text: `wants to buy your <b>${what}</b>. It costs <b>${fmt(cost)}</b> in the shop, and she pays <b>half</b> of that. How much does she pay?`, hint: `Half means two equal parts: what number plus the same number makes ${fmt(cost)}?`, explain: `${fmt(each)} + ${fmt(each)} = ${fmt(cost)}, so half of ${fmt(cost)} is ${fmt(each)}`, traps: [cost] };
    else {
      const parts = Array(n).fill(fmt(each)).concat(barn ? [fmt(barn)] : []);
      q = { text: `wants to buy your <b>${what}</b>. She pays <b>${fmt(each)} for each ${a.name.toLowerCase()}</b>${barn ? ` and <b>${fmt(barn)} for the barn</b>` : ''}. How much does she pay in all?`, hint: `Add ${fmt(each)} ${n} ${n === 1 ? 'time' : 'times'}${barn ? `, then add ${fmt(barn)} for the barn` : ''}.`, explain: `${parts.join(' + ')} = ${fmt(total)}`, traps: [n * each, each + barn, (n + 1) * each].filter((x) => x !== total) };
    }
    Object.assign(base, { text: q.text, hint: q.hint, explain: q.explain });
    return Object.assign(base, total < 100 ? { kind: 'num', answer: total, unit: '¢' } : { kind: 'choice', answer: fmt(total), choices: F.moneyChoices(total, grade, q.traps) });
  };
  // The wholesale price: about half (2nd grade: a multiple of 5¢, nice for counting by 5s and 10s).
  F.wholesale = (id, grade) => {
    const p = F.price(id, grade);
    return grade === 'k' ? Math.max(1, Math.floor(p / 2)) : Math.max(5, Math.floor(p / 10) * 5);
  };
  // At most the tier's money range, and never more than 50¢ (kindergarten) or $5: a truck pays a bit more than a
  // customer, for a lot more things. Expensive things are for customers (a truck can't take 10 of them).
  F.truckCap = (grade, tier) => Math.min(tier.max, grade === 'k' ? 50 : 500);
  // The pile the truck buys now: the biggest one it can take at least F.TRUCK_MIN of within F.truckCap.
  F.truckLoad = (stock, grade, tier) => {
    let best = null;
    for (const [id, n] of Object.entries(stock)) {
      if (n < F.TRUCK_MIN) continue;
      const each = F.wholesale(id, grade), q = Math.min(n, Math.floor(F.truckCap(grade, tier) / each));
      if (q >= F.TRUCK_MIN && (!best || q > best.q)) best = { id, q, each, total: q * each };
    }
    return best;
  };
  // The truck's problem: count the money the driver pays (kindergarten, odd prices), or count by 5s and 10s /
  // multiply (2nd grade).
  F.truckProblem = (stock, grade, tier) => {
    const L = F.truckLoad(stock, grade, tier);
    if (!L) return null;
    const { id, q, each, total } = L, fmt = (c) => F.fmt(c, grade), it = F.ITEMS[id];
    const buys = `buys <b>${things(id, q)}</b> at the wholesale price, <b>${fmt(each)} each</b> (less than customers pay, but all at once).`;
    const base = { type: 'truck', truck: true, sale: { [id]: q }, total, visual: row(id, q) + `<span class="ftag">🚚 ${fmt(each)} each</span>` };
    const easy = each === 5 || each === 10;
    if (grade !== 'k' && (easy || tier.types.includes('multiply') || tier.types.includes('deal'))) {
      const tens = Math.floor(q / 10), rest = q % 10;
      const hint = easy
        ? (q >= 10 ? `10 ${it.many} make ${fmt(10 * each)}. Count the tens first: ${tens} × ${fmt(10 * each)}${rest ? `, then count the other ${rest} by ${each}s` : ''}.` : `Count by ${each}s: ${each}, ${2 * each}, ${3 * each}…`)
        : rest ? `${q} × ${fmt(each)}: split ${q} into ${tens * 10} and ${rest}, find each part, then add.` : `${q} is ${tens} tens: find 10 × ${fmt(each)} first, then ${tens} × that.`;
      const explain = easy && q >= 10 ? `${tens} × ${fmt(10 * each)} = ${fmt(tens * 10 * each)}${rest ? `, ${rest} × ${fmt(each)} = ${fmt(rest * each)}; ${fmt(tens * 10 * each)} + ${fmt(rest * each)} = ${fmt(total)}` : ''}` : `${q} × ${fmt(each)} = ${fmt(total)}`;
      const traps = [(q - 1) * each, (q + 1) * each, total + 10 * each, total - 10 * each];
      return Object.assign(base, { text: `${buys} How much does it pay?`, hint, explain }, total < 100 ? { kind: 'num', answer: total, unit: '¢' } : { kind: 'choice', answer: fmt(total), choices: F.moneyChoices(total, grade, traps) });
    }
    const coins = F.coinsFor(total, tier.coins) || F.fewest(total, tier.coins);
    if (!coins) return null;
    return ask(Object.assign(base, { text: `${buys} The driver pays with these. How much money is it?`, visual: base.visual + MQ.V.coins(coins, grade === 'k' || tier === F.tiers(grade)[0]), hint: 'Start with the money worth the most, then count on.', explain: `${coins.map((k) => fmt(F.COINV[k])).join(' + ')} = ${fmt(total)}` }), total, grade);
  };
  const FALLBACK = ['count', 'collect', 'total', 'two'];
  // The next customer: a problem of the child's tier (one tier up for a ⭐ challenge customer).
  // stock: what can be sold (the basket; odd jobs use a pretend crate). Returns null when nothing can be sold.
  F.customer = (fm, grade, { stock, vip = false, jobs = false, truck = false } = {}) => {
    const all = F.tiers(grade);
    const ti = Math.min(all.length, Math.max(1, fm.tier) + (vip ? 1 : 0));
    const tier = all[ti - 1];
    if (!Object.values(stock).some((n) => n > 0)) return null;
    const t = truck && !vip && !jobs ? F.truckProblem(stock, grade, tier) : null;
    if (t) return Object.assign(t, { who: F.TRUCK, vip: false, jobs: false, tier: ti, ahead: !!tier.ahead });
    const types = U.shuffle(tier.types).concat(FALLBACK);
    for (const type of types) {
      const p = F.problem(type, { grade, tier, stock });
      if (!p) continue;
      const who = vip ? U.pick(F.VIPS) : U.pick(F.PEOPLE);
      return Object.assign(p, { who, vip, jobs, tier: ti, ahead: !!tier.ahead });
    }
    // nothing fits the tier (e.g. only expensive items): count the money for one item
    const id = Object.keys(stock).find((k) => stock[k] > 0), T = F.price(id, grade);
    const coins = F.coinsFor(T, all[all.length - 1].coins);
    return ask({ type: 'count', who: U.pick(F.PEOPLE), vip, jobs, tier: ti, text: `buys <b>${things(id, 1)}</b> and pays with these. How much money is it?`, visual: MQ.V.coins(coins, false), hint: 'Start with the money worth the most, then count on.', explain: `${coins.map((k) => F.fmt(F.COINV[k], grade)).join(' + ')} = ${F.fmt(T, grade)}`, sale: { [id]: 1 }, total: T }, T, grade);
  };
  // Odd jobs: helping at the big Farmers' Market with things the farm doesn't grow yet. Pays a small wage.
  F.jobStock = (fm) => {
    const L = F.level(fm.xp).level, stock = {};
    for (const [id, c] of Object.entries(F.CROPS)) if (c.lv <= L + 6) stock[id] = 9;
    for (const a of Object.values(F.ANIMALS)) if (a.lv <= L + 6) stock[a.item] = 9;
    return stock;
  };
  F.wage = (tier, grade) => (grade === 'k' ? (tier >= 3 ? 2 : 1) : 5 * tier);
  // a nicer stand tips more; the merchant's Street Musician adds 10% on any stand, his Lucky Clover 20% for a week
  F.tipRate = (fm, clover = true) => F.STANDS[fm.stand].tip + (fm.treasure && fm.treasure.musician ? F.TREASURES.musician.tip : 0) + (clover && F.charmOn(fm, 'clover') ? F.CHARMS.clover.tip : 0);
  F.tip = (fm, total, clover = true) => { const r = F.tipRate(fm, clover); return r ? Math.max(1, Math.round(total * r)) : 0; };
  F.VIP_TIP = (grade, total) => Math.max(grade === 'k' ? 2 : 10, Math.round(total * 0.5));

  // Is this answer right? (coins: the picked coins make the target exactly)
  F.isRight = (p, given) => (p.kind === 'coins' ? F.sumCoins(given) === p.target : String(given) === String(p.answer));
  // A customer was served: take the items, get paid (plus a tip for a first-try right answer), earn XP.
  F.serve = (fm, grade, p, firstTry, solved) => {
    const res = { paid: 0, tip: 0, xp: 0, ups: [] };
    if (p.jobs) {
      res.paid = solved ? (firstTry ? F.wage(p.tier, grade) : Math.ceil(F.wage(p.tier, grade) / 2)) : 0;
      fm.stats.jobs++;
    } else if (!p.noPay) {
      for (const [id, n] of Object.entries(p.sale)) { fm.basket[id] = Math.max(0, (fm.basket[id] || 0) - n); if (!fm.basket[id]) delete fm.basket[id]; fm.stats.sold += n; }
      res.paid = p.total;
      if (firstTry) res.tip = p.vip ? F.VIP_TIP(grade, p.total) : p.truck ? 0 : F.tip(fm, p.total); // wholesale: no tip
      if (firstTry && !p.vip && !p.truck && F.charmOn(fm, 'clover')) { res.clover = res.tip - F.tip(fm, p.total, false); fm.charms.clover.gain += res.clover; } // what the Lucky Clover added
    }
    fm.money += res.paid + res.tip;
    fm.stats.earned += res.paid + res.tip;
    fm.stats.tasks++;
    if (firstTry) fm.stats.right++;
    if (p.vip && firstTry) fm.stats.vip++;
    fm.customers++;
    res.xp = (firstTry ? 5 : solved ? 2 : 1) + (p.vip && firstTry ? 5 : 0) + (p.ahead && firstTry ? 2 : 0);
    res.ups = F.addXp(fm, res.xp, grade);
    return res;
  };

  MQ.farm = F;
})();
</script>
  <script>
// Saved progress, one profile per child, in localStorage on this device.
//   math-expedition-profiles   → { active, order: [ids] }
//   math-expedition-p-<id>     → that child's whole state (grade, progress, crystals, stats, farm…)
// Profiles never share data: switching profile swaps the whole state object.
// When the family is connected to the cloud (js/cloud.js), every change is reported through S.onChange
// and changes from other devices come back through S.applyRemote / S.removeRemote.
(function () {
  const MQ = (globalThis.MQ = globalThis.MQ || {});
  const INDEX = 'math-expedition-profiles';
  const PKEY = (id) => 'math-expedition-p-' + id;
  const OLD = 'math-expedition-v1'; // single-player save from the first version

  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const fresh = (grade = 'g2') => ({
    v: 1,
    id: newId(),
    grade,
    name: '',
    companion: '🦊',
    buddyName: 'Pip',
    created: MQ.U.dateKey(),
    lastPlayed: '',
    crystals: 0,
    xp: 0,
    levels: {}, // '<world>-<i>': { stars }
    creatures: {}, // id: { got, from }
    badges: {}, // id: date
    eggsHatched: 0,
    dragons: {}, // id: { name, at, seen } — a hatched dragon's name, right answers when it hatched, growth stage already celebrated
    buddy: '', // a creature chosen as the expedition buddy ('' = the companion picked at the start)
    stats: { attempts: 0, correct: 0, bestStreak: 0, topics: {}, d5: 0, lightning60: 0, lightning120: 0, endlessBest: 0, fixed: 0 },
    daily: { last: '', streak: 0, best: 0 },
    days: {}, // 'YYYY-MM-DD': { a, c } — answers and first-try right answers, kept for two years
    months: {}, // 'YYYY-MM': { topic: [answers, right] } — long-term accuracy per topic
    topicDays: {}, // 'YYYY-MM-DD': { topic: [answers, right] } — accuracy per topic by day, kept for about half a year
    mistakes: [],
    review: {}, // 'topic|d': { topic, d, box, due, miss, last } — mistakes to practice again (see S.miss / S.hit)
    goal: { perDay: 0, days: 5 }, // daily goal set by a grown-up: problems per day (0 = off), days per week
    tips: {}, // topic: date a strategy tip was last shown
    tests: { checks: [], contests: [] }, // Placement Check and mock contest results (newest last)
    seen: {}, // test-prep topic: recently shown question keys (oldest first), so retakes bring new questions
    nnatDays: {}, // 'YYYY-MM-DD': NNAT-3 practice puzzles answered that day (the GATE plan counts practice days)
    trainer: { topics: MQ.track(grade).core.slice(0, 3), diff: 'auto', mode: 'endless' },
    settings: { sound: true, unlockAll: false, readAloud: grade === 'k', voice: true },
  });

  function merge(base, saved) {
    for (const k of Object.keys(saved)) {
      if (saved[k] && typeof saved[k] === 'object' && !Array.isArray(saved[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) merge(base[k], saved[k]);
      else base[k] = saved[k];
    }
    return base;
  }
  const get = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked: play without saving */ } };
  const del = (k) => { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } };
  const readProfile = (id) => { const raw = get(PKEY(id)); return raw ? merge(fresh(raw.grade), raw) : null; };

  const S = {};
  let index = { active: null, order: [] };
  let memory = {}; // fallback when storage is blocked
  const listeners = [];
  S.onChange = (fn) => listeners.push(fn);
  const changed = (type, id, st) => listeners.forEach((fn) => { try { fn(type, id, st); } catch (e) { /* a sync problem must never break the game */ } });
  const stamp = (st) => { st.rev = Math.max(Date.now(), (st.rev || 0) + 1); };

  S.init = () => {
    index = get(INDEX) || { active: null, order: [] };
    const old = get(OLD);
    if (old && !index.order.length) { // migrate the first version's single save into a 2nd-grade profile
      const st = merge(fresh('g2'), old);
      st.id = newId();
      st.grade = 'g2';
      put(PKEY(st.id), st);
      index = { active: st.id, order: [st.id] };
      put(INDEX, index);
      del(OLD);
    }
    index.order = index.order.filter((id) => get(PKEY(id)) || memory[id]);
    MQ.state = null;
    return index;
  };
  S.profiles = () => index.order.map((id) => readProfile(id) || memory[id]).filter(Boolean);
  S.lastActive = () => index.active;
  S.open = (id) => {
    const st = readProfile(id) || memory[id];
    if (!st) return null;
    MQ.state = st;
    MQ.playerName = st.name;
    index.active = id;
    put(INDEX, index);
    return st;
  };
  S.create = ({ name, grade, companion, buddyName }) => {
    const st = fresh(grade);
    Object.assign(st, { name, companion, buddyName });
    index.order.push(st.id);
    memory[st.id] = st;
    MQ.state = st;
    S.save();
    return S.open(st.id);
  };
  // Grown-up preview: the app plays on a copy of the child's profile with every world open, and nothing is saved
  // (no storage, no cloud upload, no unfinished tests). Ending the preview reloads the real profile.
  S.preview = false;
  S.startPreview = () => {
    if (!MQ.state || S.preview) return MQ.state;
    const copy = JSON.parse(JSON.stringify(MQ.state));
    copy.settings.unlockAll = true;
    S.preview = true;
    MQ.state = copy;
    return copy;
  };
  S.endPreview = () => {
    if (!S.preview) return MQ.state;
    S.preview = false;
    const id = MQ.state && MQ.state.id;
    MQ.state = null;
    return id ? S.open(id) : null;
  };

  // Unfinished tests (Placement Check, mock contests), one per kind, kept on this device for each child.
  const PAUSE = (id) => 'math-expedition-pause-' + id;
  S.paused = (kind) => (!S.preview && MQ.state && (get(PAUSE(MQ.state.id)) || {})[kind]) || null;
  S.setPaused = (kind, data) => {
    if (!MQ.state || S.preview) return;
    const all = get(PAUSE(MQ.state.id)) || {};
    all[kind] = data;
    put(PAUSE(MQ.state.id), all);
  };
  S.clearPaused = (kind) => {
    if (!MQ.state || S.preview) return;
    const all = get(PAUSE(MQ.state.id)) || {};
    if (!(kind in all)) return;
    delete all[kind];
    Object.keys(all).length ? put(PAUSE(MQ.state.id), all) : del(PAUSE(MQ.state.id));
  };
  // The latest test of each kind with every question as it was shown (pictures and all the answers), for the review.
  // Kept on this device only: too big to sync (an NNAT-3 practice test is about 340 KB). The test just finished is
  // also kept in memory, so it can be reviewed even when storage is full or in the grown-up preview.
  const FULL = (id) => 'math-expedition-full-' + id;
  let lastFull = null;
  S.setFull = (kind, resId, items) => {
    lastFull = { id: resId, items };
    if (!MQ.state || S.preview) return;
    const all = get(FULL(MQ.state.id)) || {};
    all[kind] = { id: resId, items };
    put(FULL(MQ.state.id), all);
  };
  S.full = (resId) => {
    if (lastFull && lastFull.id === resId) return lastFull.items;
    const all = (MQ.state && !S.preview && get(FULL(MQ.state.id))) || {};
    const x = Object.values(all).find((v) => v && v.id === resId);
    return x ? x.items : null;
  };
  S.remove = (id) => {
    del(PKEY(id));
    del(PAUSE(id));
    del(FULL(id));
    delete memory[id];

    if (index.active === id) index.active = null;

    if (MQ.state && MQ.state.id === id) MQ.state = null;

  };
  S.update = (id, fields) => { // change another profile's name / grade from the grown-ups page
    if (S.preview) return;
    const st = MQ.state && MQ.state.id === id ? MQ.state : readProfile(id);
    if (!st) return;
    Object.assign(st, fields);
    stamp(st);
    put(PKEY(id), st);
    memory[id] = st;
    changed('save', id, st);
  };
  S.save = () => {
    const st = MQ.state;
    if (!st || S.preview) return;
    stamp(st);
    memory[st.id] = st;
    put(PKEY(st.id), st);
    changed('save', st.id, st);
  };
  S.reset = () => { // erase one child's progress, keep who they are
    const { id, name, grade, companion, buddyName } = MQ.state;
    MQ.state = Object.assign(fresh(grade), { id, name, grade, companion, buddyName, resetAt: Date.now() });
    del(PAUSE(id));
    del(FULL(id));
    lastFull = null;
    S.save();
  };

  S.importCode = (code) => {
    const obj = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if (!obj || obj.v !== 1) throw new Error('This is not a Math Expedition save code.');
    const st = merge(fresh(obj.grade || 'g2'), obj);
    if (!st.id || !index.order.includes(st.id)) { st.id = st.id || newId(); index.order.push(st.id); }

  };

  // Combine two copies of the same child's progress (e.g. played offline on two devices).
  // Nothing earned is lost: creatures, badges and stars are united; counters keep the higher value;
  // spendable things (crystals) and settings come from the most recent copy.

    const at = list.indexOf(key);

  };
  S.mergeProfiles = (a, b) => {
    if (!a) return b;
    if (!b) return a;
    const [nw, old] = (a.rev || 0) >= (b.rev || 0) ? [a, b] : [b, a];
    if ((nw.resetAt || 0) > (old.rev || 0)) return JSON.parse(JSON.stringify(nw)); // progress was erased on purpose
    const out = JSON.parse(JSON.stringify(nw));
    out.creatures = Object.assign({}, old.creatures, nw.creatures);
    out.badges = Object.assign({}, old.badges, nw.badges);
    out.levels = Object.assign({}, old.levels);
    for (const [k, v] of Object.entries(nw.levels || {})) out.levels[k] = { stars: Math.max(v.stars || 0, (old.levels[k] || {}).stars || 0) };
    const max = (x, y) => Math.max(x || 0, y || 0);
    out.xp = max(nw.xp, old.xp);
    out.eggsHatched = max(nw.eggsHatched, old.eggsHatched);
    // dragons: hatched on either device; the newer copy names them, growth counts from the earliest hatch
    out.dragons = Object.assign({}, old.dragons || {});
    for (const [id, v] of Object.entries(nw.dragons || {})) {
      const o = out.dragons[id];
      out.dragons[id] = o ? Object.assign({}, v, { at: Math.min(v.at || 0, o.at || 0), seen: max(v.seen, o.seen) }) : v;
    }

    for (const [t, v] of Object.entries(old.stats.topics || {})) if (!out.stats.topics[t] || out.stats.topics[t].a < v.a) out.stats.topics[t] = v;
    out.days = Object.assign({}, old.days);
    for (const [d, v] of Object.entries(nw.days || {})) out.days[d] = { a: max(v.a, (old.days[d] || {}).a), c: max(v.c, (old.days[d] || {}).c) };
    if ((old.daily.last || '') > (nw.daily.last || '')) out.daily = Object.assign({}, old.daily);
    out.daily.best = max(nw.daily.best, old.daily.best);
    if ((old.lastPlayed || '') > (out.lastPlayed || '')) out.lastPlayed = old.lastPlayed;
    // test results from both devices are kept (each result has its own id, which starts with a timestamp)
    out.tests = Object.assign({}, nw.tests);
    for (const key of new Set([...Object.keys(old.tests || {}), ...Object.keys(nw.tests || {})])) {
      const both = [...((old.tests || {})[key] || []), ...((nw.tests || {})[key] || [])];
      if (!both.every((x) => x && x.id)) continue;
      const byId = {};
      for (const r of both) byId[r.id] = r;

    S.miss(p.topic, p.d);
    return null;
  };

    return svg(sky + ground + (id === 'railway' ? river : '') + draw(D, built, building, k, ghost), id === 'castle' ? castleDefs(k) : '');

  <script>
// Sunny Farm pictures: the farm scene (sky, garden beds, pens with animals walking around, a yard with the stand and
// decorations), the market stall above each customer, and small animations (things flying to the basket, coins
// flying to the money, a night passing). Made of emoji, CSS and a few inline SVGs: no image files.
// Everything moving is turned off when the device asks for reduced motion.
(function () {
  const MQ = globalThis.MQ, F = MQ.farm, U = MQ.U;
  const esc = U.esc;
  const S = {};
  const reduced = () => typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  S.reduced = reduced;

  // ---------------------------------------------------------------- sprites without a good emoji
  const SVG = {
    windmill: `<svg class="sp windmill" viewBox="0 0 60 92" aria-hidden="true"><polygon points="22,40 38,40 45,90 15,90" fill="#f1e4c6" stroke="#8a6b46" stroke-width="2"/><rect x="25" y="70" width="10" height="20" rx="4" fill="#8a6b46"/><rect x="26" y="52" width="8" height="8" fill="#9fd3f0" stroke="#8a6b46" stroke-width="1.5"/><g class="blades">${[0, 90, 180, 270].map((r) => `<g transform="rotate(${r} 30 40)"><rect x="28.5" y="4" width="3" height="36" fill="#7a5532"/><rect x="31.5" y="6" width="9" height="26" fill="#fffaf0" stroke="#7a5532" stroke-width="1.2"/></g>`).join('')}</g><circle cx="30" cy="40" r="3.5" fill="#5b3d22"/></svg>`,
    barn: `<svg class="sp barn" viewBox="0 0 80 66" aria-hidden="true"><polygon points="2,28 40,3 78,28" fill="#8e2b23"/><rect x="8" y="26" width="64" height="38" fill="#cf4330" stroke="#8e2b23" stroke-width="2"/><rect x="28" y="36" width="24" height="28" fill="#fff4e6" stroke="#8e2b23" stroke-width="2"/><path d="M28 36 L52 64 M52 36 L28 64" stroke="#8e2b23" stroke-width="2.5"/><rect x="34" y="13" width="12" height="9" fill="#fff4e6" stroke="#8e2b23" stroke-width="2"/></svg>`,
    hive: `<svg class="sp hive" viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="31" rx="15" ry="7" fill="#e9a425"/><ellipse cx="20" cy="22" rx="12.5" ry="6.5" fill="#f2b83a"/><ellipse cx="20" cy="14" rx="9" ry="5.5" fill="#f7c95a"/><ellipse cx="20" cy="7.5" rx="5" ry="4" fill="#fad77a"/><ellipse cx="20" cy="31" rx="4" ry="3.5" fill="#6b4210"/></svg>`,
  };
  // The shop and the scene use these pictures for the windmill and the barn.
  S.icon = (id, e) => (SVG[id] ? `<span class="spi">${SVG[id]}</span>` : e);

  // Animals that are drawn from the side (they turn around when they walk the other way).
  const SIDE = new Set(['🐔', '🐐', '🐑', '🐄', '🦆', '🐖', '🦙', '🐎', '🐓', '🦃', '🦌', '🐟']);
  const WALK = { pony: '🐎' }; // a whole pony instead of the 🐴 head
  // Where each decoration stands: sky (floats), hill (on the horizon, left %), yard (in front, left %).
  const SPOTS = {
    rainbow: ['sky'], balloon: ['sky'], birdhouse: ['sky'],
    tree: ['hill', 3], greenhouse: ['hill', 24], barn: ['hill', 58], cat: ['hill', 66], windmill: ['hill', 82],
    fence: ['fence'], scarecrow: ['bed'],
    flowers: ['yard', 30], pond: ['yard', 46], fountain: ['yard', 64], golden: ['yard', 78], dog: ['run'], tractor: ['drive'],
    farmhouse: ['hill', 38], helicopter: ['sky'], ufo: ['sky'], dragon: ['sky'], fireworks: ['sky'],
    // the fun park below the yard (a row that wraps, so it never gets crowded)
    carousel: ['park'], ferris: ['park'], circus: ['park'], telescope: ['park'], rocket: ['park'], island: ['park'], sailboat: ['park'],
  };

  // ---------------------------------------------------------------- the farm scene
  function bedHtml(b, i) {
    const s = F.cropStage(b);
    const stars = F.bedStars(b), ups = `${stars ? `<span class="bstars">${'★'.repeat(stars)}</span>` : ''}${F.bedWater(b) ? '<span class="bwater">💧</span>' : ''}`;
    const glass = (F.bedGlass(b) ? ' glass' : '') + (fmNow && F.charmOn(fmNow, 'sun') ? ' sunny' : ''); // sunny: the Sunshine Potion doubles harvests
    if (s === 'empty') return `<button class="fbed soil empty${glass}" data-act="fBed" data-arg="${i}" aria-label="Empty garden bed: plant seeds"><span class="plus">＋</span>${ups}<span class="flabel">Plant</span></button>`;
    const it = F.ITEMS[b.c], left = F.cropDays(b) - b.g, y = F.cropYield(b, fmNow);
    const n = Math.min(y, 4); // the label says how many; four fit on a small bed
    const sprite = s === 'ready' ? it.e : s === 'seed' ? '🌱' : '🌿';
    const plants = Array.from({ length: s === 'ready' ? n : 3 }, (_, k) => `<i style="--k:${k}">${sprite}</i>`).join('');
    const label = s === 'ready' ? `Pick ${y}!` : `${left} ${left === 1 ? 'day' : 'days'}`;
    return `<button class="fbed soil ${s}${glass}" data-act="fBed" data-arg="${i}" aria-label="${esc(it.many)}: ${s === 'ready' ? 'ripe, tap to pick' : `ready in ${label}`}"><span class="plants">${plants}</span>${ups}${b.again ? '<span class="bagain" title="Second harvest">🔁</span>' : ''}<span class="flabel">${s === 'ready' ? label : it.e + ' ' + label}</span></button>`;
  }
  function penHtml(p, i) {
    if (!p.a) return `<button class="fpen pasture empty" data-act="go" data-arg="farm:shop" aria-label="Empty pen: buy an animal in the shop"><span class="plus">＋</span><span class="flabel">Buy an animal</span></button>`;
    const a = F.ANIMALS[p.a], sg = F.animalStage(p), got = F.penLoot(p), ready = F.penReady(p);
    // a Mythic Feed week: the animals are drawn as their mythic selves
    const myth = fmNow && F.mythOn(fmNow, p.a) && MQ.mythArt ? F.MYTHS[p.a] : null;
    const state = ready ? 'ready' : p.fed ? 'fed' : 'hungry';
    const age = ['Baby', 'Young', 'Grown-up'][sg];
    const many = F.penCount(p);
    const chip = ready ? got.map(([id, n]) => `${F.ie(id)}×${n}`).join(' ') : p.fed ? '❤️' : `🌾 ${F.penEat(p)}`;
    const loot = ready ? `<span class="loot">${got.flatMap(([id, n]) => Array(Math.min(n, 5)).fill(F.ie(id))).slice(0, 5).map((e, k) => `<i style="--k:${k}">${e}</i>`).join('')}</span>` : '';
    let who;
    if (p.a === 'bees') {
      who = `<span class="hivebox">${SVG.hive}</span>${Array.from({ length: Math.min(6, (sg + 1) * many) }, (_, k) => `<span class="bee" style="--k:${k}">${myth ? MQ.starBee() : '🐝'}</span>`).join('')}`;
    } else if (myth) {
      const pic = MQ.mythArt(p.a, { aura: false });
      who = Array.from({ length: many }, (_, k) => {
        const t = 7 + ((i * 3 + k * 2) % 5);
        return `<span class="walker side myw w${k}" style="--t:${t}s;--dl:-${(i * 2.3 + k * 3.1) % t}s"><span class="bob">${pic}</span></span>`;
      }).join('');
    } else if (p.a === 'fishpond') {
      who = Array.from({ length: Math.min(5, sg + many) }, (_, k) => `<span class="walker side fishy" style="--t:${6 + k * 2}s;--dl:-${k * 1.7}s;bottom:${14 + (k % 3) * 22}px"><span class="bob">🐟</span></span>`).join('');
    } else {
      const e = sg === 0 ? a.baby : WALK[p.a] || a.e;
      // each animal walks at its own pace and height, so two or three in one pen don't overlap
      who = Array.from({ length: many }, (_, k) => {
        const t = 7 + ((i * 3 + k * 2) % 5);
        return `<span class="walker ${SIDE.has(e) ? 'side' : ''} w${k}" style="--t:${t}s;--dl:-${(i * 2.3 + k * 3.1) % t}s"><span class="bob">${e}</span></span>`;
      }).join('');
    }
    const label = `${many > 1 ? many + ' × ' : ''}${myth ? myth.name : a.name}, ${age.toLowerCase()}: ${ready ? `${got.map(([id, n]) => `${n} ${n === 1 ? F.ITEMS[id].name : F.ITEMS[id].many}`).join(' and ')} to collect` : p.fed ? 'fed' : `hungry, eats ${F.penEat(p)} feed`}`;
    const sparkle = p.a === 'unicorn' || myth ? '<span class="twinkles"><i>✨</i><i>✨</i><i>✨</i></span>' : '';
    const left = myth ? fmNow.charms.myth.until - fmNow.day : 0;
    return `<button class="fpen pasture ${state} s${sg} a-${p.a}${myth ? ' myth' : ''}" data-act="fPen" data-arg="${i}" aria-label="${esc(label)}">${who}${sparkle}${loot}${myth ? `<span class="mytag" title="${esc(myth.many)}: ${left} ${left === 1 ? 'night' : 'nights'} left">🌟 ${left}</span>` : ''}<span class="trough ${p.fed ? 'full' : ''}"></span>${(p.u || 0) >= 3 ? '<span class="cozy" title="Cozy barn">🛖</span>' : ''}<span class="pchip">${chip}</span><span class="flabel">${age}${many > 1 ? ' × ' + many : ''}</span></button>`;
  }
  function workHtml(id) {
    const W = F.WORKS[id], w = fmWorks[id];
    // a small house: the workshop sign, and a badge with what it is doing
    let badge, state, label;
    if (w.ready) { state = 'ready'; badge = F.ITEMS[w.out].e; label = `take ${w.ready}`; }
    else if (w.r !== null && w.r !== undefined) {
      const r = W.recipes[w.r], left = r.days - w.g;
      state = 'busy'; badge = `🌙${left}`; label = `ready in ${left} ${left === 1 ? 'night' : 'nights'}`;
    } else { state = 'idle'; badge = '＋'; label = 'make something'; }
    return `<button class="fwork ${state}" data-act="fWork" data-arg="${id}" title="${esc(W.name)}" aria-label="${esc(W.name)}: ${label}"><span class="wroof"></span><span class="wbig">${W.e}</span>${state === 'busy' ? '<span class="smoke">💨</span>' : ''}<span class="wbadge">${badge}</span></button>`;
  }
  // The Big Dreams built so far stand behind the farm (tap one to see Big Dreams).
  function dreamland(fm) {
    if (!fm.dream || !MQ.dreamArt) return '';
    const shown = F.DREAMS.map((d, k) => [d, F.dreamBuilt(fm, k), k === fm.dream.p && fm.dream.b]).filter(([, n, b]) => n || b);
    if (!shown.length) return '';
    return `<div class="dreamland">${shown.map(([d, n, b]) => `<button class="dl t-${d.id} ${n >= d.stages.length ? 'done' : ''}" data-act="go" data-arg="farm:dreams" aria-label="${esc(d.name)}: ${n} of ${d.stages.length} built">${MQ.dreamArt(d.id, n, { building: b, ghost: false })}</button>`).join('')}</div>`;
  }
  let fmWorks = {}, fmNow = null;
  // The merchant's treasures live on the farm: the goose and the sheep in the yard, the musician by the stand,
  // the fairy over the pens, the watering can by the beds.
  const treasures = (fm) => Object.keys(fm.treasure || {}).filter((id) => fm.treasure[id] && MQ.treasureArt).map((id) => `<span class="trs tr-${id}" title="${esc(F.TREASURES[id].name)}">${MQ.treasureArt(id)}</span>`).join('');
  S.farm = (fm, grade) => {
    fmWorks = fm.works || {};
    fmNow = fm;
    const has = (id) => !!fm.owned[id];
    const at = (zone) => Object.keys(fm.owned).filter((id) => F.DECOR[id] && (SPOTS[id] || [])[0] === zone);
    const sky = [];
    if (has('rainbow')) sky.push('<span class="rainbow">🌈</span>');
    if (has('balloon')) sky.push('<span class="balloon">🎈</span>');
    if (has('birdhouse')) sky.push('<span class="bird">🐦</span>');
    if (has('helicopter')) sky.push('<span class="heli">🚁</span>');
    if (has('ufo')) sky.push('<span class="ufo">🛸</span>');
    if (has('dragon')) sky.push('<span class="dragon">🐉</span>');
    if (has('fireworks')) sky.push('<span class="fw f1">🎆</span><span class="fw f2">🎇</span>');
    const hill = at('hill').map((id) => `<span class="deco d-${id}" style="left:${SPOTS[id][1]}%" title="${esc(F.DECOR[id].name)}">${S.icon(id, F.DECOR[id].e)}</span>`).join('');
    const yard = at('yard').map((id) => `<span class="deco d-${id}" style="left:${SPOTS[id][1]}%" title="${esc(F.DECOR[id].name)}">${F.DECOR[id].e}</span>`).join('');
    const park = at('park').map((id) => `<span class="pk d-${id}" title="${esc(F.DECOR[id].name)}">${F.DECOR[id].e}</span>`).join('');
    const works = Object.keys(fmWorks).filter((id) => F.WORKS[id]);
    const stand = F.STANDS[fm.stand], n = F.basketCount(fm);
    return `<section class="scene${F.charmOn(fm, 'sun') ? ' sun-on' : ''}" aria-label="Your farm">
      <div class="sky">
        <span class="sun">☀️</span><span class="cloud c1">☁️</span><span class="cloud c2">☁️</span>${sky.join('')}
        <div class="hills"></div>${hill}${has('fence') ? '<div class="hfence"></div>' : ''}
      </div>
      ${dreamland(fm)}
      <div class="land">
        <div class="beds">${fm.beds.map(bedHtml).join('')}${has('scarecrow') ? '<span class="scarecrow" title="Scarecrow">🧑‍🌾</span>' : ''}</div>
        <div class="pens">${fm.pens.map(penHtml).join('')}</div>
        ${works.length ? `<div class="works">${works.map(workHtml).join('')}</div>` : ''}
        <div class="yard">
          <button class="ystand st${fm.stand}" data-act="fMarket" aria-label="${esc(stand.name)}: open the stand (${n} to sell)"><span class="awn"></span><span class="ye">${stand.e}</span>${n ? `<b class="badge">${n}</b>` : ''}</button>
          ${yard}${fm.helper && fm.helper.hired && fm.helper.on ? `<span class="farmhand" title="Farmhand ${F.HELPER.name}">🧑‍🌾</span>` : ''}${has('dog') ? '<span class="dog">🐕</span>' : ''}${has('tractor') ? '<span class="tractor">🚜</span>' : ''}${treasures(fm)}${F.charmOn(fm, 'clover') && MQ.charmArt ? `<span class="trs tr-clover" title="Lucky Clover">${MQ.charmArt('clover')}</span>` : ''}${F.merchantHas(fm) ? `<button class="trs wagon" data-act="fMerchant" aria-label="${esc(F.MERCHANT.name)}'s wagon">${MQ.wagonArt()}</button>` : ''}
        </div>
        ${park ? `<div class="park">${park}</div>` : ''}
      </div>
    </section>`;
  };

  // ---------------------------------------------------------------- the stall above a customer
  // mode: market (your stand), jobs (the big market), pay (the farm shop, where the child is the buyer).
  S.stall = ({ mode, stand = 0, seller, shopper, goods = '', vip = false }) => `<div class="stall st${stand} m-${mode} ${vip ? 'vip' : ''}" aria-hidden="true">
      <div class="awning"></div>
      <div class="stall-in">
        <span class="seller">${seller}</span>
        <div class="counter"><span class="goods" id="goods">${goods}</span><span class="cashbox" id="cashbox">💰</span></div>
        <span class="shopper ${vip ? 'vip' : ''}" id="shopper"><span>${shopper}</span></span>
      </div>
    </div>`;
  S.goods = (sale) => Object.entries(sale || {}).map(([id, n]) => Array.from({ length: Math.min(n, 6) }, () => `<i>${F.ie(id)}</i>`).join('')).join('');

  // ---------------------------------------------------------------- animations
  const box = (x) => (!x ? null : x.getBoundingClientRect ? x.getBoundingClientRect() : x);
  // Something flies from one place to another along an arc (a harvested carrot to the basket, coins to the money).
  S.fly = (html, from, to, { delay = 0, dur = 650, size = '1.9rem', land } = {}) => {
    const a = box(from), b = box(typeof to === 'string' ? document.querySelector(to) : to);
    if (reduced() || !a || !b || !document.body.animate) { if (land) land(); return; }
    const el = document.createElement('div');
    el.className = 'flyer';
    el.style.fontSize = size;
    el.innerHTML = html;
    el.style.left = a.left + a.width / 2 + 'px';
    el.style.top = a.top + a.height / 2 + 'px';
    document.body.appendChild(el);
    const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
    const anim = el.animate([
      { transform: 'translate(-50%, -50%) scale(0.8)', opacity: 0 },
      { transform: 'translate(-50%, -50%) scale(1.1)', opacity: 1, offset: 0.1 },
      { transform: `translate(calc(-50% + ${dx / 2}px), calc(-50% + ${dy / 2 - 70}px)) scale(1.25)`, offset: 0.55 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.55)`, opacity: 0.9 },
    ], { duration: dur, delay, easing: 'ease-in-out', fill: 'both' });
    anim.onfinish = () => { el.remove(); if (land) land(); };
  };
  // A few things fly one after another.
  S.flyMany = (html, n, from, to, opts = {}) => { for (let k = 0; k < n; k++) S.fly(html, from, to, Object.assign({}, opts, { delay: (opts.delay || 0) + k * 110 })); };
  // Hearts (or anything) float up from a spot.
  S.burst = (el, html = '❤️', n = 3) => {
    const r = box(el);
    if (reduced() || !r || !document.body.animate) return;
    for (let k = 0; k < n; k++) {
      const d = document.createElement('div');
      d.className = 'flyer';
      d.innerHTML = html;
      d.style.left = r.left + r.width * (0.3 + 0.2 * k) + 'px';
      d.style.top = r.top + r.height * 0.4 + 'px';
      document.body.appendChild(d);
      d.animate([{ transform: 'translate(-50%, 0) scale(0.6)', opacity: 0 }, { transform: 'translate(-50%, -20px) scale(1)', opacity: 1, offset: 0.25 }, { transform: `translate(calc(-50% + ${(k - 1) * 14}px), -70px) scale(1.1)`, opacity: 0 }], { duration: 900, delay: k * 120, easing: 'ease-out', fill: 'both' }).onfinish = () => d.remove();
    }
  };
  // A short label floats up from a spot: "+3 🥚" where the eggs were picked up, "−2 🌾" at the trough.
  S.floatText = (el, text, { delay = 0, minus = false } = {}) => {
    const r = box(el);
    if (!r) return;
    const d = document.createElement('div');
    d.className = 'flyer ftext' + (minus ? ' minus' : '');
    d.innerHTML = text; // our own text: a number and an icon (a mythic thing's icon is a glowing <i>)
    d.style.left = r.left + r.width / 2 + 'px';
    d.style.top = r.top + r.height * 0.35 + 'px';
    document.body.appendChild(d);
    if (reduced() || !document.body.animate) { setTimeout(() => d.remove(), 1200); return; }
    d.animate([{ transform: 'translate(-50%, 0) scale(0.7)', opacity: 0 }, { transform: 'translate(-50%, -14px) scale(1.15)', opacity: 1, offset: 0.2 }, { transform: 'translate(-50%, -26px) scale(1)', opacity: 1, offset: 0.7 }, { transform: 'translate(-50%, -48px) scale(1)', opacity: 0 }], { duration: 1300, delay, easing: 'ease-out', fill: 'both' }).onfinish = () => d.remove();
  };
  // A number counts up (or down) to its new value: the money pill after a sale.
  S.roll = (el, from, to, show, dur = 650) => {
    if (!el) return;
    if (reduced() || from === to || typeof requestAnimationFrame === 'undefined') { el.textContent = show(to); return; }
    const t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / dur);
      el.textContent = show(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))));
      if (k < 1 && el.isConnected) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
  // The night passes: the screen goes dark with a moon and stars, then the sun comes up.
  // dark() runs in the middle (redraw the farm there), done() at the end.
  S.night = (dark, done) => {
    if (reduced() || !document.body.animate) { dark(); done(); return; }
    const o = document.createElement('div');
    o.className = 'nightfx';
    o.innerHTML = '<span class="moon">🌙</span>' + Array.from({ length: 14 }, (_, k) => `<i style="left:${(k * 37) % 100}%;top:${(k * 23) % 60 + 5}%;animation-delay:${(k % 5) * 0.15}s">✦</i>`).join('') + '<span class="zzz">Z z z</span><span class="sunup">☀️</span>';
    document.body.appendChild(o);
    o.animate([{ opacity: 0 }, { opacity: 1, offset: 0.25 }, { opacity: 1, offset: 0.7 }, { opacity: 0 }], { duration: 2400, easing: 'ease-in-out', fill: 'both' }).onfinish = () => { o.remove(); done(); };
    setTimeout(dark, 900);
  };

  MQ.farmScene = S;
})();
</script>
  <script>

  function levelUp(ups) {

  function tipLine() { return `<div class="buddy small"><span class="buddy-e">${MQ.face(st())}</span><div class="bubble">${esc(MQ.buddyName(st()))}: ${tipText()}</div></div>`; }
  function tipText() {
    const f = fm();
    const cheapest = Math.min(...Object.entries(F.CROPS).filter(([, c]) => c.lv <= F.level(f.xp).level).map(([id]) => F.seedPrice(id, grade())));
    const hungry = f.pens.filter((p) => p.a && !p.fed);
    let t;
    if (F.bankDue(f) > 0) t = 'It’s bank day! Your savings grew. Go to the bank to collect the interest.';
    else if (F.depositReady(f)) t = 'Your locked deposit unlocked! Go to the bank to collect it. 🔓';
    else if (F.canBuild(f, grade())) t = 'You saved enough in the bank for your Big Dream! Pay the builders 🏗️';
    else if (F.merchantHas(f) && F.merchantNights(f.day) <= 1) t = `${F.MERCHANT.name} the traveling merchant leaves ${F.merchantNights(f.day) ? 'tomorrow night' : 'tonight'}! Tap his wagon.`;

    else if (F.basketCount(f)) t = 'Your basket is full of good things. Open the stand and sell them!';

  }
  // Grown-up preview: choose which money problems the customers bring (the level stays where it is set).
  function pvTiers() {

    return `<button class="fgoal" data-act="go" data-arg="farm:shop" aria-label="Saving goal">

  }

      <h2>🧺 Basket</h2>
