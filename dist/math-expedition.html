.rhint { margin: 0 0 8px; }
/* one question of the latest test, reviewed: nothing in it can be tapped */
.qreview { display: flex; flex-direction: column; gap: 12px; }
.qreview .pcard .ptext, .qreview .pcard .pvis { pointer-events: none; }
.qreview .pmeta b { font-family: var(--body); }
.qr-ok { color: var(--good); }
.qr-no { color: var(--bad); }
.qr-blank { color: var(--ink-soft); }
.choices.qrev .choice { position: relative; cursor: default; }
.choices.qrev .choice:active { transform: none; }
.choices.qrev .choice.nope { opacity: 1; }
.choices.qrev .choice.right .letter { background: var(--good); color: #fff; }
.choices.qrev .choice.nope .letter { background: var(--bad); color: #fff; }
.choices.qrev .qtag { margin-left: auto; font-family: var(--body); font-size: 0.8rem; font-weight: 900; white-space: nowrap; }
.choices.qrev.pics .qtag { margin: 4px 0 0; }
.qr-line { font-size: 1.05rem; text-align: center; color: var(--ink); }
.qr-explain { background: var(--sun-soft); border-radius: 14px; padding: 10px 12px; font-weight: 700; }

/* ================= Math Kangaroo style contest ================= */
.contest { display: flex; flex-direction: column; gap: 12px; }
.ctnav { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; }
.ctdot { aspect-ratio: 1; min-width: 0; border: 0; border-radius: 9px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); font-weight: 900; font-size: 0.78rem; color: var(--ink-soft); padding: 0; position: relative; }
.ctdot.p4 { box-shadow: inset 0 0 0 2px #c9cff5; }
.ctdot.p5 { box-shadow: inset 0 0 0 2px #f2c6ab; }
.ctdot.ans { background: #dfe3ff; color: #333c7a; }
.ctdot.cur { box-shadow: inset 0 0 0 3px var(--ink); color: var(--ink); }
.ctdot.flag::after { content: ''; position: absolute; top: 2px; right: 2px; width: 7px; height: 7px; border-radius: 50%; background: var(--coral); }
.choices.ct { grid-template-columns: 1fr; gap: 8px; }
.choices.ct .choice { display: flex; align-items: center; gap: 12px; text-align: left; min-height: 54px; font-size: 1.2rem; padding: 8px 14px; }
.choices.ct.pics { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
.choices.ct.pics.n4 { grid-template-columns: 1fr 1fr; }
.choices.ct.pics .choice { flex-direction: column; justify-content: center; min-height: 110px; }
.choices.ct .letter { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #eef1f6; font-family: var(--display); font-weight: 600; font-size: 1rem; color: var(--ink-soft); }
.choices.ct .choice.sel .letter { background: #5b63c9; color: #ffffff; }
.choices.ct .copt svg { width: auto; max-width: 100%; height: 64px; }
.ctbar { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.ctbar .btn { flex: 1; min-width: 96px; }
.kgtypes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.sumgrid.three { grid-template-columns: repeat(3, 1fr); }
.column-inline { font-family: var(--display); font-size: clamp(1.2rem, 6vw, 1.6rem); font-weight: 600; text-align: center; margin: 8px 0; letter-spacing: 0.02em; white-space: nowrap; }
.emojieq { white-space: normal; }
@media (max-width: 480px) {
  .ctnav { grid-template-columns: repeat(8, 1fr); }
  .sumgrid.three { grid-template-columns: repeat(3, 1fr); }
}

/* ===== CogAT-style pictures ===== */
.matrix2, .analogy { display: grid; grid-template-columns: auto auto auto; grid-template-rows: auto auto; align-items: center; justify-items: center; gap: 6px 10px; margin: 10px auto; width: max-content; max-width: 100%; }
.matrix2 b, .analogy b { font-family: var(--display); font-size: 1.4rem; color: var(--ink-soft); }
.matrix2 svg.vis { width: 76px; height: 76px; }
.matrix2 .mq, .analogy .mq { width: 76px; height: 76px; display: grid; place-items: center; border: 3px dashed #b9c4d0; border-radius: 10px; font-family: var(--display); font-size: 2rem; color: #ff6b5b; background: #fbfcfe; }
.analogy .abox { min-width: 76px; min-height: 76px; display: grid; place-items: center; background: #ffffff; border: 2px solid #d6e0e6; border-radius: 10px; padding: 4px; }
.analogy.emo .abox { font-size: 2.6rem; line-height: 1; }
.analogy.emo:not(:has(b)) { grid-template-columns: repeat(3, auto); grid-template-rows: auto; }
.cluster { display: inline-grid; grid-template-columns: repeat(3, 1fr); gap: 1px; font-size: 1.15rem; line-height: 1.1; font-style: normal; }
.cluster i { font-style: normal; }
.cluster.c1 { grid-template-columns: 1fr; font-size: 1.8rem; }
.cluster.c2, .cluster.c4 { grid-template-columns: repeat(2, 1fr); }
.figrow { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 10px 0; }
.figrow svg.vis { width: 70px; height: 70px; }
.foldsteps { display: flex; align-items: flex-start; justify-content: center; gap: 6px; margin: 10px 0; }
.foldsteps > div { display: grid; justify-items: center; gap: 4px; max-width: 110px; text-align: center; }
.foldsteps svg.vis { width: 88px; height: 88px; }
.foldsteps small { font-size: 0.72rem; color: var(--ink-soft); line-height: 1.2; }
.foldsteps b { align-self: center; margin-top: -18px; font-size: 1.2rem; color: var(--ink-soft); }
svg.vis.abacus { max-height: 160px; }
.choices.pics .choice svg.abacus, .choices.ct .copt svg.abacus { width: auto; height: 96px; }
.choices.pics .choice svg.sheet { width: 80px; height: 80px; }
.cemo { font-size: 2.4rem; line-height: 1; }
.choices .choice .cluster { font-size: 1.05rem; }
.stat.timer.soft { color: var(--ink-soft); }
@media (max-width: 380px) {
  .matrix2 svg.vis, .matrix2 .mq, .analogy .mq, .analogy .abox { width: 62px; height: 62px; min-width: 62px; min-height: 62px; }
  .analogy.emo .abox { font-size: 2.1rem; }
  .foldsteps svg.vis { width: 74px; height: 74px; }
}

/* Unfinished test on a test card */
.tc-resume { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; padding: 10px 12px; border-radius: 14px; background: #fff6e0; box-shadow: inset 0 0 0 2px #ffcf6b; }
.tc-resume span { font-size: 0.95rem; }

/* ⓘ: what is this test? */
.tc-head > div { flex: 1; min-width: 0; }
.infobtn { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0; padding: 0; background: #eef1ff; color: #4a50a8; box-shadow: inset 0 0 0 2px #b9bef0; font: italic 800 1.05rem Georgia, 'Times New Roman', serif; }
.infobtn:active { transform: scale(0.92); }
.infobox { text-align: left; margin: 8px 0 4px; }
.infobox h3 { font-family: var(--display); font-weight: 600; font-size: 1rem; margin: 12px 0 2px; }
.infobox p { margin: 0; font-size: 0.95rem; line-height: 1.4; }

/* Practice-by-type tiles with a short description */
.tile.type { text-align: left; align-items: flex-start; }
.tile.type small { font-size: 0.8rem; line-height: 1.3; }
.tile .tstat { font-size: 0.8rem; font-weight: 800; color: var(--ink); }

/* Review questions and strategy tips */
.dchip.rv { background: #dcf3e3; color: #23703f; margin-right: 6px; }
.tipcard { background: var(--sun-soft); color: #6b4706; border-radius: 14px; padding: 9px 12px; margin-bottom: 10px; font-weight: 700; font-size: 0.95rem; line-height: 1.35; text-align: left; box-shadow: inset 0 0 0 2px var(--sun); animation: pop 0.4s; }
.tipcard b { margin-right: 4px; }

/* Logic puzzles: numbered clues */
.clues { text-align: left; margin: 8px 0 10px; padding-left: 1.4em; display: flex; flex-direction: column; gap: 4px; font-size: 0.98em; }

/* Home: Fix-it Lab, progress, daily goal */
.t-fixit.hot { box-shadow: inset 0 0 0 3px #3c9d5d, 0 4px 0 #2b7b46; background: #e6f6ec; }
.t-progress { box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 var(--line); }
.goal { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 18px; padding: 10px 14px; box-shadow: inset 0 0 0 2px var(--line); margin: 10px 0 4px; }
.goal .ring { --p: 0; flex: none; width: 62px; height: 62px; border-radius: 50%; display: grid; place-content: center; text-align: center; line-height: 1;
  background: radial-gradient(closest-side, var(--card) 76%, transparent 78%), conic-gradient(var(--teal) calc(var(--p) * 1%), #e3e9ee 0); }
.goal .ring b { font-family: var(--display); font-weight: 600; font-size: 1.2rem; }
.goal .ring small { font-size: 0.68rem; color: var(--ink-soft); font-weight: 800; }
.goal-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.goal-t small { color: var(--ink-soft); font-weight: 800; font-size: 0.8rem; }
.wdots { display: flex; gap: 4px; margin-top: 2px; }
.wdots i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 0.68rem; font-weight: 900; background: #eef2f5; color: var(--ink-soft); }
.wdots i.on { background: var(--teal); color: #ffffff; }
.wdots i.now { box-shadow: 0 0 0 2px var(--ink); }

/* Fix-it Lab */
.fixit { display: flex; flex-direction: column; gap: 14px; }
.fxlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.fx { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 14px; padding: 10px 12px; box-shadow: inset 0 0 0 2px var(--line); }
.fx.due { box-shadow: inset 0 0 0 2px #3c9d5d; }
.fx-ic { font-size: 1.6rem; }
.fx-n { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.fx-n small { color: var(--ink-soft); font-weight: 700; }
.fx-box { display: flex; gap: 4px; }
.fx-box i { width: 14px; height: 14px; border-radius: 50%; background: #e3e9ee; box-shadow: inset 0 0 0 2px #c9d3dc; }
.fx-box i.on { background: #3c9d5d; box-shadow: none; }

/* My Progress */
.progress { display: flex; flex-direction: column; gap: 14px; }
.progtop { display: flex; flex-direction: column; gap: 10px; }
.segs.four { grid-template-columns: repeat(4, 1fr); }
.psel { display: flex; align-items: center; gap: 10px; font-weight: 800; }
.psel .field { padding: 8px 10px; font-size: 1rem; }
.pchart { margin: 6px 0 0; background: var(--card); border-radius: 16px; padding: 8px; box-shadow: inset 0 0 0 1px var(--line); }
.pchart svg { width: 100%; max-width: 460px; height: auto; display: block; margin: 0 auto; }
.pchart figcaption { font-size: 0.78rem; color: var(--ink-soft); font-weight: 700; text-align: center; margin-top: 2px; }
.pchart .cdot:hover circle:last-of-type { r: 6; }
.pchart { position: relative; }
.pchart .cdot, .pchart .cbar { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.pchart .cdot.on circle:last-of-type { r: 7; }
.pchart .cbar.on rect:first-child { fill: #2bb3a3; }
.ctip { position: absolute; pointer-events: none; background: var(--ink, #1f2a44); color: #fff; font-size: 0.8rem; font-weight: 800; padding: 5px 9px; border-radius: 10px; width: max-content; max-width: calc(100% - 8px); text-align: center; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18); z-index: 2; }
.verdict { margin: 4px 0; font-weight: 800; }
.verdict.up { color: var(--good); }
.verdict.down { color: #a4561a; }
.skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 6px; }
.skill { border: 0; text-align: left; background: var(--card); border-radius: 14px; padding: 8px 10px; box-shadow: inset 0 0 0 2px var(--line); display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: center; }
.skill .sk-m { grid-row: span 2; font-size: 1.4rem; }
.skill .sk-n { font-weight: 800; font-size: 0.9rem; line-height: 1.2; }
.skill small { color: var(--ink-soft); font-weight: 700; font-size: 0.75rem; }
.skill.m0 { opacity: 0.75; }
.skill.m3 { box-shadow: inset 0 0 0 2px #f0c35a; }
.skill.m4 { box-shadow: inset 0 0 0 2px #e0a21b; background: #fff8e6; }
.sumgrid.two { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 480px) {
  .segs.four .seg { padding: 8px 2px; }
  .wdots i { width: 19px; height: 19px; }
}

/* Grown-up preview: every level open, nothing saved */
.pvbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: -4px 0 10px; padding: 8px 12px; border-radius: 14px; background: #5b3fa8; color: #ffffff; font-size: 0.88rem; font-weight: 700; box-shadow: 0 3px 0 #3e2a78; }
.pvbar .btn { padding: 6px 14px; font-size: 0.9rem; background: #ffffff; color: #3e2a78; box-shadow: 0 2px 0 #c9bdf0; flex: none; }
.pvlevels { display: flex; flex-direction: column; gap: 6px; background: #f1edff; border-radius: 16px; padding: 10px; box-shadow: inset 0 0 0 2px #c9bdf0; }
.pvlevels > span { font-weight: 800; color: #3e2a78; }
.pvlevels .segs.six { grid-template-columns: repeat(6, 1fr); }
.pvlevels .seg { font-size: 1.1rem; padding: 6px 2px; }
/* Links to our other apps (picker screen and home footer) */
.apps { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin: 12px auto 0; font-size: 0.88rem; font-weight: 700; color: var(--ink-soft); }
.appbtn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: var(--card); color: var(--ink); text-decoration: none; box-shadow: inset 0 0 0 2px var(--line); }
.appbtn:active { transform: translateY(1px); }

/* ---------- Sunny Farm (js/farm-ui.js) ---------- */
.tile.t-farm { background: #f3fbe8; box-shadow: inset 0 0 0 3px #7fbf4d, 0 4px 0 #5d9a31; }
.tile.t-farm.hot { background: #fff6d8; box-shadow: inset 0 0 0 3px var(--sun), 0 4px 0 #e39a22; }
.pill.money { color: #2f6b1f; }
.flevel { background: var(--card); border-radius: var(--r); padding: 12px 14px; box-shadow: inset 0 0 0 2px var(--line); display: flex; flex-direction: column; gap: 6px; }
.flv { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.flv b { font-family: var(--display); font-weight: 600; font-size: 1.2rem; }
.flv span { color: var(--ink-soft); font-size: 0.9rem; font-weight: 800; }
.fbar { display: block; height: 12px; border-radius: 999px; background: #e7edf1; overflow: hidden; }
.fbar span { display: block; height: 100%; border-radius: 999px; background: #7fbf4d; transition: width 0.4s; }
.fbar.xp span { background: var(--sun); }
.fgoal { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 12px; border: 0; text-align: left; background: #fff8e6; border-radius: var(--r); padding: 10px 14px; box-shadow: inset 0 0 0 2px #f0c35a; }
.fgoal-e { font-size: 2.2rem; flex: none; }
.fgoal-t { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.fgoal-t small { color: var(--ink-soft); font-weight: 700; }
.fstand { margin-top: 4px; background: #5d9a31; box-shadow: 0 4px 0 #3f7020; }
.fstand:active { box-shadow: 0 1px 0 #3f7020; }
.fbtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
.fbtns .tile.locked { opacity: 0.55; }
.fbtns .tile.hot { background: #fff6d8; box-shadow: inset 0 0 0 3px var(--sun), 0 4px 0 #e39a22; }
.fbtns .tile { padding: 10px; }
.fbtns .tile small { font-size: 0.78rem; }
.fhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.fhead .pill { margin-top: 12px; }
.fbasket { display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; }
.fe { font-size: 2.4rem; line-height: 1.1; }
.fchip { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); font-weight: 900; font-size: 1.1rem; }
.fchip small { color: var(--ink-soft); font-size: 0.78rem; }
.fseeds, .fitems { display: flex; flex-direction: column; gap: 8px; text-align: left; margin-top: 10px; }
.fseed, .fitem { display: flex; align-items: center; gap: 10px; border: 0; border-radius: 14px; background: var(--card); padding: 8px 12px; box-shadow: inset 0 0 0 2px var(--line); }
.fseed:disabled { opacity: 0.55; cursor: not-allowed; }
.fseed .fe, .fitem .fe { font-size: 1.9rem; flex: none; }
.fseed-t, .fitem-t { display: flex; flex-direction: column; flex: 1; min-width: 0; line-height: 1.25; }
.fseed-t small, .fitem-t small { color: var(--ink-soft); font-weight: 700; font-size: 0.8rem; }
.fprice { font-family: var(--display); font-weight: 600; font-size: 1.1rem; color: #2f6b1f; white-space: nowrap; }
.fside { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.fside .btn { padding: 8px 14px; font-size: 0.95rem; }
.fitem.locked { opacity: 0.6; }
.fown, .flock { font-size: 0.8rem; font-weight: 800; color: var(--ink-soft); white-space: nowrap; }
.fown { color: var(--good); }
.ftabs { display: flex; flex-wrap: wrap; gap: 8px; }
.funlocks { list-style: none; padding: 0; margin: 10px 0; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.funlocks li { background: var(--card); border-radius: 12px; padding: 8px 12px; box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; }
.funlocks li span { font-size: 1.3rem; }
/* stand and paying */
.pcard.vip { background: #fff5fb; }
.fcust { display: flex; align-items: flex-start; gap: 12px; }
.frow { font-size: 1.9rem; letter-spacing: 4px; text-align: center; }
.ftag { display: inline-block; margin: 6px 4px 0; padding: 4px 12px; border-radius: 10px; background: #fff8e6; box-shadow: inset 0 0 0 2px #f0c35a; font-family: var(--display); font-weight: 600; font-size: 1.15rem; }
.ftags { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 6px; }
.ftags .ftag { margin: 0; }
.fchange { margin-top: 10px; padding: 10px 14px; border-radius: 14px; background: #eef1ff; font-weight: 800; }
.ftray { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; min-height: 70px; margin-top: 10px; padding: 8px; border-radius: 16px; background: #f4f0e6; box-shadow: inset 0 0 0 2px #e3d6b4; }
.fpalette { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.fcoin { border: 0; background: none; padding: 0; line-height: 0; }
.fcoin svg { height: 46px; width: auto; max-height: none; }
.fcoin.big { background: var(--card); border-radius: 16px; padding: 6px; box-shadow: inset 0 0 0 2px var(--line), 0 4px 0 var(--line); }
.fcoin.big svg { height: 56px; }
.fcoin.big:active { transform: translateY(3px); box-shadow: inset 0 0 0 2px var(--line), 0 1px 0 var(--line); }
@media (max-width: 480px) {
  .fcoin.big svg { height: 48px; }
}

/* ---------- Sunny Farm scene (js/farm-scene.js) ---------- */
.scene { position: relative; margin-top: 16px; border-radius: 22px; overflow: hidden; box-shadow: inset 0 0 0 3px #5d9a31, 0 5px 0 #4e8628; background: #8fd16a; }
.scene button { touch-action: manipulation; }
.sky { position: relative; height: 128px; background: linear-gradient(#7cc8f2, #c4ecff 80%); overflow: hidden; }
.sun { position: absolute; top: 8px; right: 14px; font-size: 2.4rem; animation: sunspin 30s linear infinite; }
.cloud { position: absolute; font-size: 2.2rem; opacity: 0.95; animation: drift 38s linear infinite; }
.cloud.c1 { top: 10px; animation-delay: -8s; }
.cloud.c2 { top: 34px; font-size: 1.6rem; animation-duration: 52s; animation-delay: -30s; }
.rainbow { position: absolute; top: -6px; left: 28%; font-size: 5.2rem; opacity: 0.8; }
.balloon { position: absolute; top: 14px; left: 12%; font-size: 1.8rem; animation: floaty 6s ease-in-out infinite; }
.bird { position: absolute; top: 22px; font-size: 1.3rem; animation: fly 16s linear infinite; }
.hills { position: absolute; left: 0; right: 0; bottom: 0; height: 52px; background: radial-gradient(ellipse 45% 100% at 20% 100%, #7cc35a 98%, transparent 100%), radial-gradient(ellipse 55% 90% at 78% 100%, #6db64c 98%, transparent 100%), linear-gradient(transparent 70%, #8fd16a 70%); }
.hfence { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: repeating-linear-gradient(90deg, #fffaf0 0 5px, transparent 5px 22px), linear-gradient(transparent 3px, #fffaf0 3px, #fffaf0 6px, transparent 6px); }
.deco { position: absolute; bottom: 6px; line-height: 1; font-size: 2.3rem; }
.sky .deco.d-tree { font-size: 2.8rem; }
.sky .deco.d-cat { bottom: 4px; font-size: 1.4rem; }
.spi { display: inline-flex; line-height: 0; }
.spi svg, .deco svg { height: 1em; width: auto; }
.sky .deco.d-barn svg { height: 52px; }
.sky .deco.d-windmill svg { height: 74px; }
.fitem .spi svg { height: 1.9rem; }
.windmill .blades { transform-origin: 30px 40px; animation: sunspin 7s linear infinite; }
.land { padding: 10px 10px 0; background: linear-gradient(#8fd16a, #7cc35a); display: flex; flex-direction: column; gap: 10px; }
.flabel { position: absolute; left: 6px; bottom: 4px; font-size: 0.68rem; font-weight: 900; padding: 1px 7px; border-radius: 999px; background: rgba(255, 255, 255, 0.85); color: var(--ink); }
.plus { font-size: 1.8rem; font-weight: 900; color: rgba(255, 255, 255, 0.9); }
/* garden beds */
.beds { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.fbed.soil { position: relative; flex: 1 1 88px; max-width: 150px; height: 82px; border: 0; border-radius: 14px; padding: 0; display: grid; place-items: center; background: repeating-linear-gradient(0deg, #9c6b3f 0 6px, #b07d4d 6px 16px); box-shadow: inset 0 0 0 3px #7c5130, 0 4px 0 #6a4426; }
.fbed.soil.empty { background: repeating-linear-gradient(0deg, #a87850 0 6px, #ba8a5c 6px 16px); opacity: 0.9; }
.fbed.soil.ready { box-shadow: inset 0 0 0 3px #5d9a31, 0 4px 0 #4e8628, 0 0 0 3px #ffe27a; }
.fbed:active { transform: translateY(3px); }
.plants { display: flex; gap: 2px; margin-bottom: 14px; }
.plants i { font-style: normal; font-size: 1.25rem; line-height: 1; }
.fbed.sprout .plants i { font-size: 1.6rem; }
.fbed.ready .plants i { font-size: 1.75rem; animation: wiggle 1.4s ease-in-out infinite; animation-delay: calc(var(--k) * 0.15s); transform-origin: 50% 100%; }
.fbed.ready .flabel { background: #fff27a; }
.scarecrow { font-size: 2.6rem; line-height: 1; align-self: center; animation: wiggle 3s ease-in-out infinite; transform-origin: 50% 100%; }
/* pens */
.pens { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.fpen.pasture { position: relative; height: 104px; border: 0; border-radius: 16px; padding: 0; overflow: hidden; background: linear-gradient(#a6dc80, #93cf6a); box-shadow: inset 0 0 0 4px #c48c55, inset 0 0 0 6px #e3b783, 0 4px 0 #8a5a31; }
.fpen.pasture::before { content: ''; position: absolute; left: 6px; right: 6px; top: 22px; height: 3px; background: rgba(196, 140, 85, 0.55); }
.fpen.pasture.empty { display: grid; place-items: center; background: linear-gradient(#b5e095, #a3d77f); opacity: 0.85; }
.fpen.pasture.ready { box-shadow: inset 0 0 0 4px #c48c55, inset 0 0 0 6px #e3b783, 0 4px 0 #8a5a31, 0 0 0 3px #ffe27a; }
.fpen:active { transform: translateY(3px); }
.walker { position: absolute; bottom: 14px; left: 8px; line-height: 1; font-size: 2.6rem; animation: wander var(--t) linear infinite; animation-delay: var(--dl); }
.walker:not(.side) { animation-name: wander-front; }
.s0 .walker { font-size: 1.7rem; }
.s1 .walker { font-size: 2.1rem; }
.bob { display: inline-block; animation: bob 0.5s ease-in-out infinite alternate; }
.hungry .bob { animation-duration: 0.9s; }
.bob.hop, .bee.hop { animation: hop 0.5s ease-out; }
.hivebox { position: absolute; left: 10px; bottom: 12px; line-height: 0; }
.hivebox svg { height: 44px; width: auto; }
.bee { position: absolute; left: 40%; top: 40%; font-size: 1.2rem; animation: buzz 3.2s ease-in-out infinite; animation-delay: calc(var(--k) * -1.1s); }
.loot { position: absolute; right: 30px; bottom: 10px; display: flex; gap: 1px; }
.loot i { font-style: normal; font-size: 1.35rem; animation: wiggle 1.2s ease-in-out infinite; animation-delay: calc(var(--k) * 0.2s); }
.trough { position: absolute; right: 8px; bottom: 10px; width: 24px; height: 12px; border-radius: 3px 3px 8px 8px; background: #8a5a31; }
.trough.full::after { content: ''; position: absolute; left: 3px; right: 3px; top: -3px; height: 6px; border-radius: 4px; background: #e8c45a; }
.pchip { position: absolute; top: 6px; right: 8px; font-size: 0.78rem; font-weight: 900; padding: 1px 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.92); color: var(--ink); }
.hungry .pchip { background: #ffe2dc; color: var(--bad); animation: bump 1.6s ease-in-out infinite; }
.ready .pchip { background: #fff27a; }
/* yard with the stand */
.yard { position: relative; height: 96px; margin: 0 -10px; background: linear-gradient(#7cc35a, #6aae49); overflow: hidden; }
.yard::before { content: ''; position: absolute; left: 0; right: 0; bottom: 18px; height: 16px; background: #d8b98a; opacity: 0.7; border-radius: 8px; }
.yard .deco { bottom: 10px; font-size: 2.1rem; }
.yard .deco.d-pond { width: 74px; height: 30px; bottom: 6px; border-radius: 50%; background: radial-gradient(#7fd0f2, #4aa8d8); display: grid; place-items: center; font-size: 1.4rem; }
.yard .deco.d-pond { animation: none; }
.ystand { position: absolute; left: 10px; bottom: 8px; width: 82px; height: 76px; border: 0; border-radius: 12px; background: #fff7e6; box-shadow: inset 0 0 0 3px #b07a46, 0 4px 0 #8a5a31; display: grid; place-items: end center; padding-bottom: 4px; }
.ystand .awn { position: absolute; top: 0; left: 0; right: 0; height: 22px; border-radius: 12px 12px 4px 4px; background: repeating-linear-gradient(90deg, var(--aw, #ff7e6b) 0 12px, #ffffff 12px 24px); }
.ystand .ye { font-size: 2rem; line-height: 1; }
.ystand .badge { position: absolute; top: -2px; right: -4px; min-width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; background: var(--coral); color: #ffffff; font-size: 0.8rem; box-shadow: 0 2px 0 var(--coral-dark); }
.ystand:active { transform: translateY(3px); }
.st1 { --aw: #f2a33a; } .st2 { --aw: #3fae6a; } .st3 { --aw: #4d8fe0; } .st4 { --aw: #9b59d0; } .st5 { --aw: #e04d7c; } .st9 { --aw: #6a5acd; }
.dog { position: absolute; bottom: 10px; font-size: 1.8rem; animation: run 9s linear infinite; }
.tractor { position: absolute; bottom: 14px; font-size: 2.4rem; animation: drive 16s linear infinite; }
.fstore { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
.fstore .btn { padding: 8px 14px; font-size: 0.95rem; }
/* market stall above the customer */
.stall { position: relative; margin: 10px 0 0; border-radius: 18px 18px 0 0; overflow: hidden; background: linear-gradient(#cfeeff, #e9f8ff); height: 116px; }
.stall .awning { position: absolute; top: 0; left: 0; right: 0; height: 26px; background: repeating-linear-gradient(90deg, var(--aw, #ff7e6b) 0 22px, #ffffff 22px 44px); border-radius: 0 0 14px 14px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.08); }
.stall.m-pay { --aw: #4d8fe0; }
.stall.vip { --aw: #b0569e; background: linear-gradient(#f6e4ff, #fff5fb); }
.stall-in { position: absolute; inset: 26px 0 0; }
.seller { position: absolute; left: 12px; bottom: 30px; font-size: 2.6rem; line-height: 1; }
.counter { position: absolute; left: 0; right: 32%; bottom: 0; height: 36px; background: #c48c55; box-shadow: inset 0 4px 0 #e3b783; display: flex; align-items: flex-start; justify-content: flex-end; gap: 8px; padding: 0 10px; }
.goods { display: flex; gap: 1px; margin-top: -24px; font-size: 1.6rem; line-height: 1; }
.goods i { font-style: normal; }
.goods.gone { opacity: 0; transition: opacity 0.3s 0.2s; }
.goods .spi svg { height: 1.7rem; }
.cashbox { margin-top: -22px; font-size: 1.6rem; line-height: 1; }
.shopper { position: absolute; right: 8%; bottom: 4px; font-size: 3.2rem; line-height: 1; animation: walkin 0.9s ease-out both; }
.shopper > span { display: inline-block; animation: bob 0.45s ease-in-out 2 alternate; }
.shopper.vip::after { content: '⭐'; position: absolute; top: -8px; right: -10px; font-size: 1.3rem; animation: sunspin 4s linear infinite; }
.shopper.happy > span { animation: hop 0.6s ease-out 2; }
.shopper.sad > span { animation: shake 0.6s; }
.stall + .pcard { border-radius: 0 0 22px 22px; }
.fcoin.landing { visibility: hidden; }
.flyer { position: fixed; z-index: 60; pointer-events: none; line-height: 1; }
.flyer svg { height: 2.2em; width: auto; max-height: none; }
/* the night between two days */
.nightfx { position: fixed; inset: 0; z-index: 55; pointer-events: none; background: radial-gradient(ellipse at 50% 120%, #2b3f7a, #0c1633 70%); overflow: hidden; }
.nightfx i { position: absolute; color: #fff6c9; font-style: normal; font-size: 0.9rem; animation: twinkle 0.8s ease-in-out infinite alternate; }
.nightfx .moon { position: absolute; top: 14%; right: 18%; font-size: 4rem; }
.nightfx .zzz { position: absolute; top: 40%; left: 50%; transform: translateX(-50%); color: #cfd8ff; font-family: var(--display); font-size: 2.2rem; letter-spacing: 0.3em; animation: floaty 1.6s ease-in-out infinite; }
.nightfx .sunup { position: absolute; left: 50%; bottom: -80px; font-size: 5rem; transform: translateX(-50%); animation: sunup 2.4s ease-in both; }
@keyframes drift { from { left: -15%; } to { left: 110%; } }
@keyframes sunspin { to { transform: rotate(360deg); } }
@keyframes floaty { 50% { transform: translateY(-10px); } }
@keyframes fly { from { left: -10%; transform: translateY(0); } 50% { transform: translateY(16px); } to { left: 110%; transform: translateY(0); } }
@keyframes wiggle { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
@keyframes hop { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-22px) scale(1.15); } 100% { transform: translateY(0) scale(1); } }
/* side-drawn animals face left: walking right they turn around */
@keyframes wander { 0% { left: 8px; transform: scaleX(-1); } 44% { left: calc(100% - 3.4rem); transform: scaleX(-1); } 50% { left: calc(100% - 3.4rem); transform: scaleX(1); } 94% { left: 8px; transform: scaleX(1); } 100% { left: 8px; transform: scaleX(-1); } }
@keyframes wander-front { 0%, 100% { left: 8px; } 50% { left: calc(100% - 3.4rem); } }
@keyframes buzz { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(34px, -18px); } 50% { transform: translate(10px, 10px); } 75% { transform: translate(-22px, -8px); } }
@keyframes run { 0% { left: 105%; transform: scaleX(1); } 45% { left: -10%; transform: scaleX(1); } 50% { left: -10%; transform: scaleX(-1); } 95% { left: 105%; transform: scaleX(-1); } 100% { left: 105%; transform: scaleX(1); } }
@keyframes drive { 0% { left: 110%; } 60%, 100% { left: -20%; } }
@keyframes walkin { from { transform: translateX(140%); } to { transform: translateX(0); } }
@keyframes twinkle { from { opacity: 0.3; } to { opacity: 1; } }
@keyframes sunup { 0%, 55% { bottom: -90px; } 100% { bottom: 30%; } }
@media (max-width: 480px) {
  .sky { height: 112px; }
  .pens { grid-template-columns: repeat(2, 1fr); }
  .fbed.soil { flex-basis: 70px; height: 76px; }
  .stall { height: 104px; }
  .shopper { font-size: 2.8rem; }
}
@media (prefers-reduced-motion: reduce) {
  .scene *, .stall * { animation: none !important; }
  .walker { left: 30%; }
}

/* ---------- Sunny Farm 2: workshops, bank, new animals and decorations ---------- */
.works { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.fwork { position: relative; height: 70px; border: 0; border-radius: 14px; padding: 0; background: #f6e7cf; box-shadow: inset 0 0 0 3px #b07a46, 0 4px 0 #8a5a31; overflow: hidden; }
.fwork .wroof { position: absolute; top: 0; left: 0; right: 0; height: 12px; background: repeating-linear-gradient(90deg, #c0533a 0 14px, #d9694f 14px 28px); }
.fwork .wbig { position: absolute; left: 50%; top: 20px; transform: translateX(-50%); font-size: 2rem; line-height: 1; }
.fwork .wout { position: absolute; right: 12px; top: 26px; font-size: 2rem; line-height: 1; }
.fwork.busy .wout { opacity: 0.45; }
.fwork.ready { box-shadow: inset 0 0 0 3px #5d9a31, 0 4px 0 #4e8628, 0 0 0 3px #ffe27a; }
.fwork.ready .wout { animation: hop 1.2s ease-in-out infinite; }
.fwork .smoke { position: absolute; left: 8px; top: 12px; font-size: 1rem; animation: smoke 2s ease-out infinite; }
.fwork:active { transform: translateY(3px); }
.park { display: flex; flex-wrap: wrap; justify-content: space-around; gap: 4px 10px; margin: 0 -10px; padding: 6px 10px 10px; background: linear-gradient(#6aae49, #5d9f3f); font-size: 2.3rem; line-height: 1.1; }
.park .d-ferris, .park .d-carousel { animation: wiggle 4s ease-in-out infinite; }
.park .d-rocket { animation: floaty 2.5s ease-in-out infinite; }
.heli { position: absolute; top: 10px; font-size: 1.6rem; animation: drive 13s linear infinite; }
.ufo { position: absolute; top: 6px; left: 46%; font-size: 1.7rem; animation: floaty 3s ease-in-out infinite; }
.dragon { position: absolute; top: 34px; font-size: 2rem; animation: fly 22s linear infinite; animation-delay: -6s; }
.fw { position: absolute; font-size: 1.6rem; animation: twinkle 1.1s ease-in-out infinite alternate; }
.fw.f1 { top: 6px; left: 62%; } .fw.f2 { top: 26px; left: 72%; animation-delay: 0.5s; }
.fpen.a-fishpond { background: radial-gradient(ellipse at 50% 60%, #8fd8f6, #4aa8d8 75%); }
.fpen.a-fishpond::before { display: none; }
.fpen.a-silkworm { background: radial-gradient(circle at 30% 70%, #6cbf4a 0 26px, transparent 27px), radial-gradient(circle at 75% 55%, #7fcb5a 0 22px, transparent 23px), linear-gradient(#b9e59a, #a3d77f); }
.fpen.a-silkworm .walker { font-size: 1.8rem; animation-duration: calc(var(--t) * 2.2); }
.walker.fishy { font-size: 1.6rem; }
.twinkles i { position: absolute; font-style: normal; font-size: 0.9rem; animation: twinkle 0.9s ease-in-out infinite alternate; }
.twinkles i:nth-child(1) { left: 20%; top: 30%; } .twinkles i:nth-child(2) { left: 55%; top: 22%; animation-delay: 0.3s; } .twinkles i:nth-child(3) { left: 40%; top: 55%; animation-delay: 0.6s; }
.stall.m-make { --aw: #c0533a; }
.stall.m-sell { --aw: #8a5a2b; }
.stall.m-bank { --aw: #2f7d4f; background: linear-gradient(#e6f5ea, #f6fbf7); }
.fbankday { display: block; width: 100%; margin-top: 12px; border: 0; text-align: left; border-radius: var(--r); padding: 12px 14px; background: #e6f5ea; box-shadow: inset 0 0 0 3px #2f7d4f, 0 4px 0 #24613d; color: #1f4f33; font-weight: 800; animation: pop 0.4s; }
.fitem-t .need span { margin-right: 2px; }
.fitem-t .need .have { color: var(--good); }
.fitem-t .need .miss { color: var(--bad); }
.bankcard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bk { display: flex; flex-direction: column; align-items: center; padding: 14px 8px; border-radius: var(--r); background: var(--card); box-shadow: inset 0 0 0 2px var(--line); }
.bk:first-child { background: #e6f5ea; box-shadow: inset 0 0 0 3px #2f7d4f; }
.bk small { color: var(--ink-soft); font-weight: 800; }
.bk b { font-family: var(--display); font-weight: 600; font-size: 1.9rem; font-variant-numeric: tabular-nums; }
.fbank .flevel { margin-top: 14px; }
.bacct-next { display: flex; align-items: center; gap: 10px; border-top: 2px dashed var(--line); padding-top: 8px; margin-top: 2px; }
.bacct-next .fe { font-size: 1.7rem; flex: none; }
.bacct-next .fitem-t small { color: var(--ink-soft); font-weight: 700; font-size: 0.8rem; }
.bchart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 170px; padding: 10px; border-radius: var(--r); background: var(--card); box-shadow: inset 0 0 0 2px var(--line); }
.bbar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 3px; min-width: 0; }
.bbar .bfill { width: 70%; border-radius: 6px 6px 2px 2px; background: #5fb37a; }
.bbar:first-child .bfill { background: #2f7d4f; }
.bbar .bv { font-size: 0.62rem; font-weight: 900; color: var(--ink-soft); white-space: nowrap; }
.bbar small { font-size: 0.66rem; font-weight: 800; color: var(--ink-soft); white-space: nowrap; }
.bsum { padding: 12px; border-radius: var(--r); background: var(--card); box-shadow: inset 0 0 0 2px var(--line); }
.bsum-k { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
.bsum-k div { display: flex; flex-direction: column; align-items: center; padding: 8px 4px; border-radius: 12px; background: #e6f5ea; text-align: center; }
.bsum-k .int { background: var(--sun-soft); }
.bsum-k .out { background: #f1f4f6; }
.bsum-k small { color: var(--ink-soft); font-weight: 800; font-size: 0.8rem; }
.bsum-k b { font-family: var(--display); font-weight: 600; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.bsum-bar { display: flex; height: 16px; margin-top: 12px; border-radius: 8px; overflow: hidden; background: var(--line); }
.bsum-bar span { min-width: 6px; }
.bsum-bar .own, .bsum-t b.own { background: #2f7d4f; }
.bsum-bar .int, .bsum-t b.int { background: var(--sun); }
.bsum-t { margin: 6px 0 0; font-weight: 700; }
.bsum-t b.own, .bsum-t b.int { padding: 0 6px; border-radius: 6px; color: #fff; }
.bsum-t b.int { color: var(--ink); }
.bsum p.muted { margin: 6px 0 0; font-size: 0.85rem; }
.blog { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.blog li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; }
.blog small { color: var(--ink-soft); }
.blog b { font-variant-numeric: tabular-nums; }
.blog b.in, .blog b.interest { color: var(--good); }
.blog b.out { color: var(--bad); }
@keyframes smoke { 0% { transform: translateY(0) scale(0.6); opacity: 0.9; } 100% { transform: translateY(-16px) scale(1.3); opacity: 0; } }
@media (max-width: 480px) {
  .fbtns { grid-template-columns: repeat(2, 1fr); }
  .works { grid-template-columns: repeat(4, 1fr); }
  .bbar .bv { font-size: 0.55rem; }
}
@media (prefers-reduced-motion: reduce) {
  .fwork *, .park *, .fbankday { animation: none !important; }
}

/* ---------- Sunny Farm 3: upgrades, several animals in a pen, compact workshops, farmhand ---------- */
.fwork .wbadge { position: absolute; right: 3px; top: 3px; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 11px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.92); font-size: 0.8rem; font-weight: 900; color: var(--ink-soft); }
.fwork.ready .wbadge { background: #fff27a; font-size: 1rem; animation: hop 1.2s ease-in-out infinite; }
.fwork.busy .wbadge { font-size: 0.7rem; }
.bstars { position: absolute; top: 4px; left: 6px; font-size: 0.7rem; letter-spacing: -1px; color: #ffe27a; text-shadow: 0 1px 0 #7c5130; }
.bwater { position: absolute; top: 3px; right: 6px; font-size: 0.8rem; }
.bagain { position: absolute; bottom: 4px; right: 6px; font-size: 0.75rem; }
.fbed.soil.glass::after { content: ''; position: absolute; inset: 3px; border-radius: 12px; background: linear-gradient(160deg, rgba(255, 255, 255, 0.55), rgba(220, 245, 255, 0.15) 45%, rgba(255, 255, 255, 0.3)); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.7); pointer-events: none; }
.walker.w1 { bottom: 34px; font-size: 0.85em; }
.walker.w2 { bottom: 24px; animation-direction: reverse; }
.s0 .walker.w1, .s0 .walker.w2 { font-size: 1.5rem; }
.cozy { position: absolute; left: 8px; top: 26px; font-size: 1.2rem; opacity: 0.9; }
.farmhand { position: absolute; bottom: 12px; font-size: 1.9rem; animation: run 14s linear infinite; animation-delay: -4s; }
.fhelp { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 8px 12px; border-radius: 14px; background: #f3fbe8; box-shadow: inset 0 0 0 2px #b6dc95; font-weight: 700; font-size: 0.9rem; }
.fhelp .btn { margin-left: auto; padding: 6px 12px; font-size: 0.85rem; }

/* ---------- Sunny Farm: the dock at the bottom (money, basket, feed, quick actions) ---------- */
#app.is-farm { padding-bottom: 150px; } /* room to scroll the last row above the dock */
html:has(#app.is-farm) { scroll-padding-bottom: 140px; } /* scrolling to a bed or pen keeps it above the dock */
.fdock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: rgba(255, 255, 255, 0.97); border-radius: 20px 20px 0 0; box-shadow: 0 -2px 0 var(--line), 0 -6px 18px rgba(20, 28, 48, 0.12); }
.fdock-in { max-width: 616px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.fdock-row { display: flex; align-items: center; gap: 6px; }
.fstat { position: relative; display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; background: #f1f5f2; box-shadow: inset 0 0 0 2px var(--line); font-weight: 900; font-size: 1rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.fstat.bump { animation: bump 0.45s; }
.fstat .delta { position: absolute; right: -2px; top: -18px; font-style: normal; font-size: 0.8rem; font-weight: 900; padding: 0 6px; border-radius: 999px; animation: deltaup 1.4s ease-out forwards; }
.fstat .delta.up { background: var(--good-soft); color: var(--good); }
.fstat .delta.down { background: var(--bad-soft); color: var(--bad); }
.fsell { margin-left: auto; padding: 8px 14px; font-size: 1rem; background: #5d9a31; box-shadow: 0 4px 0 #3f7020; white-space: nowrap; }
.fsell:active { box-shadow: 0 1px 0 #3f7020; }
.fdock-acts { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.fdock-acts::-webkit-scrollbar { display: none; }
.fdock-acts .btn { flex: none; padding: 7px 11px; font-size: 0.88rem; box-shadow: 0 3px 0 var(--line), inset 0 0 0 2px var(--line); }
.ftext { font-family: var(--display); font-weight: 600; font-size: 1.35rem; color: var(--good); background: rgba(255, 255, 255, 0.92); padding: 2px 10px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); white-space: nowrap; }
.ftext.minus { color: #a4561a; }
@keyframes deltaup { 0% { opacity: 0; transform: translateY(6px); } 20% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
@media (max-width: 480px) {
  .fstat { padding: 5px 8px; font-size: 0.92rem; }
  .fsell { padding: 7px 10px; font-size: 0.92rem; }
}

/* ---------- Sunny Farm bank: this bank week (7 farm days, the last is bank day) ---------- */
.bweek { margin-top: 14px; padding: 12px 14px; border-radius: var(--r); background: var(--card); box-shadow: inset 0 0 0 2px var(--line); }
.bweek-t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.bweek-t small { color: var(--ink-soft); font-weight: 800; }
.bweek ol { list-style: none; padding: 0; margin: 10px 0 6px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.bweek li { display: flex; flex-direction: column; align-items: center; padding: 6px 2px; border-radius: 12px; background: #f1f5f2; box-shadow: inset 0 0 0 2px var(--line); line-height: 1.15; min-width: 0; }
.bweek li small { font-size: 0.6rem; font-weight: 800; color: var(--ink-soft); }
.bweek li b { font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
.bweek li i { font-style: normal; font-size: 0.85rem; min-height: 1.1em; color: var(--good); }
.bweek li.past { background: #dff1e4; box-shadow: inset 0 0 0 2px #a9d8b8; }
.bweek li.now { box-shadow: inset 0 0 0 3px var(--coral); background: #fff3f1; }
.bweek li.bank { background: #e6f5ea; box-shadow: inset 0 0 0 3px #2f7d4f; }
.bweek li.bank.now { box-shadow: inset 0 0 0 3px var(--coral); }
.bweek p { margin: 4px 0 0; font-weight: 700; }
.bweek p.due { color: #1f4f33; }

/* ---------- NNAT-3 style practice (js/nnat.js) ---------- */
.nnwrap { display: flex; justify-content: center; margin: 10px 0 4px; }
.nnwrap svg.nn { max-width: 100%; height: auto; max-height: none; }
svg.nn.design { width: 156px; }
.choices.pics .choice svg.nn, .choices.ct .copt svg.nn { width: 64px; height: 64px; }
.choices.n5.pics:has(svg.nn):not(.ct) { grid-template-columns: repeat(5, 1fr); gap: 8px; }
.choices.n5.pics:has(svg.nn) .choice { min-height: 78px; padding: 6px; }
@media (max-width: 480px) {
  .choices.n5.pics:has(svg.nn):not(.ct) { grid-template-columns: repeat(3, 1fr); }
}

/* GATE plan card on the home screen (2nd grade) */
.gatecard { display: flex; align-items: flex-start; gap: 12px; width: 100%; margin-top: 12px; border: 0; text-align: left; border-radius: var(--r); padding: 12px 14px; background: #eaf1fb; box-shadow: inset 0 0 0 3px #2e64b8, 0 4px 0 #234d8f; color: var(--ink); }
.gatecard:active { transform: translateY(3px); box-shadow: inset 0 0 0 3px #2e64b8, 0 1px 0 #234d8f; }
.gc-ic { font-size: 2rem; line-height: 1; flex: none; }
.gc-t { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 1.02rem; }
.gc-t small { color: var(--ink-soft); font-weight: 700; font-size: 0.82rem; }
.gc-t .gc-step { color: #1f3f78; font-weight: 800; font-size: 0.9rem; }
.gc-week { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.gatecard .wdots i.on { background: #2e64b8; color: #ffffff; box-shadow: none; }

/* Sunny Farm stand: the basket — sold and left to sell, per thing */
.fbbar { margin: 10px 0 0; padding: 8px 12px 10px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); display: flex; flex-direction: column; gap: 6px; }
.fbbar + .stall { margin-top: 8px; }
.fbbar-t { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; font-size: 0.95rem; }
.fbbar-t b { font-family: var(--display); font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.fbbar ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.fbbar li { display: flex; align-items: center; gap: 4px; padding: 3px 9px 3px 6px; border-radius: 999px; background: #fff8e6; box-shadow: inset 0 0 0 2px #f1dca6; line-height: 1.1; }
.fbbar li i { font-style: normal; font-size: 1.2rem; }
.fbbar li b { font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; }
.fbbar li small { color: var(--ink-soft); font-weight: 700; font-size: 0.72rem; }
.fbbar li.want { background: #fff0c2; box-shadow: inset 0 0 0 2px #e0a21b; }
.fbbar li.out { opacity: 0.55; background: #eef7ee; box-shadow: inset 0 0 0 2px #bfe0c4; }
.fbbar li.out b { color: var(--good); }

/* ================= Sunny Farm: Big Dreams ================= */
svg.dart { display: block; width: 100%; height: auto; }
.fdream { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 12px; border: 0; text-align: left; border-radius: var(--r); padding: 8px 12px 8px 8px; background: linear-gradient(120deg, #f2fbe9, #e3f4ff); box-shadow: inset 0 0 0 3px #7cbf4a, 0 4px 0 #5d9a31; color: var(--ink); }
.fdream-pic { flex: none; width: 96px; border-radius: 14px; overflow: hidden; background: linear-gradient(#bfe6ff, #e9f7ff); }
.fdream-t { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.fdream-t b { font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
.fdream-t small { color: var(--ink-soft); font-weight: 800; }
.fdream.hot { animation: dreamglow 1.6s ease-in-out infinite; }
@keyframes dreamglow { 50% { box-shadow: inset 0 0 0 3px #ffb547, 0 4px 0 #e39a22, 0 0 22px rgba(255, 181, 71, 0.75); } }
.fdream.t-cottage { background: linear-gradient(120deg, #fff4e3, #ffe6e0); box-shadow: inset 0 0 0 3px #e8574a, 0 4px 0 #b8382e; }
.fdream.t-railway { background: linear-gradient(120deg, #e8f1ff, #fff1e6); box-shadow: inset 0 0 0 3px #4d8cff, 0 4px 0 #1f4fb0; }
.fdream.t-castle, .dbig.t-castle, .dtab.t-castle.sel, .dbuilt.t-castle { background: radial-gradient(circle at 30% 20%, #fff6d1, #f1e4ff 55%, #e2d4ff); box-shadow: inset 0 0 0 3px #d9a21a, 0 4px 0 #8a5a08, 0 0 24px rgba(255, 196, 40, 0.55); }
.fdream.t-castle .fdream-t b, .dbig.t-castle h2 { background: linear-gradient(90deg, #8a3fd1, #c97a00); -webkit-background-clip: text; background-clip: text; color: transparent; }
.fdreamjar { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 12px; border: 0; text-align: left; border-radius: var(--r); padding: 10px 14px; background: #f2fbe9; box-shadow: inset 0 0 0 2px #7cbf4a; color: var(--ink); font-size: 0.95rem; }
.fdreamjar > span:first-child { font-size: 1.8rem; }
.fdreamjar small { display: block; color: var(--ink-soft); font-weight: 800; }
.blog b.dream { color: var(--good); }
.blog b.build { color: #b8780a; }
.dreamland { display: flex; justify-content: space-around; gap: 6px; padding: 4px 8px 0; background: linear-gradient(#a6dc7e, #8fd16a); }
.dreamland .dl { flex: 0 1 132px; min-width: 0; border: 0; padding: 0; background: none; }
.dreamland .dl.done.t-castle { filter: drop-shadow(0 0 8px rgba(255, 210, 63, 0.9)); }
/* the Big Dreams screen */
.fdreams .dpath { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; }
.dtab { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; border-radius: 14px; padding: 6px 4px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); min-width: 0; color: var(--ink); }
.dtab-pic { width: 100%; border-radius: 10px; overflow: hidden; background: linear-gradient(#bfe6ff, #e9f7ff); }
.dtab b { font-size: 0.72rem; line-height: 1.1; text-align: center; }
.dtab small { font-size: 0.68rem; color: var(--ink-soft); font-weight: 800; }
.dtab.later .dtab-pic { filter: grayscale(0.9) opacity(0.5); }
.dtab.sel { box-shadow: inset 0 0 0 3px #5d9a31, 0 3px 0 #5d9a31; background: #f2fbe9; }

  <script>
// Small helpers shared by every module. Each file attaches itself to the MQ namespace
// so the app runs from plain <script> tags (works from file://, GitHub Pages, or a single bundled file).
(function () {
  const MQ = (globalThis.MQ = globalThis.MQ || {});
  const U = {};

  U.rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  U.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  U.chance = (p) => Math.random() < p;
  U.shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  U.sample = (arr, n) => U.shuffle(arr).slice(0, n);
  U.range = (a, b) => {
    const r = [];
    for (let i = a; i <= b; i++) r.push(i);
    return r;
  };
  U.sum = (arr) => arr.reduce((s, x) => s + x, 0);
  U.clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  U.esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Numeric multiple-choice options: always contains the answer, all unique and non-negative.
  U.numChoices = (answer, distractors, n = 4) => {
    const set = new Set([answer]);
    for (const d of U.shuffle(distractors)) {
      if (set.size >= n) break;
      if (Number.isInteger(d) && d >= 0) set.add(d);
    }
    let k = 1;
    while (set.size < n) {
      const c = answer + (k % 2 ? 1 : -1) * Math.ceil(k / 2);
      if (c >= 0) set.add(c);
      k++;
    }
    return U.shuffle([...set]);
  };

  // String multiple-choice options (answer first in the candidate list, then shuffled).
  U.strChoices = (answer, distractors, n = 4) => {
    const set = new Set([String(answer)]);
    for (const d of U.shuffle(distractors.map(String))) {
      if (set.size >= n) break;
      set.add(d);
    }
    return U.shuffle([...set]);
  };

  U.cents = (c) => (c >= 100 ? '$' + (c / 100).toFixed(2) : c + '¢');
  U.dollars = (c) => '$' + (c / 100).toFixed(2);
  U.comma = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  U.dateKey = (d = new Date()) =>
    d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  U.daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);

  // Short fingerprint of a question (ignores answer order), used to avoid repeats across attempts.
  U.qkey = (p) => {
    const s = String(p.text) + (p.visual || '');
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
    return h.toString(36);
  };
  MQ.U = U;
})();
</script>
