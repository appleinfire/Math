  // What a week charm could bring this farm, in a line (the Golden Piggy: worked out from the savings right now).
  function charmHelp(id, m) {
    const f = fm(), g = grade(), cost = m.cost[id];
    if (id === 'piggy') {
      const x = F.interest(f.bank.bal, g, f.bank.acct);
      if (!x) return '<p class="mc-help">💡 You have nothing saved in the bank yet, so double interest would be nothing too.</p>';
      return `<p class="mc-help">💡 With <b>${fmt(f.bank.bal)}</b> in the bank, the interest is about <b>${fmt(x)}</b>. Doubled, that is <b>+${fmt(x)}</b> more${x > cost ? `, and the piggy costs ${fmt(cost)}.` : `. The piggy costs ${fmt(cost)}: save more first, or it doesn’t pay off!`}</p>`;
    }
    const gain = F.charmGain(id, f, g, m.a);
    return `<p class="mc-help">💡 It can bring about <b>+${fmt(gain)}</b> in its week${id === 'myth' ? ' if you feed them every day' : id === 'clover' ? ' if you sell a lot at the stand' : ' if you keep your beds planted'}.</p>`;
  }
  function merchant() {
    const f = fm(), g = grade(), m = F.merchantHere(f);
    if (!m) return K().toast(`${F.MERCHANT.name} has left`);
    const w = F.merchantWares(f), n = F.merchantNights(f.day), bank = f.bank.bal;
    const charms = (m.charms || []).map((id) => {
      const c = F.CHARMS[id], cost = m.cost[id], got = (m.got || {})[id];
      const btn = got ? '<span class="fown">✓ Working!</span>' : f.money >= cost ? `<button class="btn" data-act="fBuyCharm" data-arg="${id}">Buy · ${fmt(cost)}</button>` : `<span class="flock">${fmt(cost)} · ${fmt(cost - f.money)} more</span>`;
      return `<div class="mcharm c-${id} ${got ? 'got' : ''}"><span class="mc-pic">${charmPic(id, m.a)}</span><span class="mc-t"><b>${c.e} ${esc(F.charmName(id, m.a))}</b><small>${esc(F.charmNote(id, g, fmt, m.a))}</small>${got ? '' : charmHelp(id, m)}</span><span class="mc-buy">${btn}</span></div>`;
    }).join('');
    let rare = '';
    if (w.item) {
      const t = F.TREASURES[w.item], cost = t.cost[g === 'k' ? 0 : 1];
      let plan;
      if (f.money >= cost) plan = `<button class="btn big tbuy" data-act="fBuyTreasure">Buy it · ${fmt(cost)}</button>`;
      else if (f.money + bank >= cost) plan = `<p>You have <b>${fmt(f.money)}</b> in your wallet and <b>${fmt(bank)}</b> in the bank. Take <b>${fmt(cost - f.money)}</b> out of the bank, and it’s yours!</p><button class="btn" data-act="go" data-arg="farm:bank">🏦 Go to the bank</button>`;
      else {
        const need = cost - f.money - bank, per = F.perDayToSave(need, n, g), goal = f.goal === 'treasure:' + w.item;
        plan = `<p>You have <b>${fmt(f.money)}</b>${bank ? ` + <b>${fmt(bank)}</b> in the bank` : ''}. You need <b>${fmt(need)}</b> more.</p>
          <p class="tplan">📅 ${per <= F.goodDay(F.level(f.xp).level, g).total ? `Save about <b>${fmt(per)}</b> ${n ? 'a day' : 'today'} to buy it before he leaves. Or save` : 'Save'} up for it: he brings it again on farm day <b>${F.merchantNext(f, true)}</b>.</p>
          ${goal ? '<span class="fown">⭐ Your saving goal</span>' : `<button class="btn ghost" data-act="fTreasureGoal" data-arg="${w.item}">⭐ Save up for it</button>`}`;
      }
      rare = `<div class="tcard t-${w.item}"><div class="dbuilt-rays"></div><div class="tpic">${MQ.treasureArt(w.item)}</div>
        <div class="ttag">✨ Rare treasure · stays on your farm for good</div><div class="mtitle">${t.e} ${esc(t.name)}</div>
        <p>${esc(F.treasureNote(w.item, g, fmt))}</p><div class="tprice">${fmt(cost)}</div></div>${plan}`;
    } else if (!m.item || (f.treasure || {})[m.item]) {
      const next = F.nextTreasure(f);
      if (next) { const t = F.TREASURES[next]; rare = `<p class="mrare-next">✨ Rare treasures come every 2nd visit. Next: ${t.e} <b>${esc(t.name)}</b> (${fmt(t.cost[g === 'k' ? 0 : 1])}) on farm day ${F.merchantNext(f, true)}.${f.goal === 'treasure:' + next ? ' ⭐ Your saving goal.' : ` <button class="btn ghost" data-act="fTreasureGoal" data-arg="${next}">⭐ Save up</button>`}</p>`; }
    }
    K().modal(`<div class="mhead"><span class="mh-wagon">${MQ.wagonArt()}</span><span><span class="mtitle">${esc(F.MERCHANT.name)}</span><small class="muted">The traveling merchant · ${n ? `leaves in ${n} ${n === 1 ? 'night' : 'nights'}` : '<b>leaves tonight!</b>'}</small></span></div>
      <h3 class="mh3">✨ Week charms</h3><p class="muted small">Magic for ${F.CHARM_NIGHTS} days. Used well, it brings back more than it costs.</p>
      <div class="mcharms">${charms}</div>
      ${rare}
      <p class="muted">You have <b>${fmt(f.money)}</b> in your wallet. He comes back on farm day ${F.merchantNext(f)}.</p>
      <div class="row"><button class="btn ghost" data-act="closeModal">Maybe later</button></div>`);
    MQ.sfx('shimmer');
  }
  function buyTreasure() {
    const f = fm(), g = grade(), id = F.merchantNow(f), t = id && F.TREASURES[id];
    K().closeModal();
    if (!t || f.money < t.cost[g === 'k' ? 0 : 1]) return;
    startPay(t.cost[g === 'k' ? 0 : 1], `the ${t.e} ${esc(t.name)}`, () => {
      const x = F.buyTreasure(fm(), grade());
      if (!x) return 'He already left.';
      MQ.confetti(200, { colors: ['#ffd23f', '#ff8fe0', '#9ff0ff', '#7ed957'], shape: 'star' });
      MQ.sfx('fanfare');
      return `✨ The ${x.e} <b>${esc(x.name)}</b> is yours, for good! ${esc(F.treasureNote(id, grade(), fmt))}`;
    }, MQ.treasureArt(id));
  }
  function buyCharm(id) {
    const f = fm(), m = F.merchantHere(f), cost = m && m.cost[id];
    K().closeModal();
    if (!m || !F.merchantWares(f).charms.includes(id) || f.money < cost) return;
    startPay(cost, `the ${F.CHARMS[id].e} ${esc(F.charmName(id, m.a))}`, () => {
      const x = F.buyCharm(fm(), grade(), id);
      if (!x) return 'He already left.';
      MQ.confetti(140, { colors: id === 'clover' ? ['#7ed957', '#ffd23f', '#ffffff'] : id === 'sun' ? ['#ffd23f', '#ff9a2e', '#fff3a6'] : id === 'piggy' ? ['#ffd23f', '#ffe066', '#ff8fb3'] : ['#ff8fe0', '#9d7bff', '#ffd23f', '#9ff0ff'], shape: 'star' });
      MQ.sfx('fanfare');
      return id === 'myth' ? `🌟 Your ${esc(F.MYTHS[x.a].of)} are <b>${esc(F.MYTHS[x.a].many)}</b> now, for ${F.CHARM_NIGHTS} nights! Feed them every day.`
        : id === 'piggy' ? '🐷 The Golden Piggy is waiting for bank day: the bank will pay your interest twice!'
          : `${x.e} The <b>${esc(x.name)}</b> works for ${F.CHARM_NIGHTS} days, starting now!`;
    }, charmPic(id, m.a));
  }
  // The charms working now, on the farm: how long they work and what they brought so far.
  function charmStrip() {
    const f = fm(), g = grade(), on = Object.keys(f.charms || {}).filter((id) => id !== 'piggy' && F.charmOn(f, id));
    const chip = (id) => {
      const c = f.charms[id], left = c.until - f.day;
      return `<button class="fcharm c-${id}" data-act="fCharm" data-arg="${id}"><span class="fc-pic">${id === 'myth' ? MQ.mythArt(c.a, { aura: false }) : MQ.charmArt(id)}</span><span class="fc-t"><b>${esc(id === 'myth' ? F.MYTHS[c.a].many : F.CHARMS[id].name)}</b><small>${left === 1 ? 'Last day!' : `${left} days left`} · +${fmt(F.charmGot(c, g))}</small></span></button>`;
    };
    const piggy = F.piggyWaiting(f) ? `<button class="fcharm c-piggy" data-act="fCharm" data-arg="piggy"><span class="fc-pic">${MQ.charmArt('piggy')}</span><span class="fc-t"><b>Golden Piggy</b><small>Bank day: interest × 2</small></span></button>` : '';
    return on.length || piggy ? `<div class="fcharms">${on.map(chip).join('')}${piggy}</div>` : '';
  }
  function charmInfo(id) {
    const f = fm(), g = grade(), c = (f.charms || {})[id];
    if (id === 'piggy') return K().modal(`<div class="tcard c-piggy"><div class="dbuilt-rays"></div><div class="tpic">${MQ.charmArt('piggy')}</div><div class="mtitle">🐷 Golden Piggy</div><p>On the next bank day the bank pays your interest twice. Save more before bank day, and the piggy brings more!</p></div><div class="row"><button class="btn" data-act="closeModal">OK</button></div>`);
    if (!c || !F.charmOn(f, id)) return;
    const left = c.until - f.day, got = F.charmGot(c, g);
    K().modal(`<div class="tcard c-${id}"><div class="dbuilt-rays"></div><div class="tpic">${charmPic(id, c.a)}</div><div class="mtitle">${F.CHARMS[id].e} ${esc(id === 'myth' ? F.MYTHS[c.a].many : F.CHARMS[id].name)}</div>
      <p>${esc(F.charmNote(id, g, fmt, c.a))}</p></div>
      <p>It works ${left === 1 ? '<b>today only</b> (its last day)' : `<b>${left} more days</b>`}. It cost <b>${fmt(c.cost)}</b>, and so far it brought <b>+${fmt(got)}</b>${got > c.cost ? ': it already paid for itself! 🎉' : '.'}</p>
      <div class="row"><button class="btn" data-act="closeModal">OK</button></div>`);
  }
  // The morning a charm's week is over: what it cost and what it brought, and a question: did it pay off?
  let charmEnds = [];
  function charmEndBlock(x, k) {
    const name = x.id === 'myth' ? F.charmName('myth', x.a) : F.CHARMS[x.id].name;
    const what = x.id === 'myth' ? `in ${esc(F.ITEMS[F.MYTHS[x.a].item].many)}` : x.id === 'clover' ? 'in tips' : 'in crops';
    return `<div class="mcend c-${x.id}"><span class="mc-pic">${charmPic(x.id, x.a)}</span><span class="mc-t"><b>${F.CHARMS[x.id].e} ${esc(name)} is over.</b><small>It cost ${fmt(x.cost)} and brought ${fmt(x.got)} more ${what}.</small></span><button class="btn" data-act="fProfit" data-arg="${k}">🧮 Did it pay off?</button></div>`;
  }
  function startProfit(k) {
    const x = charmEnds[k], g = grade();
    K().closeModal();
    if (!x) return;
    const name = x.id === 'myth' ? F.charmName('myth', x.a) : F.CHARMS[x.id].name, win = x.got - x.cost;
    fs = { mode: 'profit', n: 0, earned: 0, tips: 0, xp: 0, back: 'farm',
      done: () => (win > 0 ? `💰 That is your <b>profit</b>: the ${esc(name)} brought ${fmt(win)} more than it cost.` : `It brought ${fmt(-win)} ${win ? 'less than it cost' : 'just what it cost'}. Next time, use it more: ${x.id === 'myth' ? 'feed the animals every day' : x.id === 'clover' ? 'sell a lot at the stand' : 'plant every bed'}!`) };
    const p = win > 0
      ? { type: 'profit', text: `The ${F.CHARMS[x.id].e} <b>${esc(name)}</b> cost <b>${fmt(x.cost)}</b>. It brought <b>${fmt(x.got)}</b> more. How much more did it bring than it cost? That is the <b>profit</b>.`, hint: `Take away what it cost: ${fmt(x.got)} − ${fmt(x.cost)}.`, explain: `${fmt(x.got)} − ${fmt(x.cost)} = ${fmt(win)}`, sale: {}, total: 0 }
      : { type: 'profit', text: `The ${F.CHARMS[x.id].e} <b>${esc(name)}</b> cost <b>${fmt(x.cost)}</b>. It brought <b>${fmt(x.got)}</b> more. <b>Did it pay off?</b>`, hint: `Is ${fmt(x.got)} more than ${fmt(x.cost)}?`, explain: `${fmt(x.got)} is ${win ? 'less than' : 'the same as'} ${fmt(x.cost)}, so it didn’t pay off`, sale: {}, total: 0, kind: 'choice', answer: 'No, it didn’t', choices: ['Yes, it did', 'No, it didn’t'] };
    if (win > 0) Object.assign(p, win < 100 || g === 'k' ? { kind: 'num', answer: win, unit: '¢' } : { kind: 'choice', answer: fmt(win), choices: F.moneyChoices(win, g, [x.got + x.cost, x.got, x.cost]) });
    show(p);
  }

  function dreamIntro() {
    const f = fm(), d = F.dreamNow(f);
    f.dream.seen = true;
    save();
    if (!d) return;
    const n = F.dreamNext(f, grade());
    K().modal(`<div class="dbuilt t-${d.id}"><div class="dbuilt-rays"></div><div class="dpic">${MQ.dreamArt(d.id, d.stages.length)}</div><div class="dbuilt-t">✨ New: <b>Big Dreams</b></div></div>
      <p>Save money <b>in the bank</b> and build big things, one stage at a time. The first one is a ${d.e} <b>${esc(d.name)}</b>.</p>
      <ul class="funlocks"><li>🏦 The builders are paid <b>from the bank</b>, so save money there.</li><li>🌙 They build at night. In the morning the new part is on your farm.</li><li>💰 Every built stage <b>earns money every bank day</b>, straight into the bank.</li></ul>
      <p class="muted">First stage: ${n.st.e} ${esc(n.st.name)} for <b>${fmt(n.cost)}</b>.</p>
      <div class="row"><button class="btn ghost" data-act="closeModal">Later</button><button class="btn" data-act="go" data-arg="farm:dreams">🏗️ See my Big Dream</button></div>`);
    MQ.sfx('streak');
  }
  let dreamView = null; // which dream the Big Dreams screen shows (null = the one being built)
  function dreams() {
    const f = fm(), g = grade(), gi = g === 'k' ? 0 : 1, cur = f.dream.p;
    const k = dreamView === null ? Math.min(cur, F.DREAMS.length - 1) : dreamView, d = F.DREAMS[k];
    const built = F.dreamBuilt(f, k), isCur = k === cur, building = isCur && f.dream.b;
    const tab = (x, i) => {
      const nb = F.dreamBuilt(f, i), done = nb >= x.stages.length, now = i === cur;
      return `<button class="dtab t-${x.id} ${i === k ? 'sel' : ''} ${done ? 'done' : now ? 'now' : 'later'}" data-act="fDreamView" data-arg="${i}"><span class="dtab-pic">${MQ.dreamArt(x.id, i > cur ? x.stages.length : nb)}</span><b>${esc(x.name)}</b><small>${done ? '✓ Built' : now ? `${nb} / ${x.stages.length} built` : '🔒 Later'}</small></button>`;
    };
    const stages = d.stages.map((x, i) => {
      const state = i < built ? 'built' : isCur && i === built ? (building ? 'work' : 'next') : 'later';
      const pay = x.pay[gi];
      return `<li class="${state}"><span class="dst-e">${state === 'built' ? '✅' : state === 'work' ? '🏗️' : x.e}</span><span class="dst-t"><b>${esc(x.name)}</b><small>${pay ? `earns ${fmt(pay)} every bank day` : d.castle ? 'part of your castle' : ''}</small></span><span class="dst-p">${state === 'built' ? 'Built' : fmt(x.cost[gi])}</span></li>`;
    }).join('');
    let action = '', lesson = '';
    if (!isCur) action = k < cur ? `<p class="dnote ok">✓ Built! ${d.stages[0].pay[gi] ? `It earns ${fmt(U.sum(d.stages.map((x) => x.pay[gi])))} every bank day.` : 'Your very own castle 👑'}</p>` : `<p class="dnote">🔒 Opens when you finish ${esc(F.DREAMS[k - 1].name)}.</p>`;
    else {
      const n = F.dreamNext(f, g), left = n.cost - f.bank.bal;
      if (building) action = `<p class="dnote work">🏗️ The builders are working on <b>${n.st.e} ${esc(n.st.name)}</b>. Tap 🌙 Sleep on the farm to make the night pass!</p>`;
      else if (left <= 0) action = `<button class="btn big dbuild" data-act="fBuild">🏗️ Pay the builders · ${fmt(n.cost)} from the bank</button><p class="muted center">You have ${fmt(f.bank.bal)} in the bank.</p>`;
      else action = `<div class="dsave"><span class="fbar"><span style="width:${Math.round((f.bank.bal / n.cost) * 100)}%"></span></span>
          <p>In the bank: <b>${fmt(f.bank.bal)}</b> of <b>${fmt(n.cost)}</b> · <b>${fmt(left)}</b> more to save</p>
          <p class="muted">The builders are paid from the bank, not from your wallet.${f.money ? ` You have ${fmt(f.money)} in your wallet: put it in the bank!` : ''}${f.dep && f.dep.amt ? ` Your locked deposit (${fmt(F.depositBack(f.dep.amt))}) comes back on farm day ${f.dep.until}.` : ''}</p>
          <button class="btn" data-act="go" data-arg="farm:bank">🏦 Go to the bank</button></div>`;
      if (n.pay) {
        // the same money kept in the bank, at the bank's usual interest (10¢ a dollar; kindergarten 1¢ for every 10¢):
        // a simple comparison, without the account limits
        const [per, add] = F.bankRule(g), inBank = Math.floor(n.cost / per) * add;
        lesson = `<section class="dlesson"><b>💡 Bank or building?</b>
          <p>${n.st.e} ${esc(n.st.name)} earns <b>${fmt(n.pay)}</b> every bank day. It pays for itself in <b>${F.payback(n.cost, n.pay)} bank days</b>, and after that it is all profit.</p>
          <p>Kept in the bank, ${fmt(n.cost)} would earn <b>${fmt(inBank)}</b> a bank day (${g === 'k' ? '1¢ for every 10¢' : '10¢ for every dollar'}), and you could take it out any time. Spent on the building, the money is gone, but the building earns every bank day.</p></section>`;
      } else if (d.castle) lesson = '<section class="dlesson castle"><b>👑 The biggest dream</b><p>The castle doesn’t earn money. Your orchard, cottage and railway help you save for it. Build it because it is amazing!</p></section>';
    }
    const inc = F.dreamIncome(f, g), all = U.sum(inc.map((x) => x[2]));
    K().render(header('🏗️ Big Dreams', 'farm') + `<main class="farm fdreams">
      <div class="dpath">${F.DREAMS.map(tab).join('')}</div>
      <section class="dbig t-${d.id} ${built >= d.stages.length ? 'done' : ''}">
        <div class="dpic ${k > cur ? 'later' : ''}">${MQ.dreamArt(d.id, k > cur ? d.stages.length : built, { building })}</div>
        <h2>${d.e} ${esc(d.name)}</h2>
        <p class="muted">${esc(d.blurb)}</p>
        <ol class="dstages">${stages}</ol>
        ${action}
      </section>
      ${lesson}
      ${all ? `<section class="flevel dincome"><b>💰 Your buildings earn ${fmt(all)} every bank day</b><ul>${inc.map(([e, nm, x]) => `<li>${e} ${esc(nm)} <b>${fmt(x)}</b></li>`).join('')}</ul><small class="muted">It goes into the bank on bank day. Next bank day: in ${F.nightsToBankDay(f.day)} ${F.nightsToBankDay(f.day) === 1 ? 'night' : 'nights'}.</small></section>` : ''}
    </main>`, 'is-farm');
    K().setCur('farm:dreams');
  }
  // Paying the builders is a bank transfer: how much will be left in the bank?
  function startBuild() {
    const f = fm(), g = grade();
    if (!F.canBuild(f, g)) return dreams();
    const n = F.dreamNext(f, g), bal = f.bank.bal, left = bal - n.cost;
    fs = { mode: 'build', n: 0, earned: 0, tips: 0, xp: 0, back: 'farm:dreams',
      done: () => { const x = F.payBuilders(fm(), grade()); return x ? `🏗️ The builders got <b>${fmt(x.cost)}</b> from the bank. They will build ${x.st.e} ${esc(x.st.name)} tonight. Tap 🌙 Sleep on the farm!` : 'The builders are already working.'; } };
    const p = { type: 'build', text: `The builders want <b>${fmt(n.cost)}</b> for ${n.st.e} <b>${esc(n.st.name)}</b>. You have <b>${fmt(bal)}</b> in the bank. How much will be <b>left in the bank</b> after you pay them?`,
      hint: g === 'k' ? 'Take away the builders’ money: count back.' : 'Take away the dollars first, then the cents.', explain: `${fmt(bal)} − ${fmt(n.cost)} = ${fmt(left)}`, sale: {}, total: 0 };
    Object.assign(p, left < 100 ? { kind: 'num', answer: left, unit: '¢' } : { kind: 'choice', answer: fmt(left), choices: F.moneyChoices(left, g, [bal + n.cost, Math.max(0, left - 100), left + 100]) });
    show(p);
  }

  // ---------------------------------------------------------------- shop
  const TABS = [['animals', '🐔 Animals & feed'], ['up', '⬆️ Upgrades'], ['farm', '🏡 Farm'], ['decor', '✨ Decorations']];
  function shop() {
    const f = fm(), list = F.shop(f, grade()).filter((x) => x.tab === tab);
    const row = (x) => {
      // things to save up for: too expensive now, or not open yet (a goal for later levels)
      const goal = f.goal === x.id ? '<span class="fown">⭐ Goal</span>' : `<button class="btn ghost" data-act="fGoal" data-arg="${x.id}">⭐ Save up</button>`;
      let btn;
      if (x.owned && x.id === 'helper') btn = `<button class="btn ghost" data-act="fHelper">${f.helper.on ? 'Pause' : 'Back to work'}</button>`;
      else if (x.owned) btn = '<span class="fown">✓ Yours</span>';
      else if (x.locked) btn = `<span class="flock">🔒 Level ${x.lv}</span>${x.tab === 'animals' && x.id.startsWith('feed') ? '' : goal}`;
      else if (x.blocked) btn = `<span class="flock">${esc(x.blocked)}</span>`;
      else if (f.money >= x.price) btn = `<button class="btn" data-act="fBuy" data-arg="${x.id}">Buy</button>`;
      else btn = goal;
      return `<div class="fitem ${x.locked ? 'locked' : ''}"><span class="fe">${x.id.startsWith('decor:') ? SC.icon(x.id.slice(6), x.e) : x.e}</span>
        <span class="fitem-t"><b>${esc(x.name)}</b>${x.note ? `<small>${esc(x.note)}</small>` : ''}</span>
        <span class="fside"><span class="fprice">${x.owned ? '' : fmt(x.price)}</span>${btn}</span></div>`;
    };
    // the animals tab: feed, then your pens (sell to make room), then the animals to buy
    const feed = tab === 'animals' ? list.filter((x) => x.id.startsWith('feed:')) : [];
    const rows = feed.length ? `${feed.map(row).join('')}</div>${myPens()}<h2>🐾 Animals</h2><div class="fitems">${list.filter((x) => !feed.includes(x)).map(row).join('')}` : list.map(row).join('');
    K().render(header('🛒 Farm Shop', 'farm') + `<main class="farm">
      <div class="ftabs" role="tablist">${TABS.map(([id, n]) => `<button class="chip ${tab === id ? 'sel' : ''}" role="tab" aria-selected="${tab === id}" data-act="fTab" data-arg="${id}">${n}</button>`).join('')}</div>
      ${goalBar()}
      <p class="muted">${tab === 'up' ? 'Your farm has room for 6 garden beds and 6 pens. Make them better: more crops, faster growth, more animals in each pen.' : 'You pay with coins and bills, like in a real store. Tap ⭐ Save up to make something your goal.'}</p>
      <div class="fitems">${rows}</div>
    </main>`, 'is-farm');

  // ---------------------------------------------------------------- playing: stand, odd jobs, paying
  // Money to tap when paying: kindergarten pennies, nickels, dimes (and quarters for big prices); 2nd grade
  // coins and $1 bills, plus $5, $10, $20 bills for big prices.
  function payKinds(price) {
    if (grade() === 'k') return price >= 25 ? ['q', 'd', 'n', 'p'] : ['d', 'n', 'p'];
    const k = ['b', 'q', 'd', 'n', 'p'];
    if (price >= 300) k.unshift('f');
    if (price >= 1000) k.unshift('t', 'w');
    return k;
  }
  function startPay(price, what, done, icon = '', words = null) {
    fs = { mode: 'pay', what, done, icon, n: 0, earned: 0, tips: 0, xp: 0 };
    const way = `One way: ${F.fewest(price, payKinds(price)).map((k) => fmt(F.COINV[k])).join(' + ')} = ${fmt(price)}`;
    const p = { kind: 'coins', pay: true, target: price, coinKinds: payKinds(price), text: `Pay <b>${fmt(price)}</b> for ${what}. Tap your coins${grade() === 'k' ? '' : ' and bills'}, then tap Pay.`, hint: 'Start with the biggest money that fits, then add smaller coins.', explain: way, total: price };
    if (words) Object.assign(p, { text: words.text, hint: words.hint, explain: `${words.explain}. ${way}` });
    show(p);
  }
  function startMarket() {
    if (!F.basketCount(fm())) return K().toast('The basket is empty');

  function startJobs() {

  function nextCustomer() {

    const truck = !jobs && !vip && (f.customers + 1) % F.TRUCK_EVERY === 0;
    const p = F.customer(f, grade(), { stock: jobs ? F.jobStock(f) : f.basket, vip, jobs, truck });
    if (!p) return summary(true);
    show(p);

  // At the stand: what was in the basket when the stand opened, how much is sold and how much is left, per thing.

  function basketBar() {

    const left = U.sum(ids.map((id) => f.basket[id] || 0)), sold = U.sum(ids.map((id) => fs.sold[id] || 0)), all = left + sold;
    const chips = ids.map((id) => {

      return `<li class="${l ? '' : 'out'} ${want.has(id) ? 'want' : ''}" title="${esc(F.ITEMS[id].many)}: ${n} sold, ${l} left"><i>${F.ie(id)}</i><b>${l ? l : '✓'}</b>${n ? `<small>${n} sold</small>` : ''}</li>`;
    }).join('');
    return `<section class="fbbar" id="fbbar" aria-label="Basket: ${sold} sold, ${left} left">
      <div class="fbbar-t"><span>🧺 Sold <b>${sold}</b> of ${all}</span><span><b>${left}</b> left to sell</span></div>
      <span class="fbar"><span style="width:${all ? Math.round((sold / all) * 100) : 0}%"></span></span>
      <ul>${chips}</ul></section>`;
  }
  const redrawBasket = () => { const el = $('#fbbar'); if (el) el.outerHTML = basketBar(); };
  function show(p) {
    if ($('.scene')) backY = window.scrollY;
    Object.assign(fs, { p, tries: 0, input: '', tray: [], locked: false, step: 'main', pick: null });
    const f = fm(), tiers = F.tiers(grade()), tier = tiers[(p.tier || f.tier) - 1];
    const status = STATUS[fs.mode] ? STATUS[fs.mode]() : fs.mode === 'jobs' ? `🧹 Odd jobs · ${fs.n} done · +${fmt(fs.earned)}` : `🏪 Customer ${fs.n + 1} · +${fmt(fs.earned + fs.tips)}`;
    const label = fs.label ? fs.label : LABEL[fs.mode] ? LABEL[fs.mode] : p.vip ? '⭐ Challenge customer · big tip' : p.truck ? '🚚 Buys a lot at once' : `🧮 ${esc(tier.name)}${tier.ahead ? ' ⭐' : ''}`;
    const intro = fs.mode === 'jobs' ? '<small class="muted">At the big Farmers’ Market:</small><br>' : '';
    const stall = fs.mode === 'pay'

    K().render(`<div class="play fplay" style="--wc:${p.vip ? '#b0569e' : '#e0a21b'}">

        <div class="fcust"><div class="ptext wordy">${intro}${p.who ? `<b>${esc(p.who[1])}</b> ` : ''}${p.text}</div></div>

    if (st().settings.readAloud) speakIt();

  const speakIt = () => { const p = fs && fs.p; if (p) MQ.speak(((p.who ? p.who[1] + ' ' : '') + MQ.toSpeech(p.text)).replace(/\$(\d+)\.(\d\d)/g, (_, d, c) => F.spoken(+d * 100 + +c, 'g2')).replace(/(\d+)¢/g, '$1 cents')); };
  const BANKISH = new Set(['deposit', 'withdraw', 'interest', 'lock', 'unlock']);
  const STATUS = {

    make: () => `${F.WORKS[fs.work].e} ${esc(F.WORKS[fs.work].name)}`,
    sell: () => `${F.NEIGHBOR[0]} Selling to ${esc(F.NEIGHBOR[1])}`,
    deposit: () => `🏦 Bank: ${fmt(fm().bank.bal)}`,
    withdraw: () => `🏦 Bank: ${fmt(fm().bank.bal)}`,
    interest: () => `🏦 Bank day · ${fs.n + 1} of ${fs.weeks}`, // fs.n counts the questions done
    build: () => `🏦 Bank: ${fmt(fm().bank.bal)}`,
    lock: () => `🏦 Bank: ${fmt(fm().bank.bal)}`,
    unlock: () => `🏦 Bank: ${fmt(fm().bank.bal)}`,
    profit: () => '🧳 A week charm',
  };
  const LABEL = { pay: '🛒 Farm Shop', make: '🧮 Is it worth making?', sell: '💰 Selling animals', deposit: '🏦 Put money in the bank', withdraw: '🏦 Take money out', interest: '🏦 Bank day: interest', build: '🏗️ Pay the builders', lock: '🔒 Locked deposit', unlock: '🔓 Your deposit is back', profit: '🧮 Did it pay off?' };
  // the problem being answered now (paying too much asks for the change)
  const cur = () => (fs.step === 'change' ? fs.change : fs.p);
  function drawAnswer() {
    const p = cur(), box = $('#fanswer'), step = $('#fstep');

    let top = fs.step === 'change' ? `<div class="fchange">${fs.change.text}</div>` : '';

      box.innerHTML = fs.locked ? lockedHtml() : `<div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((k) => `<button class="key" data-act="fKey" data-arg="${k}">${k}</button>`).join('')}<button class="key alt" data-act="fKey" data-arg="back" aria-label="Delete">⌫</button><button class="key" data-act="fKey" data-arg="0">0</button><button class="key go" data-act="fCheck">Check</button></div>`;

      box.innerHTML = fs.locked ? lockedHtml() : `<div class="choices n${p.choices.length}">${p.choices.map((c, i) => `<button class="choice" data-act="fChoose" data-arg="${i}">${esc(c)}</button>`).join('')}</div>`;
    } else {
      const tray = fs.tray.length ? fs.tray.map((k, i) => `<button class="fcoin" data-act="fUncoin" data-arg="${i}" aria-label="Take back ${V.COIN[k].name}" ${fs.locked ? 'disabled' : ''}>${V.coins([k], true)}</button>`).join('') : `<span class="muted">${p.pay || p.free ? 'Your money goes here' : 'Tap coins below'}</span>`;
      top += `<div class="ftray" aria-label="Picked money">${tray}</div>`;
      box.innerHTML = fs.locked ? lockedHtml() : `<div class="fpalette">${p.coinKinds.map((k) => `<button class="fcoin big" data-act="fCoin" data-arg="${k}" aria-label="${V.COIN[k].name}">${V.coins([k], true)}</button>`).join('')}</div>
        <div class="row"><button class="btn ghost" data-act="fClear" ${fs.tray.length ? '' : 'disabled'}>Clear</button><button class="btn" data-act="fCheck" ${fs.tray.length ? '' : 'disabled'}>${p.go || (p.pay ? 'Pay' : 'Done')} ✓</button></div>`;
    }
    step.innerHTML = top;
  }
  const NEXT = { pay: 'Back to the farm', make: 'Back to the farm', sell: 'Done', deposit: 'Back to the bank', withdraw: 'Back to the bank', build: 'Back to Big Dreams', lock: 'Back to the bank', unlock: 'Back to the bank', profit: 'Back to the farm' };
  const lockedHtml = () => `<div class="row"><button class="btn big" data-act="fNext">${fs.mode === 'interest' ? (fs.n < fs.weeks ? 'Next' : 'Back to the bank') : NEXT[fs.mode] || 'Next customer'} →</button></div>`;
  function feedback(html, cls) {
    const el = $('#feedback');
    if (el) el.innerHTML = `<div class="fb ${cls}">${html}</div>`;
  }
  function check(given) {
    if (!fs || fs.locked) return;
    const p = cur();
    // The bank: any amount the child picks (up to what they have). Saving asks to count it first.
    if (p.free && p.kind === 'coins' && fs.step === 'main') {
      const sum = F.sumCoins(given);
      if (!sum || sum > p.limit) return K().toast(`You can use up to ${fmt(p.limit)}`);
      fs.amount = sum;
      if (fs.mode === 'withdraw') return withdrawn();
      fs.change = Object.assign({ text: `How much money are you putting in the bank?`, hint: 'Start with the money worth the most, then count on.', explain: `${given.slice().sort((a, b) => F.COINV[b] - F.COINV[a]).map((k) => fmt(F.COINV[k])).join(' + ')} = ${fmt(sum)}` }, grade() === 'k' || sum < 100 ? { kind: 'num', answer: sum } : { kind: 'choice', answer: fmt(sum), choices: F.moneyChoices(sum, grade()) });
      fs.step = 'change';
      fs.input = '';
      MQ.sfx('coin');
      return drawAnswer();
    }
    // Paying: too much money is fine in 2nd grade (then: how much change?); kindergarten pays the exact amount.
    if (p.pay && p.kind === 'coins') {
      const sum = F.sumCoins(given);
      if (sum > p.target && grade() !== 'k' && fs.tries < 2) {
        const C = sum - p.target;
        fs.paid = sum;
        fs.change = Object.assign({ text: `You gave <b>${fmt(sum)}</b>. How much <b>change</b> do you get back?`, hint: `Count up from ${fmt(p.target)} to ${fmt(sum)}.`, explain: `${fmt(sum)} − ${fmt(p.target)} = ${fmt(C)}` }, C < 100 ? { kind: 'num', answer: C } : { kind: 'choice', answer: fmt(C), choices: F.moneyChoices(C, grade()) });

    if (fs.tries < 2) {

  function right() {

  function reveal() {

  // A customer or an odd job is done.

  function key(k) {

  // ---------------------------------------------------------------- the bank
  function bank() {
    const f = fm(), g = grade(), b = f.bank, due = F.bankDue(f), nights = F.nightsToBankDay(f.day);
    if (F.depositCheck(f, g)) save();

    const LOG = { in: ['⬇️', 'Saved'], out: ['⬆️', 'Took out'], interest: ['✨', 'Interest'], piggy: ['🐷', 'Golden Piggy: interest again'], build: ['🏗️', 'Paid the builders'], dream: ['🏡', 'Your buildings earned'], lock: ['🔒', 'Locked in a deposit'], unlock: ['🔓', 'Deposit came back'] };

    K().render(header('🏦 Farm Bank', 'farm') + `<main class="farm fbank">

      ${due > 0 ? `<button class="btn big fstand" data-act="fInterest">✨ Collect your interest${inc ? ' and what your buildings earned' : ''}${due > 1 ? ` (${due} bank days)` : ''}</button>` : ''}
      <div class="row"><button class="btn" data-act="fDeposit" ${f.money ? '' : 'disabled'}>⬇️ Save money</button><button class="btn ghost" data-act="fWithdraw" ${b.bal ? '' : 'disabled'}>⬆️ Take money out</button></div>
      ${dreamJar()}
      ${depositCard()}
      ${accountCard()}
      <section class="flevel"><b>How the bank works</b>
        <p>${esc(F.ruleText(g, b.acct))} The money is safe in the bank, and you can take it out any time to spend it.</p>
        <p class="muted">On the morning of bank day the bank looks at what you have saved, and the interest is for that money. If you miss bank days, up to ${F.BANK_MISSED} wait for you.</p></section>

    </main>`, 'is-farm');

  }
  // The locked deposit (2nd grade): lock savings in $5 steps for 4 bank weeks; every $5 comes back as $6.
  let depAmt = 0;
  function depositCard() {
    const f = fm(), g = grade(), d = f.dep;
    if (!F.depositOn(f, g)) return '';
    const D = F.DEPOSIT, top = F.bankTop(f.bank.acct, g), ready = F.depositReady(f);
    let body;
    if (ready) body = `<p>Unlocked! You locked <b>${fmt(d.amt)}</b> and <b>${fmt(F.depositBack(d.amt))}</b> comes back to your savings.</p><button class="btn big fdep-go" data-act="fDepCollect">🔓 Collect ${fmt(F.depositBack(d.amt))}</button>`;
    else if (d.amt) {
      const left = d.until - f.day, passed = D.weeks - Math.ceil(left / F.BANK_WEEK);
      body = `<p><b>${fmt(d.amt)}</b> is locked. On bank day, farm day ${d.until} (in ${left} ${left === 1 ? 'night' : 'nights'}), you get <b>${fmt(F.depositBack(d.amt))}</b> back.</p>
        <div class="fdep-weeks" aria-label="${passed} of ${D.weeks} bank weeks">${Array.from({ length: D.weeks }, (_, i) => `<i class="${i < passed ? 'on' : ''}">🏦</i>`).join('')}</div>
        <p class="muted">It can’t be taken out early. Then it goes back to your savings.</p>`;
    } else {
      const max = Math.floor(f.bank.bal / D.step) * D.step;
      if (max < D.step) body = `<p>Lock savings for ${D.weeks} bank weeks: for every <b>${fmt(D.step)}</b>, the bank gives back <b>${fmt(D.back)}</b>.</p><p class="muted">Save at least ${fmt(D.step)} in the bank to start one.</p>`;
      else {
        if (!depAmt || depAmt > max) depAmt = Math.min(max, Math.max(D.step, Math.floor((f.bank.bal - top) / D.step) * D.step));
        const keep = f.bank.bal - depAmt;
        body = `<p>Lock savings for <b>${D.weeks} bank weeks</b>. For every <b>${fmt(D.step)}</b> you lock, the bank gives back <b>${fmt(D.back)}</b>. You can’t take it out early.</p>
          <div class="fdep-pick"><button class="iconbtn" data-act="fDepAmt" data-arg="-1" ${depAmt <= D.step ? 'disabled' : ''} aria-label="Less">−</button><b>${fmt(depAmt)}</b><button class="iconbtn" data-act="fDepAmt" data-arg="1" ${depAmt + D.step > max ? 'disabled' : ''} aria-label="More">+</button></div>
          ${keep < top ? `<p class="fdep-tip">💡 Savings up to ${fmt(top)} already earn 10¢ for every dollar each week, more than a deposit. Lock only what is above ${fmt(top)}: that part earns just 1¢.</p>` : ''}
          <button class="btn big fdep-go" data-act="fDepLock">🔒 Lock ${fmt(depAmt)} for ${D.weeks} bank weeks</button>`;
      }
    }
    return `<section class="fdep ${ready ? 'ready' : d.amt ? 'locked' : ''}"><div class="fdep-pic">${MQ.vaultArt(ready)}</div><div class="fdep-t"><b>${ready ? '🔓' : '🔒'} Locked deposit</b>${body}</div></section>`;
  }
  function startLock() {
    const f = fm(), g = grade(), amt = depAmt, back = F.depositBack(amt), n = amt / F.DEPOSIT.step;
    if (!F.depositOn(f, g) || f.dep.amt || amt > f.bank.bal) return bank();
    fs = { mode: 'lock', n: 0, earned: 0, tips: 0, xp: 0, back: 'farm:bank',
      done: () => (F.lockDeposit(fm(), grade(), amt) ? `🔒 <b>${fmt(amt)}</b> is locked until bank day, farm day ${fm().dep.until}. Then you get <b>${fmt(back)}</b> back!` : 'It is already locked.') };
    show({ type: 'deposit', kind: 'choice', answer: fmt(back), choices: F.moneyChoices(back, g, [amt + 100, amt, back + F.DEPOSIT.step]),
      text: `You lock <b>${fmt(amt)}</b> for ${F.DEPOSIT.weeks} bank weeks. For every <b>${fmt(F.DEPOSIT.step)}</b>, the bank gives back <b>${fmt(F.DEPOSIT.back)}</b>. <b>How much do you get back?</b>`,
      hint: `How many ${fmt(F.DEPOSIT.step)} are in ${fmt(amt)}? Each one comes back as ${fmt(F.DEPOSIT.back)}.`,
      explain: `${fmt(amt)} is ${n} × ${fmt(F.DEPOSIT.step)}, so you get ${n} × ${fmt(F.DEPOSIT.back)} = ${fmt(back)}`, sale: {}, total: 0 });
  }
  function startUnlock() {
    const f = fm(), g = grade();
    if (!F.depositReady(f)) return bank();
    const back = F.depositBack(f.dep.amt), bal = f.bank.bal, ans = bal + back;
    fs = { mode: 'unlock', n: 0, earned: 0, tips: 0, xp: 0, back: 'farm:bank',
      done: () => { const x = F.collectDeposit(fm()); MQ.confetti(140, { colors: ['#ffd23f', '#ffe066', '#9d7bff'], shape: 'star' }); return x ? `🔓 <b>${fmt(x.back)}</b> is back in your savings: <b>${fmt(x.back - x.amt)}</b> more than you locked! Now you have <b>${fmt(fm().bank.bal)}</b>.` : ''; } };
    show(Object.assign({ type: 'deposit', text: `Your locked deposit unlocked! <b>${fmt(back)}</b> goes back to your savings. You have <b>${fmt(bal)}</b> in the bank now. <b>How much will you have?</b>`,
      hint: `Add ${fmt(back)} to ${fmt(bal)}.`, explain: `${fmt(bal)} + ${fmt(back)} = ${fmt(ans)}`, sale: {}, total: 0 }, ans < 100 ? { kind: 'num', answer: ans, unit: '¢' } : { kind: 'choice', answer: fmt(ans), choices: F.moneyChoices(ans, g, [bal, back]) }));
  }
  // The bank is the Big Dream's piggy bank: how much of the next stage is saved.
  function dreamJar() {
    const f = fm(), g = grade(), n = F.dreamOpen(f) && F.dreamNext(f, g);
    if (!n) return '';
    const left = n.cost - f.bank.bal;
    return `<button class="fdreamjar t-${n.d.id}" data-act="go" data-arg="farm:dreams"><span>🏗️</span><span><b>Saving for: ${n.st.e} ${esc(n.st.name)}</b> (${esc(n.d.name)})<small>${f.dream.b ? 'The builders are working on it tonight.' : left > 0 ? `${fmt(n.cost)} · ${fmt(left)} to go` : `${fmt(n.cost)} · you have enough! Pay the builders 🎉`}</small></span></button>`;
  }
  // All time: how much the child saved and took out, how much the bank added, and what the money in the bank is made of.
  function bankSummary() {
    const s = F.bankSummary(fm());
    if (!s.saved) return '';
    const tile = (cls, label, v) => `<div class="${cls}"><small>${label}</small><b>${fmt(v)}</b></div>`;
    return `<h2>📊 My savings, all time</h2><section class="bsum">
      <div class="bsum-k">${tile('in', '⬇️ Saved', s.saved)}${tile('int', '✨ Interest', s.interest)}${s.dreamIn ? tile('in', '🏡 Buildings earned', s.dreamIn) : ''}${s.tookOut ? tile('out', '⬆️ Took out', s.tookOut) : ''}${s.built ? tile('out', '🏗️ Paid builders', s.built) : ''}</div>
      ${s.bal ? `<div class="bsum-bar" aria-hidden="true">${s.own ? `<span class="own" style="flex-grow:${s.own}"></span>` : ''}${s.fromInterest ? `<span class="int" style="flex-grow:${s.fromInterest}"></span>` : ''}</div>
      <p class="bsum-t">In the bank now: <b>${fmt(s.bal)}</b> = <b class="own">${fmt(s.own)}</b> your money + <b class="int">${fmt(s.fromInterest)}</b> interest</p>` : ''}
      <p class="muted">${s.interest ? `The bank added ${fmt(s.interest)} in ${s.days} bank ${s.days === 1 ? 'day' : 'days'}, just because you saved.` : 'On bank day the bank adds interest to what you saved.'}</p></section>`;
  }
  // Your bank account: how much of the savings earns the big interest, and the next, better account.
  function accountCard() {
    const f = fm(), g = grade(), a = F.account(f), parts = F.interestParts(f.bank.bal, g, f.bank.acct);
    const big = grade() === 'k' ? '1¢ for every 10¢' : '10¢ for every dollar', small = grade() === 'k' ? '1¢ for every 100¢' : '1¢ for every dollar';
    const over = f.bank.bal > parts.top;
    const x = F.shopItem(f, g, 'acct');
    let up = '';
    if (x) {
      const btn = x.locked ? `<span class="flock">🔒 Level ${x.lv}</span>` : f.money >= x.price ? `<button class="btn" data-act="fBuy" data-arg="acct">Upgrade · ${fmt(x.price)}</button>` : f.goal === 'acct' ? '<span class="fown">⭐ Goal</span>' : `<button class="btn ghost" data-act="fGoal" data-arg="acct">⭐ Save up · ${fmt(x.price)}</button>`;
      const nx = F.ACCOUNTS[(f.bank.acct || 0) + 1];
      up = `<div class="bacct-next"><span class="fe">${nx.e}</span><span class="fitem-t"><b>${esc(nx.name)}</b><small>${big} up to ${fmt(nx.top[g === 'k' ? 0 : 1])}</small></span><span class="fside">${btn}</span></div>`;
    }
    return `<section class="flevel bacct"><b>${a.e} Your account: ${esc(a.name)}</b>
      <p>${big} up to <b>${fmt(parts.top)}</b>, then ${small}.</p>
      ${over ? `<p class="muted">You have ${fmt(f.bank.bal - parts.top)} above ${fmt(parts.top)}: that part only earns ${small}.${x ? ' A better account makes more of your savings earn the big interest.' : ''}</p>` : ''}
      ${up || '<p class="muted">👑 The best account in the bank!</p>'}</section>`;
  }
  function bankKinds(max) {
    if (grade() === 'k') return max >= 25 ? ['q', 'd', 'n', 'p'] : ['d', 'n', 'p'];
    return payKinds(max);
  }
  function startDeposit() {
    const f = fm();
    if (!f.money) return;
    fs = { mode: 'deposit', n: 0, earned: 0, tips: 0, xp: 0, back: 'farm:bank',
      done: () => { F.deposit(fm(), fs.amount); return `<b>${fmt(fs.amount)}</b> is in the bank now. You have <b>${fmt(fm().bank.bal)}</b> saved.`; } };
    show({ kind: 'coins', free: true, limit: f.money, go: 'Put in the bank', coinKinds: bankKinds(f.money), text: `Tap the coins${grade() === 'k' ? '' : ' and bills'} you want to save. You have <b>${fmt(f.money)}</b> in your wallet.`, hint: 'Start with the money worth the most, then count on.', explain: '' });
  }
  function startWithdraw() {
    const f = fm();
    if (!f.bank.bal) return;
    fs = { mode: 'withdraw', n: 0, earned: 0, tips: 0, xp: 0, back: 'farm:bank' };
    show({ kind: 'coins', free: true, limit: f.bank.bal, go: 'Take out', coinKinds: bankKinds(f.bank.bal), text: `Tap the coins${grade() === 'k' ? '' : ' and bills'} you want to take out. You have <b>${fmt(f.bank.bal)}</b> in the bank.`, hint: '', explain: '' });
  }
  function startInterest() {
    const f = fm(), weeks = f.bank.pend.reduce((n, p) => n + (p.paid ? 0 : 1) + (p.inc && p.inc.length ? 1 : 0), 0);
    if (!weeks) return bank();
    fs = { mode: 'interest', weeks, n: 0, earned: 0, tips: 0, xp: 0, back: 'farm:bank' };
    interestQuestion();
  }
  // One bank day: work out this week's interest, then it is added.
  function interestQuestion() {
    const f = fm(), g = grade(), pend = f.bank.pend[0];
    if (!pend) return next();
    if (pend.paid) return incomeQuestion(pend);
    fs.label = '';
    const bal = pend.bal, { top, per, add, big, small, x } = F.interestParts(bal, g, f.bank.acct);
    fs.done = () => {
      const got = F.payInterest(fm(), g);
      if (!got.bonus) return `The bank added <b>${fmt(got.x)}</b>. Now you have <b>${fmt(fm().bank.bal)}</b> saved.`;
      MQ.confetti(120, { colors: ['#ffd23f', '#ffe066', '#ff8fb3'], shape: 'star' });
      return `The bank added <b>${fmt(got.x)}</b>, and 🐷 the <b>Golden Piggy</b> doubled it: <b>+${fmt(got.bonus)}</b> more (it cost ${fmt(got.cost)})! Now you have <b>${fmt(fm().bank.bal)}</b> saved.`;
    };
    const unit = per === 100 ? 'whole dollar' : fmt(per), units = per === 100 ? 'whole dollars' : 'tens';
    const lowUnit = g === 'k' ? '100¢' : 'whole dollar', over = bal > top, rest = bal - top;
    const p = over
      ? { type: 'interest', text: `Bank day, farm day ${pend.day}: that morning you had <b>${fmt(bal)}</b> in the bank. The bank adds <b>${fmt(add)} for every ${unit}</b> up to <b>${fmt(top)}</b>, and <b>1¢ for every ${lowUnit}</b> above ${fmt(top)}. How much interest do you get this week?`,
        hint: `Split it into two parts. The first ${fmt(top)}: ${per === 100 ? 'each whole dollar brings 10¢' : 'each ten brings 1¢'}. The rest above ${fmt(top)}: each ${lowUnit} brings 1¢. Then add the two parts.`,
        explain: `First ${fmt(top)}: ${big} × ${fmt(add)} = ${fmt(big * add)}. Above it: ${fmt(bal)} − ${fmt(top)} = ${fmt(rest)}, that is ${small} × 1¢ = ${fmt(small)}. ${fmt(big * add)} + ${fmt(small)} = ${fmt(x)}`, sale: {}, total: 0 }
      : { type: 'interest', text: `Bank day, farm day ${pend.day}: that morning you had <b>${fmt(bal)}</b> in the bank. The bank adds <b>${fmt(add)} for every ${unit}</b> (up to ${fmt(top)}). How much interest do you get this week?`,
        hint: per === 100 ? `How many whole dollars are in ${fmt(bal)}? Each one brings 10¢.` : `How many tens are in ${bal}? Each ten brings 1¢.`,
        explain: `${fmt(bal)} has ${big} ${units}: ${big} × ${fmt(add)} = ${fmt(x)}`, sale: {}, total: 0 };
    // likely slips on two-part interest: forgetting the part above the limit, or the big rate on all of it
    const traps = over ? [big * add, Math.floor(bal / per) * add] : [];
    Object.assign(p, g === 'k' || x < 100 ? { kind: 'num', answer: x, unit: '¢' } : { kind: 'choice', answer: fmt(x), choices: F.moneyChoices(x, g, traps) });
    if (!x) { F.payInterest(f, g); fs.n++; save(); return next(); } // nothing to work out on a tiny balance
    show(p);
  }
  // What the Big Dreams' buildings earned that bank day goes into the bank: add it up.

  function startScreen() {
    const list = S.profiles();
    const name = wanted.trim();
    if (name) {
      const p = list.find((x) => x.name.trim().toLowerCase() === name.toLowerCase());
      if (p) { wanted = ''; return openProfile(p.id); }

  // ---------------------------------------------------------------- home
  function nextUp() {

  function home() {
    if (!st) return who();
    const lv = MQ.levelFromXp(st.xp);
    const pct = Math.round(((st.xp - lv.from) / (lv.to - lv.from)) * 100);
    const nu = nextUp();
    const all = MQ.trackCreatures(st.grade);
    const have = all.filter((c) => st.creatures[c.id]).length, total = all.length;

      <div class="tiles">
        <button class="tile t-map" data-act="go" data-arg="map"><span class="ti">🗺️</span><b>Expedition Map</b><small>${WORLDS().length} worlds · ${WORLDS().length * 6} levels</small></button>

        <button class="tile t-fixit ${toFix ? 'hot' : ''}" data-act="go" data-arg="fixit"><span class="ti">🛠️</span><b>Fix-it Lab</b><small>${toFix ? `${toFix} to fix today` : inRepair ? 'All done today ✓' : 'No mistakes to fix'}</small></button>
        <button class="tile t-journal" data-act="go" data-arg="journal"><span class="ti">📔</span><b>Field Journal</b><small>${have} / ${total} creatures</small></button>

  // Sunny Farm: level, money and what's waiting (ripe crops, things to collect, a full basket).
  function farmTile() {
    const F = MQ.farm, fm = st.farm;
    if (!fm || !fm.started) return `<button class="tile t-farm wide" data-act="go" data-arg="farm"><span class="ti">🌻</span><span><b>Sunny Farm</b><small>New! Grow, sell at your stand, count real money</small></span></button>`;
    const waiting = fm.beds.some((b) => F.cropStage(b) === 'ready') || fm.pens.some((p) => F.penReady(p));
    const n = F.basketCount(fm);
    const bankDay = !!(fm.bank && fm.bank.pend && fm.bank.pend.length);
    const made = fm.works && Object.values(fm.works).some((w) => w.ready);
    const build = F.canBuild(F.ensure(st), st.grade);
    const trader = F.merchantHas(fm), unlocked = F.depositReady(fm);
    const note = bankDay ? '🏦 Bank day: interest is waiting!' : build ? '🏗️ Saved enough for your Big Dream!' : unlocked ? '🔓 Your bank deposit unlocked!' : trader ? `🧳 A traveling merchant is here!` : waiting || made ? 'Something is ready to pick!' : n ? `${n} to sell at your stand` : 'Farm day ' + fm.day;
    return `<button class="tile t-farm wide ${waiting || made || bankDay || build || trader || unlocked || n ? 'hot' : ''}" data-act="go" data-arg="farm"><span class="ti">🌻</span><span><b>Sunny Farm</b><small>Level ${F.level(fm.xp).level} · 💰 ${F.fmt(fm.money, st.grade)} · ${note}</small></span></button>`;
  }

  // For grown-ups: how Sunny Farm is going (its money problems also count in the daily totals above).
  function farmReport() {
    const F = MQ.farm, fm = st.farm;

      ${fm.dep && (fm.dep.amt || s.depBonus) ? `<p>🔒 Locked deposit: ${fm.dep.amt ? `<b>${F.fmt(fm.dep.amt, st.grade)}</b> locked until farm day ${fm.dep.until}` : 'none now'}; locked deposits have earned ${F.fmt(s.depBonus || 0, st.grade)} so far.</p>` : ''}

      ${s.charms ? `<p>✨ Week charms from the merchant: ${s.charms} bought for ${F.fmt(s.charmCost || 0, st.grade)}; they brought ${F.fmt(s.charmGain || 0, st.grade)} (${s.charmWins || 0} paid for themselves). After each one the child works out whether it paid off.</p>` : ''}
      <p>${s.tasks} money problems from customers and odd jobs, <b>${pct(s.right, s.tasks)}%</b> right on the first try · ${s.vip} ⭐ challenge customers. Now practicing: <b>${esc(tier.name)}</b>${tier.ahead ? ' (ahead of grade)' : ''}.</p>
      <p class="muted">Customers bring problems with real US coins and bills: counting money, totals, making change, paying with exact coins (2.MD.8), and later multi-step budgets, multiplying prices and deals. Problems get harder after 4 first-try right answers in a row and easier after 2 misses; a new level of problems opens as the farm grows.</p></section>`;
  }

  // ---- GATE plan (2nd grade): the NNAT-3 test in February, the district's usual timeline, and this week's practice.
  // Dates come from Eureka Union's GATE/HA Master Plan (invitations Dec 1–5, register by Jan 10–13, testing Feb 14–20,
  // results Apr 1–12); the district's email has the exact dates each year.
  const gatePlanOn = () => st.grade === 'g2' && st.settings.gatePlan !== false;
  MQ.gateTimeline = (today = U.dateKey()) => {
    const y = +today.slice(0, 4), md = today.slice(5);
    const Y = md <= '04-12' ? y : y + 1; // the February coming up (or the one whose results are still due)
    const at = (yy, m) => `${yy}-${m}`;
    const test = at(Y, '02-14'), testEnd = at(Y, '02-20');
    const days = U.daysBetween(today, test);
    let step;
    if (today < at(Y - 1, '12-01')) step = { icon: '📧', text: 'Invitations come by email in early December', when: at(Y - 1, '12-01') };
    else if (today <= at(Y, '01-13')) step = { icon: '📝', text: 'Register by about January 10–13: the link is in the district email', when: at(Y, '01-13') };
    else if (today < test) step = { icon: '🔷', text: 'Testing is February 14–20 (after school for grades 2–3)', when: test };
    else if (today <= testEnd) step = { icon: '🍀', text: 'Test week! Sleep well, eat breakfast, and do your best', when: testEnd };
    else step = { icon: '📬', text: 'Results come in early April: pick them up at school', when: at(Y, '04-01') };
    return { year: Y, test, days, weeks: Math.max(0, Math.ceil(days / 7)), step };
  };
  function gateCard() {
    if (!gatePlanOn()) return '';
    const g = MQ.gateTimeline(), today = U.dateKey(), mon = MQ.weekStart(today);
    const wk = U.range(0, 6).map((i) => S.addDays(mon, i));
    const nd = st.nnatDays || {}, DAY = 6; // a practice day: at least 6 NNAT puzzles
    const done = wk.filter((k) => (nd[k] || 0) >= DAY).length;
    const dots = wk.map((k, i) => `<i class="${(nd[k] || 0) >= DAY ? 'on' : ''} ${k === today ? 'now' : ''}" title="${'MTWTFSS'[i]}">${'MTWTFSS'[i]}</i>`).join('');
    const last = myContests('nnat').slice(-1)[0], since = last ? U.daysBetween(last.date, today) : 99;
    const testNote = g.days > 0 ? (since >= 21 ? 'A practice test is due (every 3 weeks)' : `Next practice test in ${21 - since} ${21 - since === 1 ? 'day' : 'days'}`) : '';
    const head = g.days > 7 ? `<b>${g.weeks} weeks</b> to the GATE test` : g.days > 0 ? `<b>${g.days} ${g.days === 1 ? 'day' : 'days'}</b> to the GATE test` : g.days >= -6 ? '<b>GATE test week</b>' : '<b>GATE test</b> done';
    return `<button class="gatecard" data-act="go" data-arg="prep" aria-label="GATE plan">
      <span class="gc-ic">🔷</span><span class="gc-t">${head} <small>NNAT-3 · usually Feb 14–20</small>
      <small class="gc-step">${g.step.icon} ${esc(g.step.text)}</small>
      ${g.days > 0 ? `<span class="gc-week"><span class="wdots">${dots}</span><small>${done} of 3 practice days this week${testNote ? ' · ' + testNote : ''}</small></span>` : ''}</span></button>`;
  }

  // The daily goal a grown-up set: a ring for today and a dot for each day of this week.
  function goalStrip() {
    const g = st.goal || {};
    if (!g.perDay) return '';
    const today = U.dateKey(), n = (st.days[today] || {}).a || 0, mon = MQ.weekStart(today);
    const days = U.range(0, 6).map((i) => S.addDays(mon, i));
    const met = days.filter((k) => ((st.days[k] || {}).a || 0) >= g.perDay).length;
    const dots = days.map((k, i) => `<i class="${((st.days[k] || {}).a || 0) >= g.perDay ? 'on' : ''} ${k === today ? 'now' : ''}" title="${'MTWTFSS'[i]}">${'MTWTFSS'[i]}</i>`).join('');
    return `<div class="goal" role="group" aria-label="Daily goal">
      <span class="ring" style="--p:${Math.min(100, pct(n, g.perDay))}"><b>${Math.min(n, 999)}</b><small>/ ${g.perDay}</small></span>
      <span class="goal-t"><b>${n >= g.perDay ? 'Today’s goal reached! 🎉' : `Today’s goal: ${g.perDay - n} more ${g.perDay - n === 1 ? 'problem' : 'problems'}`}</b>
        <small>This week: ${met} of ${g.days} goal days</small><span class="wdots">${dots}</span></span></div>`;
  }

  // ---------------------------------------------------------------- map & world
  function map() {
    const cards = WORLDS().map((w, i) => {
      const open = worldOpen(i);
      const stars = worldStars(w);
      const found = w.levels.filter((l) => st.creatures[l.creature]).length;
      return `<button class="wcard ${open ? '' : 'locked'}" ${open ? `data-act="go" data-arg="world:${w.id}"` : 'disabled'} style="--wc:${w.color};--wt:${w.tint}">
        <span class="wemoji">${open ? w.emoji : '🔒'}</span>
        <span class="winfo"><b>${i + 1}. ${w.name}</b><small>${w.blurb}</small>
        ${open ? `<span class="wprog">★ ${stars}/18 · ${w.levels.map((l) => `<i class="${st.creatures[l.creature] ? '' : 'sil'}">${MQ.CREATURES[l.creature].emoji}</i>`).join('')}</span>` : `<span class="wprog">Befriend the guardian of ${WORLDS()[i - 1].name} to open</span>`}
        </span>${open && found === 6 ? '<span class="wdone">✓</span>' : ''}</button>`;
    }).join('');
    render(header('Expedition Map') + `<main class="map">${cards}</main>`);
    cur = 'map';
  }

  function world(id) {
    const w = WORLDS().find((x) => x.id === id);
    if (!w) return map();
    const rows = w.levels.map((lv, i) => {
      const open = levelOpen(w, i);
      const rec = st.levels[w.id + '-' + i];

      const got = !!st.creatures[lv.creature];

        <span class="linfo"><b>${levelName(lv, i)}</b><small>${lv.topics.map((t) => MQ.TOPICS[t].name).join(' + ')} · ${dtxt}</small>

  // ---------------------------------------------------------------- play
  function pickProblem() {

    }
    if (sess.warm && sess.warm.length && (sess.asked === 0 || sess.asked === 2)) { // Daily Quest: NNAT warm-up

    }
    const rv = reviewProblem();
    if (rv) return rv;
    const topic = U.pick(sess.topics);
    const d = sess.auto ? sess.autoD : U.rnd(sess.d[0], sess.d[1]);

  function reviewProblem() {
    if (sess.mode === 'fixit') { const r = sess.queue.shift(); return r ? makeReview(r) : null; }

  function makeReview(r) {

      <div class="ptext ${p.big ? 'eq' : ''} ${p.wordy ? 'wordy' : ''}">${p.text}</div>

  }
  // The answer area for each question format.

  function answerHtml(p) {
    const checkMode = sess.mode === 'check';
    const go = sess.locked ? '' : `<button class="btn big go-pick" data-act="submitPick">${checkMode ? 'Next →' : 'Check'}</button>`;
    if (p.kind === 'num') {
      return `<div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((k) => `<button class="key" data-act="key" data-arg="${k}">${k}</button>`).join('')}<button class="key alt" data-act="key" data-arg="back" aria-label="Delete">⌫</button><button class="key" data-act="key" data-arg="0">0</button><button class="key go" data-act="submit">${checkMode ? 'Next' : 'Check'}</button></div>`;
    }
    if (p.kind === 'choice') {
      return `<div class="choices n${p.choices.length} ${p.choiceHtml ? 'pics' : ''}">${p.choices.map((c, i) => `<button class="choice" data-act="choose" data-arg="${i}" aria-label="${esc(c)}">${p.choiceHtml ? p.choiceHtml[i] : fmtChoice(c)}</button>`).join('')}</div>${checkMode ? go : ''}`;
    }

    }

    say(`${bname()}: ${U.pick(MQ.SAY.reveal)}`);
    sess.pending = sessDone() ? finish : nextProblem; // waits for the Next button
    if (voiceOn()) { const a = spokenAnswer(p); MQ.speak(U.pick(MQ.SAY.voiceReveal) + (a ? ` The answer is ${a}.` : ' Look at the green answer.')); }
    S.save();
    status();
  }
  function finish() {
    if (sess.mode === 'level') finishLevel();
    else if (sess.mode === 'daily') finishDaily();
    else if (sess.mode === 'fixit') finishFixit();
    else finishTrainer();
  }

  function finishLevel() {
    const { world: w, li, level: lv } = sess;
    const stars = sess.mistakes === 0 ? 3 : sess.mistakes <= 2 ? 2 : 1;
    const key = w.id + '-' + li, prev = st.levels[key];
    const firstClear = !prev;
    st.levels[key] = { stars: Math.max(stars, prev ? prev.stars : 0) };
    let gems = 5 + stars * 2 + (lv.type === 'boss' ? 10 : lv.type === 'challenge' ? 5 : 0);
    if (!firstClear) gems = Math.ceil(gems / 2);
    addGems(gems);
    let creature = null;
    if (!st.creatures[lv.creature]) { st.creatures[lv.creature] = { got: U.dateKey(), from: w.id }; creature = MQ.CREATURES[lv.creature]; }
    const wi = worldIndex(w.id);
    const newWorld = firstClear && lv.type === 'boss' && !st.settings.unlockAll ? WORLDS()[wi + 1] : null;
    S.save();
    const hasNext = li < 5 && levelOpen(w, li + 1);
    render(`<main class="result" style="--wc:${w.color};--wt:${w.tint}">
      <div class="bigstars">${starStr(stars)}</div>
      <h1 class="title">${lv.type === 'boss' ? 'Guardian befriended!' : stars === 3 ? 'Perfect expedition!' : 'Level complete!'}</h1>
      <p class="lead">${sess.correct} right${sess.mistakes ? ` · ${sess.mistakes} ${sess.mistakes === 1 ? 'oops' : 'oopses'}` : ' · no mistakes!'} · <b>+${gems} 💎</b></p>
      ${creature ? creatureCard(creature, true) : `<p class="muted">You already discovered the ${MQ.CREATURES[lv.creature].emoji} ${MQ.CREATURES[lv.creature].name} here.${stars < 3 ? ' Try for 3 stars!' : ''}</p>`}

    MQ.confetti(lv.type === 'boss' ? 220 : 120);

    later(checkBadges, 1400);
  }

  function finishDaily() {
    const today = U.dateKey();
    const first = st.daily.last !== today;
    let gems = 0, treasure = 0;
    if (first) {
      const gap = st.daily.last ? U.daysBetween(st.daily.last, today) : 99;
      st.daily.streak = gap === 1 ? st.daily.streak + 1 : 1;
      st.daily.best = Math.max(st.daily.best, st.daily.streak);
      st.daily.last = today;
      treasure = MQ.dragonTreasure(st);
      gems = DAILY_REWARD + Math.min(st.daily.streak - 1, 10) + treasure;
      addGems(gems);
      if (st.farm && st.farm.started) { st.farm.feed += FARM_FEED_BONUS; st.farm.t = Date.now(); }
    }
    S.save();
    render(`<main class="result" style="--wc:#e09a2b;--wt:#fbecd2">
      <div class="bigemoji">${first ? '🔥' : '✅'}</div>
      <h1 class="title">Daily Quest complete!</h1>
      <p class="lead">${first ? `Day streak: <b>${st.daily.streak}</b> · <b>+${gems} 💎</b>` : 'Extra practice — great job! Come back tomorrow for a new quest.'}</p>
      ${first && st.farm && st.farm.started ? `<p class="muted">+${FARM_FEED_BONUS} 🌾 feed bags for your farm animals</p>` : ''}
      ${first && st.daily.streak > 1 ? `<p class="muted">Streak bonus: +${Math.min(st.daily.streak - 1, 10)} 💎 for coming back every day.</p>` : ''}
      ${treasure ? `<div class="unlock">🐉 Dragon treasure: <b>+${treasure} 💎</b> from your grown-up dragons</div>` : ''}
      ${eggNudge()}

    MQ.sfx('reward');
    MQ.confetti();
    if (st.settings.voice !== false) MQ.speak('Daily quest complete! Great job!');

  }

  function finishTrainer() {
    if (!sess) return home();
    let record = '';
    if (sess.timer === 60 && sess.correct > (st.stats.lightning60 || 0)) { st.stats.lightning60 = sess.correct; record = 'New 60-second record!'; }
    if (sess.timer === 120 && sess.correct > (st.stats.lightning120 || 0)) { st.stats.lightning120 = sess.correct; record = 'New 2-minute record!'; }
    if (!sess.timer && sess.best > (st.stats.endlessBest || 0)) { st.stats.endlessBest = sess.best; if (sess.best >= 5) record = 'New best streak!'; }
    S.save();
    const acc = pct(sess.firstTry, sess.answered);
    render(`<main class="result" style="--wc:#ff6b5b;--wt:#ffe3dd">
      <div class="bigemoji">${sess.timer ? '⚡' : '♾️'}</div>
      <h1 class="title">${sess.timer ? 'Time!' : 'Training done!'}</h1>
      ${record ? `<div class="unlock">🏆 ${record}</div>` : ''}
      <div class="sumgrid">
        <div><b>${sess.correct}</b><small>correct</small></div>
        <div><b>${acc}%</b><small>first try</small></div>
        <div><b>${sess.best}</b><small>best streak</small></div>
        <div><b>+${sess.earned + sess.fixedNow * FIX_REWARD}</b><small>💎 earned</small></div>
      </div>
      ${sess.fixedNow ? `<div class="unlock">🛠️ ${sess.fixedNow} old ${sess.fixedNow === 1 ? 'mistake' : 'mistakes'} fixed for good!</div>` : ''}
      ${sess.earned + sess.fixedNow ? eggNudge() : ''}
      <div class="row"><button class="btn ghost" data-act="go" data-arg="home">Home</button>${sess.kgTopic
        ? `<button class="btn ghost" data-act="go" data-arg="${MQ.TOPICS[sess.kgTopic].cogat ? 'cgtypes' : MQ.TOPICS[sess.kgTopic].logic ? 'lgtypes' : 'kgtypes'}">Other types</button><button class="btn" data-act="kgPractice" data-arg="${sess.kgTopic}">Play again</button>`
        : '<button class="btn ghost" data-act="go" data-arg="trainer">Change settings</button><button class="btn" data-act="startTrainer">Play again</button>'}</div></main>`);
    if (sess.correct) { MQ.sfx('reward'); if (record) MQ.confetti(); }
    if (st.settings.voice !== false && sess.correct) MQ.speak(`You got ${sess.correct} right! ${record ? 'A new record!' : 'Great training!'}`);
    later(checkBadges, 1200);
  }

  // ---------------------------------------------------------------- Fix-it Lab
  const whenStr = (key) => { const n = U.daysBetween(U.dateKey(), key); return n <= 0 ? 'today' : n === 1 ? 'tomorrow' : fmtDate(key).replace(/, \d{4}$/, ''); };
  function fixit() {
    const today = U.dateKey();
    const all = Object.values(st.review).filter((r) => MQ.TOPICS[r.topic]).sort((a, b) => (a.due !== b.due ? (a.due < b.due ? -1 : 1) : b.miss - a.miss));
    const due = all.filter((r) => r.due <= today);
    const rows = all.map((r) => {
      const T = MQ.TOPICS[r.topic], now = r.due <= today;
      return `<li class="fx ${now ? 'due' : ''}"><span class="fx-ic">${T.icon}</span><span class="fx-n"><b>${T.name}</b><small>${D_NAMES[r.d]} · ${now ? 'ready to practice' : 'next try ' + whenStr(r.due)}${r.miss > 1 ? ` · missed ${r.miss} times` : ''}</small></span>
        <span class="fx-box" role="img" aria-label="${r.box} of 3 right">${[0, 1, 2].map((i) => `<i class="${i < r.box ? 'on' : ''}"></i>`).join('')}</span></li>`;
    }).join('');
    render(header('Fix-it Lab') + `<main class="fixit">
      <p class="lead">Mistakes help your brain grow! Here are the kinds of problems that went wrong. Get a new one right on 3 different days and it is fixed for good: <b>+${FIX_REWARD} 💎</b> each.</p>
      ${due.length ? `<button class="btn big" data-act="startFixit">Fix ${Math.min(10, due.length)} now ▶</button>`
        : all.length ? '<div class="unlock">✅ All done for today! Come back tomorrow for the next tries.</div>' : '<div class="unlock">🎉 Nothing to fix. When a problem goes wrong, it shows up here.</div>'}
      ${all.length ? `<ul class="fxlist">${rows}</ul>` : ''}
      <p class="muted small">Mistakes from every game and test come here. Similar questions also come back in levels, training, the Daily Quest and practice tests. Fixed so far: <b>${st.stats.fixed || 0}</b>.</p>
    </main>`);
    cur = 'fixit';
  }
  function startFixit() {
    const queue = S.dueReview().slice(0, 10);
    if (!queue.length) return fixit();
    startSession({ mode: 'fixit', queue, total: queue.length, topics: [], d: [1, 1], goal: 0 });
  }
  function finishFixit() {
    if (!sess) return home();
    const fixed = sess.fixedNow, left = S.dueReview().length;
    S.save();
    render(`<main class="result" style="--wc:#3c9d5d;--wt:#dcf3e3">
      <div class="bigemoji">🛠️</div>
      <h1 class="title">${fixed ? `${fixed} ${fixed === 1 ? 'mistake' : 'mistakes'} fixed for good!` : 'Great practice!'}</h1>
      <div class="sumgrid three">
        <div><b>${sess.firstTry} / ${sess.answered}</b><small>right first try</small></div>
        <div><b>${fixed}</b><small>fixed for good</small></div>
        <div><b>+${fixed * FIX_REWARD}</b><small>💎 earned</small></div>
      </div>
      <p class="muted">Each right answer moves a mistake one step closer to fixed. Three right answers on different days fix it.</p>
      <div class="row"><button class="btn ghost" data-act="go" data-arg="home">Home</button><button class="btn ghost" data-act="go" data-arg="fixit">Fix-it Lab</button>${left ? `<button class="btn" data-act="startFixit">Keep fixing (${left})</button>` : ''}</div></main>`);
    MQ.sfx('reward');
    if (fixed) MQ.confetti(80);
    if (st.settings.voice !== false) MQ.speak(fixed ? 'You fixed old mistakes! Great job!' : 'Great practice!');
    later(checkBadges, 1200);
  }

  function quit() {
    if (!sess) return home();
    if (sess.mode === 'fixit') {
      if (sess.answered === 0) return go('fixit');
      clearTimers();
      sess.locked = true;
      return finishFixit();
    }
    if (sess.mode === 'trainer') {
      if (sess.answered === 0) return go('trainer');
      clearTimers();
      sess.locked = true;
      return finishTrainer();
    }
    if (sess.mode === 'check') {
      saveCheck();
      return modal(`<div class="mtitle">Take a break?</div><p>${S.preview ? 'This is a preview: the check is not saved.' : `Your answers are saved. Next time you can continue from question ${sess.answered + 1}, or start over.`}</p>
        <div class="row"><button class="btn ghost" data-act="closeModal">Keep going</button><button class="btn" data-act="leave">Save and stop</button></div>`);
    }
    modal(`<div class="mtitle">Leave this ${sess.mode === 'daily' ? 'quest' : 'level'}?</div><p>You will need to start it again to ${sess.mode === 'daily' ? 'finish the quest' : 'discover the creature'}.</p>
      <div class="row"><button class="btn ghost" data-act="closeModal">Keep playing</button><button class="btn" data-act="leave">Leave</button></div>`);
  }

  // ---------------------------------------------------------------- test prep
  const P = () => MQ.prep;
  const myChecks = () => (st.tests.checks || []).filter((c) => c.grade === st.grade);
  const fmtDate = (k) => { const d = new Date(k + 'T12:00:00'); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
  // Line chart of the overall level across checks, with where the grade "should" be as a dashed line.
  function historyChart(checks) {
    if (checks.length < 2) return '';
    const W = 320, H = 150, L = 64, T = 10, B = 24, PW = W - L - 12, PH = H - T - B;
    const lo = Math.max(0, Math.floor(Math.min(...checks.map((c) => Math.min(c.overall, c.expected))) - 1));
    const hi = Math.min(9, Math.ceil(Math.max(...checks.map((c) => Math.max(c.overall, c.expected))) + 1));
    const y = (v) => T + PH - ((v - lo) / Math.max(1, hi - lo)) * PH;
    const x = (i) => L + (checks.length === 1 ? PW / 2 : (i / (checks.length - 1)) * PW);
    let s = '';
    for (let v = lo; v <= hi; v++) s += `<line x1="${L}" y1="${y(v)}" x2="${L + PW}" y2="${y(v)}" stroke="#d6e0e6"/><text x="${L - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="#5b6885" font-family="Nunito, sans-serif" font-weight="700">${P().STEPS[v].label}</text>`;
    s += `<polyline points="${checks.map((c, i) => `${x(i)},${y(c.expected)}`).join(' ')}" fill="none" stroke="#9aa6b8" stroke-width="2" stroke-dasharray="5 4"/>`;
    s += `<polyline points="${checks.map((c, i) => `${x(i)},${y(c.overall)}`).join(' ')}" fill="none" stroke="#5b63c9" stroke-width="3"/>`;
    s += checks.map((c, i) => `<circle cx="${x(i)}" cy="${y(c.overall)}" r="5" fill="#5b63c9" stroke="#ffffff" stroke-width="2"/><text x="${x(i)}" y="${H - 6}" font-size="10" text-anchor="middle" fill="#5b6885" font-family="Nunito, sans-serif" font-weight="700">${fmtDate(c.date).replace(/, \d{4}$/, '')}</text>`).join('');
    return `<figure class="hchart">${`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Placement Check history">${s}</svg>`}<figcaption><span class="lg l1"></span>Placement Check level <span class="lg l2"></span>Where most kids are at that time of year</figcaption></figure>`;
  }
  function prep() {
    const checks = myChecks(), last = checks[checks.length - 1];
    const total = st.grade === 'k' ? 20 : 30;
    render(header('Test Prep') + `<main class="prep">
      <p class="lead">Get ready for the tests you take at school.</p>
      ${st.grade === 'k' ? '' : nnatCard()}
      <article class="testcard" style="--pc:#5b63c9">
        <div class="tc-head"><span class="tc-ic">🎯</span><div><b>Placement Check</b><small>In the style of i-Ready · ${total} questions · about ${st.grade === 'k' ? 15 : 25} minutes</small></div>${infoBtn('check')}</div>
        <p>Questions about numbers, algebra, measurement and shapes. They get harder or easier as you answer, like i-Ready at school. No hints this time: just do your best, and make your best guess if you are not sure.</p>
        ${last ? `<div class="tc-last">Last check, ${fmtDate(last.date)}: <b>${P().label(last.overall)}</b> · ${P().status(last.overall, last.expected).icon} ${P().status(last.overall, last.expected).text} <button class="linkbtn" data-act="viewCheck" data-arg="${last.id}">See results</button></div>` : ''}
        ${resumeBox('check')}
        <button class="btn ${pausedInfo('check') ? 'ghost' : ''}" data-act="startCheck">${pausedInfo('check') ? 'Start over' : last ? 'Take a new check' : 'Start the check'}${pausedInfo('check') ? '' : ' ▶'}</button>
      </article>
      ${historyChart(checks)}
      ${contestCard()}
      ${logicCard()}
    </main>`);
    cur = 'prep';
  }
  // ---- Unfinished tests: saved after every step and when the page is hidden, so the child can continue later.
  function saveCheck() {
    if (!sess || sess.mode !== 'check') return;
    S.setPaused('check', { eng: Object.assign({}, sess.eng, { seen: [...sess.eng.seen] }), p: sess.locked ? null : sess.p, // an answered question is not asked again
      answered: sess.answered, correct: sess.correct, saved: Date.now() });
  }
  function saveContest() {
    if (!ct) return;
    const { interval, ...rest } = ct;
    S.setPaused(ct.kind, Object.assign(rest, { elapsed: Date.now() - ct.started, saved: Date.now() }));
  }
  function saveProgress() { saveCheck(); saveContest(); }
  const pausedInfo = (kind) => {
    const x = S.paused(kind);
    if (!x) return null;
    const done = kind === 'check' ? x.answered : x.answers.filter((a) => a !== null).length;
    const n = kind === 'check' ? x.eng.plan.length : x.items.length;
    return { done, n, date: U.dateKey(new Date(x.saved)) };
  };
  // A highlighted box on a test card: continue the unfinished test.
  function resumeBox(kind) {
    const x = pausedInfo(kind);
    if (!x) return '';
    const when = x.date === U.dateKey() ? 'today' : fmtDate(x.date).replace(/, \d{4}$/, '');
    return `<div class="tc-resume"><span>⏸️ Unfinished (${when}): <b>${x.done} of ${x.n}</b> answered</span><button class="btn" data-act="resumeTest" data-arg="${kind}">Continue ▶</button></div>`;
  }
  // Starting again throws the unfinished test away, so ask first.
  function confirmRestart(kind, act, arg) {
    const x = pausedInfo(kind);
    if (!x || ui.restartOk === kind) { ui.restartOk = null; return false; }
    modal(`<div class="mtitle">Start over?</div><p>You have an unfinished ${kind === 'check' ? 'check' : 'test'} with <b>${x.done} of ${x.n}</b> answered. Starting over will throw it away.</p>
      <div class="row"><button class="btn ghost" data-act="resumeTest" data-arg="${kind}">Continue it</button><button class="btn" data-act="restartTest" data-arg="${kind}|${act}|${arg || ''}">Start over</button></div>`);
    return true;
  }
  function resumeTest(kind) {
    closeModal();
    const x = S.paused(kind);
    if (!x) return prep();
    if (kind === 'check') {
      const eng = Object.assign({}, x.eng, { seen: new Set(x.eng.seen) });
      startSession({ mode: 'check', eng, topics: [], d: [1, 1], goal: 0, resumeP: x.p, answered: x.answered, correct: x.correct });
      say(`${bname()}: Welcome back! Let’s keep going from question ${x.answered + 1}.`);
      return;
    }
    remember('contest');
    const { elapsed, saved, ...rest } = x;
    ct = Object.assign(rest, { started: Date.now() - (elapsed || 0) }); // time away does not count
    render('', 'is-contest');
    contestView();
    toast('Welcome back! Your answers are all here.');
    if (ct.timed || ct.soft) ct.interval = setInterval(contestTick, 1000);
  }
  function startCheck() {
    if (confirmRestart('check', 'startCheck')) return;
    S.clearPaused('check');
    const eng = P().newCheck(st.grade, myChecks());
    startSession({ mode: 'check', eng, topics: [], d: [1, 1], goal: 0 });
    say(`${bname()}: Do your best! No hints in a check. If you are not sure, make your best guess.`);
  }
  function finishCheck() {
    S.clearPaused('check');
    const res = P().result(sess.eng);
    const list = st.tests.checks;
    list.push(res);
    while (list.length > 12) list.shift();
    list.slice(0, -3).forEach((c) => { delete c.items; }); // keep the answer review only for the latest checks
    const full = sess.eng.full || [];
    if (full.length === res.items.length) S.setFull('check', res.id, full); // a check paused in an older version has gaps
    addGems(20);
    S.save();
    sess = null;
    checkResult(res, true);
    MQ.sfx('reward');
    MQ.confetti(120);
    if (st.settings.voice !== false) MQ.speak('You finished the placement check! Great job!');
    later(checkBadges, 1200);
  }
  function checkResult(res, fresh) {
    const stt = P().status(res.overall, res.expected);
    const plan = P().practicePlan(res, st.grade);
    const bar = (v) => `<span class="lbar"><span class="lfill" style="width:${((v + 0.5) / 10) * 100}%"></span><span class="lexp" style="left:${((res.expected + 0.5) / 10) * 100}%" title="Where most kids are now"></span></span>`;
    render(header('Placement Check', 'prep') + `<main class="presult">
      <div class="pr-hero">
        ${fresh ? '<div class="pr-done">Check complete! +20 💎</div>' : `<div class="pr-done muted">${fmtDate(res.date)}</div>`}
        <div class="pr-level">${P().label(res.overall)}</div>
        <div class="pr-status s-${stt.id}">${stt.icon} ${stt.text}</div>
        <p class="muted">${res.correct} of ${res.n} right · most kids are at <b>${P().label(res.expected)}</b> at this time of year</p>
      </div>
      <section class="pr-domains">${P().DOMAINS.map((d) => `<div class="pr-dom"><span class="pd-name">${d.icon} ${d.name}</span>${bar(res.domains[d.id])}<span class="pd-lv">${P().label(res.domains[d.id])}</span></div>`).join('')}
        <p class="muted small">The dark tick shows where most kids are at this time of year.</p></section>
      <section class="pr-plan"><h2>What to practice next</h2>
        <p>${plan.domains.map((d) => `${d.icon} <b>${d.name}</b>`).join(' and ')}</p>
        <div class="chips">${plan.topics.map((t) => `<span class="chip sel">${MQ.TOPICS[t].icon} ${MQ.TOPICS[t].name}</span>`).join('')}</div>
        <button class="btn" data-act="practicePlan" data-arg="${res.id}">Practice these ▶</button></section>
      <div class="row">${res.items ? `<button class="btn ghost" data-act="reviewCheck" data-arg="${res.id}">Review answers</button>` : ''}<button class="btn ghost" data-act="go" data-arg="prep">Test Prep</button><button class="btn ghost" data-act="go" data-arg="home">Home</button></div>
      <p class="muted small center">Practice in the style of i-Ready. The level is an estimate from this app, not an official i-Ready score.</p>
    </main>`);
  }
  function reviewCheck(res) {
    const full = S.full(res.id);
    render(header('Review answers', 'prep') + `<main class="review">${full ? TAP_HINT : ''}<ol class="rlist">${res.items.map((it, k) => `<li class="${it.ok ? 'ok' : 'no'}${full ? ' rtap' : ''}" ${full ? `data-act="viewQ" data-arg="${res.id}:${k}" data-q="${k}"` : ''}>

      ${res.used ? `<p class="muted">Pace: <b>${Math.round(res.used / Math.max(1, res.n - res.blank))} seconds</b> a puzzle (the real test allows about ${Math.round((MQ.NNAT_TEST.minutes * 60) / MQ.NNAT_TEST.n)}).${res.blank ? ` ${res.blank} left blank: on the real test, a guess is better than a blank.` : ''}</p>` : ''}</section>` : '';
    const typeRows = (res.kind.startsWith('cogat') || res.kind.startsWith('logic')) && res.types ? `<section class="pr-domains">${Object.entries(res.types).map(([t, s]) => `<div class="pr-dom"><span class="pd-name">${MQ.TOPICS[t].icon} ${MQ.TOPICS[t].name}</span><span class="lbar"><span class="lfill" style="width:${Math.round((s.right / s.n) * 100)}%"></span></span><span class="pd-lv">${s.right} of ${s.n}</span></div>`).join('')}</section>` : '';
    render(header(info.title, 'prep') + `<main class="presult">
      <div class="pr-hero" style="box-shadow: inset 0 0 0 3px ${info.color}, 0 5px 0 ${info.color}">
        ${fresh ? `<div class="pr-done">Finished! +${kids ? 15 : 25} 💎</div>` : `<div class="pr-done muted">${fmtDate(res.date)}</div>`}
        <div class="pr-level">${kangaroo ? `${res.score} / ${res.max}` : `${res.right} of ${res.n}`}</div>
        <div class="muted">${kangaroo ? `points · ${res.right} of ${res.n} right${res.blank ? ` · ${res.blank} blank` : ''}${res.timed ? ` · ${res.minutes} min` : ''}` : kids ? 'solved ' + '⭐'.repeat(Math.max(1, Math.round((res.right / res.n) * 3))) : `right · ${res.minutes} min${res.blank ? ` · ${res.blank} blank` : ''}`}</div>
      </div>
      ${tiles ? `<div class="sumgrid ${res.kind.startsWith('logic') ? 'two' : 'three'}">${tiles}</div>` : ''}
      ${typeRows}${nnRows}
      ${res.items ? `<section><h2>Review</h2>${full ? TAP_HINT : ''}<ol class="rlist">${res.items.map((it, k) => `<li class="${it.ok ? 'ok' : 'no'}${full ? ' rtap' : ''}" ${full ? `data-act="viewQ" data-arg="${res.id}:${k}" data-q="${k}"` : ''}>
        <span class="rmark">${it.ok ? '✓' : '✗'}</span><div><div class="rq"><b>${k + 1}.</b> ${esc(it.q)}${kangaroo ? ` <span class="dchip">${it.pts} pts</span>` : ''}</div>
        <div class="ra">${it.ok ? `Your answer: <b>${it.letterG}</b>` : `Your answer: <b>${it.letterG || '—'}</b> · Right answer: <b>${it.letterA}</b>${/^picture/.test(it.a) ? '' : ` (${esc(it.a)})`}`}</div>
        ${!it.ok && it.e ? `<div class="re">${esc(it.e)}</div>` : ''}</div>${full ? '<span class="rgo" aria-hidden="true">›</span>' : ''}</li>`).join('')}</ol></section>` : ''}
      <div class="row"><button class="btn ghost" data-act="go" data-arg="prep">Test Prep</button><button class="btn ghost" data-act="go" data-arg="home">Home</button>${info.more ? `<button class="btn" data-act="go" data-arg="${info.more}">Practice by type</button>` : ''}</div>
      <p class="muted small center">${info.note}</p>
    </main>`);
  }
  function contestQuit() {
    saveContest();
    modal(`<div class="mtitle">Take a break?</div><p>${S.preview ? 'This is a preview: the test is not saved.' : `Your answers are saved. Next time you can continue where you stopped${ct && ct.timed ? ' (the clock waits for you)' : ''}, or start over.`}</p>
      <div class="row"><button class="btn ghost" data-act="closeModal">Keep going</button><button class="btn" data-act="ctLeave">Save and stop</button></div>`);
